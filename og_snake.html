<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>OG Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 600px; height: 600px;
  overflow: hidden;
  background: #000;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #fff;
}

/* ── Select Screen ── */
#select-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 600px; height: 600px;
  position: absolute; top: 0; left: 0;
}
#select-screen h1 {
  font-size: 36px;
  margin-bottom: 4px;
  color: #0f0;
  text-shadow: 0 0 12px #0f0;
}
.tagline {
  font-size: 13px;
  color: #6a6;
  font-style: italic;
  margin-bottom: 18px;
  letter-spacing: 0.5px;
}
#select-screen p {
  font-size: 16px;
  margin-bottom: 10px;
  color: #aaa;
}
.avatar-row {
  display: flex;
  gap: 14px;
  margin-bottom: 14px;
}
.avatar-option {
  width: 100px; height: 100px;
  border: 3px solid #444;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  background: #111;
}
.avatar-option img {
  width: 80px; height: 80px;
  border-radius: 10px;
}
.avatar-option.focused {
  border-color: #0f0;
  box-shadow: 0 0 18px rgba(0,255,0,0.5);
  transform: scale(1.08);
}

/* ── Speed Slider ── */
.slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.slider-label {
  font-size: 14px;
  color: #aaa;
}
#speed-slider {
  width: 200px;
  accent-color: #0f0;
}
.slider-val {
  font-size: 14px;
  color: #0f0;
  min-width: 140px;
}

/* ── Game Screen ── */
#game-screen {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 600px; height: 600px;
}
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 12px;
  font-size: 16px;
  color: #0f0;
  z-index: 10;
  pointer-events: none;
}
canvas {
  display: block;
}

/* ── Game Over ── */
#gameover {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 600px; height: 600px;
  background: rgba(0,0,0,0.85);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 20;
}
#gameover h2 {
  font-size: 36px;
  color: #f44;
  text-shadow: 0 0 14px #f44;
  margin-bottom: 8px;
}
.final-score {
  font-size: 24px;
  color: #fff;
  margin-bottom: 10px;
}
#snake-trail {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  justify-content: center;
  max-width: 560px;
  margin-bottom: 14px;
  padding: 8px;
  background: rgba(0,255,0,0.05);
  border: 1px solid rgba(0,255,0,0.15);
  border-radius: 10px;
}
#snake-trail img {
  width: 28px; height: 28px;
  border-radius: 4px;
}
.go-btn {
  padding: 12px 32px;
  margin: 6px;
  font-size: 18px;
  border: 2px solid #555;
  border-radius: 12px;
  background: #111;
  color: #fff;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
}
.go-btn.focused {
  border-color: #0f0;
  box-shadow: 0 0 14px rgba(0,255,0,0.5);
  transform: scale(1.05);
}

/* ── Leaderboard ── */
#leaderboard-screen {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 600px; height: 600px;
  background: #000;
  flex-direction: column;
  align-items: center;
  z-index: 25;
  overflow-y: auto;
  padding: 16px 10px;
}
#leaderboard-screen h2 {
  font-size: 30px;
  color: #0f0;
  text-shadow: 0 0 10px #0f0;
  margin-bottom: 12px;
}
.lb-entry {
  width: 540px;
  background: #111;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 8px;
}
.lb-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.lb-rank {
  font-size: 18px;
  color: #0f0;
  font-weight: bold;
}
.lb-score {
  font-size: 16px;
  color: #fff;
}
.lb-date {
  font-size: 12px;
  color: #666;
}
.lb-trail {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
}
.lb-trail img {
  width: 22px; height: 22px;
  border-radius: 3px;
}
.lb-empty {
  color: #666;
  font-size: 16px;
  margin-top: 40px;
}

/* ── SDK Badge ── */
#sdk-badge {
  position: absolute;
  bottom: 8px; right: 12px;
  font-size: 12px;
  color: #555;
  pointer-events: none;
  z-index: 30;
}

/* ── Capture toast ── */
.capture-toast {
  position: absolute;
  pointer-events: none;
  font-size: 16px;
  font-weight: bold;
  color: #0f0;
  text-shadow: 0 0 8px #0f0, 0 1px 3px #000;
  white-space: nowrap;
  z-index: 15;
  animation: toastUp 1.2s ease-out forwards;
}
@keyframes toastUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  60% { opacity: 1; transform: translateY(-30px) scale(1.1); }
  100% { opacity: 0; transform: translateY(-50px) scale(0.9); }
}
</style>
</head>

<div id="sdk-badge"></div>

<!-- Select Screen -->
<div id="select-screen">
  <h1>OG SNAKE</h1>
  <div class="tagline">collecting minutiae for your timeline</div>
  <p>Choose your avatar</p>
  <div class="avatar-row">
    <div>
      <div class="avatar-option focused" data-avatar="0" tabindex="0">
        <img src="https://d2xsxph8kpxj0f.cloudfront.net/310519663318016215/VLBcZWGPKDgGMMhnuB2oKx/avatar1_54ee146c.png" alt="Avatar 1">
      </div>
    </div>
    <div>
      <div class="avatar-option" data-avatar="1" tabindex="0">
        <img src="https://d2xsxph8kpxj0f.cloudfront.net/310519663318016215/VLBcZWGPKDgGMMhnuB2oKx/avatar2_8beb7d44.png" alt="Avatar 2">
      </div>
    </div>
  </div>
  <div class="slider-row">
    <span class="slider-label">Speed:</span>
    <input type="range" id="speed-slider" min="1" max="7" value="3" step="1">
    <span class="slider-val" id="speed-val"></span>
  </div>
  <div style="display:flex;gap:10px;margin-top:6px;">
    <button class="go-btn" id="btn-start" tabindex="0" style="border-color:#0f0;">Start</button>
    <button class="go-btn" id="btn-leaderboard" tabindex="0">Top Scores</button>
  </div>
  <p style="margin-top:14px;font-size:13px;color:#555;">&#x2190; &#x2192; avatar &middot; &#x2191; &#x2193; speed &middot; Enter start</p>
</div>

<!-- Game Screen -->
<div id="game-screen">
  <div id="hud">
    <span id="score-display">Score: 0</span>
    <span id="high-display">Best: 0</span>
  </div>
  <canvas id="game-canvas" width="600" height="600"></canvas>
</div>

<!-- Game Over -->
<div id="gameover">
  <h2>GAME OVER</h2>
  <div class="final-score" id="final-score">Score: 0</div>
  <div id="snake-trail"></div>
  <button class="go-btn focused" data-action="restart" tabindex="0">Play Again</button>
  <button class="go-btn" data-action="reselect" tabindex="0">Change Avatar</button>
</div>

<!-- Leaderboard -->
<div id="leaderboard-screen">
  <h2>TOP SCORES</h2>
  <div id="lb-list"></div>
  <button class="go-btn" id="btn-lb-back" tabindex="0" style="margin-top:12px;">Back</button>
</div>

  ];

  /* ── Preload emoji images ── */
  var emojiImages = [];
  ALL_EMOJI.forEach(function(e) {
    var img = new Image();
    img.src = e.s;
    emojiImages.push(img);
  });

  /* ── Constants ── */
  var GRID = 20;
  var CELL = 600 / GRID; // 30
  var HUD_ROWS = 2;

  /* ── Speed presets: [label, intervalMs, reactionWindowLabel] ── */
  var SPEED_PRESETS = [
    ["Zen",      350, "~2s window"],
    ["Chill",    280, "~1.5s window"],
    ["Easy",     220, "~1s window"],
    ["Normal",   170, "~700ms window"],
    ["Fast",     130, "~500ms window"],
    ["Turbo",    95,  "~350ms window"],
    ["Insane",   60,  "~200ms window"]
  ];

  /* ── State ── */
  var state = 'select'; // select | playing | gameover | leaderboard
  var selectedAvatar = 0;
  var speedLevel = 2; // index into SPEED_PRESETS (default Easy)
  var snake, dir, nextDir, food, score, baseSpeed, speed;
  var capturedEmoji = []; // array of emoji indices captured this game

  /* ── Smooth animation state ── */
  var prevSnake = null; // positions at start of current step
  var accumulator = 0;  // time accumulated toward next tick
  var lastFrameTime = 0;
  var animFrame = null;
  var gameRunning = false;
  var gameOver = false;

  /* ── Capture toast state ── */
  var toasts = []; // {text, x, y, startTime}

  /* ── Avatar images ── */
  var avatarSrcs = ["https://d2xsxph8kpxj0f.cloudfront.net/310519663318016215/VLBcZWGPKDgGMMhnuB2oKx/avatar1_54ee146c.png", "https://d2xsxph8kpxj0f.cloudfront.net/310519663318016215/VLBcZWGPKDgGMMhnuB2oKx/avatar2_8beb7d44.png"];
  var avatarImgs = avatarSrcs.map(function(src) {
    var img = new Image();
    img.src = src;
    return img;
  });

  /* ── Direction to rotation angle ── */
  /* Images face "down" by default, so down=0, right=-90, up=180, left=90 */
  function dirToAngle(d) {
    if (d.x === 1 && d.y === 0) return -Math.PI / 2;
    if (d.x === -1 && d.y === 0) return Math.PI / 2;
    if (d.x === 0 && d.y === -1) return Math.PI;
    return 0; // down
  }

  /* ── Compute direction a segment is "facing" (toward the segment ahead of it) ── */
  function segmentDir(idx) {
    if (idx === 0) return dir;
    var curr = snake[idx];
    var prev = snake[idx - 1];
    var dx = prev.x - curr.x;
    var dy = prev.y - curr.y;
    // Clamp to unit (handles wrap-around edge cases)
    if (dx > 1) dx = 1; if (dx < -1) dx = -1;
    if (dy > 1) dy = 1; if (dy < -1) dy = -1;
    if (dx === 0 && dy === 0) return dir;
    return { x: dx, y: dy };
  }



  /* ── DOM refs ── */
  var selectScreen = document.getElementById('select-screen');
  var gameScreen = document.getElementById('game-screen');
  var gameoverDiv = document.getElementById('gameover');
  var lbScreen = document.getElementById('leaderboard-screen');
  var canvas = document.getElementById('game-canvas');
  var ctx = canvas.getContext('2d');
  var scoreDisplay = document.getElementById('score-display');
  var highDisplay = document.getElementById('high-display');
  var finalScore = document.getElementById('final-score');
  var snakeTrailDiv = document.getElementById('snake-trail');
  var avatarOptions = document.querySelectorAll('.avatar-option');
  var goButtons = document.querySelectorAll('#gameover .go-btn');
  var speedSlider = document.getElementById('speed-slider');
  var speedVal = document.getElementById('speed-val');
  var btnStart = document.getElementById('btn-start');
  var btnLeaderboard = document.getElementById('btn-leaderboard');
  var btnLbBack = document.getElementById('btn-lb-back');
  var lbList = document.getElementById('lb-list');

  /* ── Score history ── */
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem('ogsnake_history') || '[]'); }
    catch(e) { return []; }
  }
  function saveHistory(h) {
    h.sort(function(a,b) { return b.score - a.score; });
    if (h.length > 20) h.length = 20;
    localStorage.setItem('ogsnake_history', JSON.stringify(h));
  }
  function getBestScore() {
    var h = loadHistory();
    return h.length > 0 ? h[0].score : 0;
  }

  /* ── Focus helpers ── */
  function focusAvatar(idx) {
    avatarOptions.forEach(function(el, i) {
      el.classList.toggle('focused', i === idx);
    });
    selectedAvatar = idx;
  }

  var goFocusIdx = 0;
  function focusGoBtn(idx) {
    goButtons.forEach(function(el, i) {
      el.classList.toggle('focused', i === idx);
    });
    goFocusIdx = idx;
  }

  function updateSpeedDisplay() {
    speedSlider.value = speedLevel + 1;
    speedVal.textContent = SPEED_PRESETS[speedLevel][0] + '  ' + SPEED_PRESETS[speedLevel][2];
  }

  /* ── Random emoji ── */
  function randomEmojiIdx() {
    return Math.floor(Math.random() * ALL_EMOJI.length);
  }

  /* ── Lerp helper ── */
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  /* ── Spawn capture toast ── */
  function spawnToast(name, gridX, gridY) {
    var el = document.createElement('div');
    el.className = 'capture-toast';
    el.textContent = name;
    el.style.left = (gridX * CELL + CELL / 2) + 'px';
    el.style.top = (gridY * CELL) + 'px';
    gameScreen.appendChild(el);
    setTimeout(function() {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 1300);
  }

  /* ── Game logic ── */
  function initGame() {
    var startX = Math.floor(GRID / 2);
    var startY = Math.floor(GRID / 2);
    snake = [
      { x: startX, y: startY },
      { x: startX - 1, y: startY },
      { x: startX - 2, y: startY }
    ];
    prevSnake = null;
    capturedEmoji = [];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    baseSpeed = SPEED_PRESETS[speedLevel][1];
    speed = baseSpeed;
    scoreDisplay.textContent = 'Score: 0';
    highDisplay.textContent = 'Best: ' + getBestScore();
    placeFood();
  }

  function placeFood() {
    var occupied;
    do {
      food = {
        x: Math.floor(Math.random() * GRID),
        y: HUD_ROWS + Math.floor(Math.random() * (GRID - HUD_ROWS)),
        emojiIdx: randomEmojiIdx()
      };
      occupied = snake.some(function(s) { return s.x === food.x && s.y === food.y; });
    } while (occupied);
  }

  function advanceStep() {
    // Save current positions as "previous" for interpolation
    prevSnake = snake.map(function(s) { return { x: s.x, y: s.y }; });

    dir = { x: nextDir.x, y: nextDir.y };
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < HUD_ROWS || head.y >= GRID) {
      gameOver = true;
      return;
    }
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        gameOver = true;
        return;
      }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      capturedEmoji.push(food.emojiIdx);
      score++;
      scoreDisplay.textContent = 'Score: ' + score;
      var best = getBestScore();
      if (score > best) {
        highDisplay.textContent = 'Best: ' + score;
      }
      spawnToast(ALL_EMOJI[food.emojiIdx].d, food.x, food.y);
      if (speed > 40) speed -= 2;
      placeFood();
    } else {
      snake.pop();
    }
  }

  /* ── Draw with interpolation ── */
  function drawInterpolated(t) {
    ctx.clearRect(0, 0, 600, 600);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 0.5;
    for (var i = 0; i <= GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, HUD_ROWS * CELL); ctx.lineTo(i * CELL, 600); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(600, i * CELL); ctx.stroke();
    }

    // border
    ctx.strokeStyle = 'rgba(0,255,0,0.3)';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, HUD_ROWS * CELL, 600, 600 - HUD_ROWS * CELL);

    // food (gentle pulse)
    var foodImg = emojiImages[food.emojiIdx];
    if (foodImg && foodImg.complete && foodImg.naturalWidth > 0) {
      var pulse = 1 + 0.06 * Math.sin(performance.now() / 300);
      var fs = (CELL - 2) * pulse;
      var fo = (CELL - fs) / 2;
      ctx.drawImage(foodImg, food.x * CELL + fo, food.y * CELL + fo, fs, fs);
    }

    // Compute interpolation factor from accumulator
    var frac = Math.min(accumulator / speed, 1);

    // Draw snake body (tail to index 1)
    for (var i = snake.length - 1; i >= 1; i--) {
      var s = snake[i];
      var px, py;
      if (prevSnake && i < prevSnake.length) {
        px = lerp(prevSnake[i].x, s.x, frac) * CELL;
        py = lerp(prevSnake[i].y, s.y, frac) * CELL;
      } else {
        px = s.x * CELL;
        py = s.y * CELL;
      }

      var emojiOffset = i - 3;
      var sd = segmentDir(i);
      var sAngle = dirToAngle(sd);
      var scx = px + CELL / 2;
      var scy = py + CELL / 2;

      if (emojiOffset >= 0 && emojiOffset < capturedEmoji.length) {
        // Draw captured emoji rotated
        var eIdx = capturedEmoji[emojiOffset];
        var eImg = emojiImages[eIdx];
        if (eImg && eImg.complete && eImg.naturalWidth > 0) {
          ctx.save();
          ctx.translate(scx, scy);
          ctx.rotate(sAngle);
          ctx.drawImage(eImg, -CELL / 2 + 1, -CELL / 2 + 1, CELL - 2, CELL - 2);
          ctx.restore();
        }
      } else {
        // Avatar copy for initial body
        var avatarImg = avatarImgs[selectedAvatar];
        if (avatarImg.complete && avatarImg.naturalWidth > 0) {
          ctx.save();
          ctx.globalAlpha = 0.6;
          ctx.translate(scx, scy);
          ctx.rotate(sAngle);
          ctx.drawImage(avatarImg, -CELL / 2 + 1, -CELL / 2 + 1, CELL - 2, CELL - 2);
          ctx.restore();
        }
      }
    }

    // snake head (interpolated)
    var h = snake[0];
    var hx, hy;
    if (prevSnake && prevSnake.length > 0) {
      hx = lerp(prevSnake[0].x, h.x, frac) * CELL;
      hy = lerp(prevSnake[0].y, h.y, frac) * CELL;
    } else {
      hx = h.x * CELL;
      hy = h.y * CELL;
    }
    var headImg = avatarImgs[selectedAvatar];
    if (headImg.complete && headImg.naturalWidth > 0) {
      var angle = dirToAngle(dir);
      var cx = hx + CELL / 2;
      var cy = hy + CELL / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.drawImage(headImg, -CELL / 2, -CELL / 2, CELL, CELL);
      ctx.restore();
    }
  }

  /* ── Animation loop (unified: accumulate time, advance steps, render) ── */
  function renderLoop(timestamp) {
    if (!gameRunning) return;

    var dt = timestamp - lastFrameTime;
    lastFrameTime = timestamp;
    // Clamp dt to avoid spiral of death on tab switch
    if (dt > 500) dt = speed;

    accumulator += dt;

    // Advance game state as many steps as accumulated
    while (accumulator >= speed) {
      advanceStep();
      accumulator -= speed;
      if (gameOver) {
        endGame();
        return;
      }
    }

    drawInterpolated();
    animFrame = requestAnimationFrame(renderLoop);
  }

  function endGame() {
    gameRunning = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    state = 'gameover';
    finalScore.textContent = 'Score: ' + score;

    // Final draw at rest positions
    prevSnake = null;
    accumulator = speed; // frac = 1
    drawInterpolated();

    // Build snake trail display
    snakeTrailDiv.innerHTML = '';
    var headEl = document.createElement('img');
    headEl.src = avatarSrcs[selectedAvatar];
    headEl.style.border = '2px solid #0f0';
    snakeTrailDiv.appendChild(headEl);
    for (var b = 0; b < 2; b++) {
      var bodyEl = document.createElement('img');
      bodyEl.src = avatarSrcs[selectedAvatar];
      bodyEl.style.opacity = '0.6';
      snakeTrailDiv.appendChild(bodyEl);
    }
    capturedEmoji.forEach(function(eIdx) {
      var eEl = document.createElement('img');
      eEl.src = ALL_EMOJI[eIdx].s;
      eEl.title = ALL_EMOJI[eIdx].n + ' (' + ALL_EMOJI[eIdx].c + ')';
      snakeTrailDiv.appendChild(eEl);
    });

    // Save to history
    var history = loadHistory();
    history.push({
      score: score,
      avatar: selectedAvatar,
      emoji: capturedEmoji.slice(),
      speed: SPEED_PRESETS[speedLevel][0],
      date: new Date().toISOString().slice(0, 16).replace('T', ' ')
    });
    saveHistory(history);

    goFocusIdx = 0;
    focusGoBtn(0);
    gameoverDiv.style.display = 'flex';
  }

  function startGame() {
    state = 'playing';
    selectScreen.style.display = 'none';
    gameoverDiv.style.display = 'none';
    lbScreen.style.display = 'none';
    gameScreen.style.display = 'block';
    // Remove any lingering toasts
    var oldToasts = gameScreen.querySelectorAll('.capture-toast');
    oldToasts.forEach(function(el) { el.remove(); });
    initGame();
    prevSnake = snake.map(function(s) { return { x: s.x, y: s.y }; });
    accumulator = 0;
    gameOver = false;
    gameRunning = true;
    lastFrameTime = performance.now();
    animFrame = requestAnimationFrame(renderLoop);
  }

  function showSelect() {
    state = 'select';
    gameRunning = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    gameScreen.style.display = 'none';
    gameoverDiv.style.display = 'none';
    lbScreen.style.display = 'none';
    selectScreen.style.display = 'flex';
    focusAvatar(selectedAvatar);
    updateSpeedDisplay();
  }

  function showLeaderboard() {
    state = 'leaderboard';
    selectScreen.style.display = 'none';
    lbScreen.style.display = 'flex';

    var history = loadHistory();
    lbList.innerHTML = '';
    if (history.length === 0) {
      lbList.innerHTML = '<div class="lb-empty">No games yet. Go play!</div>';
      return;
    }
    history.forEach(function(entry, idx) {
      var div = document.createElement('div');
      div.className = 'lb-entry';

      var header = document.createElement('div');
      header.className = 'lb-header';
      header.innerHTML = '<span class="lb-rank">#' + (idx + 1) + '</span>' +
        '<span class="lb-score">Score: ' + entry.score + '</span>' +
        '<span class="lb-date">' + (entry.speed || '') + ' &middot; ' + (entry.date || '') + '</span>';
      div.appendChild(header);

      var trail = document.createElement('div');
      trail.className = 'lb-trail';
      var hImg = document.createElement('img');
      hImg.src = avatarSrcs[entry.avatar || 0];
      hImg.style.border = '1px solid #0f0';
      trail.appendChild(hImg);
      if (entry.emoji) {
        entry.emoji.forEach(function(eIdx) {
          if (eIdx >= 0 && eIdx < ALL_EMOJI.length) {
            var eImg = document.createElement('img');
            eImg.src = ALL_EMOJI[eIdx].s;
            eImg.title = ALL_EMOJI[eIdx].n;
            trail.appendChild(eImg);
          }
        });
      }
      div.appendChild(trail);
      lbList.appendChild(div);
    });
  }

  /* ── Input ── */
  document.addEventListener('keydown', function(e) {
    var keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Backspace','Escape'];
    if (keys.indexOf(e.key) !== -1) e.preventDefault();

    if (state === 'select') {
      if (e.key === 'ArrowLeft') focusAvatar(0);
      if (e.key === 'ArrowRight') focusAvatar(1);
      if (e.key === 'ArrowUp') {
        speedLevel = Math.min(speedLevel + 1, SPEED_PRESETS.length - 1);
        updateSpeedDisplay();
      }
      if (e.key === 'ArrowDown') {
        speedLevel = Math.max(speedLevel - 1, 0);
        updateSpeedDisplay();
      }
      if (e.key === 'Enter') startGame();
    }
    else if (state === 'playing') {
      if (e.key === 'ArrowUp' && dir.y !== 1) nextDir = { x: 0, y: -1 };
      if (e.key === 'ArrowDown' && dir.y !== -1) nextDir = { x: 0, y: 1 };
      if (e.key === 'ArrowLeft' && dir.x !== 1) nextDir = { x: -1, y: 0 };
      if (e.key === 'ArrowRight' && dir.x !== -1) nextDir = { x: 1, y: 0 };
      if (e.key === 'Backspace' || e.key === 'Escape') {
        gameRunning = false;
        if (animFrame) cancelAnimationFrame(animFrame);
        showSelect();
      }
    }
    else if (state === 'gameover') {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        focusGoBtn(goFocusIdx === 0 ? 1 : 0);
      }
      if (e.key === 'Enter') {
        if (goFocusIdx === 0) startGame();
        else showSelect();
      }
      if (e.key === 'Backspace' || e.key === 'Escape') showSelect();
    }
    else if (state === 'leaderboard') {
      if (e.key === 'Enter' || e.key === 'Backspace' || e.key === 'Escape') showSelect();
    }
  });

  /* ── Mouse/touch ── */
  avatarOptions.forEach(function(el, i) {
    el.addEventListener('click', function() { focusAvatar(i); });
  });
  btnStart.addEventListener('click', startGame);
  btnLeaderboard.addEventListener('click', showLeaderboard);
  btnLbBack.addEventListener('click', showSelect);
  goButtons.forEach(function(el, i) {
    el.addEventListener('click', function() {
      if (i === 0) startGame();
      else showSelect();
    });
  });
  speedSlider.addEventListener('input', function() {
    speedLevel = parseInt(this.value) - 1;
    updateSpeedDisplay();
  });

  /* ── Init ── */
  focusAvatar(0);
  updateSpeedDisplay();

})();
</script>
</body>
