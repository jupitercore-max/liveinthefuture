<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Trader — LITF Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d0d;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;width:600px;height:600px}

/* Mobile responsive: scale 600x600 canvas to fit viewport */
@media (max-width: 600px) {
  html,body{width:100%!important;height:100%!important;margin:0;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw!important;max-height:100vh!important;width:auto!important;height:auto!important;aspect-ratio:1/1}
}
@media (max-height: 600px) and (max-width: 600px) {
  canvas{max-height:100vh!important;max-width:100vh!important}
}
</style>
</head>
<body>
<canvas id="c" width="600" height="600" tabindex="0"></canvas>
<script>
(function(){
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 600, H = 600;

// Audio context
var audioCtx = null;
var analyser = null;
var micLevel = 0;
var micSmooth = 0;
var micActive = false;
var micFailed = false;

// Rank system
var RANKS = [
  {name: 'Intern', threshold: 0, cashMult: 1.0, lotSize: 1, timeBonus: 0},
  {name: 'Analyst', threshold: 50000, cashMult: 1.05, lotSize: 1, timeBonus: 0},
  {name: 'Broker', threshold: 200000, cashMult: 1.10, lotSize: 2, timeBonus: 3},
  {name: 'Fund Mgr', threshold: 500000, cashMult: 1.15, lotSize: 2, timeBonus: 5},
  {name: 'Director', threshold: 1500000, cashMult: 1.20, lotSize: 3, timeBonus: 5},
  {name: 'VP', threshold: 4000000, cashMult: 1.25, lotSize: 3, timeBonus: 8},
  {name: 'Managing Dir', threshold: 10000000, cashMult: 1.30, lotSize: 4, timeBonus: 8},
  {name: 'Wall St Legend', threshold: 25000000, cashMult: 1.35, lotSize: 5, timeBonus: 10}
];

function loadStats() {
  try {
    var raw = localStorage.getItem('trader_stats');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  // Migrate old format
  var best = parseInt(localStorage.getItem('trader_best') || '0');
  var games = parseInt(localStorage.getItem('trader_games') || '0');
  return {totalProfit: best * Math.max(1, games), bestProfit: best, totalGames: games, totalTrades: 0};
}

function saveStats() {
  try {
    localStorage.setItem('trader_stats', JSON.stringify(stats));
  } catch(e) {}
}

function getRankIdx(totalProfit) {
  var idx = 0;
  for (var i = RANKS.length - 1; i >= 0; i--) {
    if (totalProfit >= RANKS[i].threshold) { idx = i; break; }
  }
  return idx;
}

function getRankBonuses(rankIdx) {
  return RANKS[rankIdx];
}

var stats = loadStats();
var prevRankIdx = getRankIdx(stats.totalProfit);
var rankUpTriggered = false;

// Game state
var STATE_TITLE = 0, STATE_PLAY = 1, STATE_RESULT = 2;
var state = STATE_TITLE;
var selectedCommodity = 0;
var cash = 100000;
var startCash = 100000;
var baseTime = 60;
var timer = 60;
var lastTick = 0;
var priceTick = 0;
var frame = 0;
var currentLotSize = 1;

// Commodities
var NAMES = ['GOLD', 'OIL', 'CRYPTO', 'GRAIN'];
var COLORS = ['#FFD700', '#4FC3F7', '#FF6B35', '#66BB6A'];
var ICONS = ['🥇', '🛢️', '₿', '🌾'];
var BASE_PRICES = [2400, 78, 68000, 520];

var commodities = [];
var holdings = [0, 0, 0, 0];
var priceHistories = [[], [], [], []];
var HISTORY_LEN = 40;

// Market events
var events = [];
var eventTimer = 0;
var EVENT_MSGS = [
  {text: 'FED RATE CUT', targets: [0, 2], dir: 1, strength: 2},
  {text: 'OIL EMBARGO', targets: [1], dir: 1, strength: 3},
  {text: 'CRYPTO CRASH', targets: [2], dir: -1, strength: 3},
  {text: 'DROUGHT WARNING', targets: [3], dir: 1, strength: 2.5},
  {text: 'RECESSION FEARS', targets: [0, 1, 2, 3], dir: -1, strength: 1.5},
  {text: 'TECH RALLY', targets: [2], dir: 1, strength: 2.5},
  {text: 'GOLD RUSH', targets: [0], dir: 1, strength: 2},
  {text: 'SUPPLY GLUT', targets: [1, 3], dir: -1, strength: 2},
  {text: 'BULL MARKET', targets: [0, 1, 2, 3], dir: 1, strength: 1.5},
  {text: 'HARVEST SURPLUS', targets: [3], dir: -1, strength: 2}
];
var activeEvent = null;
var activeEventTimer = 0;

// News ticker
var newsTicker = '';
var newsTickerX = W;

// Black Swan events — rare, dramatic, discoverable
var BLACK_SWANS = [
  {text: '🦢 FLASH CRASH — ALL MARKETS HALTED', effect: 'flash_crash', desc: 'All prices drop 40-60% instantly'},
  {text: '🦢 CURRENCY COLLAPSE — CASH DEVALUES 50%', effect: 'cash_burn', desc: 'Your cash loses half its value'},
  {text: '🦢 SHORT SQUEEZE — CRYPTO MOONS 5×', effect: 'moon', commodity: 2, desc: 'One commodity goes parabolic'},
  {text: '🦢 EXCHANGE HACK — HOLDINGS FROZEN 8s', effect: 'freeze', desc: 'Cannot buy or sell for 8 seconds'},
  {text: '🦢 GOLDEN WINDOW — ALL PRICES +80% FOR 6s', effect: 'golden', desc: 'Brief window of inflated prices to sell into'},
  {text: '🦢 MARKET INVERSION — CHEAP↔EXPENSIVE FLIP', effect: 'invert', desc: 'Price ratios reverse between commodities'}
];
var blackSwanTriggered = false;
var blackSwanTimer = 0;
var blackSwanFlash = 0;
var activeBlackSwan = null;
var freezeTimer = 0;
var goldenTimer = 0;
var goldenPriceBoost = false;
var blackSwanSeen = {};  // Track which ones the player has ever seen

// Oscillators for price audio
var oscillators = [null, null, null, null];
var oscGains = [null, null, null, null];
var FREQS = [330, 440, 554, 660];

// Flash effects
var buyFlash = 0;
var sellFlash = 0;
var liquidateFlash = 0;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.85;
  
  for (var i = 0; i < 4; i++) {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = i === 2 ? 'sawtooth' : i === 1 ? 'triangle' : 'sine';
    osc.frequency.value = FREQS[i];
    gain.gain.value = 0;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    oscillators[i] = osc;
    oscGains[i] = gain;
  }
// === BGM System ===
var bgmAudio = null, bgmGameover = null, bgmMuted = false, bgmStarted = false;
function bgmInit() {
  bgmAudio = new Audio('audio/trader-bgm.mp3');
  bgmAudio.loop = true;
  bgmAudio.volume = 0.15;
  bgmGameover = new Audio('audio/gameover-gentle.mp3');
  bgmGameover.volume = 0.25;
}
function bgmPlay() {
  if (bgmMuted || !bgmAudio) return;
  if (!bgmStarted) { bgmAudio.currentTime = 0; bgmStarted = true; }
  bgmAudio.play().catch(function(){});
}
function bgmStop() { if (bgmAudio) { bgmAudio.pause(); } bgmStarted = false; }
function bgmGameOver() {
  bgmStop();
  if (bgmMuted || !bgmGameover) return;
  bgmGameover.currentTime = 0;
  bgmGameover.play().catch(function(){});
}
function bgmToggle() {
  bgmMuted = !bgmMuted;
  if (bgmMuted) { if (bgmAudio) bgmAudio.pause(); }
  else bgmPlay();
}

}

function initMic() {
  if (micActive || micFailed) return;
  micFailed = true;
  try {
    navigator.mediaDevices.getUserMedia({audio: true}).then(function(stream) {
      var src = audioCtx.createMediaStreamSource(stream);
      src.connect(analyser);
      micActive = true;
      micFailed = false;
    }).catch(function() { micFailed = true; });
  } catch(e) { micFailed = true; }
}

function updateMic() {
  if (!analyser) return;
  var data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  var sum = 0;
  for (var i = 0; i < data.length; i++) sum += data[i];
  micLevel = sum / (data.length * 255);
  micSmooth += (micLevel - micSmooth) * 0.08;
}

function initGame() {
  var rankIdx = getRankIdx(stats.totalProfit);
  var bonuses = getRankBonuses(rankIdx);
  
  startCash = Math.round(100000 * bonuses.cashMult);
  cash = startCash;
  currentLotSize = bonuses.lotSize;
  baseTime = 60 + bonuses.timeBonus;
  timer = baseTime;
  
  holdings = [0, 0, 0, 0];
  lastTick = Date.now();
  priceTick = 0;
  events = [];
  activeEvent = null;
  activeEventTimer = 0;
  selectedCommodity = 0;
  prevRankIdx = rankIdx;
  rankUpTriggered = false;
  
  // Black swan: 30% chance per game, triggers between 20-45s into the round
  blackSwanTriggered = false;
  blackSwanTimer = Math.random() < 0.30 ? (15 + Math.random() * 25) : -1;
  blackSwanFlash = 0;
  activeBlackSwan = null;
  freezeTimer = 0;
  goldenTimer = 0;
  goldenPriceBoost = false;
  // Load seen swans from localStorage
  try {
    var seenRaw = localStorage.getItem('trader_swans_seen');
    if (seenRaw) blackSwanSeen = JSON.parse(seenRaw);
  } catch(e) { blackSwanSeen = {}; }
  
  commodities = [];
  priceHistories = [[], [], [], []];
  for (var i = 0; i < 4; i++) {
    var p = BASE_PRICES[i];
    commodities.push({
      price: p,
      trend: (Math.random() - 0.5) * 0.003,
      momentum: 0,
      prevPrice: p
    });
    for (var j = 0; j < HISTORY_LEN; j++) {
      priceHistories[i].push(p);
    }
  }
  
  eventTimer = 8 + Math.random() * 7;
}

function portfolioValue() {
  var total = cash;
  for (var i = 0; i < 4; i++) {
    total += holdings[i] * commodities[i].price;
  }
  return total;
}

function buyOne(idx) {
  if (freezeTimer > 0) return; // Exchange frozen
  var price = commodities[idx].price;
  var lots = currentLotSize;
  // Buy as many as we can afford up to lot size
  var canAfford = Math.floor(cash / price);
  var toBuy = Math.min(lots, canAfford);
  if (toBuy > 0) {
    cash -= toBuy * price;
    holdings[idx] += toBuy;
    buyFlash = 1;
    stats.totalTrades += toBuy;
    playTrade(true);
  }
}

function sellOne(idx) {
  if (freezeTimer > 0) return; // Exchange frozen
  var lots = currentLotSize;
  var toSell = Math.min(lots, holdings[idx]);
  if (toSell > 0) {
    cash += toSell * commodities[idx].price;
    holdings[idx] -= toSell;
    sellFlash = 1;
    stats.totalTrades += toSell;
    playTrade(false);
  }
}

function liquidateAll() {
  if (freezeTimer > 0) return; // Exchange frozen
  var sold = false;
  for (var i = 0; i < 4; i++) {
    if (holdings[i] > 0) {
      cash += holdings[i] * commodities[i].price;
      stats.totalTrades += holdings[i];
      holdings[i] = 0;
      sold = true;
    }
  }
  if (sold) {
    liquidateFlash = 1;
    playLiquidate();
  }
}

function playTrade(isBuy) {
  if (!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = isBuy ? 600 : 400;
  g.gain.value = 0.15;
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start();
  osc.frequency.setTargetAtTime(isBuy ? 800 : 300, audioCtx.currentTime, 0.05);
  g.gain.setTargetAtTime(0, audioCtx.currentTime + 0.1, 0.05);
  osc.stop(audioCtx.currentTime + 0.3);
}

function playLiquidate() {
  if (!audioCtx) return;
  // Quick descending sweep — cash register sound
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = 900;
  g.gain.value = 0.12;
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start();
  osc.frequency.setTargetAtTime(400, audioCtx.currentTime, 0.08);
  g.gain.setTargetAtTime(0, audioCtx.currentTime + 0.25, 0.06);
  osc.stop(audioCtx.currentTime + 0.5);
  // Second hit for "ka-ching"
  var osc2 = audioCtx.createOscillator();
  var g2 = audioCtx.createGain();
  osc2.type = 'sine';
  osc2.frequency.value = 1200;
  g2.gain.value = 0.08;
  osc2.connect(g2);
  g2.connect(audioCtx.destination);
  osc2.start(audioCtx.currentTime + 0.1);
  g2.gain.setTargetAtTime(0, audioCtx.currentTime + 0.3, 0.05);
  osc2.stop(audioCtx.currentTime + 0.5);
}

function playEvent() {
  if (!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = 300;
  g.gain.value = 0.08;
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start();
  osc.frequency.setTargetAtTime(600, audioCtx.currentTime, 0.15);
  g.gain.setTargetAtTime(0, audioCtx.currentTime + 0.4, 0.1);
  osc.stop(audioCtx.currentTime + 0.6);
}

function playBlackSwan() {
  if (!audioCtx) return;
  // Ominous alarm — three descending notes with distortion
  var notes = [880, 440, 220];
  for (var i = 0; i < notes.length; i++) {
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = notes[i];
    g.gain.value = 0.15;
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.25);
    g.gain.setTargetAtTime(0.05, audioCtx.currentTime + i * 0.25 + 0.2, 0.05);
    osc.stop(audioCtx.currentTime + i * 0.25 + 0.4);
  }
  // Low rumble underneath
  var rumble = audioCtx.createOscillator();
  var rg = audioCtx.createGain();
  rumble.type = 'sawtooth';
  rumble.frequency.value = 55;
  rg.gain.value = 0.1;
  rumble.connect(rg);
  rg.connect(audioCtx.destination);
  rumble.start();
  rg.gain.setTargetAtTime(0, audioCtx.currentTime + 1.2, 0.3);
  rumble.stop(audioCtx.currentTime + 2);
}

function playBell() {
  if (!audioCtx) return;
  var notes = [523, 659, 784, 1047];
  for (var i = 0; i < notes.length; i++) {
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = notes[i];
    g.gain.value = 0.1;
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.12);
    g.gain.setTargetAtTime(0, audioCtx.currentTime + i * 0.12 + 0.3, 0.1);
    osc.stop(audioCtx.currentTime + i * 0.12 + 0.6);
  }
}

function playRankUp() {
  if (!audioCtx) return;
  var notes = [523, 659, 784, 1047];
  for (var i = 0; i < notes.length; i++) {
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = notes[i];
    g.gain.value = 0.12;
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + 0.5 + i * 0.15);
    g.gain.setTargetAtTime(0, audioCtx.currentTime + 0.5 + i * 0.15 + 0.4, 0.12);
    osc.stop(audioCtx.currentTime + 0.5 + i * 0.15 + 0.8);
  }
}

function updatePrices(dt) {
  var volatility = 0.5 + micSmooth * 4;
  
  for (var i = 0; i < 4; i++) {
    var c = commodities[i];
    c.prevPrice = c.price;
    
    c.trend += (Math.random() - 0.5) * 0.001 * volatility;
    c.trend = Math.max(-0.008, Math.min(0.008, c.trend));
    
    if (activeEvent) {
      for (var j = 0; j < activeEvent.targets.length; j++) {
        if (activeEvent.targets[j] === i) {
          c.momentum += activeEvent.dir * activeEvent.strength * 0.002 * dt;
        }
      }
    }
    
    c.momentum *= 0.98;
    
    var change = (c.trend + c.momentum + (Math.random() - 0.5) * 0.005 * volatility);
    c.price *= (1 + change);
    // Price floor at 10% of base price
    c.price = Math.max(BASE_PRICES[i] * 0.1, c.price);
    
    priceHistories[i].push(c.price);
    if (priceHistories[i].length > HISTORY_LEN) priceHistories[i].shift();
    
    if (oscillators[i]) {
      var priceChange = (c.price - c.prevPrice) / c.prevPrice;
      var targetFreq = FREQS[i] * (1 + priceChange * 50);
      targetFreq = Math.max(100, Math.min(2000, targetFreq));
      oscillators[i].frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
      
      var vol = (i === selectedCommodity) ? 0.06 : 0.015;
      oscGains[i].gain.setTargetAtTime(vol, audioCtx.currentTime, 0.05);
    }
  }
}

function updateEvents(dt) {
  eventTimer -= dt;
  if (eventTimer <= 0 && !activeEvent) {
    activeEvent = EVENT_MSGS[Math.floor(Math.random() * EVENT_MSGS.length)];
    activeEventTimer = 5;
    newsTicker = '⚡ BREAKING: ' + activeEvent.text + ' ⚡';
    newsTickerX = W;
    playEvent();
    eventTimer = 10 + Math.random() * 10;
  }
  if (activeEvent) {
    activeEventTimer -= dt;
    if (activeEventTimer <= 0) activeEvent = null;
  }
  
  // Black Swan trigger
  if (blackSwanTimer > 0 && !blackSwanTriggered) {
    blackSwanTimer -= dt;
    if (blackSwanTimer <= 0) {
      triggerBlackSwan();
    }
  }
  
  // Black Swan ongoing effects
  if (freezeTimer > 0) freezeTimer -= dt;
  if (goldenTimer > 0) {
    goldenTimer -= dt;
    if (goldenTimer <= 0) {
      goldenPriceBoost = false;
      // Snap prices back
      for (var i = 0; i < 4; i++) {
        commodities[i].price /= 1.8;
      }
    }
  }
  if (blackSwanFlash > 0) blackSwanFlash -= 0.008;
}

function triggerBlackSwan() {
  blackSwanTriggered = true;
  var swan = BLACK_SWANS[Math.floor(Math.random() * BLACK_SWANS.length)];
  activeBlackSwan = swan;
  blackSwanFlash = 1;
  newsTicker = swan.text;
  newsTickerX = W;
  activeEvent = null;
  activeEventTimer = 0;
  playBlackSwan();
  
  // Track discovery
  blackSwanSeen[swan.effect] = true;
  try { localStorage.setItem('trader_swans_seen', JSON.stringify(blackSwanSeen)); } catch(e) {}
  
  // Apply effect
  switch (swan.effect) {
    case 'flash_crash':
      for (var i = 0; i < 4; i++) {
        commodities[i].price *= (0.4 + Math.random() * 0.2); // 40-60% drop
        commodities[i].momentum = -0.02;
      }
      break;
    case 'cash_burn':
      cash = Math.round(cash * 0.5);
      break;
    case 'moon':
      var ci = swan.commodity !== undefined ? swan.commodity : Math.floor(Math.random() * 4);
      commodities[ci].price *= 5;
      commodities[ci].momentum = 0.03;
      break;
    case 'freeze':
      freezeTimer = 8;
      break;
    case 'golden':
      goldenTimer = 6;
      goldenPriceBoost = true;
      for (var i = 0; i < 4; i++) {
        commodities[i].price *= 1.8;
      }
      break;
    case 'invert':
      // Swap price ratios — cheap becomes expensive, expensive becomes cheap
      var prices = [];
      for (var i = 0; i < 4; i++) prices.push(commodities[i].price / BASE_PRICES[i]);
      var maxRatio = Math.max.apply(null, prices);
      var minRatio = Math.min.apply(null, prices);
      for (var i = 0; i < 4; i++) {
        var normalized = (prices[i] - minRatio) / (maxRatio - minRatio || 1);
        var inverted = 1 - normalized;
        commodities[i].price = BASE_PRICES[i] * (minRatio + inverted * (maxRatio - minRatio));
      }
      break;
  }
}

function formatPrice(p) {
  if (p >= 10000) return '$' + Math.round(p).toLocaleString();
  if (p >= 100) return '$' + p.toFixed(1);
  return '$' + p.toFixed(2);
}

function formatMoney(m) {
  if (Math.abs(m) >= 1e6) return '$' + (m / 1e6).toFixed(2) + 'M';
  if (Math.abs(m) >= 1e3) return '$' + (m / 1e3).toFixed(1) + 'K';
  return '$' + m.toFixed(0);
}

function formatThreshold(t) {
  if (t >= 1e6) return (t / 1e6) + 'M';
  if (t >= 1e3) return (t / 1e3) + 'K';
  return '' + t;
}

function drawTitle() {
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, W, H);
  
  // Animated background — scrolling price lines
  ctx.strokeStyle = 'rgba(255,215,0,0.05)';
  ctx.lineWidth = 1;
  for (var i = 0; i < 8; i++) {
    ctx.beginPath();
    for (var x = 0; x < W; x += 4) {
      var y = 200 + i * 40 + Math.sin(x * 0.02 + frame * 0.02 + i) * 20;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  
  // Title
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 64px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('TRADER', W/2, 140);
  
  ctx.fillStyle = '#888';
  ctx.font = '18px system-ui';
  ctx.fillText('Your room is the market', W/2, 175);
  
  // Rank display
  var rankIdx = getRankIdx(stats.totalProfit);
  var rank = RANKS[rankIdx];
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 20px system-ui';
  ctx.fillText('📊 ' + rank.name, W/2, 210);
  
  // Rank progress bar
  if (rankIdx < RANKS.length - 1) {
    var nextRank = RANKS[rankIdx + 1];
    var progress = (stats.totalProfit - rank.threshold) / (nextRank.threshold - rank.threshold);
    progress = Math.max(0, Math.min(1, progress));
    
    var barW = 240;
    var barH = 10;
    var barX = W/2 - barW/2;
    var barY = 220;
    ctx.fillStyle = '#222';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(barX, barY, barW * progress, barH);
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);
    
    ctx.fillStyle = '#777';
    ctx.font = '12px system-ui';
    ctx.fillText(formatMoney(stats.totalProfit) + ' / $' + formatThreshold(nextRank.threshold) + ' → ' + nextRank.name, W/2, 245);
  } else {
    ctx.fillStyle = '#FFD700';
    ctx.font = '12px system-ui';
    ctx.fillText('MAX RANK — $' + formatMoney(stats.totalProfit) + ' lifetime profit', W/2, 245);
  }
  
  // Rank bonuses preview
  if (rankIdx > 0) {
    ctx.fillStyle = '#555';
    ctx.font = '11px system-ui';
    var bonusTexts = [];
    if (rank.cashMult > 1) bonusTexts.push('+' + Math.round((rank.cashMult - 1) * 100) + '% capital');
    if (rank.lotSize > 1) bonusTexts.push(rank.lotSize + '× lots');
    if (rank.timeBonus > 0) bonusTexts.push('+' + rank.timeBonus + 's');
    if (bonusTexts.length) ctx.fillText(bonusTexts.join('  •  '), W/2, 260);
  }
  
  // Commodity preview
  var y0 = 290;
  for (var i = 0; i < 4; i++) {
    ctx.fillStyle = COLORS[i];
    ctx.font = '26px system-ui';
    ctx.fillText(ICONS[i] + ' ' + NAMES[i], W/2, y0 + i * 36);
  }
  
  // Instructions
  ctx.fillStyle = '#aaa';
  ctx.font = '15px system-ui';
  ctx.fillText('↑↓ Select  ← Buy  → Sell  Enter: Liquidate', W/2, 450);
  ctx.fillText('Loud room = volatile market', W/2, 472);
  ctx.fillText('Quiet room = stable market', W/2, 492);
  
  if (stats.bestProfit > 0) {
    ctx.fillStyle = '#4CAF50';
    ctx.font = '14px system-ui';
    ctx.fillText('Best: +' + formatMoney(stats.bestProfit) + '  •  Games: ' + stats.totalGames, W/2, 525);
  }
  
  // Start prompt
  var alpha = 0.5 + 0.5 * Math.sin(frame * 0.05);
  ctx.fillStyle = 'rgba(255,215,0,' + alpha + ')';
  ctx.font = 'bold 22px system-ui';
  ctx.fillText('ENTER to trade', W/2, 560);
  
  if (!micActive && !micFailed) {
    ctx.fillStyle = '#666';
    ctx.font = '12px system-ui';
    ctx.fillText('🎤 Press any key to enable mic (market volatility)', W/2, 590);
  }
}

function drawPlay() {
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, W, H);
  
  var pv = portfolioValue();
  var profit = pv - startCash;
  var profitPct = ((pv / startCash - 1) * 100);
  
  // Top bar
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, W, 50);
  
  // Timer
  ctx.fillStyle = timer <= 10 ? '#FF4444' : '#FFD700';
  ctx.font = 'bold 24px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('⏱ ' + Math.ceil(timer) + 's', 15, 34);
  
  // Rank label
  var rankIdx = getRankIdx(stats.totalProfit);
  ctx.fillStyle = '#666';
  ctx.font = '11px system-ui';
  ctx.fillText(RANKS[rankIdx].name, 15, 14);
  
  // Portfolio value
  ctx.textAlign = 'right';
  ctx.fillStyle = profit >= 0 ? '#4CAF50' : '#FF4444';
  ctx.font = 'bold 20px system-ui';
  ctx.fillText(formatMoney(pv), W - 15, 22);
  ctx.font = '14px system-ui';
  ctx.fillText((profit >= 0 ? '+' : '') + formatMoney(profit) + ' (' + (profitPct >= 0 ? '+' : '') + profitPct.toFixed(1) + '%)', W - 15, 42);
  
  // Cash + lot size
  ctx.textAlign = 'center';
  ctx.fillStyle = '#888';
  ctx.font = '14px system-ui';
  var cashLabel = 'Cash: ' + formatMoney(cash);
  if (currentLotSize > 1) cashLabel += '  (×' + currentLotSize + ' lots)';
  ctx.fillText(cashLabel, W/2, 34);
  
  // Volatility meter
  var volBarW = 80;
  var volBarH = 6;
  var volX = W/2 - volBarW/2;
  ctx.fillStyle = '#333';
  ctx.fillRect(volX, 43, volBarW, volBarH);
  var volFill = Math.min(1, micSmooth * 3);
  var volColor = volFill < 0.3 ? '#4CAF50' : volFill < 0.6 ? '#FFD700' : '#FF4444';
  ctx.fillStyle = volColor;
  ctx.fillRect(volX, 43, volBarW * volFill, volBarH);
  ctx.fillStyle = '#666';
  ctx.font = '9px system-ui';
  ctx.fillText(micActive ? '🎤 VOLATILITY' : '🎤 OFF', W/2, 42);
  
  // Commodity rows
  var rowH = 110;
  var startY = 55;
  
  for (var i = 0; i < 4; i++) {
    var y = startY + i * rowH;
    var c = commodities[i];
    var isSelected = (i === selectedCommodity);
    var priceChange = ((c.price - c.prevPrice) / c.prevPrice * 100);
    
    if (isSelected) {
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(0, y, W, rowH);
      ctx.strokeStyle = COLORS[i];
      ctx.lineWidth = 2;
      ctx.strokeRect(1, y + 1, W - 2, rowH - 2);
    }
    
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, y + rowH - 1, W, 1);
    
    // Left panel
    ctx.textAlign = 'left';
    ctx.fillStyle = COLORS[i];
    ctx.font = 'bold 18px system-ui';
    ctx.fillText(ICONS[i] + ' ' + NAMES[i], 12, y + 24);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 26px system-ui';
    ctx.fillText(formatPrice(c.price), 12, y + 56);
    
    var changeColor = priceChange >= 0 ? '#4CAF50' : '#FF4444';
    var arrow = priceChange >= 0 ? '▲' : '▼';
    ctx.fillStyle = changeColor;
    ctx.font = '14px system-ui';
    ctx.fillText(arrow + ' ' + Math.abs(priceChange).toFixed(2) + '%', 12, y + 76);
    
    if (holdings[i] > 0) {
      var holdVal = holdings[i] * c.price;
      ctx.fillStyle = '#aaa';
      ctx.font = '13px system-ui';
      ctx.fillText(holdings[i] + ' held = ' + formatMoney(holdVal), 12, y + 96);
    }
    
    // Price chart
    var chartX = 260;
    var chartW = 320;
    var chartH = 80;
    var chartY = y + 12;
    
    var hist = priceHistories[i];
    if (hist.length > 1) {
      var minP = Infinity, maxP = -Infinity;
      for (var j = 0; j < hist.length; j++) {
        if (hist[j] < minP) minP = hist[j];
        if (hist[j] > maxP) maxP = hist[j];
      }
      var range = maxP - minP || 1;
      
      // Fill under line
      ctx.beginPath();
      ctx.moveTo(chartX, chartY + chartH);
      for (var j = 0; j < hist.length; j++) {
        var px = chartX + (j / (HISTORY_LEN - 1)) * chartW;
        var py = chartY + chartH - ((hist[j] - minP) / range) * chartH;
        ctx.lineTo(px, py);
      }
      ctx.lineTo(chartX + chartW, chartY + chartH);
      ctx.closePath();
      var hex = COLORS[i];
      var r = parseInt(hex.slice(1,3), 16);
      var g = parseInt(hex.slice(3,5), 16);
      var b = parseInt(hex.slice(5,7), 16);
      ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',0.08)';
      ctx.fill();
      
      ctx.beginPath();
      for (var j = 0; j < hist.length; j++) {
        var px = chartX + (j / (HISTORY_LEN - 1)) * chartW;
        var py = chartY + chartH - ((hist[j] - minP) / range) * chartH;
        if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = COLORS[i];
      ctx.lineWidth = isSelected ? 2.5 : 1.5;
      ctx.stroke();
      
      var lastPx = chartX + chartW;
      var lastPy = chartY + chartH - ((hist[hist.length-1] - minP) / range) * chartH;
      ctx.beginPath();
      ctx.arc(lastPx, lastPy, isSelected ? 4 : 3, 0, Math.PI * 2);
      ctx.fillStyle = COLORS[i];
      ctx.fill();
    }
    
    if (isSelected) {
      ctx.fillStyle = '#4CAF50';
      ctx.font = '12px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('← BUY' + (currentLotSize > 1 ? ' ×' + currentLotSize : ''), chartX - 30, y + rowH - 6);
      ctx.fillStyle = '#FF4444';
      ctx.fillText('SELL →' + (currentLotSize > 1 ? ' ×' + currentLotSize : ''), chartX + chartW + 30, y + rowH - 6);
    }
  }
  
  // Buy flash
  if (buyFlash > 0) {
    ctx.fillStyle = 'rgba(76,175,80,' + (buyFlash * 0.3) + ')';
    ctx.fillRect(0, 0, W, H);
    buyFlash -= 0.05;
  }
  if (sellFlash > 0) {
    ctx.fillStyle = 'rgba(255,68,68,' + (sellFlash * 0.3) + ')';
    ctx.fillRect(0, 0, W, H);
    sellFlash -= 0.05;
  }
  if (liquidateFlash > 0) {
    ctx.fillStyle = 'rgba(255,215,0,' + (liquidateFlash * 0.25) + ')';
    ctx.fillRect(0, 0, W, H);
    liquidateFlash -= 0.04;
  }
  
  // News ticker
  if (activeEvent || activeBlackSwan) {
    var isBlackSwan = activeBlackSwan && blackSwanFlash > 0;
    ctx.fillStyle = isBlackSwan ? 'rgba(255,0,0,0.25)' : 'rgba(255,215,0,0.15)';
    ctx.fillRect(0, H - 30, W, 30);
    ctx.fillStyle = isBlackSwan ? '#FF0000' : '#FFD700';
    ctx.font = 'bold 16px system-ui';
    ctx.textAlign = 'left';
    ctx.fillText(newsTicker, newsTickerX, H - 10);
    newsTickerX -= (isBlackSwan ? 1 : 2);
    if (newsTickerX < -ctx.measureText(newsTicker).width) {
      newsTickerX = W;
      if (isBlackSwan) activeBlackSwan = null;
    }
  }
  
  // Black Swan full-screen flash
  if (blackSwanFlash > 0.5) {
    ctx.fillStyle = 'rgba(255,0,0,' + ((blackSwanFlash - 0.5) * 0.6) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  
  // Freeze overlay
  if (freezeTimer > 0) {
    ctx.fillStyle = 'rgba(0,100,255,0.08)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#4FC3F7';
    ctx.font = 'bold 28px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('🔒 EXCHANGE FROZEN — ' + Math.ceil(freezeTimer) + 's', W/2, H/2);
    ctx.textAlign = 'left';
  }
  
  // Golden window overlay
  if (goldenTimer > 0) {
    var gAlpha = 0.03 + 0.03 * Math.sin(frame * 0.1);
    ctx.fillStyle = 'rgba(255,215,0,' + gAlpha + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('⚡ GOLDEN WINDOW — SELL NOW! ' + Math.ceil(goldenTimer) + 's ⚡', W/2, H - 35);
    ctx.textAlign = 'left';
  }
  
  // Timer warning
  if (timer <= 10) {
    var pulseAlpha = 0.1 + 0.1 * Math.sin(frame * 0.15);
    ctx.fillStyle = 'rgba(255,0,0,' + pulseAlpha + ')';
    ctx.fillRect(0, 0, W, 4);
    ctx.fillRect(0, H - 4, W, 4);
  }
}

function drawResult() {
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, W, H);
  
  var pv = portfolioValue();
  var profit = pv - startCash;
  var profitPct = ((pv / startCash - 1) * 100);
  var isProfit = profit >= 0;
  
  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = isProfit ? '#4CAF50' : '#FF4444';
  ctx.font = 'bold 42px system-ui';
  ctx.fillText(isProfit ? 'PROFIT' : 'LOSS', W/2, 80);
  
  // Big number
  ctx.fillStyle = isProfit ? '#4CAF50' : '#FF4444';
  ctx.font = 'bold 52px system-ui';
  ctx.fillText((isProfit ? '+' : '') + formatMoney(profit), W/2, 145);
  
  ctx.fillStyle = '#888';
  ctx.font = '18px system-ui';
  ctx.fillText((profitPct >= 0 ? '+' : '') + profitPct.toFixed(1) + '% return', W/2, 175);
  
  // Grade
  var grade = 'F';
  var gradeColor = '#FF4444';
  if (profitPct >= 50) { grade = 'S'; gradeColor = '#FFD700'; }
  else if (profitPct >= 30) { grade = 'A'; gradeColor = '#4CAF50'; }
  else if (profitPct >= 15) { grade = 'B'; gradeColor = '#66BB6A'; }
  else if (profitPct >= 5) { grade = 'C'; gradeColor = '#aaa'; }
  else if (profitPct >= 0) { grade = 'D'; gradeColor = '#888'; }
  
  ctx.fillStyle = gradeColor;
  ctx.font = 'bold 64px system-ui';
  ctx.fillText(grade, W/2, 260);
  
  // Breakdown
  ctx.fillStyle = '#aaa';
  ctx.font = '15px system-ui';
  var y0 = 300;
  ctx.fillText('Cash: ' + formatMoney(cash), W/2, y0);
  for (var i = 0; i < 4; i++) {
    if (holdings[i] > 0) {
      ctx.fillStyle = COLORS[i];
      y0 += 22;
      ctx.fillText(ICONS[i] + ' ' + holdings[i] + ' × ' + formatPrice(commodities[i].price) + ' = ' + formatMoney(holdings[i] * commodities[i].price), W/2, y0);
    }
  }
  
  // Best
  y0 += 30;
  if (profit > stats.bestProfit) {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 18px system-ui';
    ctx.fillText('🏆 NEW BEST!', W/2, y0);
  } else if (stats.bestProfit > 0) {
    ctx.fillStyle = '#666';
    ctx.font = '13px system-ui';
    ctx.fillText('Best: +' + formatMoney(stats.bestProfit) + '  •  Games: ' + stats.totalGames, W/2, y0);
  }
  
  // Rank progress section
  y0 += 30;
  var rankIdx = getRankIdx(stats.totalProfit);
  var rank = RANKS[rankIdx];
  
  // Rank-up announcement
  if (rankUpTriggered) {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 22px system-ui';
    var glow = 0.5 + 0.5 * Math.sin(frame * 0.08);
    ctx.shadowColor = 'rgba(255,215,0,' + glow + ')';
    ctx.shadowBlur = 15;
    ctx.fillText('⭐ PROMOTED: ' + rank.name + ' ⭐', W/2, y0);
    ctx.shadowBlur = 0;
    
    // Show new bonus
    y0 += 22;
    ctx.fillStyle = '#aaa';
    ctx.font = '13px system-ui';
    var bonusTexts = [];
    if (rank.cashMult > 1) bonusTexts.push('+' + Math.round((rank.cashMult - 1) * 100) + '% capital');
    if (rank.lotSize > 1) bonusTexts.push(rank.lotSize + '× lots');
    if (rank.timeBonus > 0) bonusTexts.push('+' + rank.timeBonus + 's rounds');
    if (bonusTexts.length) ctx.fillText('Unlocked: ' + bonusTexts.join(', '), W/2, y0);
    y0 += 20;
  } else {
    ctx.fillStyle = '#888';
    ctx.font = '16px system-ui';
    ctx.fillText('📊 ' + rank.name, W/2, y0);
    y0 += 20;
  }
  
  // Rank progress bar
  if (rankIdx < RANKS.length - 1) {
    var nextRank = RANKS[rankIdx + 1];
    var progress = (stats.totalProfit - rank.threshold) / (nextRank.threshold - rank.threshold);
    progress = Math.max(0, Math.min(1, progress));
    
    var barW = 280;
    var barH = 12;
    var barX = W/2 - barW/2;
    ctx.fillStyle = '#222';
    ctx.fillRect(barX, y0, barW, barH);
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(barX, y0, barW * progress, barH);
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, y0, barW, barH);
    
    y0 += barH + 14;
    ctx.fillStyle = '#666';
    ctx.font = '12px system-ui';
    ctx.fillText(formatMoney(stats.totalProfit) + ' / $' + formatThreshold(nextRank.threshold) + ' → ' + nextRank.name, W/2, y0);
  }
  
  // Mic volatility note
  if (micActive) {
    ctx.fillStyle = '#555';
    ctx.font = '12px system-ui';
    ctx.fillText('Avg volatility: ' + (micSmooth < 0.1 ? 'Low 📉' : micSmooth < 0.25 ? 'Medium 📊' : 'High 📈'), W/2, H - 80);
  }
  
  // Black Swan discovery tracker
  var seenCount = 0;
  for (var k in blackSwanSeen) { if (blackSwanSeen.hasOwnProperty(k)) seenCount++; }
  if (seenCount > 0) {
    ctx.fillStyle = seenCount >= 6 ? '#FFD700' : '#555';
    ctx.font = '12px system-ui';
    ctx.fillText('🦢 Black Swans seen: ' + seenCount + '/6', W/2, H - 96);
  }
  
  // Restart
  var alpha = 0.5 + 0.5 * Math.sin(frame * 0.05);
  ctx.fillStyle = 'rgba(255,215,0,' + alpha + ')';
  ctx.font = 'bold 20px system-ui';
  ctx.fillText('ENTER to trade again', W/2, H - 42);
  
  ctx.fillStyle = '#555';
  ctx.font = '14px system-ui';
  ctx.fillText('ESC to quit', W/2, H - 18);
}

function update() {
  if (state !== STATE_PLAY) return;
  
  var now = Date.now();
  var dt = Math.min(0.1, (now - lastTick) / 1000);
  lastTick = now;
  
  timer -= dt;
  priceTick += dt;
  
  if (priceTick >= 0.5) {
    updatePrices(priceTick);
    priceTick = 0;
  }
  
  updateEvents(dt);
  updateMic();
  
  if (timer <= 0) {
    timer = 0;
    state = STATE_RESULT; bgmGameOver();
    
    var profit = portfolioValue() - startCash;
    var profitOnly = Math.max(0, profit);
    stats.totalGames++;
    stats.totalProfit += profitOnly;
    if (profit > stats.bestProfit) stats.bestProfit = profit;
    saveStats();
    
    // Check rank up
    var newRankIdx = getRankIdx(stats.totalProfit);
    if (newRankIdx > prevRankIdx) {
      rankUpTriggered = true;
      playRankUp();
    }
    
    // Silence oscillators
    for (var i = 0; i < 4; i++) {
      if (oscGains[i]) oscGains[i].gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
    }
    
    playBell();
  }
}

function render() {
  frame++;
  update();
  
  if (state === STATE_TITLE) drawTitle();
  else if (state === STATE_PLAY) drawPlay();
  else if (state === STATE_RESULT) drawResult();
  
  requestAnimationFrame(render);
}

document.addEventListener('keydown', function(e) {
  e.preventDefault();
  
  if (!audioCtx) initAudio(); if(!bgmAudio) bgmInit();
  if (!micActive && !micFailed) initMic();
  
  if (state === STATE_TITLE) {
    if (e.key === 'Enter') {
      initGame();
      state = STATE_PLAY; bgmPlay();
      lastTick = Date.now();
      playBell();
    }
    if (e.key === 'Escape') {
      window.location.href = '/games/';
    }
  } else if (state === STATE_PLAY) {
    if (e.key === 'ArrowUp') {
      selectedCommodity = (selectedCommodity + 3) % 4;
    } else if (e.key === 'ArrowDown') {
      selectedCommodity = (selectedCommodity + 1) % 4;
    } else if (e.key === 'ArrowLeft') {
      buyOne(selectedCommodity);
    } else if (e.key === 'ArrowRight') {
      sellOne(selectedCommodity);
    } else if (e.key === 'Enter') {
      liquidateAll();
    }
  } else if (state === STATE_RESULT) {
    if (e.key === 'Enter') {
      initGame();
      state = STATE_PLAY;
      lastTick = Date.now();
      playBell();
    }
    if (e.key === 'Escape') {
      window.location.href = '/games/';
    }
  }
});

render();
})();
</script>
<script>
/* === MRBD D-pad Fix === */
(function() {
  // Prevent MRBD browser from intercepting D-pad for spatial navigation
  document.addEventListener('keydown', function(e) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key)) {
      e.preventDefault();
    }
  }, true); // capture phase to beat browser's handler
  // Auto-focus canvas and click-to-refocus
  var c = document.querySelector('canvas');
  if (c) {
    if (!c.getAttribute('tabindex')) c.setAttribute('tabindex', '0');
    c.style.outline = 'none';
    c.focus();
    c.addEventListener('click', function() { c.focus(); });
    c.addEventListener('touchstart', function() { c.focus(); });
  }
  // Disable focusable elements during gameplay to prevent arrow-key focus stealing
  document.querySelectorAll('a, button, input, select, textarea').forEach(function(el) {
    el.setAttribute('tabindex', '-1');
  });
})();
/* === End MRBD D-pad Fix === */
</script>
<script src="../touch-controls.js"></script>
