<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://liveinthefuture.org/games/audio-memory.html" />
  <meta property="og:title" content="Audio Memory — LITF Games" />
  <meta property="og:url" content="https://liveinthefuture.org/games/audio-memory.html" />
  <meta property="og:site_name" content="Live in the Future" />
  <meta name="twitter:card" content="summary" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Audio Memory — LITF Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d0d;font-family:system-ui,-apple-system,sans-serif;color:#e0e0e0}
canvas{display:block;width:600px;height:600px}

/* Mobile responsive: scale 600x600 canvas to fit viewport */
@media (max-width: 600px) {
  html,body{width:100%!important;height:100%!important;margin:0;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw!important;max-height:100vh!important;width:auto!important;height:auto!important;aspect-ratio:1/1}
}
@media (max-height: 600px) and (max-width: 600px) {
  canvas{max-height:100vh!important;max-width:100vh!important}
}
</style>
</head>
<body>
<canvas id="c" width="600" height="600" tabindex="0"></canvas>
<script>
// === BGM System ===
var bgmAudio = null, bgmGameover = null, bgmMuted = false, bgmStarted = false;
function bgmInit() {
  bgmAudio = new Audio('audio/audio-memory-bgm.mp3');
  bgmAudio.loop = true;
  bgmAudio.volume = 0.15;
  bgmGameover = new Audio('audio/gameover-gentle.mp3');
  bgmGameover.volume = 0.25;
}
function bgmPlay() {
  if (bgmMuted || !bgmAudio) return;
  if (!bgmStarted) { bgmAudio.currentTime = 0; bgmStarted = true; }
  bgmAudio.play().catch(function(){});
}
function bgmStop() { if (bgmAudio) { bgmAudio.pause(); } bgmStarted = false; }
function bgmGameOver() {
  bgmStop();
  if (bgmMuted || !bgmGameover) return;
  bgmGameover.currentTime = 0;
  bgmGameover.play().catch(function(){});
}
function bgmToggle() {
  bgmMuted = !bgmMuted;
  if (bgmMuted) { if (bgmAudio) bgmAudio.pause(); }
  else bgmPlay();
}

(function(){
"use strict";
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 600, H = 600, CX = W/2, CY = H/2;

// Audio
var audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

// Tones for each direction — musical, pleasant
var TONES = {
  up:    { freq: 523.25, color: "#4fc3f7", label: "▲", angle: -Math.PI/2 },  // C5
  right: { freq: 659.25, color: "#81c784", label: "▶", angle: 0 },           // E5
  down:  { freq: 392.00, color: "#ffb74d", label: "▼", angle: Math.PI/2 },   // G4
  left:  { freq: 440.00, color: "#e57373", label: "◀", angle: Math.PI }      // A4
};
var DIRS = ["up", "right", "down", "left"];

// Game state
var STATE_TITLE = 0, STATE_WATCH = 1, STATE_PLAY = 2, STATE_CORRECT = 3;
var STATE_WRONG = 4, STATE_GAMEOVER = 5, STATE_SPEED = 6;
var state = STATE_TITLE;
var sequence = [];
var playerIndex = 0;
var round = 1;
var bestRound = 0;
var showIndex = 0;
var showTimer = 0;
var showGap = 0;
var activeDir = null;
var activeTimer = 0;
var flashTimer = 0;
var flashColor = "";
var comboStreak = 0;
var totalScore = 0;
var speedMode = false;
var baseTempo = 600; // ms per tone
var tempo = baseTempo;
var correctFlash = 0;
var shakeTimer = 0;
var shakeX = 0, shakeY = 0;
var particles = [];
var titlePulse = 0;
var inputLocked = false;

// Risk bid system — strategic depth
var STATE_BID = 7;
var lives = 3;
var maxLives = 3;
var bidLevel = 0; // 0=safe(1×), 1=risky(2×), 2=reckless(3×)
var BID_OPTIONS = [
  {label:"SAFE",   mult:1, cost:1, color:"#81c784", desc:"1× score, lose 1 life"},
  {label:"RISKY",  mult:2, cost:2, color:"#ffb74d", desc:"2× score, lose 2 lives"},
  {label:"ALL IN", mult:3, cost:3, color:"#ff5252", desc:"3× score, GAME OVER"}
];
var bidConfirmTimer = 0;

// Challenge rounds
var challengeType = null; // null, "reverse", "ghost", "speed"
var ghostIndex = -1;
var challengeAnnounceTimer = 0;
var CHALLENGE_TYPES = ["reverse", "ghost", "speed"];
var CHALLENGE_INFO = {
  reverse: {name: "🔄 REVERSE", desc: "Repeat it BACKWARDS!", color: "#e040fb"},
  ghost:   {name: "👻 GHOST TONE", desc: "One tone is hidden!", color: "#7c4dff"},
  speed:   {name: "⚡ DOUBLE SPEED", desc: "2× speed, 2× points!", color: "#ffab00"}
};

// Load best from localStorage
try { bestRound = parseInt(localStorage.getItem("litf_audiomem_best")) || 0; } catch(e) {}

function playTone(dir, duration) {
  ensureAudio();
  var t = TONES[dir];
  if (!t) return;
  var dur = duration || 0.25;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(t.freq, audioCtx.currentTime);
  // Add a slight harmonic for richness
  var osc2 = audioCtx.createOscillator();
  osc2.type = "sine";
  osc2.frequency.setValueAtTime(t.freq * 2, audioCtx.currentTime);
  var gain2 = audioCtx.createGain();
  gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  osc2.connect(gain2);
  gain.connect(audioCtx.destination);
  gain2.connect(audioCtx.destination);
  osc.start();
  osc2.start();
  osc.stop(audioCtx.currentTime + dur);
  osc2.stop(audioCtx.currentTime + dur);
}

function playWrongSound() {
  ensureAudio();
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.4);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}

function playSuccessChime() {
  ensureAudio();
  var notes = [523.25, 659.25, 783.99]; // C5 E5 G5
  for (var i = 0; i < notes.length; i++) {
    (function(idx) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(notes[idx], audioCtx.currentTime + idx * 0.12);
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + idx * 0.12);
      osc.stop(audioCtx.currentTime + idx * 0.12 + 0.3);
    })(i);
  }
}

function addParticles(dir, count) {
  var t = TONES[dir];
  var bx = CX + Math.cos(t.angle) * 130;
  var by = CY + Math.sin(t.angle) * 130;
  for (var i = 0; i < count; i++) {
    var a = Math.random() * Math.PI * 2;
    var spd = 1 + Math.random() * 3;
    particles.push({
      x: bx, y: by,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
      color: t.color,
      size: 2 + Math.random() * 4
    });
  }
}

function startGame() {
  sequence = [];
  playerIndex = 0;
  round = 1;
  comboStreak = 0;
  totalScore = 0;
  speedMode = false;
  tempo = baseTempo;
  lives = 3;
  maxLives = 3;
  bidLevel = 0;
  addToSequence();
  startBidPhase();
}

function addToSequence() {
  sequence.push(DIRS[Math.floor(Math.random() * 4)]);
}

function startBidPhase() {
  // First round: skip bid, go straight to listen
  if (round === 1) {
    bidLevel = 0;
    startShowSequence();
    return;
  }
  state = STATE_BID;
  bidLevel = 0;
  bidConfirmTimer = 0;
  inputLocked = false;
}

function playBidSelectSound() {
  ensureAudio();
  var freq = 300 + bidLevel * 200;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  g.gain.setValueAtTime(0.2, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.2);
}

function playBidConfirmSound() {
  ensureAudio();
  var base = 400 + bidLevel * 150;
  var notes = [base, base * 1.25, base * 1.5];
  for (var i = 0; i < notes.length; i++) {
    (function(idx) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = bidLevel === 2 ? "sawtooth" : "triangle";
      o.frequency.setValueAtTime(notes[idx], audioCtx.currentTime + idx * 0.08);
      g.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + idx * 0.08);
      o.stop(audioCtx.currentTime + idx * 0.08 + 0.25);
    })(i);
  }
}

function setupChallenge() {
  if (round >= 3 && round % 3 === 0) {
    challengeType = CHALLENGE_TYPES[Math.floor(Math.random() * CHALLENGE_TYPES.length)];
    if (challengeType === "ghost" && sequence.length >= 2) {
      ghostIndex = Math.floor(Math.random() * sequence.length);
    } else if (challengeType === "ghost") {
      challengeType = "speed"; // fallback for very short sequences
      ghostIndex = -1;
    } else {
      ghostIndex = -1;
    }
    playChallengeChime();
  } else {
    challengeType = null;
    ghostIndex = -1;
  }
}

function playChallengeChime() {
  ensureAudio();
  var t = audioCtx.currentTime;
  // Rising mystery tone
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(300, t);
  o.frequency.exponentialRampToValueAtTime(600, t + 0.2);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.4);
  var o2 = audioCtx.createOscillator();
  var g2 = audioCtx.createGain();
  o2.type = "sine";
  o2.frequency.setValueAtTime(450, t + 0.1);
  o2.frequency.exponentialRampToValueAtTime(900, t + 0.3);
  g2.gain.setValueAtTime(0.15, t + 0.1);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  o2.connect(g2);
  g2.connect(audioCtx.destination);
  o2.start(t + 0.1);
  o2.stop(t + 0.5);
}

function startShowSequence() {
  setupChallenge();
  if (challengeType) {
    state = STATE_SPEED; // reuse speed state for announce
    challengeAnnounceTimer = 60; // ~1 second at 60fps
  } else {
    state = STATE_WATCH;
  }
  showIndex = 0;
  showTimer = 0;
  showGap = 0;
  activeDir = null;
  inputLocked = true;
  // Tempo increases every 5 rounds
  var baseTmp = baseTempo - (round - 1) * 20;
  if (challengeType === "speed") baseTmp = baseTmp * 0.5; // double speed
  tempo = Math.max(150, baseTmp);
}

function handleInput(dir) {
  if (inputLocked) return;
  if (state === STATE_BID) {
    if (dir === "left") {
      bidLevel = Math.max(0, bidLevel - 1);
      playBidSelectSound();
    } else if (dir === "right") {
      bidLevel = Math.min(2, bidLevel + 1);
      playBidSelectSound();
    }
    return;
  }
  if (state === STATE_PLAY) {
    ensureAudio();
    activeDir = dir;
    activeTimer = 8;
    playTone(dir, 0.2);
    addParticles(dir, 8);

    // Build expected sequence (reversed if challenge)
    var expected;
    if (challengeType === "reverse") {
      expected = sequence.slice().reverse();
    } else {
      expected = sequence;
    }

    if (dir === expected[playerIndex]) {
      playerIndex++;
      comboStreak++;
      var scoreMult = challengeType ? 2 : 1; // double points on challenge rounds
      var bidMult = BID_OPTIONS[bidLevel].mult;
      totalScore += round * comboStreak * scoreMult * bidMult;
      correctFlash = 6;

      if (playerIndex >= sequence.length) {
        // Round complete!
        state = STATE_CORRECT;
        inputLocked = true;
        if (round > bestRound) {
          bestRound = round;
          try { localStorage.setItem("litf_audiomem_best", bestRound); } catch(e) {}
        }
        playSuccessChime();
        shakeTimer = 8;
        setTimeout(function() {
          round++;
          addToSequence();
          playerIndex = 0;
          startBidPhase();
        }, 1200);
      }
    } else {
      // Wrong!
      state = STATE_WRONG;
      inputLocked = true;
      playWrongSound();
      flashColor = "#ff1744";
      flashTimer = 20;
      shakeTimer = 15;
      comboStreak = 0;
      var cost = BID_OPTIONS[bidLevel].cost;
      lives -= cost;
      if (lives <= 0) {
        lives = 0;
        setTimeout(function() {
          state = STATE_GAMEOVER; bgmGameOver();
        }, 1000);
      } else {
        // Survive! Show the correct answer briefly then continue
        setTimeout(function() {
          state = STATE_CORRECT;
          // Replay same round (don't add to sequence)
          playerIndex = 0;
          setTimeout(function() {
            startBidPhase();
          }, 800);
        }, 1000);
      }
    }
  }
}

// Input
document.addEventListener("keydown", function(e) {
  if (e.key === 'm' || e.key === 'M') { bgmToggle(); return; }
  e.preventDefault();
  var key = e.key;
  if (state === STATE_TITLE) {
    if (key === "Enter") {
      ensureAudio();
      startGame();
    }
    return;
  }
  if (state === STATE_BID) {
    if (key === "ArrowLeft") handleInput("left");
    else if (key === "ArrowRight") handleInput("right");
    else if (key === "Enter") {
      ensureAudio();
      playBidConfirmSound();
      inputLocked = true;
      setTimeout(function() {
        startShowSequence();
      }, 400);
    }
    else if (key === "Escape") { state = STATE_TITLE; }
    return;
  }
  if (state === STATE_GAMEOVER) {
    if (key === "Enter") {
      startGame();
    }
    if (key === "Escape") {
      state = STATE_TITLE;
    }
    return;
  }
  if (key === "Escape") {
    state = STATE_TITLE;
    return;
  }
  if (key === "ArrowUp") handleInput("up");
  else if (key === "ArrowRight") handleInput("right");
  else if (key === "ArrowDown") handleInput("down");
  else if (key === "ArrowLeft") handleInput("left");
});

// Update
var lastTime = 0;
var frameCount = 0;
var showPhaseTimer = 0;

function update(dt) {
  frameCount++;
  titlePulse += dt * 2;

  // Screen shake
  if (shakeTimer > 0) {
    shakeTimer--;
    shakeX = (Math.random() - 0.5) * shakeTimer * 0.8;
    shakeY = (Math.random() - 0.5) * shakeTimer * 0.8;
  } else {
    shakeX = 0;
    shakeY = 0;
  }

  // Active direction fade
  if (activeTimer > 0) activeTimer--;
  else activeDir = null;

  // Correct flash
  if (correctFlash > 0) correctFlash--;

  // Flash timer
  if (flashTimer > 0) flashTimer--;

  // Particles
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Challenge announce
  if (state === STATE_SPEED) {
    challengeAnnounceTimer--;
    if (challengeAnnounceTimer <= 0) {
      state = STATE_WATCH;
    }
  }

  // Show sequence logic
  if (state === STATE_WATCH) {
    showPhaseTimer += dt * 1000;
    var toneLen = tempo * 0.6;
    var gapLen = tempo * 0.4;

    if (showIndex < sequence.length) {
      if (showGap === 0) {
        // Playing tone
        if (showTimer === 0) {
          activeDir = sequence[showIndex];
          if (challengeType === "ghost" && showIndex === ghostIndex) {
            // Ghost tone: show pad dim glow but don't play audio
            addParticles(sequence[showIndex], 3);
          } else {
            playTone(sequence[showIndex], toneLen / 1000);
            addParticles(sequence[showIndex], 5);
          }
        }
        showTimer += dt * 1000;
        activeTimer = 8;
        if (showTimer >= toneLen) {
          showTimer = 0;
          showGap = 1;
          activeDir = null;
        }
      } else {
        // Gap between tones
        showTimer += dt * 1000;
        if (showTimer >= gapLen) {
          showTimer = 0;
          showGap = 0;
          showIndex++;
        }
      }
    } else {
      // Done showing — player's turn
      activeDir = null;
      state = STATE_PLAY; bgmPlay();
      playerIndex = 0;
      inputLocked = false;
    }
  }
}

// Draw
function drawPad(dir, highlight, alpha) {
  var t = TONES[dir];
  var dist = 130;
  var bx = CX + Math.cos(t.angle) * dist;
  var by = CY + Math.sin(t.angle) * dist;
  var size = 55;
  var a = alpha || 1;

  // Glow when highlighted
  if (highlight) {
    ctx.save();
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 30;
    ctx.globalAlpha = a;
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.arc(bx, by, size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Inner bright
    ctx.globalAlpha = a;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(bx, by, size * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  } else {
    // Dim pad
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = t.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(bx, by, size, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Direction label
    ctx.fillStyle = t.color;
    ctx.globalAlpha = 0.5;
    ctx.font = "28px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(t.label, bx, by);
    ctx.globalAlpha = 1;
  }
}

function drawTitle() {
  // Pulsing ring
  var pulse = Math.sin(titlePulse) * 0.15 + 0.85;
  ctx.strokeStyle = "#4fc3f7";
  ctx.globalAlpha = 0.2 * pulse;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(CX, CY, 140 * pulse, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Draw all 4 pads pulsing
  for (var i = 0; i < 4; i++) {
    var dir = DIRS[i];
    var t = TONES[dir];
    var dist = 130;
    var bx = CX + Math.cos(t.angle) * dist;
    var by = CY + Math.sin(t.angle) * dist;
    var pSize = 55 + Math.sin(titlePulse + i * 0.5) * 5;
    ctx.globalAlpha = 0.4 + Math.sin(titlePulse + i * 0.5) * 0.2;
    ctx.strokeStyle = t.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(bx, by, pSize, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = t.color;
    ctx.globalAlpha = 0.3;
    ctx.font = "28px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(t.label, bx, by);
    ctx.globalAlpha = 1;
  }

  // Title
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 36px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("AUDIO MEMORY", CX, CY - 20);

  ctx.fillStyle = "#888";
  ctx.font = "16px system-ui";
  ctx.fillText("Listen. Remember. Repeat.", CX, CY + 15);

  ctx.fillStyle = "#4fc3f7";
  ctx.font = "18px system-ui";
  var enterAlpha = 0.5 + Math.sin(titlePulse * 1.5) * 0.5;
  ctx.globalAlpha = enterAlpha;
  ctx.fillText("ENTER to start", CX, CY + 60);
  ctx.globalAlpha = 1;

  if (bestRound > 0) {
    ctx.fillStyle = "#ffb74d";
    ctx.font = "14px system-ui";
    ctx.fillText("Best: Round " + bestRound, CX, CY + 90);
  }

  // Footer
  ctx.fillStyle = "#555";
  ctx.font = "12px system-ui";
  ctx.fillText("ESC to quit", CX, H - 20);
}

function drawHUD() {
  // Round
  ctx.fillStyle = "#e0e0e0";
  ctx.font = "bold 18px system-ui";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText("Round " + round, 20, 15);

  // Sequence length indicator
  ctx.fillStyle = "#888";
  ctx.font = "13px system-ui";
  ctx.fillText(sequence.length + " tones", 20, 38);

  // Score
  ctx.textAlign = "right";
  ctx.fillStyle = "#4fc3f7";
  ctx.font = "bold 18px system-ui";
  ctx.fillText(totalScore, W - 20, 15);

  // Combo
  if (comboStreak > 1) {
    ctx.fillStyle = "#ffb74d";
    ctx.font = "13px system-ui";
    ctx.fillText(comboStreak + "× combo", W - 20, 38);
  }

  // Best
  if (bestRound > 0) {
    ctx.fillStyle = "#555";
    ctx.font = "12px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("Best: " + bestRound, CX, 15);
  }

  // Lives display
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  var livesStr = "";
  for (var li = 0; li < maxLives; li++) {
    livesStr += li < lives ? "♥" : "♡";
  }
  ctx.fillStyle = lives === 1 ? "#ff5252" : "#e57373";
  ctx.font = "16px system-ui";
  ctx.fillText(livesStr, CX, 35);

  // Bid multiplier indicator during play
  if (bidLevel > 0 && (state === STATE_WATCH || state === STATE_PLAY)) {
    var bo = BID_OPTIONS[bidLevel];
    ctx.fillStyle = bo.color;
    ctx.font = "bold 12px system-ui";
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    ctx.globalAlpha = 0.7;
    ctx.fillText(bo.mult + "× " + bo.label, W - 20, 38);
    ctx.globalAlpha = 1;
  }

  // State indicator
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";

  // Challenge type indicator
  if (challengeType && CHALLENGE_INFO[challengeType]) {
    var ci = CHALLENGE_INFO[challengeType];
    ctx.fillStyle = ci.color;
    ctx.font = "bold 13px system-ui";
    ctx.globalAlpha = 0.8;
    ctx.fillText(ci.name + " — 2×", CX, 60);
    ctx.globalAlpha = 1;
  }

  if (state === STATE_WATCH) {
    ctx.fillStyle = "#ffb74d";
    ctx.font = "bold 16px system-ui";
    var dots = "";
    for (var d = 0; d <= showIndex && d < 3; d++) dots += "•";
    ctx.fillText("LISTEN " + dots, CX, H - 15);
  } else if (state === STATE_PLAY) {
    ctx.fillStyle = "#81c784";
    ctx.font = "bold 16px system-ui";
    var turnLabel = challengeType === "reverse" ? "REVERSE  " : "YOUR TURN  ";
    ctx.fillText(turnLabel + playerIndex + "/" + sequence.length, CX, H - 15);
  } else if (state === STATE_CORRECT) {
    ctx.fillStyle = "#4fc3f7";
    ctx.font = "bold 18px system-ui";
    ctx.fillText("✓ CORRECT!", CX, H - 15);
  }

  // Progress dots
  if (state === STATE_PLAY || state === STATE_WATCH) {
    var dotY = H - 50;
    var maxDots = Math.min(sequence.length, 20);
    var dotSpacing = Math.min(20, (W - 100) / maxDots);
    var startX = CX - (maxDots - 1) * dotSpacing / 2;

    for (var i = 0; i < maxDots; i++) {
      var dx = startX + i * dotSpacing;
      var isPlayed = (state === STATE_PLAY && i < playerIndex) ||
                     (state === STATE_WATCH && i < showIndex);
      var isCurrent = (state === STATE_WATCH && i === showIndex && showGap === 0);
      var isGhost = (challengeType === "ghost" && i === ghostIndex);
      var dir = sequence[i];
      var col = TONES[dir] ? TONES[dir].color : "#555";
      if (isGhost && state === STATE_WATCH && i < showIndex) col = "#7c4dff";

      if (isCurrent) {
        ctx.fillStyle = isGhost ? "#7c4dff" : col;
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(dx, dotY, 5, 0, Math.PI * 2);
        ctx.fill();
      } else if (isPlayed) {
        ctx.fillStyle = col;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(dx, dotY, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = "#333";
        ctx.beginPath();
        ctx.arc(dx, dotY, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

function drawGameOver() {
  // Dim overlay
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, 0, W, H);

  // Draw all pads dim
  for (var i = 0; i < 4; i++) {
    drawPad(DIRS[i], false);
  }

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillStyle = "#ff1744";
  ctx.font = "bold 36px system-ui";
  ctx.fillText("GAME OVER", CX, CY - 50);

  ctx.fillStyle = "#e0e0e0";
  ctx.font = "22px system-ui";
  ctx.fillText("Round " + round, CX, CY);

  ctx.fillStyle = "#4fc3f7";
  ctx.font = "18px system-ui";
  ctx.fillText("Score: " + totalScore, CX, CY + 35);

  if (round >= bestRound && bestRound > 0) {
    ctx.fillStyle = "#ffb74d";
    ctx.font = "bold 16px system-ui";
    ctx.fillText("★ NEW BEST! ★", CX, CY + 70);
  } else if (bestRound > 0) {
    ctx.fillStyle = "#888";
    ctx.font = "14px system-ui";
    ctx.fillText("Best: Round " + bestRound, CX, CY + 70);
  }

  // Show what bid level killed you
  if (bidLevel > 0) {
    var bo = BID_OPTIONS[bidLevel];
    ctx.fillStyle = bo.color;
    ctx.font = "13px system-ui";
    ctx.fillText("Bid: " + bo.label + " (" + bo.mult + "×)", CX, CY + 88);
  }

  // Show the correct answer
  if (sequence.length > 0 && playerIndex < sequence.length) {
    var expectedSeq = challengeType === "reverse" ? sequence.slice().reverse() : sequence;
    var correctDir = expectedSeq[playerIndex];
    var t = TONES[correctDir];
    ctx.fillStyle = t.color;
    ctx.font = "14px system-ui";
    var hint = challengeType === "reverse" ? " (reversed)" : "";
    ctx.fillText("It was " + t.label + " (" + correctDir + ")" + hint, CX, CY + 100);
  }

  ctx.fillStyle = "#81c784";
  ctx.font = "16px system-ui";
  var blink = Math.sin(titlePulse * 2) > 0 ? 1 : 0.4;
  ctx.globalAlpha = blink;
  ctx.fillText("ENTER to retry", CX, CY + 140);
  ctx.globalAlpha = 1;

  ctx.fillStyle = "#555";
  ctx.font = "12px system-ui";
  ctx.fillText("ESC for title", CX, CY + 170);
}

function draw() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  ctx.fillStyle = "#0d0d0d";
  ctx.fillRect(-5, -5, W + 10, H + 10);

  // Flash overlay
  if (flashTimer > 0) {
    ctx.fillStyle = flashColor;
    ctx.globalAlpha = flashTimer / 20 * 0.15;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // Correct flash
  if (correctFlash > 0) {
    ctx.fillStyle = "#4fc3f7";
    ctx.globalAlpha = correctFlash / 6 * 0.1;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  if (state === STATE_TITLE) {
    drawTitle();
  } else if (state === STATE_GAMEOVER) {
    drawGameOver();
  } else if (state === STATE_BID) {
    // Bid phase drawing
    // Draw pads dim
    for (var i = 0; i < 4; i++) drawPad(DIRS[i], false);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#e0e0e0";
    ctx.font = "bold 22px system-ui";
    ctx.fillText("ROUND " + round, CX, CY - 100);

    ctx.fillStyle = "#888";
    ctx.font = "14px system-ui";
    ctx.fillText(sequence.length + " tones to remember", CX, CY - 75);

    // Bid options
    for (var bi = 0; bi < BID_OPTIONS.length; bi++) {
      var bo = BID_OPTIONS[bi];
      var by = CY - 20 + bi * 50;
      var isSelected = bi === bidLevel;

      if (isSelected) {
        // Selected option — glowing box
        ctx.fillStyle = bo.color;
        ctx.globalAlpha = 0.15;
        var bw = 240, bh = 40;
        ctx.fillRect(CX - bw/2, by - bh/2, bw, bh);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = bo.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(CX - bw/2, by - bh/2, bw, bh);

        ctx.fillStyle = bo.color;
        ctx.font = "bold 18px system-ui";
        ctx.fillText(bo.label + "  " + bo.mult + "×", CX, by - 2);
        ctx.font = "11px system-ui";
        ctx.fillStyle = "#ccc";
        ctx.fillText(bo.desc, CX, by + 14);
      } else {
        ctx.fillStyle = "#555";
        ctx.font = "16px system-ui";
        ctx.fillText(bo.label + "  " + bo.mult + "×", CX, by);
      }
    }

    // Arrow indicators
    ctx.fillStyle = "#888";
    ctx.font = "14px system-ui";
    ctx.fillText("◀ ▶ choose    ENTER confirm", CX, CY + 120);

    // Lives
    var livesStr = "";
    for (var li = 0; li < maxLives; li++) {
      livesStr += li < lives ? "♥" : "♡";
    }
    ctx.fillStyle = lives === 1 ? "#ff5252" : "#e57373";
    ctx.font = "18px system-ui";
    ctx.fillText(livesStr, CX, CY + 90);

    // Score
    ctx.fillStyle = "#4fc3f7";
    ctx.font = "bold 16px system-ui";
    ctx.textAlign = "right";
    ctx.fillText(totalScore, W - 20, 20);

  } else if (state === STATE_SPEED) {
    // Challenge announce overlay
    // Draw pads dim
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(CX, CY, 50, 0, Math.PI * 2);
    ctx.stroke();
    for (var i = 0; i < 4; i++) drawPad(DIRS[i], false);

    if (challengeType && CHALLENGE_INFO[challengeType]) {
      var ci = CHALLENGE_INFO[challengeType];
      var aAlpha = Math.min(1, (60 - challengeAnnounceTimer) / 10);
      ctx.globalAlpha = aAlpha;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = ci.color;
      ctx.font = "bold 32px system-ui";
      ctx.fillText(ci.name, CX, CY - 15);
      ctx.fillStyle = "#ccc";
      ctx.font = "16px system-ui";
      ctx.fillText(ci.desc, CX, CY + 20);
      ctx.fillStyle = "#888";
      ctx.font = "13px system-ui";
      ctx.fillText("2× POINTS", CX, CY + 50);
      ctx.globalAlpha = 1;
    }
    drawHUD();
  } else {
    // Draw center ring
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(CX, CY, 50, 0, Math.PI * 2);
    ctx.stroke();

    // Connecting lines
    ctx.strokeStyle = "#1a1a1a";
    ctx.lineWidth = 1;
    for (var i = 0; i < 4; i++) {
      var t = TONES[DIRS[i]];
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(t.angle) * 55, CY + Math.sin(t.angle) * 55);
      ctx.lineTo(CX + Math.cos(t.angle) * 75, CY + Math.sin(t.angle) * 75);
      ctx.stroke();
    }

    // Draw pads
    for (var i = 0; i < 4; i++) {
      var dir = DIRS[i];
      var isActive = (activeDir === dir && activeTimer > 0);
      drawPad(dir, isActive, isActive ? activeTimer / 8 : 1);
    }

    // Particles
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawHUD();
  }

  ctx.restore();
}

// Main loop
function frame(ts) {
  var dt = lastTime ? Math.min((ts - lastTime) / 1000, 0.05) : 0.016;
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
<script>
/* === MRBD D-pad Fix === */
(function() {
  // Prevent MRBD browser from intercepting D-pad for spatial navigation
  document.addEventListener('keydown', function(e) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key)) {
      e.preventDefault();
    }
  }, true); // capture phase to beat browser's handler
  // Auto-focus canvas and click-to-refocus
  var c = document.querySelector('canvas');
  if (c) {
    if (!c.getAttribute('tabindex')) c.setAttribute('tabindex', '0');
    c.style.outline = 'none';
    c.focus();
    c.addEventListener('click', function() { c.focus(); });
    c.addEventListener('touchstart', function() { c.focus(); });
  }
  // Disable focusable elements during gameplay to prevent arrow-key focus stealing
  document.querySelectorAll('a, button, input, select, textarea').forEach(function(el) {
    el.setAttribute('tabindex', '-1');
  });
})();
/* === End MRBD D-pad Fix === */
</script>
<script src="../touch-controls.js"></script>
</body>
