<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://liveinthefuture.org/games/" />
  <meta property="og:title" content="Games — Live in the Future" />
  <meta property="og:url" content="https://liveinthefuture.org/games/" />
  <meta property="og:site_name" content="Live in the Future" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../images/favicon-192.png">
  <link rel="apple-touch-icon" href="../images/favicon-192.png">
  <link rel="shortcut icon" type="image/png" href="../favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0">
<title>Games — Live in the Future</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0d0d0d;
  color: #e8e8e8;
  width: 600px;
  height: 600px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
.header {
  height: 50px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid #222;
  background: #111;
}
.header .logo { font-size: 14px; color: #888; }
.header h1 { font-size: 22px; margin-left: 12px; font-weight: 600; }
.list {
  height: 550px;
  overflow-y: auto;
  padding: 12px 16px;
  scroll-behavior: smooth;
}
.card {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  margin-bottom: 8px;
  background: #1a1a1a;
  border-radius: 10px;
  border: 2px solid transparent;
  transition: border-color 0.15s ease, background-color 0.15s ease;
  cursor: default;
}
.card.focused {
  border-color: #4a9eff;
  background: rgba(74, 158, 255, 0.1);
}
.card .emoji { font-size: 32px; margin-right: 14px; flex-shrink: 0; }
.card .info { flex: 1; min-width: 0; }
.card .title { font-size: 20px; font-weight: 600; color: #fff; }
.card .genre {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: #2a2a2a;
  color: #aaa;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.card .desc { font-size: 14px; color: #999; margin-top: 4px; }
.hint {
  text-align: center;
  padding: 12px;
  font-size: 13px;
  color: #555;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
</style>
</head>
<body>
<div class="header">
  <span class="logo">LITF</span>
  <h1>🎮 Games</h1>
</div>
<div class="list" id="list"></div>
<div class="hint">↑↓ Navigate · Enter Play · Esc Back</div>

<script>
var games = [
  { emoji: '⚔', title: 'Dungeon Crawl', score: 92, genre: 'Roguelike', desc: 'Explore procedural dungeons — hear monsters through walls, rank up across runs', file: 'dungeon-crawl.html' },
  { emoji: '🔱', title: 'Sonar Sub', score: 92, genre: 'Exploration', desc: 'Navigate caves by echolocation — discover bioluminescent zones, ancient relics, and deep-sea creatures', file: 'sonar-sub.html' },
  { emoji: '📈', title: 'Trader', score: 90, genre: 'Trading', desc: 'Trade 4 commodities in 60 seconds — your room\'s noise IS the market volatility. Watch for Black Swans.', file: 'trader.html' },
  { emoji: '🌌', title: 'Gravity Sling', score: 90, genre: 'Physics', desc: 'Slingshot probes through gravity wells — wormhole portals, spatial planet audio', file: 'gravity-sling.html' },
  { emoji: '🌍', title: 'Terraform', score: 90, genre: 'Simulation', desc: 'Build an ecosystem on a dead planet — discover 6 rare wonders', file: 'terraform.html' },
  { emoji: '🕵', title: 'Stalk', score: 88, genre: 'Stealth', desc: 'Be quiet IRL to stay hidden — 5 discoveries (guards, terrain), your mic IS the stealth mechanic', file: 'stalk.html' },
  { emoji: '🎣', title: 'Fisher', score: 84, genre: 'Relaxation', desc: 'Cast, listen, hook — 6 legendary encounters from Moon Frenzy to The Leviathan, quiet rooms attract more fish', file: 'fisher.html' },
  { emoji: '📡', title: 'Signal', score: 88, genre: 'Radar Defense', desc: 'Track blips by sound — 6 radar alerts create different survival challenges', file: 'signal.html' },
  { emoji: '🗼', title: 'Beacon', score: 88, genre: 'Lighthouse', desc: 'Sweep your beam and launch flares to guide ships through fog — 5 maritime events, room noise IS the fog', file: 'beacon.html' },
  { emoji: '⛏️', title: 'Mine', score: 88, genre: 'Digging', desc: 'Fog of war — dig by ear, not sight. Ore veins, crystal caverns, 5 rare geological events, and gem-for-HP repair tradeoffs create unique geology each run', file: 'mine.html' },
  { emoji: '⚔', title: 'Duel', score: 86, genre: 'Quick-Draw', desc: 'Quick-draw reaction — environmental modifiers change the rules each round', file: 'duel.html' },
  { emoji: '💫', title: 'Photon Dodge', score: 86, genre: 'Arcade', desc: 'Bullet-hell survival — shield ability, 4 power-up types, 5 hazards with distinct bone conduction warnings, mic-reactive patterns', file: 'photon-dodge.html' },
  { emoji: '🏰', title: 'Lord Bluetooth: Org', score: 86, genre: 'Management', desc: '30-day megacorp sim — manage engineers, spend Political Capital, 98 voice-acted events through bone conduction, 7 Corporate Myths to discover, caffeine Transcendence at 800mg', file: 'lord-bluetooth-org.html' },
  { emoji: '🫀', title: 'Pulse', score: 84, genre: 'Rhythm/Medical', desc: 'YOU are the heartbeat — keep rhythm while handling medical emergencies with D-pad', file: 'pulse.html' },
  { emoji: '🎵', title: 'Rhythm Pulse', score: 84, genre: 'Rhythm', desc: 'Mic-reactive rhythm game — beats from ambient music, lane modifiers add strategic decisions', file: 'rhythm-pulse.html' },
  { emoji: '⬡', title: 'Hex Collapse', score: 80, genre: 'Puzzle', desc: 'Chain-reaction hex tile matching — each color plays a unique note, burst gems add positioning strategy', file: 'hex-collapse.html' },
  { emoji: '🎰', title: 'Buffalo Gold', score: 80, genre: 'Slot Machine', desc: '1024 ways to win — nudge reels, collect buffalo multipliers in free spins, mic-driven volatility', file: 'buffalo-gold.html' },
  { emoji: '🔊', title: 'Audio Memory', score: 80, genre: 'Memory', desc: 'Listen, bid your confidence, repeat — 5 challenge types, risk management meets memory', file: 'audio-memory.html' },
  { emoji: '📡', title: 'Lord Bluetooth', score: 78, genre: 'Action', desc: 'Defend the wireless spectrum — room acoustics shape per-lane interference via FFT spectral mapping, 9 frequency lanes, 6 Royal Decrees', file: 'lord-bluetooth.html' }
];

var listEl = document.getElementById('list');
var focusIndex = 0;

function render() {
  listEl.innerHTML = '';
  for (var i = 0; i < games.length; i++) {
    var g = games[i];
    var card = document.createElement('div');
    card.className = 'card' + (i === focusIndex ? ' focused' : '');
    card.setAttribute('data-idx', i);
    var scoreColor = g.score >= 90 ? '#facc15' : g.score >= 76 ? '#4a9eff' : '#9ca3af';
    card.innerHTML = '<div class="emoji">' + g.emoji + '</div>' +
      '<div class="info">' +
        '<div class="title">' + g.title + ' <span style="font-size:14px;font-weight:700;color:' + scoreColor + '">' + g.score + '/100</span></div>' +
        '<span class="genre">' + g.genre + '</span>' +
        '<div class="desc">' + g.desc + '</div>' +
      '</div>';
    listEl.appendChild(card);
  }
  var focused = listEl.querySelector('.focused');
  if (focused) focused.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

document.addEventListener('keydown', function(e) {
  e.preventDefault();
  if (e.key === 'ArrowDown') {
    focusIndex = Math.min(games.length - 1, focusIndex + 1);
    render();
  } else if (e.key === 'ArrowUp') {
    focusIndex = Math.max(0, focusIndex - 1);
    render();
  } else if (e.key === 'Enter') {
    window.location.href = games[focusIndex].file;
  } else if (e.key === 'Escape' || e.key === 'Backspace') {
    window.location.href = '../';
  }
});

render();
</script>
</body>
</html>
