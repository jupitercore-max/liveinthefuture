<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Xin Fú City Builder — 新福特別行政區</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#e8e8e8;touch-action:none;overscroll-behavior:none;position:fixed;inset:0}
#gameCanvas{display:block;cursor:crosshair;image-rendering:pixelated;touch-action:none}
#view3d{position:fixed;inset:0;display:none;z-index:1}
#view3d.show{display:block}
#view3d canvas{display:block}

/* ─── HUD ─── */
#hud{position:fixed;top:0;left:0;right:0;background:linear-gradient(180deg,#111 0%,rgba(10,10,10,0.95) 100%);border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:10;font-size:12px;gap:4px;padding-top:env(safe-area-inset-top,0);flex-wrap:wrap;min-height:52px}
.stat{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#666}
.stat-val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-val.money{color:#4ade80}
.stat-val.pop{color:#60a5fa}
.stat-val.happy{color:#fbbf24}
.stat-val.happy.low{color:#ef4444}

/* ─── RCI Meter ─── */
#rciMeter{display:flex;gap:3px;align-items:flex-end;height:28px;padding:2px 4px;background:rgba(0,0,0,0.3);border-radius:6px}
.rci-bar{display:flex;flex-direction:column;align-items:center;gap:1px}
.rci-bar-fill{width:8px;border-radius:2px 2px 0 0;transition:height .3s;min-height:2px}
.rci-bar-label{font-size:7px;font-weight:700}
.rci-r .rci-bar-fill{background:#3b82f6}
.rci-c .rci-bar-fill{background:#f59e0b}
.rci-i .rci-bar-fill{background:#a16207}
.rci-r .rci-bar-label{color:#3b82f6}
.rci-c .rci-bar-label{color:#f59e0b}
.rci-i .rci-bar-label{color:#a16207}

/* ─── View Toggle (2D/3D) ─── */
#viewToggle{position:fixed;top:6px;right:6px;z-index:11;width:44px;height:36px;border-radius:8px;border:1px solid #333;background:rgba(26,26,26,.95);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);line-height:1.1;text-align:center}
#viewToggle:active{transform:scale(.92)}
#viewToggle.active3d{border-color:#4a9eff;background:rgba(74,158,255,.15);color:#4a9eff}

/* ─── Tax Slider ─── */
#taxControl{display:flex;flex-direction:column;align-items:center;gap:1px}
#taxSlider{width:60px;height:4px;-webkit-appearance:none;appearance:none;background:#333;border-radius:2px;outline:none}
#taxSlider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fbbf24;cursor:pointer}
#taxSlider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fbbf24;cursor:pointer;border:none}

/* ─── Toolbar Categories ─── */
#toolbarWrap{position:fixed;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(0deg,#0c0c0c 0%,rgba(10,10,10,0.98) 100%);border-top:1px solid #2a2a2a;padding-bottom:env(safe-area-inset-bottom,0)}
#categoryTabs{display:flex;gap:2px;padding:4px 4px 0;overflow-x:auto;scrollbar-width:none}
#categoryTabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:4px 10px;border-radius:6px 6px 0 0;font-size:10px;font-weight:600;color:#666;cursor:pointer;transition:all .15s;border-bottom:2px solid transparent;user-select:none;-webkit-user-select:none;white-space:nowrap}
.cat-tab.active{color:#4a9eff;border-bottom-color:#4a9eff}
.cat-tab:active{transform:scale(.95)}
#toolbar{padding:4px 4px 6px;display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity}
#toolbar::-webkit-scrollbar{display:none}
.tool{flex-shrink:0;width:60px;height:56px;border:1px solid #333;border-radius:10px;background:#1a1a1a;color:#ccc;font-size:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .1s,background .15s,border-color .15s;user-select:none;-webkit-user-select:none;scroll-snap-align:start}
.tool:active{transform:scale(.92);background:#222}
.tool.active{border-color:#4a9eff;background:rgba(74,158,255,.15);color:#fff;box-shadow:0 0 8px rgba(74,158,255,.2)}
.tool-icon{font-size:20px;line-height:1}
.tool-name{font-size:7px;text-align:center;line-height:1.1;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-cost{font-size:7px;color:#666}
.tool.active .tool-cost{color:#4a9eff}
.tool-demand{font-size:6px;color:#22c55e;font-weight:700}
.tool.demand-high{border-color:#22c55e;box-shadow:0 0 4px rgba(34,197,94,.3)}

/* ─── Scroll indicators ─── */
.scroll-fade{position:absolute;top:0;bottom:0;width:24px;pointer-events:none;z-index:1;display:flex;align-items:center;justify-content:center}
.scroll-fade.left{left:0;background:linear-gradient(90deg,rgba(10,10,10,0.9),transparent)}
.scroll-fade.right{right:0;background:linear-gradient(270deg,rgba(10,10,10,0.9),transparent)}
.scroll-fade.hidden{display:none}
.scroll-fade .arrow{font-size:12px;color:#555;opacity:.7}

/* ─── Info Bar ─── */
#infoBar{position:fixed;bottom:120px;left:8px;right:8px;background:rgba(10,10,10,.94);border:1px solid #2a2a2a;border-radius:10px;padding:10px 14px;font-size:12px;z-index:9;display:none;max-width:380px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#infoBar.show{display:block}
#infoBar .info-title{font-weight:700;color:#fbbf24;margin-bottom:4px;font-size:14px}
#infoBar .info-row{display:flex;justify-content:space-between;margin:2px 0;color:#aaa}
#infoBar .info-row .val{color:#e8e8e8;font-weight:600}
#infoBar .info-close{position:absolute;top:4px;right:8px;color:#666;font-size:16px;cursor:pointer}

/* ─── Budget Panel ─── */
#budgetPanel{position:fixed;top:52px;left:8px;background:rgba(10,10,10,.96);border:1px solid #2a2a2a;border-radius:10px;padding:10px 14px;font-size:11px;z-index:9;display:none;min-width:200px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#budgetPanel.show{display:block}
#budgetPanel .bp-title{font-weight:700;color:#4ade80;margin-bottom:4px;font-size:12px}
#budgetPanel .bp-row{display:flex;justify-content:space-between;margin:2px 0;color:#aaa}
#budgetPanel .bp-row .val{font-weight:600}
#budgetPanel .bp-row .val.pos{color:#4ade80}
#budgetPanel .bp-row .val.neg{color:#ef4444}

/* ─── Toast ─── */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(10,10,10,.96);border:1px solid #444;border-radius:10px;padding:8px 18px;font-size:13px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#toast.show{opacity:1}

/* ─── Minimap ─── */
#minimap{position:fixed;top:56px;right:56px;width:80px;height:80px;border:1px solid #333;border-radius:6px;z-index:8;opacity:.88;cursor:pointer;touch-action:none}

/* ─── Presence ─── */
.presence-badge{position:fixed;top:54px;left:6px;font-size:9px;color:#888;background:rgba(10,10,10,.85);padding:3px 8px;border-radius:6px;z-index:8}
.online-dot{display:inline-block;width:5px;height:5px;background:#22c55e;border-radius:50%;margin-right:3px}

/* ─── Mode Toggle (Pan vs Build) ─── */
#modeToggle{position:fixed;top:56px;right:144px;z-index:9;width:36px;height:36px;border-radius:50%;border:2px solid #333;background:rgba(26,26,26,.95);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#modeToggle:active{transform:scale(.9)}
#modeToggle.pan-mode{border-color:#fbbf24;background:rgba(251,191,36,.15)}

/* ─── Zoom buttons ─── */
#zoomControls{position:fixed;top:100px;right:10px;z-index:8;display:flex;flex-direction:column;gap:4px}
.zoom-btn{width:36px;height:36px;border-radius:8px;border:1px solid #333;background:rgba(26,26,26,.92);color:#ccc;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s;user-select:none;-webkit-user-select:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.zoom-btn:active{transform:scale(.88)}

/* ─── Budget / Sound buttons ─── */
#extraControls{position:fixed;top:100px;left:6px;z-index:8;display:flex;flex-direction:column;gap:4px}
.extra-btn{width:36px;height:36px;border-radius:8px;border:1px solid #333;background:rgba(26,26,26,.92);color:#ccc;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s;user-select:none;-webkit-user-select:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.extra-btn:active{transform:scale(.88)}
.extra-btn.active{border-color:#4a9eff;color:#4a9eff}

/* ─── Car / Driving ─── */
#dpad{position:fixed;bottom:130px;left:12px;z-index:9;display:none;user-select:none;-webkit-user-select:none;touch-action:none}
#dpad.show{display:block}
.dpad-row{display:flex;gap:4px;justify-content:center}
.dpad-btn{width:48px;height:48px;border-radius:12px;border:2px solid #2a4a2a;background:rgba(20,40,20,.9);color:#6bdc6b;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s,background .1s;user-select:none;-webkit-user-select:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dpad-btn:active,.dpad-btn.pressed{transform:scale(.88);background:rgba(40,80,40,.95);border-color:#4a9e4a}
.dpad-spacer{width:48px;height:48px}

#carControls{position:fixed;bottom:130px;right:12px;z-index:9;display:none;flex-direction:column;gap:6px}
#carControls.show{display:flex}
.car-btn{padding:8px 14px;border-radius:10px;border:1px solid #444;background:rgba(26,26,26,.92);color:#ccc;font-size:11px;font-weight:600;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .1s}
.car-btn:active{transform:scale(.92)}
.car-btn.spawn{border-color:#22c55e;color:#22c55e}
.car-btn.exit{border-color:#ef4444;color:#ef4444}

/* ─── Notification Badge ─── */
#notifBadge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#ef4444;color:#fff;font-size:9px;display:none;align-items:center;justify-content:center;font-weight:700}
#notifBadge.show{display:flex}

@media(max-width:600px){
  .stat-val{font-size:14px}
  .stat-label{font-size:8px}
  .tool{width:54px;height:52px}
  .tool-icon{font-size:18px}
  #hud{min-height:48px;padding-top:env(safe-area-inset-top,0)}
  #minimap{width:64px;height:64px;top:52px;right:52px}
  #modeToggle{top:52px;right:124px;width:32px;height:32px;font-size:14px}
  #viewToggle{top:4px;right:4px;width:40px;height:32px;font-size:9px}
}
@media(max-height:500px) and (orientation:landscape){
  #toolbar{padding:3px 4px}
  .tool{width:48px;height:42px}
  #hud{min-height:40px}
}
</style>
</head>
<body>

<div id="hud">
  <div class="stat"><span class="stat-label">💰 Treasury</span><span class="stat-val money" id="moneyVal">$50,000</span></div>
  <div class="stat"><span class="stat-label">👥 Citizens</span><span class="stat-val pop" id="popVal">0</span></div>
  <div class="stat"><span class="stat-label">😊 Happy</span><span class="stat-val happy" id="happyVal">75%</span></div>
  <div id="rciMeter" title="RCI Demand">
    <div class="rci-bar rci-r"><div class="rci-bar-fill" id="rciR" style="height:14px"></div><div class="rci-bar-label">R</div></div>
    <div class="rci-bar rci-c"><div class="rci-bar-fill" id="rciC" style="height:14px"></div><div class="rci-bar-label">C</div></div>
    <div class="rci-bar rci-i"><div class="rci-bar-fill" id="rciI" style="height:14px"></div><div class="rci-bar-label">I</div></div>
  </div>
  <div id="taxControl">
    <span class="stat-label">🏛️ Tax <span id="taxVal">5%</span></span>
    <input type="range" id="taxSlider" min="0" max="20" value="5" step="1">
  </div>
</div>

<canvas id="gameCanvas"></canvas>
<div id="view3d"></div>
<canvas id="minimap"></canvas>
<div class="presence-badge" id="presenceBadge" style="display:none"><span class="online-dot"></span><span id="presenceText">just you</span></div>
<div id="infoBar"></div>
<div id="budgetPanel"></div>
<div id="toast"></div>

<!-- View toggle 2D/3D -->
<div id="viewToggle">2D<br>3D</div>

<!-- Mode toggle: Build vs Pan -->
<div id="modeToggle" class="pan-mode" title="Toggle pan/build mode">🖐️</div>

<!-- Zoom buttons -->
<div id="zoomControls">
  <div class="zoom-btn" id="zoomIn">+</div>
  <div class="zoom-btn" id="zoomOut">−</div>
</div>

<!-- Extra controls -->
<div id="extraControls">
  <div class="extra-btn" id="budgetBtn" title="Budget">💰</div>
  <div class="extra-btn" id="soundBtn" title="Sound">🔊</div>
</div>

<!-- D-Pad for driving (mobile) -->
<div id="dpad">
  <div class="dpad-row"><div class="dpad-btn" data-dir="up">▲</div></div>
  <div class="dpad-row">
    <div class="dpad-btn" data-dir="left">◀</div>
    <div class="dpad-btn" data-dir="down">▼</div>
    <div class="dpad-btn" data-dir="right">▶</div>
  </div>
</div>

<!-- Car spawn/exit controls -->
<div id="carControls">
  <div class="car-btn spawn" id="spawnCarBtn">🚗 Drive!</div>
  <div class="car-btn exit" id="exitCarBtn" style="display:none">🚪 Exit Car</div>
</div>

<!-- Toolbar with categories -->
<div id="toolbarWrap">
  <div class="scroll-fade left hidden" id="scrollLeft"><span class="arrow">‹</span></div>
  <div class="scroll-fade right" id="scrollRight"><span class="arrow">›</span></div>
  <div id="categoryTabs"></div>
  <div id="toolbar"></div>
</div>

<script src="../firebase-shared.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// XIN FÚ CITY BUILDER — 新福特別行政區
// Enhanced SimCity-style city builder with 3D, RCI, power, & more
// ═══════════════════════════════════════════════════════════════════

const TILE = 20;
const GRID_W = 40, GRID_H = 40;
const WORLD_W = GRID_W * TILE, WORLD_H = GRID_H * TILE;

// ─── Tile Types ────────────────────────────────────────────────────
const T = {
  GRASS: 0, WATER: 1, ROAD: 2,
  RES: 3, COM: 4, IND: 5, AGRI: 6,
  BLUETOOTH_TOWER: 10, THRONE_ROOM: 11, GRILL: 12,
  GARAGE: 13, GUMMY_FACTORY: 14, HORN_TOWER: 15, SIGN: 16,
  POWER_PLANT: 17, POWER_LINE: 18, PARK: 19,
};

const TILE_DATA = {
  [T.GRASS]:    { name:'Grass', color:'#2d5a2d', cost:0 },
  [T.WATER]:    { name:'Water', color:'#1a3a5c', cost:0 },
  [T.ROAD]:     { name:'Road', color:'#444', cost:50 },
  [T.RES]:      { name:'Residential', color:'#3b82f6', cost:100 },
  [T.COM]:      { name:'Commercial', color:'#f59e0b', cost:150 },
  [T.IND]:      { name:'Industrial', color:'#a16207', cost:200 },
  [T.AGRI]:     { name:'Pepper Farm', color:'#16a34a', cost:80 },
  [T.BLUETOOTH_TOWER]: { name:'Bluetooth Tower', color:'#8b5cf6', cost:5000, special:true, landmark:true },
  [T.THRONE_ROOM]:     { name:"Lord Bluetooth's Throne", color:'#c9a84c', cost:3000, special:true, landmark:true },
  [T.GRILL]:           { name:'Napoleon Flex Flame Grill', color:'#ef4444', cost:1200, special:true, landmark:true },
  [T.GARAGE]:          { name:"GLENN'S GARAGE", color:'#64748b', cost:1500, special:true, landmark:true },
  [T.GUMMY_FACTORY]:   { name:'Smart Gummy Factory', color:'#ec4899', cost:2500, special:true, landmark:true },
  [T.HORN_TOWER]:      { name:'AI Horn Speaker Tower', color:'#06b6d4', cost:1800, special:true, landmark:true },
  [T.SIGN]:            { name:'Directional Sign', color:'#fbbf24', cost:10, special:true },
  [T.POWER_PLANT]:     { name:'Power Plant', color:'#f59e0b', cost:4000, special:true, power:5000 },
  [T.POWER_LINE]:      { name:'Power Line', color:'#6b7280', cost:30 },
  [T.PARK]:            { name:'Park', color:'#22c55e', cost:200, special:true },
};

// ─── Tool Categories ───────────────────────────────────────────────
const CATEGORIES = [
  { id:'zones', icon:'🏘️', name:'Zones' },
  { id:'roads', icon:'🛣️', name:'Infra' },
  { id:'landmarks', icon:'🏛️', name:'Special' },
  { id:'tools', icon:'🔧', name:'Tools' },
];

const TOOLS = [
  // Zones
  { id:'inspect', icon:'🔍', name:'Inspect', cost:0, cat:'tools' },
  { id:'road', icon:'🛣️', name:'Road', tile:T.ROAD, cost:50, cat:'roads' },
  { id:'res', icon:'🏠', name:'Residential', tile:T.RES, cost:100, cat:'zones', rci:'r' },
  { id:'com', icon:'🏪', name:'Commercial', tile:T.COM, cost:150, cat:'zones', rci:'c' },
  { id:'ind', icon:'🏭', name:'Industrial', tile:T.IND, cost:200, cat:'zones', rci:'i' },
  { id:'agri', icon:'🌶️', name:'Pepper Farm', tile:T.AGRI, cost:80, cat:'zones' },
  // Infrastructure
  { id:'power_line', icon:'🔌', name:'Power Line', tile:T.POWER_LINE, cost:30, cat:'roads' },
  { id:'power_plant', icon:'⚡', name:'Power Plant', tile:T.POWER_PLANT, cost:4000, cat:'roads' },
  { id:'park', icon:'🌳', name:'Park', tile:T.PARK, cost:200, cat:'roads' },
  // Landmarks
  { id:'bluetooth', icon:'📡', name:'BT Tower', tile:T.BLUETOOTH_TOWER, cost:5000, cat:'landmarks' },
  { id:'throne', icon:'👑', name:'Throne', tile:T.THRONE_ROOM, cost:3000, cat:'landmarks' },
  { id:'grill', icon:'🔥', name:'Grill', tile:T.GRILL, cost:1200, cat:'landmarks' },
  { id:'garage', icon:'🔧', name:'Garage', tile:T.GARAGE, cost:1500, cat:'landmarks' },
  { id:'gummy', icon:'🐻', name:'Gummy', tile:T.GUMMY_FACTORY, cost:2500, cat:'landmarks' },
  { id:'horn', icon:'📢', name:'Horn', tile:T.HORN_TOWER, cost:1800, cat:'landmarks' },
  { id:'sign', icon:'🪧', name:'Sign', tile:T.SIGN, cost:10, cat:'landmarks' },
  // Tools
  { id:'bulldoze', icon:'💥', name:'Bulldoze', cost:0, cat:'tools' },
  { id:'drive', icon:'🚗', name:'Drive', cost:0, cat:'tools' },
];

// ─── Road Signs ────────────────────────────────────────────────────
const ROAD_SIGNS = [
  { text:'Livermore — 45 mi ←', dir:'left' },
  { text:'Las Vegas — 540 mi →', dir:'right', sub:"Lord Bluetooth's Territory" },
  { text:'Menlo Park — 1215 Chrysler Dr →', dir:'right', sub:"Glenn's Garage HQ" },
  { text:'Tokyo — 5,128 mi →', dir:'right' },
  { text:'Copenhagen — 5,431 mi →', dir:'right' },
  { text:'Xin Fú Downtown — ↑', dir:'up' },
];

// ─── Canvas Setup ──────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');
minimap.width = 80; minimap.height = 80;

let camX = 0, camY = 0;
let zoom = 1;
let dragStart = null;
let isDragging = false;
let currentCategory = 'zones';

// ─── Responsive Canvas ─────────────────────────────────────────────
const HUD_H = 52;
const TOOLBAR_H = 90;

function resizeCanvas() {
  const w = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  try { if (View3D.initialized) View3D.onResize(); } catch(e) {}
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resizeCanvas);
  window.visualViewport.addEventListener('scroll', resizeCanvas);
}

// ─── Game State ────────────────────────────────────────────────────
let state = {
  grid: [],
  money: 50000,
  population: 0,
  happiness: 75,

// ─── Sound System ──────────────────────────────────────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}
function playSound(freq, duration, type) {
  if (!soundEnabled) return;
  const ac = getAudioCtx();
  if (!ac) return;
  if (ac.state === 'suspended') ac.resume();
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.08, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (duration || 0.1));
  osc.start(ac.currentTime);
  osc.stop(ac.currentTime + (duration || 0.1));
}
function sndPlace() { playSound(440, 0.08, 'square'); setTimeout(() => playSound(660, 0.06, 'square'), 40); }
function sndBulldoze() { playSound(150, 0.15, 'sawtooth'); }
function sndError() { playSound(200, 0.12, 'square'); }
function sndTick() { playSound(800, 0.03, 'sine'); }

// ─── Haptic feedback ───────────────────────────────────────────────
function haptic(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

// ─── Init Grid ─────────────────────────────────────────────────────
function initGrid() {
  state.grid = [];
  state.pollution = [];
  for (let y = 0; y < GRID_H; y++) {
    const row = [], pRow = [];
    for (let x = 0; x < GRID_W; x++) {
      let tile = T.GRASS;
      if ((x < 4 && y < 4) || (x > 35 && y > 35)) tile = T.WATER;
      if (x >= 8 && x <= 10 && y >= 30 && y <= 33) tile = T.WATER;
      row.push({ type: tile, level: 0, data: {} });
      pRow.push(0);
    }
    state.grid.push(row);
    state.pollution.push(pRow);
  }

  // Pre-place landmarks
  state.grid[20][20] = { type: T.BLUETOOTH_TOWER, level: 1, data: {} };
  state.grid[18][22] = { type: T.THRONE_ROOM, level: 1, data: {} };
  state.grid[22][18] = { type: T.GRILL, level: 1, data: {} };
  state.grid[26][28] = { type: T.GARAGE, level: 1, data: {} };
  state.grid[28][26] = { type: T.GUMMY_FACTORY, level: 1, data: {} };
  state.grid[15][25] = { type: T.HORN_TOWER, level: 1, data: {} };
  state.grid[24][14] = { type: T.AGRI, level: 1, data: {} };
  state.grid[25][14] = { type: T.AGRI, level: 1, data: {} };
  state.grid[24][15] = { type: T.AGRI, level: 1, data: {} };
  state.grid[25][15] = { type: T.AGRI, level: 1, data: {} };

  // Roads
  for (let x = 16; x <= 30; x++) state.grid[20][x] = { type: T.ROAD, level: 1, data: {} };
  for (let y = 15; y <= 28; y++) state.grid[y][20] = { type: T.ROAD, level: 1, data: {} };
  for (let y = 18; y <= 22; y++) state.grid[y][22] = { type: T.ROAD, level: 1, data: {} };
  for (let x = 22; x <= 28; x++) state.grid[26][x] = { type: T.ROAD, level: 1, data: {} };
  for (let x = 14; x <= 20; x++) state.grid[24][x] = { type: T.ROAD, level: 1, data: {} };

  // Zones
  for (let y of [18,19]) for (let x of [17,18,19]) state.grid[y][x] = { type: T.RES, level: 1, data:{} };
  for (let y of [21,22]) for (let x of [21,22,23]) state.grid[y][x] = { type: T.COM, level: 1, data:{} };
  for (let y of [27,28]) for (let x of [27,29]) state.grid[y][x] = { type: T.IND, level: 1, data:{} };

  // Power plant
  state.grid[14][14] = { type: T.POWER_PLANT, level: 1, data: {} };
  // Power lines connecting plant to city
  for (let x = 15; x <= 19; x++) {
    if (state.grid[14][x].type === T.GRASS) state.grid[14][x] = { type: T.POWER_LINE, level: 1, data: {} };
  }

  // Park
  state.grid[16][16] = { type: T.PARK, level: 1, data: {} };

  // Signs
  const signPositions = [
    { x: 12, y: 20, signIdx: 0 },
    { x: 31, y: 20, signIdx: 1 },
    { x: 20, y: 12, signIdx: 2 },
    { x: 33, y: 15, signIdx: 3 },
    { x: 6, y: 10, signIdx: 4 },
    { x: 20, y: 16, signIdx: 5 },
  ];
  signPositions.forEach(s => {
    state.grid[s.y][s.x] = { type: T.SIGN, level: 1, data: { signIdx: s.signIdx } };
  });
}

// ─── Camera Controls ───────────────────────────────────────────────
function getCanvasOffsetY() { return HUD_H; }

function screenToWorld(sx, sy) {
  return { x: (sx - camX) / zoom, y: (sy - camY - getCanvasOffsetY()) / zoom };
}
function worldToTile(wx, wy) {
  return { x: Math.floor(wx / TILE), y: Math.floor(wy / TILE) };
}
function centerCamera() {
  camX = (canvas.width - WORLD_W * zoom) / 2;
  camY = (canvas.height - getCanvasOffsetY() - TOOLBAR_H - WORLD_H * zoom) / 2;
  clampCamera();
}
function clampCamera() {
  camX = Math.max(Math.min(camX, 0), canvas.width - WORLD_W * zoom);
  camY = Math.max(Math.min(camY, getCanvasOffsetY()), Math.min(canvas.height - TOOLBAR_H - WORLD_H * zoom, getCanvasOffsetY()));
}

// ─── Touch/Mouse — Unified Pointer Events ──────────────────────────
let pointers = new Map();
let lastPinchDist = 0;
let pinchCenter = null;
const DRAG_THRESHOLD = 8;
const TAP_THRESHOLD = 6;

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY });
  if (pointers.size === 1) {
    dragStart = { x: e.clientX, y: e.clientY, camX, camY, moved: false, pointerId: e.pointerId };
  } else if (pointers.size === 2) {
    const pts = [...pointers.values()];
    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchCenter = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    if (dragStart) dragStart.moved = true;
  }
});

canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) {
    pointers.set(e.pointerId, { ...pointers.get(e.pointerId), x: e.clientX, y: e.clientY });
  }
  if (pointers.size === 2) {
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const newCenter = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    if (lastPinchDist > 0) {
      const scale = dist / lastPinchDist;
      const oldZoom = zoom;
      zoom = Math.max(0.5, Math.min(3, zoom * scale));
      const wx = (newCenter.x - camX) / oldZoom;
      const wy = (newCenter.y - camY - getCanvasOffsetY()) / oldZoom;
      camX = newCenter.x - wx * zoom;
      camY = newCenter.y - wy * zoom - getCanvasOffsetY();
      clampCamera();
    }
    lastPinchDist = dist;
    pinchCenter = newCenter;
    if (dragStart) dragStart.moved = true;
    return;
  }
  if (dragStart && pointers.size === 1) {
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    const dist = Math.hypot(dx, dy);
    if (dist > DRAG_THRESHOLD) {
      dragStart.moved = true;
      isDragging = true;
      camX = dragStart.camX + dx;
      camY = dragStart.camY + dy;
      clampCamera();
      if (interactionMode === 'build' && activeTool !== 'inspect' && activeTool !== 'bulldoze' && activeTool !== 'drive') {
        const tool = TOOLS.find(t => t.id === activeTool);
        if (tool && !TILE_DATA[tool.tile]?.special) {
          const tx = worldToTile(screenToWorld(e.clientX, e.clientY));
          handleBuild(tx.x, tx.y);
        }
      }
      if (activeTool === 'bulldoze') {
        const tx = worldToTile(screenToWorld(e.clientX, e.clientY));
        handleBulldoze(tx.x, tx.y);
      }
    }
  }
});

canvas.addEventListener('pointerup', e => {
  const wasSinglePointer = pointers.size === 1;
  const ptrInfo = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) { lastPinchDist = 0; pinchCenter = null; }
  if (wasSinglePointer && dragStart && !dragStart.moved) {
    const totalMove = ptrInfo ? Math.hypot(e.clientX - ptrInfo.startX, e.clientY - ptrInfo.startY) : 0;
    if (totalMove < TAP_THRESHOLD) {
      const tx = worldToTile(screenToWorld(e.clientX, e.clientY));
      if (activeTool === 'drive') {} 
      else if (interactionMode === 'build') {
        if (activeTool === 'inspect') showTileInfo(tx.x, tx.y);
        else { handleBuild(tx.x, tx.y); haptic(10); }
      } else {
        document.getElementById('infoBar').classList.remove('show');
      }
    }
  }
  if (pointers.size === 0) { dragStart = null; setTimeout(() => { isDragging = false; }, 50); }
});

canvas.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) { dragStart = null; isDragging = false; }
  if (pointers.size < 2) lastPinchDist = 0;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(0.5, Math.min(3, zoom * delta));
  const wx = (e.clientX - camX) / zoom;
  const wy = (e.clientY - camY - getCanvasOffsetY()) / zoom;
  zoom = newZoom;
  camX = e.clientX - wx * zoom;
  camY = e.clientY - wy * zoom - getCanvasOffsetY();
  clampCamera();
}, { passive: false });

// ─── Building Logic ────────────────────────────────────────────────
function handleBuild(tx, ty) {
  if (tx < 0 || tx >= GRID_W || ty < 0 || ty >= GRID_H) return;
  const tile = state.grid[ty][tx];
  const tool = TOOLS.find(t => t.id === activeTool);
  if (!tool) return;
  if (activeTool === 'bulldoze') { handleBulldoze(tx, ty); return; }
  const data = TILE_DATA[tool.tile];
  if (!data) return;
  if (tile.type === T.WATER) { toast('Cannot build on water!'); sndError(); return; }
  if (tile.type !== T.GRASS && tile.type !== T.ROAD) { toast('Tile occupied! Bulldoze first.'); sndError(); return; }
  if (data.special && tile.type !== T.GRASS) { toast('Clear the tile first!'); sndError(); return; }
  if (state.money < data.cost) { toast('Not enough funds!'); sndError(); return; }
  if (tile.type === tool.tile) return;

  state.money -= data.cost;
  state.grid[ty][tx] = { type: tool.tile, level: 1, data: {} };
  state.buildCount[tool.tile] = (state.buildCount[tool.tile] || 0) + 1;
  sndPlace();
  updateHUD();
  if (view3DMode) View3D.updateTile(tx, ty);
  scheduleSave();
}

function handleBulldoze(tx, ty) {
  if (tx < 0 || tx >= GRID_W || ty < 0 || ty >= GRID_H) return;
  const tile = state.grid[ty][tx];
  if (tile.type === T.GRASS || tile.type === T.WATER) return;
  const data = TILE_DATA[tile.type];
  const refund = data ? Math.floor(data.cost * 0.25) : 0;
  state.money += refund;
  state.grid[ty][tx] = { type: T.GRASS, level: 0, data: {} };
  sndBulldoze();
  updateHUD();
  if (view3DMode) View3D.updateTile(tx, ty);
  scheduleSave();
}

  }

    html += `<div class="info-row"><span>📊 Level</span><span class="val">${tile.level}/3</span></div>`;

    html += `<div class="info-row"><span>🛣️ Road Access</span><span class="val">${hasRoadAdjacent(tx,ty)?'✅':'❌'}</span></div>`;
  }
  if (tile.type === T.COM) {
    html += `<div class="info-row"><span>💰 Income</span><span class="val">$${getComIncome(tile)}/cycle</span></div>`;
    html += `<div class="info-row"><span>👥 Jobs</span><span class="val">${tile.level * 8}</span></div>`;
    html += `<div class="info-row"><span>⚡ Power</span><span class="val">${hasPower(tx,ty)?'✅':'❌'}</span></div>`;
  }
  if (tile.type === T.IND) {
    html += `<div class="info-row"><span>💰 Income</span><span class="val">$${getIndIncome(tile)}/cycle</span></div>`;
    html += `<div class="info-row"><span>👥 Jobs</span><span class="val">${tile.level * 12}</span></div>`;
    html += `<div class="info-row"><span>☁️ Pollution</span><span class="val">${getPollution(tx,ty)}</span></div>`;
    html += `<div class="info-row"><span>⚡ Power</span><span class="val">${hasPower(tx,ty)?'✅':'❌'}</span></div>`;
  }
  if (tile.type === T.AGRI) {

// ─── Economy & Simulation ─────────────────────────────────────────
function getResPop(tile) { return tile.type !== T.RES ? 0 : tile.level * 12; }
function getComIncome(tile) { return tile.type !== T.COM ? 0 : tile.level * 8; }
function getIndIncome(tile) { return tile.type !== T.IND ? 0 : tile.level * 12; }
function getAgriIncome(tile) { return tile.type !== T.AGRI ? 0 : tile.level * 5; }
function getPollution(tx, ty) { return state.pollution[ty] ? Math.round(state.pollution[ty][tx] || 0) : 0; }

function hasRoadAdjacent(tx, ty) {
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = tx + dx, ny = ty + dy;
      if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
      if (state.grid[ny][nx].type === T.ROAD) return true;
    }
  }
  return false;
}

// ─── Power System ──────────────────────────────────────────────────
function hasPower(tx, ty) {
  // Check if within range of power plant or connected via power lines
  const range = 6;
  // Direct power plant proximity
  for (let dy = -range; dy <= range; dy++) {
    for (let dx = -range; dx <= range; dx++) {
      const nx = tx + dx, ny = ty + dy;
      if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
      if (state.grid[ny][nx].type === T.POWER_PLANT) return true;
      if (state.grid[ny][nx].type === T.POWER_LINE) {
        // Check if power line is connected to plant within larger range
        if (distToPowerPlant(nx, ny) < 15) return true;
      }
    }
  }
  return false;
}

function distToPowerPlant(tx, ty) {
  let minDist = Infinity;
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (state.grid[y][x].type === T.POWER_PLANT) {
        const d = Math.abs(x - tx) + Math.abs(y - ty);
        if (d < minDist) minDist = d;
      }
    }
  }
  return minDist;
}

// ─── Pollution System ──────────────────────────────────────────────
function updatePollution() {
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      state.pollution[y][x] = 0;
    }
  }
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const tile = state.grid[y][x];
      if (tile.type === T.IND) {
        const pollution = 3 + tile.level * 2;
        for (let dy = -3; dy <= 3; dy++) {
          for (let dx = -3; dx <= 3; dx++) {
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
            const dist = Math.hypot(dx, dy);
            if (dist <= 3) {
              state.pollution[ny][nx] += pollution * (1 - dist / 3.5);
            }
          }
        }
      }
      if (tile.type === T.POWER_PLANT) {
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
            const dist = Math.hypot(dx, dy);
            if (dist <= 2) state.pollution[ny][nx] += 5 * (1 - dist / 2.5);
          }
        }
      }
      if (tile.type === T.PARK) {
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
            state.pollution[ny][nx] = Math.max(0, state.pollution[ny][nx] - 2);
          }
        }
      }
    }
  }
}

// ─── RCI Demand ────────────────────────────────────────────────────
function updateRCIDemand() {
  let resCount = 0, comCount = 0, indCount = 0;
  let resCap = 0, comJobs = 0, indJobs = 0;
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const t = state.grid[y][x];
      if (t.type === T.RES) { resCount++; resCap += getResPop(t); }
      else if (t.type === T.COM) { comCount++; comJobs += t.level * 8; }
      else if (t.type === T.IND) { indCount++; indJobs += t.level * 12; }
    }
  }
  const totalJobs = comJobs + indJobs;
  const taxFactor = 1 - state.taxRate / 30;
  // Demand goes up when there are jobs but no residents, and vice versa
  let rDemand = 50 + (totalJobs - resCap) * 0.5 - state.taxRate * 2;
  let cDemand = 50 + (resCap - comJobs) * 0.3 + state.happiness * 0.3 - state.taxRate * 1.5;
  let iDemand = 50 + (resCap - indJobs) * 0.2 + comCount * 2 - state.taxRate;
  rDemand *= taxFactor;
  cDemand *= taxFactor;
  iDemand *= taxFactor;
  state.rciDemand.r = Math.max(0, Math.min(100, rDemand));
  state.rciDemand.c = Math.max(0, Math.min(100, cDemand));
  state.rciDemand.i = Math.max(0, Math.min(100, iDemand));
}

// ─── Traffic System ────────────────────────────────────────────────
function updateTraffic() {
  // Spawn ambient cars based on activity
  const targetCars = Math.min(8, Math.floor(state.population / 30));
  while (state.trafficCars.length < targetCars) {
    spawnTrafficCar();
  }
  // Remove excess
  while (state.trafficCars.length > targetCars) {
    state.trafficCars.pop();
  }
  // Move traffic cars
  for (const car of state.trafficCars) {
    car.x += car.vx;
    car.y += car.vy;
    // Check if still on road
    const tx = Math.floor(car.x / TILE);
    const ty = Math.floor(car.y / TILE);
    if (tx < 0 || tx >= GRID_W || ty < 0 || ty >= GRID_H || state.grid[ty][tx].type !== T.ROAD) {
      // Pick a new direction
      const roadDir = getRandomRoadDir(tx, ty);
      car.vx = roadDir.x * 0.5;
      car.vy = roadDir.y * 0.5;
      // Snap back to a road
      const roadTile = findNearestRoad(tx, ty);
      if (roadTile) { car.x = roadTile.x * TILE + TILE/2; car.y = roadTile.y * TILE + TILE/2; }
    }
    // Random chance to turn
    if (Math.random() < 0.02) {
      const roadDir = getRandomRoadDir(Math.floor(car.x/TILE), Math.floor(car.y/TILE));
      car.vx = roadDir.x * 0.5;
      car.vy = roadDir.y * 0.5;
    }
  }
}

function spawnTrafficCar() {
  const roadTile = findNearestRoad(Math.floor(GRID_W/2), Math.floor(GRID_H/2));
  if (!roadTile) return;
  const dir = getRandomRoadDir(roadTile.x, roadTile.y);
  const colors = ['#ef4444','#3b82f6','#22c55e','#fbbf24','#a855f7','#06b6d4','#ec4899','#f97316'];
  state.trafficCars.push({
    x: roadTile.x * TILE + TILE/2,
    y: roadTile.y * TILE + TILE/2,
    vx: dir.x * 0.5,
    vy: dir.y * 0.5,
    color: colors[Math.floor(Math.random() * colors.length)],
  });
}

function getRandomRoadDir(tx, ty) {
  const dirs = [];
  const check = [[0,-1],[0,1],[-1,0],[1,0]];
  for (const [dx,dy] of check) {
    const nx=tx+dx, ny=ty+dy;
    if (nx>=0&&nx<GRID_W&&ny>=0&&ny<GRID_H && state.grid[ny][nx].type===T.ROAD) dirs.push({x:dx,y:dy});
  }
  if (dirs.length === 0) return {x:0,y:0};
  return dirs[Math.floor(Math.random()*dirs.length)];
}

function findNearestRoad(tx, ty) {
  tx = Math.max(0, Math.min(GRID_W-1, tx));
  ty = Math.max(0, Math.min(GRID_H-1, ty));
  for (let r = 0; r < 10; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const nx = tx+dx, ny = ty+dy;
        if (nx>=0&&nx<GRID_W&&ny>=0&&ny<GRID_H && state.grid[ny][nx].type === T.ROAD) return {x:nx,y:ny};
      }
    }
  }
  return null;
}

// ─── Economy Tick (enhanced) ──────────────────────────────────────
function economyTick() {
  state.tick++;
  let income = 0, pop = 0;
  let indCount=0, resCount=0, comCount=0, roadCount=0;
  let happinessDelta = 0;

  updatePollution();

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const tile = state.grid[y][x];
      const road = hasRoadAdjacent(x, y);
      const powered = hasPower(x, y);
      switch (tile.type) {
        case T.RES:
          if (road && powered) {
            const growChance = 0.3 * (1 - state.taxRate / 25) * (state.rciDemand.r / 100);
            if (tile.level < 3 && state.tick % 10 === 0 && Math.random() < growChance) tile.level++;
            pop += getResPop(tile);
            resCount++;
            // Pollution effect
            const poll = getPollution(x, y);
            if (poll > 5) happinessDelta -= 0.5;
          } else if (road && !powered) {
            happinessDelta -= 0.3;
          }
          break;
        case T.COM:
          if (road && powered) {
            income += getComIncome(tile);
            comCount++;
            const growChance = 0.25 * (state.rciDemand.c / 100);
            if (tile.level < 3 && state.tick % 8 === 0 && Math.random() < growChance) tile.level++;
          }
          break;
        case T.IND:
          if (road && powered) {
            income += getIndIncome(tile);
            indCount++;
            const growChance = 0.2 * (state.rciDemand.i / 100);
            if (tile.level < 3 && state.tick % 12 === 0 && Math.random() < growChance) tile.level++;
          }
          break;
        case T.AGRI:
          if (road) income += getAgriIncome(tile);
          break;
        case T.GRILL: income += 25; break;
        case T.GARAGE: income += 30; break;
        case T.GUMMY_FACTORY: income += 50; happinessDelta -= 1; break;
        case T.THRONE_ROOM: happinessDelta += 3; break;
        case T.BLUETOOTH_TOWER: happinessDelta += 5; break;
        case T.HORN_TOWER: happinessDelta += 2; break;
        case T.PARK: happinessDelta += 0.5; break;
        case T.ROAD: roadCount++; break;
      }
    }
  }

  // Tax calculation
  const taxMultiplier = state.taxRate / 5;
  const taxes = Math.floor(pop * (state.happiness / 100) * taxMultiplier * 0.5);
  income += taxes;

  // Maintenance
  const maintenance = Math.floor((resCount + comCount + indCount) * 2 + roadCount * 0.5 + (state.buildCount[T.POWER_PLANT] || 0) * 50);

  // RCI demand update
  if (state.tick % 3 === 0) updateRCIDemand();

  // Traffic
  updateTraffic();

  // Happiness
  const towerPos = findTile(T.BLUETOOTH_TOWER);
  if (towerPos) happinessDelta += 2;
  if (indCount > resCount && resCount > 0) happinessDelta -= Math.min(10, Math.floor((indCount - resCount) * 0.5));
  if (resCount > 0 && comCount === 0) happinessDelta -= 2;
  if (roadCount > 10) happinessDelta += 1;
  // Tax effect on happiness
  if (state.taxRate > 10) happinessDelta -= (state.taxRate - 10) * 0.3;

  state.happiness = Math.max(0, Math.min(100, state.happiness + happinessDelta * 0.5));
  state.income = income;
  state.expenses = maintenance;
  state.population = pop;
  state.money += income - maintenance;

  updateHUD();
  updateBudgetPanel();
  if (state.tick % 5 === 0) sndTick();
}

function findTile(type) {
  for (let y = 0; y < GRID_H; y++)
    for (let x = 0; x < GRID_W; x++)
      if (state.grid[y][x].type === type) return { x, y };
  return null;
}
function countTiles(type) {
  let c = 0;
  for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++) if (state.grid[y][x].type === type) c++;
  return c;
}

function updateToolDemand() {
  document.querySelectorAll('.tool').forEach(el => {
    const toolId = el.dataset.tool;
    const tool = TOOLS.find(t => t.id === toolId);
    if (!tool || !tool.rci) return;

    let badge = el.querySelector('.tool-demand');
    if (demand > 65) {
      if (!badge) { badge = document.createElement('div'); badge.className = 'tool-demand'; el.appendChild(badge); }
      badge.textContent = '▲';
    } else if (badge) badge.remove();
  });
}

function buildCategoryTabs() {

  ct.innerHTML = '';

    tab.className = 'cat-tab' + (currentCategory === cat.id ? ' active' : '');

function buildToolbar() {
  const tb = document.getElementById('toolbar');
  tb.innerHTML = '';
  TOOLS.filter(t => t.cat === currentCategory).forEach(tool => {
    const btn = document.createElement('div');
    btn.className = 'tool' + (activeTool === tool.id ? ' active' : '');

      buildToolbar();

const toolbarEl = document.getElementById('toolbar');
