// ═══════════════════════════════════════════════════════════════════
// 🚗 CAR / DRIVING SYSTEM
// ═══════════════════════════════════════════════════════════════════

const CAR_COLORS = ['#ef4444','#3b82f6','#22c55e','#fbbf24','#a855f7','#06b6d4','#ec4899','#f97316'];
let myCar = null;
let cars = {};
let carRef = null;
let driving = false;
const CAR_SIZE = 10;

function getMyId() {
  if (typeof FirebaseShared !== 'undefined' && FirebaseShared.visitorId) return FirebaseShared.visitorId;
  return 'local_' + (sessionStorage.getItem('carId') || (() => {
    const id = 'anon_' + Math.random().toString(36).slice(2,8);
    sessionStorage.setItem('carId', id);
    return id;
  })());
}
function getMyName() {
  if (typeof FirebaseShared !== 'undefined' && FirebaseShared.getVisitorName) return FirebaseShared.getVisitorName();
  return 'Driver';
}

function spawnMyCar() {
  const id = getMyId();
  let spawnX = 20 * TILE + TILE/2, spawnY = 20 * TILE + TILE/2;
  let bestDist = Infinity;
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (state.grid[y][x].type === T.ROAD) {
        const d = (x - 20) ** 2 + (y - 20) ** 2;
        if (d < bestDist) { bestDist = d; spawnX = x * TILE + TILE/2; spawnY = y * TILE + TILE/2; }
      }
    }
  }
  const colorIdx = Math.abs(hashCode(id)) % CAR_COLORS.length;
  myCar = { x: spawnX, y: spawnY, dir: 0, speed: 0, color: CAR_COLORS[colorIdx], name: getMyName() };
  driving = true;
  centerCameraOnCar();
  toast('🚗 Car spawned! Use D-pad or arrow keys to drive.');
  haptic(20);
  saveCar();
}

function exitCar() {
  driving = false;
  if (carRef && myCar) { carRef.child(getMyId()).remove(); }
  delete cars[getMyId()];
  myCar = null;
  hideCarControls();
  toast('🚪 Exited car');
}

function centerCameraOnCar() {
  if (!myCar) return;
  camX = canvas.width / 2 - myCar.x * zoom;
  camY = (canvas.height - TOOLBAR_H) / 2 + getCanvasOffsetY() - myCar.y * zoom;
}

function hashCode(s) { let h=0; for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;} return h; }

const keys = { up:false, down:false, left:false, right:false };
window.addEventListener('keydown', e => {
  if (driving && myCar) {
    if (e.key==='ArrowUp'||e.key==='w') {keys.up=true;e.preventDefault();}
    else if (e.key==='ArrowDown'||e.key==='s') {keys.down=true;e.preventDefault();}
    else if (e.key==='ArrowLeft'||e.key==='a') {keys.left=true;e.preventDefault();}
    else if (e.key==='ArrowRight'||e.key==='d') {keys.right=true;e.preventDefault();}
    return;
  }
  const ps = 30;
  if (e.key==='ArrowLeft') {camX+=ps;clampCamera();}
  else if (e.key==='ArrowRight') {camX-=ps;clampCamera();}
  else if (e.key==='ArrowUp') {camY+=ps;clampCamera();}
  else if (e.key==='ArrowDown') {camY-=ps;clampCamera();}
  else if (e.key==='='||e.key==='+') {zoom=Math.min(3,zoom*1.15);clampCamera();}
  else if (e.key==='-') {zoom=Math.max(0.5,zoom/1.15);clampCamera();}
});
window.addEventListener('keyup', e => {
  if (e.key==='ArrowUp'||e.key==='w') keys.up=false;
  else if (e.key==='ArrowDown'||e.key==='s') keys.down=false;
  else if (e.key==='ArrowLeft'||e.key==='a') keys.left=false;
  else if (e.key==='ArrowRight'||e.key==='d') keys.right=false;
});

document.querySelectorAll('.dpad-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  const start = e => { e.preventDefault(); e.stopPropagation(); keys[dir]=true; btn.classList.add('pressed'); haptic(5); };
  const end = e => { e.preventDefault(); e.stopPropagation(); keys[dir]=false; btn.classList.remove('pressed'); };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointercancel', end);
  btn.addEventListener('pointerleave', end);
});

document.getElementById('spawnCarBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); if (!myCar) spawnMyCar(); showCarControls();
});
document.getElementById('exitCarBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); exitCar();
});

function showCarControls() {
  document.getElementById('dpad').classList.add('show');
  document.getElementById('carControls').classList.add('show');
  document.getElementById('spawnCarBtn').style.display = 'none';
  document.getElementById('exitCarBtn').style.display = 'block';
}
function hideCarControls() {
  document.getElementById('dpad').classList.remove('show');
  document.getElementById('carControls').classList.remove('show');
  document.getElementById('spawnCarBtn').style.display = 'block';
  document.getElementById('exitCarBtn').style.display = 'none';
}

let carSaveAccumulator = 0;
function updateCar(dt) {
  if (!myCar || !driving) return;
  const ACCEL=0.08, MAX_SPEED=2.5, TURN=0.06;
  if (keys.up) myCar.speed=Math.min(myCar.speed+ACCEL,MAX_SPEED);
  else if (keys.down) myCar.speed=Math.max(myCar.speed-ACCEL,-MAX_SPEED*0.5);
  else { myCar.speed*=0.95; if(Math.abs(myCar.speed)<0.01)myCar.speed=0; }
  if (Math.abs(myCar.speed)>0.05) {
    const tf = myCar.speed>0?1:-1;
    if (keys.left) myCar.dir -= TURN*tf;
    if (keys.right) myCar.dir += TURN*tf;
  }
  const nx = myCar.x + Math.cos(myCar.dir)*myCar.speed;
  const ny = myCar.y + Math.sin(myCar.dir)*myCar.speed;
  if (nx>=0&&nx<=WORLD_W&&ny>=0&&ny<=WORLD_H) { myCar.x=nx; myCar.y=ny; }
  else myCar.speed=0;
  if (view3DMode) {
    View3D.updateMyCar();
  } else {
    centerCameraOnCar();
  }
  carSaveAccumulator += dt;
  if (carSaveAccumulator > 150) { carSaveAccumulator=0; saveCar(); }
}

// ─── Render cars (2D) ──────────────────────────────────────────────
function renderCars() {
  const allCars = { ...cars };
  if (myCar) allCars[getMyId()] = myCar;
  for (const [id, car] of Object.entries(allCars)) {
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.dir);
    const isMine = id === getMyId();
    ctx.fillStyle = car.color || '#ef4444';
    ctx.fillRect(-CAR_SIZE/2, -CAR_SIZE/2, CAR_SIZE, CAR_SIZE);
    ctx.fillStyle = 'rgba(150,200,255,0.7)';
    ctx.fillRect(CAR_SIZE/2-4, -CAR_SIZE/2+1, 2, CAR_SIZE-2);
    if (isMine) { ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(-CAR_SIZE/2-1,-CAR_SIZE/2-1,CAR_SIZE+2,CAR_SIZE+2); }
    ctx.restore();
    if (car.name) {
      ctx.fillStyle = isMine ? '#fff' : '#aaa';
      ctx.font = '6px sans-serif'; ctx.textAlign='center';
      ctx.fillText(car.name, car.x, car.y - CAR_SIZE/2 - 3);
    }
  }
}

// ─── Render traffic cars (2D) ──────────────────────────────────────
function renderTrafficCars() {
  for (const car of state.trafficCars) {
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.fillStyle = car.color;
    ctx.globalAlpha = 0.6;
    ctx.fillRect(-CAR_SIZE/2, -CAR_SIZE/2, CAR_SIZE, CAR_SIZE);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// ─── Firebase car sync ─────────────────────────────────────────────
function saveCar() {
  if (!carRef || !myCar) return;
  try {
    carRef.child(getMyId()).set({
      x: Math.round(myCar.x*10)/10, y: Math.round(myCar.y*10)/10,
      dir: Math.round(myCar.dir*100)/100, color: myCar.color, name: myCar.name,
      updated: Date.now(),
    });
  } catch(e) {}
}
function listenForCars() {
  if (!carRef) return;
  carRef.on('value', snap => {
    const data = snap.val();
    if (!data) { cars = {}; return; }
    const now = Date.now();
    const nc = {};
    for (const [id, car] of Object.entries(data)) {
      if (id === getMyId()) continue;
      if (now - (car.updated||0) > 30000) { carRef.child(id).remove(); continue; }
      nc[id] = car;
    }
    cars = nc;
  });
}

// ═══════════════════════════════════════════════════════════════════
// 🎨 2D RENDERING
// ═══════════════════════════════════════════════════════════════════

function render() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(camX, camY + getCanvasOffsetY());
  ctx.scale(zoom, zoom);

  const sx = Math.max(0, Math.floor(-camX / zoom / TILE));
  const ex = Math.min(GRID_W, Math.ceil((canvas.width - camX) / zoom / TILE));
  const sy = Math.max(0, Math.floor(-(camY + getCanvasOffsetY()) / zoom / TILE));
  const ey = Math.min(GRID_H, Math.ceil((canvas.height - camY - getCanvasOffsetY() - TOOLBAR_H) / zoom / TILE));

  for (let y = sy; y < ey; y++)
    for (let x = sx; x < ex; x++)
      drawTile(x, y);

  if (zoom > 1) {
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (let x = sx; x <= ex; x++) { ctx.beginPath(); ctx.moveTo(x*TILE, sy*TILE); ctx.lineTo(x*TILE, ey*TILE); ctx.stroke(); }
    for (let y = sy; y <= ey; y++) { ctx.beginPath(); ctx.moveTo(sx*TILE, y*TILE); ctx.lineTo(ex*TILE, y*TILE); ctx.stroke(); }
  }

  renderTrafficCars();
  renderCars();
  ctx.restore();
  renderMinimap();
}

function drawTile(tx, ty) {
  const tile = state.grid[ty][tx];
  const data = TILE_DATA[tile.type] || TILE_DATA[T.GRASS];
  const px = tx * TILE, py = ty * TILE;
  ctx.fillStyle = data.color;
  ctx.fillRect(px, py, TILE, TILE);

  switch (tile.type) {
    case T.GRASS:
      if ((tx+ty)%3===0) { ctx.fillStyle='#275027'; ctx.fillRect(px+2,py+2,3,3); }
      break;
    case T.WATER:
      const sh = Math.sin(state.tick*0.05+tx*0.5+ty*0.3)*0.5+0.5;
      ctx.fillStyle=`rgba(100,150,200,${sh*0.15})`;
      ctx.fillRect(px,py,TILE,TILE);
      break;
    case T.ROAD:
      ctx.fillStyle='#333'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#555'; ctx.fillRect(px+TILE/2-1,py,2,TILE); ctx.fillRect(px,py+TILE/2-1,TILE,2);
      break;
    case T.RES: drawBuilding(px,py,tile.level,'#3b82f6','#1e40af'); break;
    case T.COM: drawBuilding(px,py,tile.level,'#f59e0b','#92400e'); break;
    case T.IND:
      drawBuilding(px,py,tile.level,'#a16207','#713f12');
      ctx.fillStyle='#444'; ctx.fillRect(px+TILE-5,py+2,3,4);
      break;
    case T.AGRI:
      ctx.fillStyle='#15803d'; ctx.fillRect(px+1,py+1,TILE-2,TILE-2);
      ctx.fillStyle='#dc2626';
      for(let i=0;i<3;i++) ctx.fillRect(px+3+i*5,py+5+(i%2)*6,2,2);
      break;
    case T.BLUETOOTH_TOWER:
      ctx.fillStyle='#1a1a2e'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#8b5cf6'; ctx.fillRect(px+TILE/2-1,py+2,3,TILE-4);
      ctx.strokeStyle='#8b5cf6'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(px+TILE/2+1,py+4,4,-Math.PI/3,Math.PI/3); ctx.stroke();
      ctx.beginPath(); ctx.arc(px+TILE/2+1,py+4,7,-Math.PI/3,Math.PI/3); ctx.stroke();
      break;
    case T.THRONE_ROOM:
      ctx.fillStyle='#1a1a2e'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#c9a84c'; ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
      ctx.font=`${TILE-6}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('👑',px+TILE/2,py+TILE/2);
      break;
    case T.GRILL:
      ctx.fillStyle='#1a0a0a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#ef4444'; ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
      ctx.font=`${TILE-6}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🔥',px+TILE/2,py+TILE/2);
      break;
    case T.GARAGE:
      ctx.fillStyle='#1a1a1a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#64748b'; ctx.fillRect(px+1,py+1,TILE-2,TILE-2);
      ctx.fillStyle='#0a0a0a'; ctx.fillRect(px+4,py+6,TILE-8,TILE-10);
      ctx.fillStyle='#fbbf24'; ctx.font='5px monospace'; ctx.textAlign='center';
      ctx.fillText('GARAGE',px+TILE/2,py+TILE-3);
      break;
    case T.GUMMY_FACTORY:
      ctx.fillStyle='#1a1a1a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#ec4899'; ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
      ctx.font=`${TILE-8}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🐻',px+TILE/2,py+TILE/2);
      break;
    case T.HORN_TOWER:
      ctx.fillStyle='#0a1a1a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#06b6d4';
      ctx.beginPath(); ctx.moveTo(px+TILE/2,py+2); ctx.lineTo(px+TILE-3,py+TILE-3); ctx.lineTo(px+3,py+TILE-3); ctx.closePath(); ctx.fill();
      break;
    case T.SIGN:
      ctx.fillStyle='#2d5a2d'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#888'; ctx.fillRect(px+TILE/2-1,py+4,2,TILE-4);
      ctx.fillStyle='#fbbf24'; ctx.fillRect(px+1,py+2,TILE-2,5);
      ctx.fillStyle='#000'; ctx.font='4px monospace'; ctx.textAlign='center';
      const sign = ROAD_SIGNS[tile.data.signIdx||0];
      if (sign) { const arrow=sign.dir==='left'?'◀':sign.dir==='right'?'▶':'▲'; ctx.fillText(arrow,px+TILE/2,py+6); }
      break;
    case T.POWER_PLANT:
      ctx.fillStyle='#1a1a0a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#f59e0b'; ctx.fillRect(px+2,py+4,TILE-4,TILE-6);
      ctx.fillStyle='#ef4444'; ctx.fillRect(px+TILE/2-2,py+2,4,3);
      ctx.font='6px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⚡',px+TILE/2,py+TILE/2+2);
      break;
    case T.POWER_LINE:
      ctx.fillStyle='#2d5a2d'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#6b7280'; ctx.fillRect(px+TILE/2-1,py,2,TILE);
      ctx.fillStyle='#9ca3af'; ctx.fillRect(px+TILE/2-3,py+2,6,2);
      ctx.fillRect(px+TILE/2-3,py+TILE-4,6,2);
      break;
    case T.PARK:
      ctx.fillStyle='#16a34a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#22c55e'; ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
      ctx.fillStyle='#15803d';
      ctx.beginPath(); ctx.arc(px+TILE/2,py+TILE/2,3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#166534';
      ctx.beginPath(); ctx.arc(px+5,py+5,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(px+TILE-5,py+TILE-5,2,0,Math.PI*2); ctx.fill();
      break;
  }

  // Overlays for missing requirements
  const needsRoad = [T.RES,T.COM,T.IND,T.AGRI].includes(tile.type);
  const needsPower = [T.RES,T.COM,T.IND].includes(tile.type);
  if (needsRoad && !hasRoadAdjacent(tx,ty)) {
    ctx.fillStyle='rgba(239,68,68,0.15)'; ctx.fillRect(px,py,TILE,TILE);
    ctx.fillStyle='rgba(239,68,68,0.5)'; ctx.font='8px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🚫',px+TILE/2,py+2);
  }
  if (needsPower && !hasPower(tx,ty)) {
    ctx.fillStyle='rgba(33,33,33,0.2)'; ctx.fillRect(px,py,TILE,TILE);
    ctx.fillStyle='rgba(255,200,0,0.5)'; ctx.font='6px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⚡',px+TILE-4,py+4);
  }
}

function drawBuilding(px, py, level, color, darkColor) {
  const h = 4 + level * 4;
  ctx.fillStyle = darkColor;
  ctx.fillRect(px+2, py+TILE-h-2, TILE-4, h);
  ctx.fillStyle = color;
  ctx.fillRect(px+2, py+TILE-h-2, TILE-4, Math.min(h,3));
  ctx.fillStyle = 'rgba(255,255,200,0.6)';
  for (let i = 0; i < level; i++) {
    ctx.fillRect(px+4, py+TILE-4-i*4, 2, 2);
    ctx.fillRect(px+TILE-6, py+TILE-4-i*4, 2, 2);
  }
}

// ─── Minimap ───────────────────────────────────────────────────────
function renderMinimap() {
  const mw = minimap.width / GRID_W, mh = minimap.height / GRID_H;
  mctx.fillStyle = '#0a0a0a';
  mctx.fillRect(0, 0, minimap.width, minimap.height);
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const data = TILE_DATA[state.grid[y][x].type];
      if (data && state.grid[y][x].type !== T.GRASS) {
        mctx.fillStyle = data.color;
        mctx.fillRect(x*mw, y*mh, mw+0.5, mh+0.5);
      }
    }
  }
  const allCars = { ...cars };
  if (myCar) allCars[getMyId()] = myCar;
  for (const car of Object.values(allCars)) {
    mctx.fillStyle = car.color || '#fff';
    mctx.fillRect((car.x/TILE)*mw - 1, (car.y/TILE)*mh - 1, 3, 3);
  }
  const vx = -camX/zoom/TILE*mw;
  const vy = -(camY+getCanvasOffsetY())/zoom/TILE*mh;
  const vw = canvas.width/zoom/TILE*mw;
  const vh = (canvas.height-getCanvasOffsetY()-TOOLBAR_H)/zoom/TILE*mh;
  mctx.strokeStyle = 'rgba(255,255,255,0.5)';
  mctx.lineWidth = 1;
  mctx.strokeRect(vx, vy, vw, vh);
}

minimap.addEventListener('pointerdown', e => {
  e.preventDefault();
  const rect = minimap.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width;
  const my = (e.clientY - rect.top) / rect.height;
  if (myCar && driving) {
    myCar.dir = Math.atan2(my*WORLD_H - myCar.y, mx*WORLD_W - myCar.x);
  } else {
    camX = canvas.width/2 - mx*WORLD_W*zoom;
    camY = (canvas.height-TOOLBAR_H)/2 + getCanvasOffsetY() - my*WORLD_H*zoom;
    clampCamera();
  }
});

// ═══════════════════════════════════════════════════════════════════
// 🌐 3D VIEW SYSTEM (Three.js)
// ═══════════════════════════════════════════════════════════════════

const View3D = {
  initialized: false,
  scene: null,
  camera: null,
  renderer: null,
  container: null,
  tileMeshes: [],
  carMeshes: {},
  myCarMesh: null,
  trafficMeshes: [],
  cameraAngle: Math.PI / 4,
  cameraPitch: 0.5,
  cameraDist: 35,
  cameraTarget: { x: GRID_W/2, y: 0, z: GRID_H/2 },
  raycaster: null,
  mouse: null,
  drag3D: null,
  smokeParticles: [],
  clock: 0,

  // ── Shared geometry/materials (performance) ──
  geo: {},
  mat: {},

  init() {
    if (this.initialized) return;
    if (typeof THREE === 'undefined') {
      toast('3D library failed to load');
      return;
    }
    this.container = document.getElementById('view3d');
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x080810);
    this.scene.fog = new THREE.Fog(0x080810, 30, 90);

    this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
    this.updateCamera();

    // Lighting
    const ambient = new THREE.AmbientLight(0x404060, 0.7);
    this.scene.add(ambient);
    const hemi = new THREE.HemisphereLight(0x88aaff, 0x223322, 0.5);
    this.scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(20, 35, 15);
    dir.castShadow = true;
    dir.shadow.mapSize.width = 2048;
    dir.shadow.mapSize.height = 2048;
    dir.shadow.camera.left = -25;
    dir.shadow.camera.right = 25;
    dir.shadow.camera.top = 25;
    dir.shadow.camera.bottom = -25;
    dir.shadow.camera.near = 0.5;
    dir.shadow.camera.far = 100;
    this.scene.add(dir);
    this.sun = dir;

    // Ground plane
    const gGeo = new THREE.PlaneGeometry(GRID_W + 4, GRID_H + 4);
    const gMat = new THREE.MeshStandardMaterial({ color: 0x1a3010 });
    const ground = new THREE.Mesh(gGeo, gMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(GRID_W/2 - 0.5, -0.02, GRID_H/2 - 0.5);
    ground.receiveShadow = true;
    this.scene.add(ground);
    this.ground = ground;

    // Init shared resources
    this.geo.box = (w,h,d) => new THREE.BoxGeometry(w,h,d);
    this.geo.plane = (w,d) => new THREE.PlaneGeometry(w,d);
    this.geo.cyl = (r1,r2,h) => new THREE.CylinderGeometry(r1,r2,h,8);
    this.geo.cone = (r,h,s) => new THREE.ConeGeometry(r,h,s||4);

    // Init tile mesh array
    for (let y = 0; y < GRID_H; y++) {
      this.tileMeshes[y] = [];
      for (let x = 0; x < GRID_W; x++) this.tileMeshes[y][x] = null;
    }

    // Raycaster for tile picking
    this.raycaster = new THREE.Raycaster();
    this.mouse = new THREE.Vector2();
    this.pickPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(GRID_W, GRID_H),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    this.pickPlane.rotation.x = -Math.PI / 2;
    this.pickPlane.position.set(GRID_W/2 - 0.5, 0, GRID_H/2 - 0.5);
    this.scene.add(this.pickPlane);

    this.setupControls3D();
    this.initialized = true;
  },

  setupControls3D() {
    const dom = this.renderer.domElement;
    let ptrs = new Map();
    let lastPinch = 0;
    let dragMoved = false;

    dom.addEventListener('pointerdown', e => {
      e.preventDefault();
      dom.setPointerCapture(e.pointerId);
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
      if (ptrs.size === 1) {
        this.drag3D = { x: e.clientX, y: e.clientY, moved: false };
        dragMoved = false;
      } else if (ptrs.size === 2) {
        const pts = [...ptrs.values()];
        lastPinch = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      }
    });

    dom.addEventListener('pointermove', e => {
      if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (ptrs.size === 2) {
        const pts = [...ptrs.values()];
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (lastPinch > 0) {
          const scale = d / lastPinch;
          this.cameraDist = Math.max(10, Math.min(70, this.cameraDist / scale));
          this.updateCamera();
        }
        lastPinch = d;
        dragMoved = true;
        return;
      }
      if (this.drag3D && ptrs.size === 1) {
        const dx = e.clientX - this.drag3D.x;
        const dy = e.clientY - this.drag3D.y;
        if (Math.hypot(dx, dy) > 5) {
          this.drag3D.moved = true;
          dragMoved = true;
          this.cameraAngle -= dx * 0.008;
          this.cameraPitch = Math.max(0.15, Math.min(1.2, this.cameraPitch - dy * 0.005));
          this.updateCamera();
          this.drag3D.x = e.clientX;
          this.drag3D.y = e.clientY;
        }
      }
    });

    dom.addEventListener('pointerup', e => {
      const info = ptrs.get(e.pointerId);
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) lastPinch = 0;
      if (info && ptrs.size === 0 && !dragMoved) {
        // Tap → pick tile
        const move = Math.hypot(e.clientX - info.sx, e.clientY - info.sy);
        if (move < 6) this.pickTile(e.clientX, e.clientY);
      }
      if (ptrs.size === 0) this.drag3D = null;
    });

    dom.addEventListener('pointercancel', () => { ptrs.clear(); this.drag3D = null; });

    dom.addEventListener('wheel', e => {
      e.preventDefault();
      this.cameraDist = Math.max(10, Math.min(70, this.cameraDist + e.deltaY * 0.03));
      this.updateCamera();
    }, { passive: false });

    dom.addEventListener('contextmenu', e => e.preventDefault());
  },

  pickTile(sx, sy) {
    if (!this.renderer) return;
    const rect = this.renderer.domElement.getBoundingClientRect();
    this.mouse.x = ((sx - rect.left) / rect.width) * 2 - 1;
    this.mouse.y = -((sy - rect.top) / rect.height) * 2 + 1;
    this.raycaster.setFromCamera(this.mouse, this.camera);
    const hits = this.raycaster.intersectObject(this.pickPlane);
    if (hits.length > 0) {
      const p = hits[0].point;
      const tx = Math.floor(p.x + 0.5);
      const ty = Math.floor(p.z + 0.5);
      if (tx >= 0 && tx < GRID_W && ty >= 0 && ty < GRID_H) {
        if (activeTool === 'inspect') {
          showTileInfo(tx, ty);
        } else if (activeTool === 'bulldoze') {
          handleBulldoze(tx, ty);
        } else if (activeTool !== 'drive') {
          handleBuild(tx, ty);
        }
        haptic(10);
      }
    }
  },

  updateCamera() {
    const cx = this.cameraTarget.x;
    const cz = this.cameraTarget.z;
    this.camera.position.x = cx + Math.cos(this.cameraAngle) * this.cameraDist * Math.cos(this.cameraPitch);
    this.camera.position.z = cz + Math.sin(this.cameraAngle) * this.cameraDist * Math.cos(this.cameraPitch);
    this.camera.position.y = this.cameraDist * Math.sin(this.cameraPitch);
    this.camera.lookAt(cx, 0, cz);
  },

  zoom(factor) {
    this.cameraDist = Math.max(10, Math.min(70, this.cameraDist * factor));
    this.updateCamera();
  },

  buildAll() {
    // Clear existing
    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        if (this.tileMeshes[y][x]) {
          this.scene.remove(this.tileMeshes[y][x]);
          this.disposeGroup(this.tileMeshes[y][x]);
          this.tileMeshes[y][x] = null;
        }
      }
    }
    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        this.updateTile(x, y);
      }
    }
    this.centerOnCity();
  },

  centerOnCity() {
    this.cameraTarget = { x: GRID_W/2 - 0.5, y: 0, z: GRID_H/2 - 0.5 };
    this.cameraDist = 35;
    this.cameraAngle = Math.PI / 4;
    this.cameraPitch = 0.5;
    this.updateCamera();
  },

  updateTile(x, y) {
    if (!this.initialized) return;
    if (this.tileMeshes[y][x]) {
      this.scene.remove(this.tileMeshes[y][x]);
      this.disposeGroup(this.tileMeshes[y][x]);
    }
    const tile = state.grid[y][x];
    const mesh = this.createTileMesh(x, y, tile);
    if (mesh) {
      this.scene.add(mesh);
      this.tileMeshes[y][x] = mesh;
    } else {
      this.tileMeshes[y][x] = null;
    }
  },

  disposeGroup(g) {
    g.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
    });
  },

  createTileMesh(gx, gy, tile) {
    const px = gx;
    const pz = gy;
    const group = new THREE.Group();
    group.position.set(px, 0, pz);

    switch (tile.type) {
      case T.GRASS:
        // No mesh needed, ground plane shows through
        // Add subtle grass color variation
        if ((gx + gy) % 3 === 0) {
          const g = new THREE.Mesh(this.geo.box(0.15, 0.05, 0.15), new THREE.MeshStandardMaterial({ color: 0x3a6a3a }));
          g.position.set(0, 0.03, 0);
          group.add(g);
        }
        break;

      case T.WATER: {
        const m = new THREE.Mesh(
          this.geo.box(0.98, 0.08, 0.98),
          new THREE.MeshStandardMaterial({ color: 0x1a3a5c, transparent: true, opacity: 0.85 })
        );
        m.position.y = 0.04;
        m.receiveShadow = true;
        group.add(m);
        break;
      }

      case T.ROAD: {
        const m = new THREE.Mesh(
          this.geo.plane(0.96, 0.96),
          new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        m.rotation.x = -Math.PI / 2;
        m.position.y = 0.02;
        m.receiveShadow = true;
        group.add(m);
        // Lane marking
        const mark = new THREE.Mesh(
          this.geo.plane(0.06, 0.06),
          new THREE.MeshBasicMaterial({ color: 0x666666 })
        );
        mark.rotation.x = -Math.PI / 2;
        mark.position.y = 0.025;
        group.add(mark);
        break;
      }

      case T.RES: {
        const h = 0.35 + tile.level * 0.25;
        const body = new THREE.Mesh(
          this.geo.box(0.65, h, 0.65),
          new THREE.MeshStandardMaterial({ color: 0x3b82f6 })
        );
        body.position.y = h / 2;
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);
        // Roof (pyramid)
        const roof = new THREE.Mesh(
          this.geo.cone(0.5, 0.22, 4),
          new THREE.MeshStandardMaterial({ color: 0x1e40af })
        );
        roof.position.y = h + 0.11;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        group.add(roof);
        break;
      }

      case T.COM: {
        const h = 0.5 + tile.level * 0.3;
        const body = new THREE.Mesh(
          this.geo.box(0.72, h, 0.72),
          new THREE.MeshStandardMaterial({ color: 0xf59e0b })
        );
        body.position.y = h / 2;
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);
        // Awning stripe
        const awning = new THREE.Mesh(
          this.geo.box(0.75, 0.06, 0.1),
          new THREE.MeshStandardMaterial({ color: 0xef4444 })
        );
        awning.position.set(0, h * 0.4, 0.38);
        group.add(awning);
        break;
      }

      case T.IND: {
        const h = 0.4 + tile.level * 0.2;
        const body = new THREE.Mesh(
          this.geo.box(0.8, h, 0.8),
          new THREE.MeshStandardMaterial({ color: 0xa16207 })
        );
        body.position.y = h / 2;
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);
        // Chimneys
        for (let i = 0; i < 2; i++) {
          const ch = new THREE.Mesh(
            this.geo.cyl(0.06, 0.08, 0.25),
            new THREE.MeshStandardMaterial({ color: 0x555555 })
          );
          ch.position.set(-0.2 + i * 0.4, h + 0.12, -0.2 + i * 0.4);
          ch.castShadow = true;
          group.add(ch);
        }
        break;
      }

      case T.AGRI: {
        const base = new THREE.Mesh(
          this.geo.plane(0.95, 0.95),
          new THREE.MeshStandardMaterial({ color: 0x15803d })
        );
        base.rotation.x = -Math.PI / 2;
        base.position.y = 0.02;
        base.receiveShadow = true;
        group.add(base);
        // Pepper rows
        for (let i = 0; i < 3; i++) {
          for (let j = 0; j < 3; j++) {
            const p = new THREE.Mesh(
              this.geo.box(0.08, 0.08, 0.08),
              new THREE.MeshStandardMaterial({ color: 0xdc2626 })
            );
            p.position.set(-0.3 + i * 0.3, 0.08, -0.3 + j * 0.3);
            group.add(p);
          }
        }
        break;
      }

      case T.BLUETOOTH_TOWER: {
        // Tall glowing spire
        const base = new THREE.Mesh(
          this.geo.box(0.8, 0.2, 0.8),
          new THREE.MeshStandardMaterial({ color: 0x1a1a2e })
        );
        base.position.y = 0.1;
        group.add(base);
        const spire = new THREE.Mesh(
          this.geo.cyl(0.08, 0.25, 3.0, 8),
          new THREE.MeshStandardMaterial({ color: 0x8b5cf6, emissive: 0x4a2a8a, emissiveIntensity: 0.5 })
        );
        spire.position.y = 1.7;
        spire.castShadow = true;
        group.add(spire);
        // Glowing top
        const top = new THREE.Mesh(
          this.geo.sphere(0.15, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0x8b5cf6 })
        );
        top.position.y = 3.3;
        group.add(top);
        this.registerGlow(top);
        break;
      }

      case T.THRONE_ROOM: {
        const body = new THREE.Mesh(
          this.geo.box(0.85, 0.8, 0.85),
          new THREE.MeshStandardMaterial({ color: 0xc9a84c, emissive: 0x4a3a10, emissiveIntensity: 0.2 })
        );
        body.position.y = 0.4;
        body.castShadow = true;
        group.add(body);
        // Crown spikes
        for (let i = 0; i < 4; i++) {
          const spike = new THREE.Mesh(
            this.geo.cone(0.06, 0.2, 4),
            new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0x886500, emissiveIntensity: 0.3 })
          );
          const angle = (i / 4) * Math.PI * 2;
          spike.position.set(Math.cos(angle) * 0.3, 0.9, Math.sin(angle) * 0.3);
          spike.castShadow = true;
          group.add(spike);
        }
        break;
      }

      case T.GRILL: {
        const body = new THREE.Mesh(
          this.geo.box(0.75, 0.55, 0.75),
          new THREE.MeshStandardMaterial({ color: 0xef4444 })
        );
        body.position.y = 0.28;
        body.castShadow = true;
        group.add(body);
        // Chimney with smoke
        const ch = new THREE.Mesh(
          this.geo.cyl(0.08, 0.1, 0.2),
          new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        ch.position.set(0.2, 0.7, 0);
        group.add(ch);
        // Smoke particle
        for (let i = 0; i < 3; i++) {
          const s = new THREE.Mesh(
            this.geo.sphere(0.06 + i*0.02, 6, 6),
            new THREE.MeshBasicMaterial({ color: 0x666666, transparent: true, opacity: 0.4 - i*0.1 })
          );
          s.position.set(0.2, 0.85 + i * 0.15, 0);
          s.userData.smoke = { base_y: 0.85 + i * 0.15, t: i * 0.5 };
          group.add(s);
          this.smokeParticles.push(s);
        }
        break;
      }

      case T.GARAGE: {
        const body = new THREE.Mesh(
          this.geo.box(0.85, 0.6, 0.85),
          new THREE.MeshStandardMaterial({ color: 0x64748b })
        );
        body.position.y = 0.3;
        body.castShadow = true;
        group.add(body);
        // Roll-up door
        const door = new THREE.Mesh(
          this.geo.box(0.7, 0.4, 0.05),
          new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
        );
        door.position.set(0, 0.25, 0.43);
        group.add(door);
        break;
      }

      case T.GUMMY_FACTORY: {
        const body = new THREE.Mesh(
          this.geo.box(0.85, 0.9, 0.85),
          new THREE.MeshStandardMaterial({ color: 0xec4899 })
        );
        body.position.y = 0.45;
        body.castShadow = true;
        group.add(body);
        // Colorful gummies on top
        const gummyColors = [0xef4444, 0x22c55e, 0x3b82f6, 0xfbbf24];
        for (let i = 0; i < 4; i++) {
          const g = new THREE.Mesh(
            this.geo.sphere(0.08, 6, 6),
            new THREE.MeshStandardMaterial({ color: gummyColors[i], emissive: gummyColors[i], emissiveIntensity: 0.2 })
          );
          g.position.set(-0.25 + (i%2)*0.5, 1.0, -0.25 + Math.floor(i/2)*0.5);
          group.add(g);
        }
        break;
      }

      case T.HORN_TOWER: {
        const base = new THREE.Mesh(
          this.geo.box(0.5, 0.15, 0.5),
          new THREE.MeshStandardMaterial({ color: 0x0a1a1a })
        );
        base.position.y = 0.08;
        group.add(base);
        // Triangular horn
        const horn = new THREE.Mesh(
          this.geo.cone(0.3, 1.8, 3),
          new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x034a52, emissiveIntensity: 0.3 })
        );
        horn.position.y = 1.05;
        horn.castShadow = true;
        group.add(horn);
        break;
      }

      case T.SIGN: {
        const post = new THREE.Mesh(
          this.geo.box(0.04, 0.4, 0.04),
          new THREE.MeshStandardMaterial({ color: 0x888888 })
        );
        post.position.y = 0.2;
        group.add(post);
        const board = new THREE.Mesh(
          this.geo.box(0.5, 0.15, 0.03),
          new THREE.MeshStandardMaterial({ color: 0xfbbf24 })
        );
        board.position.y = 0.38;
        group.add(board);
        break;
      }

      case T.POWER_PLANT: {
        const body = new THREE.Mesh(
          this.geo.box(0.8, 0.5, 0.8),
          new THREE.MeshStandardMaterial({ color: 0xf59e0b })
        );
        body.position.y = 0.25;
        body.castShadow = true;
        group.add(body);
        // Cooling tower
        const tower = new THREE.Mesh(
          this.geo.cyl(0.2, 0.3, 0.4, 8),
          new THREE.MeshStandardMaterial({ color: 0x9a9a9a })
        );
        tower.position.set(0, 0.7, 0);
        tower.castShadow = true;
        group.add(tower);
        // Glow
        const glow = new THREE.Mesh(
          this.geo.box(0.3, 0.05, 0.3),
          new THREE.MeshBasicMaterial({ color: 0xff0000 })
        );
        glow.position.set(0, 0.52, 0);
        group.add(glow);
        this.registerGlow(glow);
        break;
      }

      case T.POWER_LINE: {
        const post = new THREE.Mesh(
          this.geo.box(0.05, 0.5, 0.05),
          new THREE.MeshStandardMaterial({ color: 0x6b7280 })
        );
        post.position.y = 0.25;
        post.castShadow = true;
        group.add(post);
        // Crossbar
        const bar = new THREE.Mesh(
          this.geo.box(0.4, 0.03, 0.03),
          new THREE.MeshStandardMaterial({ color: 0x9ca3af })
        );
        bar.position.y = 0.45;
        group.add(bar);
        break;
      }

      case T.PARK: {
        const base = new THREE.Mesh(
          this.geo.plane(0.95, 0.95),
          new THREE.MeshStandardMaterial({ color: 0x22c55e })
        );
        base.rotation.x = -Math.PI / 2;
        base.position.y = 0.03;
        base.receiveShadow = true;
        group.add(base);
        // Trees
        for (let i = 0; i < 2; i++) {
          const trunk = new THREE.Mesh(
            this.geo.cyl(0.03, 0.04, 0.12, 6),
            new THREE.MeshStandardMaterial({ color: 0x4a2810 })
          );
          trunk.position.set(-0.2 + i * 0.4, 0.1, -0.1 + i * 0.2);
          group.add(trunk);
          const leaves = new THREE.Mesh(
            this.geo.cone(0.12, 0.25, 6),
            new THREE.MeshStandardMaterial({ color: 0x166534 })
          );
          leaves.position.set(-0.2 + i * 0.4, 0.28, -0.1 + i * 0.2);
          leaves.castShadow = true;
          group.add(leaves);
        }
        break;
      }
    }

    return group.children.length > 0 ? group : null;
  },

  registerGlow(mesh) {
    if (!this.glowObjects) this.glowObjects = [];
    this.glowObjects.push(mesh);
  },

  geo: {
    box: (w,h,d) => new THREE.BoxGeometry(w,h,d),
    plane: (w,d) => new THREE.PlaneGeometry(w,d),
    cyl: (r1,r2,h,s=8) => new THREE.CylinderGeometry(r1,r2,h,s),
    cone: (r,h,s=4) => new THREE.ConeGeometry(r,h,s),
    sphere: (r,s1=8,s2=8) => new THREE.SphereGeometry(r,s1,s2),
  },

  render3D(dt) {
    if (!this.initialized) return;
    this.clock += dt * 0.001;

    // Animate glow objects
    if (this.glowObjects) {
      for (const obj of this.glowObjects) {
        if (obj.material) {
          const baseIntensity = obj.material.emissiveIntensity || 0;
          obj.material.opacity = 0.7 + Math.sin(this.clock * 3) * 0.3;
          if (!obj.material.emissive) {
            obj.material.transparent = true;
          }
        }
      }
    }

    // Animate smoke particles
    for (const s of this.smokeParticles) {
      if (s.userData.smoke) {
        s.userData.smoke.t += dt * 0.001;
        s.position.y = s.userData.smoke.base_y + Math.sin(s.userData.smoke.t) * 0.15;
        s.position.x += Math.sin(s.userData.smoke.t * 0.7) * 0.001;
      }
    }

    // Sun rotation for subtle shadow movement
    if (this.sun) {
      this.sun.position.x = 20 + Math.sin(this.clock * 0.05) * 5;
    }

    // Update cars
    this.updateCars3D();

    this.renderer.render(this.scene, this.camera);
  },

  updateCars3D() {
    // My car
    if (myCar && driving) {
      if (!this.myCarMesh) {
        this.myCarMesh = this.createCarMesh(myCar.color, true);
        this.scene.add(this.myCarMesh);
      }
      this.myCarMesh.position.set(myCar.x, 0.15, myCar.y);
      this.myCarMesh.rotation.y = -myCar.dir + Math.PI/2;
      // Camera follows
      this.cameraTarget.x = myCar.x;
      this.cameraTarget.z = myCar.y;
      this.cameraDist = 12;
      this.updateCamera();
    } else if (this.myCarMesh) {
      this.scene.remove(this.myCarMesh);
      this.disposeGroup(this.myCarMesh);
      this.myCarMesh = null;
    }

    // Visitor cars
    const allCars = { ...cars };
    for (const [id, car] of Object.entries(allCars)) {
      if (!this.carMeshes[id]) {
        const mesh = this.createCarMesh(car.color, false);
        this.scene.add(mesh);
        this.carMeshes[id] = mesh;
      }
      this.carMeshes[id].position.set(car.x, 0.15, car.y);
      this.carMeshes[id].rotation.y = -car.dir + Math.PI/2;
    }
    // Remove stale car meshes
    for (const [id, mesh] of Object.entries(this.carMeshes)) {
      if (!allCars[id]) {
        this.scene.remove(mesh);
        this.disposeGroup(mesh);
        delete this.carMeshes[id];
      }
    }

    // Traffic cars
    while (this.trafficMeshes.length < state.trafficCars.length) {
      const m = this.createCarMesh('#888888', false);
      m.userData.trafficIdx = this.trafficMeshes.length;
      this.scene.add(m);
      this.trafficMeshes.push(m);
    }
    while (this.trafficMeshes.length > state.trafficCars.length) {
      const m = this.trafficMeshes.pop();
      this.scene.remove(m);
      this.disposeGroup(m);
    }
    for (let i = 0; i < state.trafficCars.length; i++) {
      const tc = state.trafficCars[i];
      const m = this.trafficMeshes[i];
      m.position.set(tc.x, 0.12, tc.y);
      if (Math.abs(tc.vx) + Math.abs(tc.vy) > 0.01) {
        m.rotation.y = -Math.atan2(tc.vy, tc.vx) + Math.PI/2;
      }
    }
  },

  createCarMesh(color, isMine) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.35, 0.15, 0.2),
      new THREE.MeshStandardMaterial({ color: color })
    );
    body.position.y = 0.08;
    body.castShadow = true;
    group.add(body);
    // Cabin
    const cabin = new THREE.Mesh(
      new THREE.BoxGeometry(0.18, 0.1, 0.18),
      new THREE.MeshStandardMaterial({ color: 0x111133, transparent: true, opacity: 0.7 })
    );
    cabin.position.set(-0.02, 0.17, 0);
    group.add(cabin);
    // Headlights
    const hl = new THREE.Mesh(
      new THREE.BoxGeometry(0.02, 0.04, 0.04),
      new THREE.MeshBasicMaterial({ color: 0xffffaa })
    );
    hl.position.set(0.18, 0.08, 0.07);
    group.add(hl);
    const hl2 = hl.clone();
    hl2.position.z = -0.07;
    group.add(hl2);
    if (isMine) {
      // White outline for my car
      const outline = new THREE.Mesh(
        new THREE.BoxGeometry(0.42, 0.02, 0.27),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      outline.position.y = 0.01;
      group.add(outline);
    }
    return group;
  },

  onResize() {
    if (!this.initialized) return;
    const w = window.innerWidth;
    const h = window.innerHeight;
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h);
  },
};

// ═══════════════════════════════════════════════════════════════════
// FIREBASE SYNC
// ═══════════════════════════════════════════════════════════════════

let firebaseReady = false;
let saveTimer = null;
let cityRef = null;

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCity, 2000);
}

function serializeCity() {
  const tiles = [];
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const t = state.grid[y][x];
      tiles.push(t.type, t.level, t.data.signIdx != null ? t.data.signIdx : -1);
    }
  }
  return {
    tiles: tiles.join(','),
    money: Math.floor(state.money),
    pop: state.population,
    happiness: Math.round(state.happiness),
    tick: state.tick,
    taxRate: state.taxRate,
    updated: Date.now(),
    builder: typeof FirebaseShared !== 'undefined' ? FirebaseShared.getVisitorName() : 'Unknown',
  };
}

function deserializeCity(data) {
  if (!data || !data.tiles) return false;
  const parts = data.tiles.split(',').map(Number);
  if (parts.length !== GRID_W * GRID_H * 3) return false;
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const idx = (y * GRID_W + x) * 3;
      state.grid[y][x] = {
        type: parts[idx],
        level: parts[idx + 1],
        data: parts[idx + 2] >= 0 ? { signIdx: parts[idx + 2] } : {},
      };
    }
  }
  if (typeof data.money === 'number') state.money = data.money;
  if (typeof data.happiness === 'number') state.happiness = data.happiness;
  if (typeof data.taxRate === 'number') {
    state.taxRate = data.taxRate;
    taxSlider.value = state.taxRate;
    document.getElementById('taxVal').textContent = state.taxRate + '%';
  }
  state.tick = data.tick || 0;
  updateHUD();
  if (view3DMode) View3D.buildAll();
  return true;
}

async function saveCity() {
  if (!firebaseReady || !cityRef) return;
  try { await cityRef.set(serializeCity()); } catch (e) {}
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem('xinfu_city');
    if (saved) {
      const data = JSON.parse(saved);
      if (deserializeCity(data)) { toast('City loaded from local storage'); return true; }
    }
  } catch (e) {}
  return false;
}

function saveToLocalStorage() {
  try { localStorage.setItem('xinfu_city', JSON.stringify(serializeCity())); } catch (e) {}
}

async function initFirebase() {
  if (typeof FirebaseShared === 'undefined') {
    toast('Firebase not available — using local storage');
    loadFromLocalStorage();
    return;
  }
  try {
    await FirebaseShared.init('xinfu-city', { presenceId: 'presenceBadge' });
    document.getElementById('presenceBadge').style.display = 'block';
    if (typeof firebase !== 'undefined' && firebase.database) {
      const db = firebase.database();
      cityRef = db.ref('xinfu-city/state');
      carRef = db.ref('xinfu-city/cars');
      cityRef.on('value', snap => {
        const data = snap.val();
        if (data) {
          if (deserializeCity(data)) { toast('City synced from cloud'); updateHUD(); }
        }
      });
      cityRef.once('value', snap => { if (!snap.val()) saveCity(); });
      listenForCars();
      firebaseReady = true;
      toast('Connected to Xin Fú Cloud!');
    }
  } catch (e) {
    toast('Using local storage (Firebase unavailable)');
    loadFromLocalStorage();
  }
}

// ═══════════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════════

let lastEconomyTick = 0;
let lastFrame = 0;

function gameLoop(timestamp) {
  const now = Date.now();
  const dt = lastFrame ? timestamp - lastFrame : 16;
  lastFrame = timestamp;

  if (now - lastEconomyTick > 3000) {
    economyTick();
    lastEconomyTick = now;
    saveToLocalStorage();
  }

  updateCar(dt);

  if (view3DMode) {
    View3D.render3D(dt);
  } else {
    render();
  }

  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════

initGrid();
centerCamera();
buildCategoryTabs();
buildToolbar();
updateHUD();
requestAnimationFrame(gameLoop);

setTimeout(initFirebase, 500);
setTimeout(() => toast('👑 Welcome to Xin Fú SAR! Toggle 2D/3D view in top right.'), 800);
</script>
