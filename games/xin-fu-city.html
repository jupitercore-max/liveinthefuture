<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Xin Fú City Builder — 新福特別行政區</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#e8e8e8;touch-action:none;overscroll-behavior:none;position:fixed;inset:0}
#gameCanvas{display:block;cursor:crosshair;image-rendering:pixelated;touch-action:none}

/* ─── HUD ─── */
#hud{position:fixed;top:0;left:0;right:0;height:52px;background:linear-gradient(180deg,#111 0%,rgba(10,10,10,0.95) 100%);border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:10;font-size:12px;gap:4px;padding-top:env(safe-area-inset-top,0)}
.stat{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#666}
.stat-val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-val.money{color:#4ade80}
.stat-val.pop{color:#60a5fa}
.stat-val.happy{color:#fbbf24}
.stat-val.happy.low{color:#ef4444}

/* ─── Toolbar ─── */
#toolbar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,#111 0%,rgba(10,10,10,0.98) 100%);border-top:1px solid #2a2a2a;padding:6px 4px;z-index:10;display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom,0);scroll-snap-type:x proximity}
#toolbar::-webkit-scrollbar{display:none}
.tool{flex-shrink:0;width:60px;height:56px;border:1px solid #333;border-radius:10px;background:#1a1a1a;color:#ccc;font-size:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .1s,background .15s,border-color .15s;user-select:none;-webkit-user-select:none;scroll-snap-align:start}
.tool:active{transform:scale(.92);background:#222}
.tool.active{border-color:#4a9eff;background:rgba(74,158,255,.15);color:#fff;box-shadow:0 0 8px rgba(74,158,255,.2)}
.tool-icon{font-size:20px;line-height:1}
.tool-name{font-size:7px;text-align:center;line-height:1.1;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-cost{font-size:7px;color:#666}
.tool.active .tool-cost{color:#4a9eff}

/* ─── Scroll indicators ─── */
#toolbarWrap{position:fixed;bottom:0;left:0;right:0;z-index:10}
.scroll-fade{position:absolute;top:0;bottom:0;width:24px;pointer-events:none;z-index:1;display:flex;align-items:center;justify-content:center}
.scroll-fade.left{left:0;background:linear-gradient(90deg,rgba(10,10,10,0.9),transparent)}
.scroll-fade.right{right:0;background:linear-gradient(270deg,rgba(10,10,10,0.9),transparent)}
.scroll-fade.hidden{display:none}
.scroll-fade .arrow{font-size:12px;color:#555;opacity:.7}

/* ─── Info Bar ─── */
#infoBar{position:fixed;bottom:80px;left:8px;right:8px;background:rgba(10,10,10,.94);border:1px solid #2a2a2a;border-radius:10px;padding:8px 12px;font-size:12px;z-index:9;display:none;max-width:360px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#infoBar.show{display:block}
#infoBar .info-title{font-weight:700;color:#fbbf24;margin-bottom:2px}

/* ─── Toast ─── */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(10,10,10,.96);border:1px solid #444;border-radius:10px;padding:8px 18px;font-size:13px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#toast.show{opacity:1}

/* ─── Minimap ─── */
#minimap{position:fixed;top:60px;right:6px;width:80px;height:80px;border:1px solid #333;border-radius:6px;z-index:8;opacity:.88;cursor:pointer;touch-action:none}

/* ─── Presence ─── */
.presence-badge{position:fixed;top:54px;left:6px;font-size:9px;color:#888;background:rgba(10,10,10,.85);padding:3px 8px;border-radius:6px;z-index:8}
.online-dot{display:inline-block;width:5px;height:5px;background:#22c55e;border-radius:50%;margin-right:3px}

/* ─── Mode Toggle (Pan vs Build) ─── */
#modeToggle{position:fixed;top:60px;right:94px;z-index:9;width:40px;height:40px;border-radius:50%;border:2px solid #333;background:rgba(26,26,26,.95);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#modeToggle:active{transform:scale(.9)}
#modeToggle.pan-mode{border-color:#fbbf24;background:rgba(251,191,36,.15)}

/* ─── Zoom buttons ─── */
#zoomControls{position:fixed;top:110px;right:10px;z-index:8;display:flex;flex-direction:column;gap:4px}
.zoom-btn{width:36px;height:36px;border-radius:8px;border:1px solid #333;background:rgba(26,26,26,.92);color:#ccc;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s;user-select:none;-webkit-user-select:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.zoom-btn:active{transform:scale(.88)}

/* ─── Car / Driving ─── */
#dpad{position:fixed;bottom:80px;left:12px;z-index:9;display:none;user-select:none;-webkit-user-select:none;touch-action:none}
#dpad.show{display:block}
.dpad-row{display:flex;gap:4px;justify-content:center}
.dpad-btn{width:48px;height:48px;border-radius:12px;border:2px solid #2a4a2a;background:rgba(20,40,20,.9);color:#6bdc6b;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s,background .1s;user-select:none;-webkit-user-select:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dpad-btn:active,.dpad-btn.pressed{transform:scale(.88);background:rgba(40,80,40,.95);border-color:#4a9e4a}
.dpad-spacer{width:48px;height:48px}

#carControls{position:fixed;bottom:80px;right:12px;z-index:9;display:none;flex-direction:column;gap:6px}
#carControls.show{display:flex}
.car-btn{padding:8px 14px;border-radius:10px;border:1px solid #444;background:rgba(26,26,26,.92);color:#ccc;font-size:11px;font-weight:600;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .1s}
.car-btn:active{transform:scale(.92)}
.car-btn.spawn{border-color:#22c55e;color:#22c55e}
.car-btn.exit{border-color:#ef4444;color:#ef4444}

@media(max-width:600px){
  .stat-val{font-size:14px}
  .stat-label{font-size:8px}
  .tool{width:54px;height:52px}
  .tool-icon{font-size:18px}
  #hud{height:48px;padding-top:env(safe-area-inset-top,0)}
}
@media(max-height:500px) and (orientation:landscape){
  #toolbar{padding:3px 4px}
  .tool{width:48px;height:42px}
  #hud{height:40px}
}
</style>
</head>
<body>

<div id="hud">
  <div class="stat"><span class="stat-label">💰 Treasury</span><span class="stat-val money" id="moneyVal">$50,000</span></div>
  <div class="stat"><span class="stat-label">👥 Citizens</span><span class="stat-val pop" id="popVal">0</span></div>
  <div class="stat"><span class="stat-label">😊 Happiness</span><span class="stat-val happy" id="happyVal">75%</span></div>
</div>

<canvas id="gameCanvas"></canvas>
<canvas id="minimap"></canvas>
<div class="presence-badge" id="presenceBadge" style="display:none"><span class="online-dot"></span><span id="presenceText">just you</span></div>
<div id="infoBar"></div>
<div id="toast"></div>

<!-- Mode toggle: Build vs Pan -->
<div id="modeToggle" class="pan-mode" title="Toggle pan/build mode">🖐️</div>

<!-- Zoom buttons -->
<div id="zoomControls">
  <div class="zoom-btn" id="zoomIn">+</div>
  <div class="zoom-btn" id="zoomOut">−</div>
</div>

<!-- D-Pad for driving (mobile) -->
<div id="dpad">
  <div class="dpad-row"><div class="dpad-btn" data-dir="up">▲</div></div>
  <div class="dpad-row">
    <div class="dpad-btn" data-dir="left">◀</div>
    <div class="dpad-btn" data-dir="down">▼</div>
    <div class="dpad-btn" data-dir="right">▶</div>
  </div>
</div>

<!-- Car spawn/exit controls -->
<div id="carControls">
  <div class="car-btn spawn" id="spawnCarBtn">🚗 Drive!</div>
  <div class="car-btn exit" id="exitCarBtn" style="display:none">🚪 Exit Car</div>
</div>

<!-- Toolbar with scroll indicators -->
<div id="toolbarWrap">
  <div class="scroll-fade left hidden" id="scrollLeft"><span class="arrow">‹</span></div>
  <div class="scroll-fade right" id="scrollRight"><span class="arrow">›</span></div>
  <div id="toolbar"></div>
</div>

<script src="../firebase-shared.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// XIN FÚ CITY BUILDER — 新福特別行政區
// A SimCity-style city builder for the Xin Fú SAR
// ═══════════════════════════════════════════════════════════════════

const TILE = 20;
const GRID_W = 40, GRID_H = 40;
const WORLD_W = GRID_W * TILE, WORLD_H = GRID_H * TILE;

// ─── Tile Types ────────────────────────────────────────────────────
const T = {
  GRASS: 0, WATER: 1, ROAD: 2,
  RES: 3, COM: 4, IND: 5, AGRI: 6,
  BLUETOOTH_TOWER: 10, THRONE_ROOM: 11, GRILL: 12,
  GARAGE: 13, GUMMY_FACTORY: 14, HORN_TOWER: 15, SIGN: 16,
};

const TILE_DATA = {
  [T.GRASS]:    { name:'Grass', color:'#2d5a2d', cost:0 },
  [T.WATER]:    { name:'Water', color:'#1a3a5c', cost:0 },
  [T.ROAD]:     { name:'Road', color:'#444', cost:50 },
  [T.RES]:      { name:'Residential', color:'#3b82f6', cost:100 },
  [T.COM]:      { name:'Commercial', color:'#f59e0b', cost:150 },
  [T.IND]:      { name:'Industrial', color:'#a16207', cost:200 },
  [T.AGRI]:     { name:'Pepper Farm', color:'#16a34a', cost:80 },
  [T.BLUETOOTH_TOWER]: { name:'Bluetooth Tower', color:'#8b5cf6', cost:5000, special:true },
  [T.THRONE_ROOM]:     { name:"Lord Bluetooth's Throne", color:'#c9a84c', cost:3000, special:true },
  [T.GRILL]:           { name:'Napoleon Flex Flame Grill', color:'#ef4444', cost:1200, special:true },
  [T.GARAGE]:          { name:"GLENN'S GARAGE", color:'#64748b', cost:1500, special:true },
  [T.GUMMY_FACTORY]:   { name:'Smart Gummy Factory', color:'#ec4899', cost:2500, special:true },
  [T.HORN_TOWER]:      { name:'AI Horn Speaker Tower', color:'#06b6d4', cost:1800, special:true },
  [T.SIGN]:            { name:'Directional Sign', color:'#fbbf24', cost:10, special:true },
};

// ─── Tools ─────────────────────────────────────────────────────────
const TOOLS = [
  { id:'inspect', icon:'🔍', name:'Inspect', cost:0 },
  { id:'road', icon:'🛣️', name:'Road', tile:T.ROAD, cost:50 },
  { id:'res', icon:'🏠', name:'Residential', tile:T.RES, cost:100 },
  { id:'com', icon:'🏪', name:'Commercial', tile:T.COM, cost:150 },
  { id:'ind', icon:'🏭', name:'Industrial', tile:T.IND, cost:200 },
  { id:'agri', icon:'🌶️', name:'Pepper Farm', tile:T.AGRI, cost:80 },
  { id:'bluetooth', icon:'📡', name:'BT Tower', tile:T.BLUETOOTH_TOWER, cost:5000 },
  { id:'throne', icon:'👑', name:'Throne', tile:T.THRONE_ROOM, cost:3000 },
  { id:'grill', icon:'🔥', name:'Grill', tile:T.GRILL, cost:1200 },
  { id:'garage', icon:'🔧', name:'Garage', tile:T.GARAGE, cost:1500 },
  { id:'gummy', icon:'🐻', name:'Gummy', tile:T.GUMMY_FACTORY, cost:2500 },
  { id:'horn', icon:'📢', name:'Horn', tile:T.HORN_TOWER, cost:1800 },
  { id:'sign', icon:'🪧', name:'Sign', tile:T.SIGN, cost:10 },
  { id:'bulldoze', icon:'💥', name:'Bulldoze', cost:0 },
  { id:'drive', icon:'🚗', name:'Drive', cost:0 },
];

// ─── Road Signs ────────────────────────────────────────────────────
const ROAD_SIGNS = [
  { text:'Livermore — 45 mi ←', dir:'left' },
  { text:'Las Vegas — 540 mi →', dir:'right', sub:"Lord Bluetooth's Territory" },
  { text:'Menlo Park — 1215 Chrysler Dr →', dir:'right', sub:"Glenn's Garage HQ" },
  { text:'Tokyo — 5,128 mi →', dir:'right' },
  { text:'Copenhagen — 5,431 mi →', dir:'right' },
  { text:'Xin Fú Downtown — ↑', dir:'up' },
];

// ─── Canvas Setup ──────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');
minimap.width = 80; minimap.height = 80;

let camX = 0, camY = 0;
let zoom = 1;
let dragStart = null;
let isDragging = false;

// ─── Responsive Canvas (handles mobile browser chrome) ─────────────
const HUD_H = 52;
const TOOLBAR_H = 68;

function resizeCanvas() {
  const w = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
resizeCanvas();

window.addEventListener('resize', resizeCanvas);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resizeCanvas);
  window.visualViewport.addEventListener('scroll', resizeCanvas);
}

// ─── Game State ────────────────────────────────────────────────────
let state = {
  grid: [],
  money: 50000,
  population: 0,
  happiness: 75,
  income: 0,
  expenses: 0,
  tick: 0,
  buildCount: {},
};

let activeTool = 'inspect';

// ─── Interaction Mode ──────────────────────────────────────────────
// 'build' = tap to place, drag to build continuously
// 'pan'   = tap does nothing, drag to pan camera
let interactionMode = 'pan'; // start in pan mode (safer for mobile)

const modeToggle = document.getElementById('modeToggle');
modeToggle.addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  if (interactionMode === 'pan') {
    interactionMode = 'build';
    modeToggle.textContent = '🏗️';
    modeToggle.classList.remove('pan-mode');
  } else {
    interactionMode = 'pan';
    modeToggle.textContent = '🖐️';
    modeToggle.classList.add('pan-mode');
  }
  haptic(8);
});

// ─── Zoom buttons ──────────────────────────────────────────────────
document.getElementById('zoomIn').addEventListener('pointerdown', e => {
  e.preventDefault();
  zoom = Math.min(3, zoom * 1.2);
  clampCamera();
  haptic(8);
});
document.getElementById('zoomOut').addEventListener('pointerdown', e => {
  e.preventDefault();
  zoom = Math.max(0.5, zoom / 1.2);
  clampCamera();
  haptic(8);
});

// ─── Haptic feedback ───────────────────────────────────────────────
function haptic(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

// ─── Init Grid ─────────────────────────────────────────────────────
function initGrid() {
  state.grid = [];
  for (let y = 0; y < GRID_H; y++) {
    const row = [];
    for (let x = 0; x < GRID_W; x++) {
      let tile = T.GRASS;
      if ((x < 4 && y < 4) || (x > 35 && y > 35)) tile = T.WATER;
      if (x >= 8 && x <= 10 && y >= 30 && y <= 33) tile = T.WATER;
      row.push({ type: tile, level: 0, data: {} });
    }
    state.grid.push(row);
  }

  state.grid[20][20] = { type: T.BLUETOOTH_TOWER, level: 1, data: {} };
  state.grid[18][22] = { type: T.THRONE_ROOM, level: 1, data: {} };
  state.grid[22][18] = { type: T.GRILL, level: 1, data: {} };
  state.grid[26][28] = { type: T.GARAGE, level: 1, data: {} };
  state.grid[28][26] = { type: T.GUMMY_FACTORY, level: 1, data: {} };
  state.grid[15][25] = { type: T.HORN_TOWER, level: 1, data: {} };
  state.grid[24][14] = { type: T.AGRI, level: 1, data: {} };
  state.grid[25][14] = { type: T.AGRI, level: 1, data: {} };
  state.grid[24][15] = { type: T.AGRI, level: 1, data: {} };
  state.grid[25][15] = { type: T.AGRI, level: 1, data: {} };

  for (let x = 16; x <= 30; x++) state.grid[20][x] = { type: T.ROAD, level: 1, data: {} };
  for (let y = 15; y <= 28; y++) state.grid[y][20] = { type: T.ROAD, level: 1, data: {} };
  for (let y = 18; y <= 22; y++) state.grid[y][22] = { type: T.ROAD, level: 1, data: {} };
  for (let x = 22; x <= 28; x++) state.grid[26][x] = { type: T.ROAD, level: 1, data: {} };
  for (let x = 14; x <= 20; x++) state.grid[24][x] = { type: T.ROAD, level: 1, data: {} };

  for (let y of [18,19]) for (let x of [17,18,19]) state.grid[y][x] = { type: T.RES, level: 1, data:{} };
  for (let y of [21,22]) for (let x of [21,22,23]) state.grid[y][x] = { type: T.COM, level: 1, data:{} };
  for (let y of [27,28]) for (let x of [27,29]) state.grid[y][x] = { type: T.IND, level: 1, data:{} };

  const signPositions = [
    { x: 12, y: 20, signIdx: 0 },
    { x: 31, y: 20, signIdx: 1 },
    { x: 20, y: 12, signIdx: 2 },
    { x: 33, y: 15, signIdx: 3 },
    { x: 6, y: 10, signIdx: 4 },
    { x: 20, y: 16, signIdx: 5 },
  ];
  signPositions.forEach(s => {
    state.grid[s.y][s.x] = { type: T.SIGN, level: 1, data: { signIdx: s.signIdx } };
  });
}

// ─── Camera Controls ───────────────────────────────────────────────
function getCanvasOffsetY() {
  return HUD_H;
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - camX) / zoom,
    y: (sy - camY - getCanvasOffsetY()) / zoom,
  };
}

function worldToTile(wx, wy) {
  return {
    x: Math.floor(wx / TILE),
    y: Math.floor(wy / TILE),
  };
}

function centerCamera() {
  camX = (canvas.width - WORLD_W * zoom) / 2;
  camY = (canvas.height - getCanvasOffsetY() - TOOLBAR_H - WORLD_H * zoom) / 2;
  clampCamera();
}

function clampCamera() {
  const maxX = 0;
  const minX = canvas.width - WORLD_W * zoom;
  const maxY = getCanvasOffsetY();
  const minY = canvas.height - TOOLBAR_H - WORLD_H * zoom;
  camX = Math.max(Math.min(camX, maxX), minX);
  camY = Math.max(Math.min(camY, maxY), Math.min(minY, getCanvasOffsetY()));
}

// ─── Touch/Mouse — Unified Pointer Events ──────────────────────────
let pointers = new Map();
let lastPinchDist = 0;
let pinchCenter = null;
const DRAG_THRESHOLD = 8; // pixels — must move this far before pan starts
const TAP_THRESHOLD = 6;   // max movement to count as a tap

const MOVE_THRESHOLD_PAN = 8;

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY });

  if (pointers.size === 1) {
    // Track for tap vs drag determination
    dragStart = {
      x: e.clientX, y: e.clientY,
      camX, camY,
      moved: false,
      pointerId: e.pointerId,
    };
  } else if (pointers.size === 2) {
    const pts = [...pointers.values()];
    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchCenter = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    // Cancel any pending tap
    if (dragStart) dragStart.moved = true;
  }
});

canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) {
    pointers.set(e.pointerId, { ...pointers.get(e.pointerId), x: e.clientX, y: e.clientY });
  }

  // ── Pinch zoom (two fingers) ──
  if (pointers.size === 2) {
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const newCenter = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    if (lastPinchDist > 0) {
      const scale = dist / lastPinchDist;
      const oldZoom = zoom;
      zoom = Math.max(0.5, Math.min(3, zoom * scale));
      // Zoom toward pinch center
      const wx = (newCenter.x - camX) / oldZoom;
      const wy = (newCenter.y - camY - getCanvasOffsetY()) / oldZoom;
      camX = newCenter.x - wx * zoom;
      camY = newCenter.y - wy * zoom - getCanvasOffsetY();
      clampCamera();
    }
    lastPinchDist = dist;
    pinchCenter = newCenter;
    if (dragStart) dragStart.moved = true;
    return;
  }

  // ── Single pointer ──
  if (dragStart && pointers.size === 1) {
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    const dist = Math.hypot(dx, dy);

    if (dist > DRAG_THRESHOLD) {
      dragStart.moved = true;
      isDragging = true;

      // Pan camera (works in both modes — in build mode, pan only if moved significantly)
      camX = dragStart.camX + dx;
      camY = dragStart.camY + dy;
      clampCamera();

      // Continuous building in build mode for non-special tools
      if (interactionMode === 'build' && activeTool !== 'inspect' && activeTool !== 'bulldoze' && activeTool !== 'drive') {
        const tool = TOOLS.find(t => t.id === activeTool);
        if (tool && !tool.special) {
          const tx = worldToTile(screenToWorld(e.clientX, e.clientY));
          handleBuild(tx.x, tx.y);
        }
      }
      // Continuous bulldoze
      if (activeTool === 'bulldoze') {
        const tx = worldToTile(screenToWorld(e.clientX, e.clientY));
        handleBulldoze(tx.x, tx.y);
      }
    }
  }
});

canvas.addEventListener('pointerup', e => {
  const wasSinglePointer = pointers.size === 1;
  const ptrInfo = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);

  if (pointers.size < 2) {
    lastPinchDist = 0;
    pinchCenter = null;
  }

  // ── Tap detection: if this was a single pointer that didn't move much ──
  if (wasSinglePointer && dragStart && !dragStart.moved) {
    const totalMove = ptrInfo ? Math.hypot(e.clientX - ptrInfo.startX, e.clientY - ptrInfo.startY) : 0;
    if (totalMove < TAP_THRESHOLD) {
      // It's a tap!
      const tx = worldToTile(screenToWorld(e.clientX, e.clientY));

      if (activeTool === 'drive') {
        // Ignore taps on canvas while in drive mode
      } else if (interactionMode === 'build') {
        if (activeTool === 'inspect') {
          showTileInfo(tx.x, tx.y);
        } else {
          handleBuild(tx.x, tx.y);
          haptic(10);
        }
      } else {
        // Pan mode — tapping dismisses info bar
        document.getElementById('infoBar').classList.remove('show');
      }
    }
  }

  if (pointers.size === 0) {
    dragStart = null;
    setTimeout(() => { isDragging = false; }, 50);
  }
});

canvas.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    dragStart = null;
    isDragging = false;
  }
  if (pointers.size < 2) lastPinchDist = 0;
});

// Prevent context menu on long press
canvas.addEventListener('contextmenu', e => e.preventDefault());

// Wheel zoom (desktop)
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(0.5, Math.min(3, zoom * delta));
  const wx = (e.clientX - camX) / zoom;
  const wy = (e.clientY - camY - getCanvasOffsetY()) / zoom;
  zoom = newZoom;
  camX = e.clientX - wx * zoom;
  camY = e.clientY - wy * zoom - getCanvasOffsetY();
  clampCamera();
}, { passive: false });

// ─── Building Logic ────────────────────────────────────────────────
function handleBuild(tx, ty) {
  if (tx < 0 || tx >= GRID_W || ty < 0 || ty >= GRID_H) return;
  const tile = state.grid[ty][tx];
  const tool = TOOLS.find(t => t.id === activeTool);
  if (!tool) return;

  if (activeTool === 'bulldoze') {
    handleBulldoze(tx, ty);
    return;
  }

  const data = TILE_DATA[tool.tile];
  if (!data) return;

  if (tile.type === T.WATER) { toast('Cannot build on water!'); return; }
  if (tile.type !== T.GRASS && tile.type !== T.ROAD) {
    toast('Tile occupied! Bulldoze first.'); return;
  }
  if (data.special && tile.type !== T.GRASS) { toast('Clear the tile first!'); return; }
  if (state.money < data.cost) { toast('Not enough funds!'); return; }
  if (tile.type === tool.tile) return;

  state.money -= data.cost;
  state.grid[ty][tx] = { type: tool.tile, level: 1, data: {} };
  state.buildCount[tool.tile] = (state.buildCount[tool.tile] || 0) + 1;
  updateHUD();
  scheduleSave();
}

function handleBulldoze(tx, ty) {
  if (tx < 0 || tx >= GRID_W || ty < 0 || ty >= GRID_H) return;
  const tile = state.grid[ty][tx];
  if (tile.type === T.GRASS || tile.type === T.WATER) return;

  const data = TILE_DATA[tile.type];
  const refund = data ? Math.floor(data.cost * 0.25) : 0;
  state.money += refund;
  state.grid[ty][tx] = { type: T.GRASS, level: 0, data: {} };
  updateHUD();
  scheduleSave();
}

// ─── Tile Info ─────────────────────────────────────────────────────
function showTileInfo(tx, ty) {
  const infoBar = document.getElementById('infoBar');
  if (tx < 0 || tx >= GRID_W || ty < 0 || ty >= GRID_H) {
    infoBar.classList.remove('show');
    return;
  }
  const tile = state.grid[ty][tx];
  const data = TILE_DATA[tile.type];
  if (!data) { infoBar.classList.remove('show'); return; }

  let html = `<div class="info-title">${data.name}</div>`;
  html += `<div style="color:#888">Location: (${tx}, ${ty})</div>`;

  if (tile.type === T.SIGN && tile.data.signIdx != null) {
    const sign = ROAD_SIGNS[tile.data.signIdx];
    if (sign) html += `<div style="color:#fbbf24;margin-top:4px">${sign.text}</div>`;
  }
  if (tile.type === T.RES) html += `<div style="color:#888">Level ${tile.level} · ${getResPop(tile)} residents</div>`;
  if (tile.type === T.COM) html += `<div style="color:#888">Level ${tile.level} · $${getComIncome(tile)}/cycle</div>`;
  if (tile.type === T.IND) html += `<div style="color:#888">Level ${tile.level} · $${getIndIncome(tile)}/cycle</div>`;
  if (tile.type === T.AGRI) html += `<div style="color:#888">Pepper farm · $${getAgriIncome(tile)}/cycle</div>`;

  infoBar.innerHTML = html;
  infoBar.classList.add('show');
}

// ─── Economy ───────────────────────────────────────────────────────
function getResPop(tile) { return tile.type !== T.RES ? 0 : tile.level * 12; }
function getComIncome(tile) { return tile.type !== T.COM ? 0 : tile.level * 8; }
function getIndIncome(tile) { return tile.type !== T.IND ? 0 : tile.level * 12; }
function getAgriIncome(tile) { return tile.type !== T.AGRI ? 0 : tile.level * 5; }

function hasRoadAdjacent(tx, ty) {
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = tx + dx, ny = ty + dy;
      if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
      if (state.grid[ny][nx].type === T.ROAD) return true;
    }
  }
  return false;
}

function economyTick() {
  state.tick++;
  let income = 0;
  let pop = 0;
  let indCount = 0, resCount = 0, comCount = 0;
  let happinessDelta = 0;

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const tile = state.grid[y][x];
      const hasRoad = hasRoadAdjacent(x, y);
      switch (tile.type) {
        case T.RES:
          if (hasRoad) {
            if (tile.level < 3 && state.tick % 10 === 0 && Math.random() < 0.3) tile.level++;
            pop += getResPop(tile);
            resCount++;
          }
          break;
        case T.COM:
          if (hasRoad) {
            income += getComIncome(tile);
            comCount++;
            if (tile.level < 3 && state.tick % 8 === 0 && Math.random() < 0.25) tile.level++;
          }
          break;
        case T.IND:
          if (hasRoad) {
            income += getIndIncome(tile);
            indCount++;
            if (tile.level < 3 && state.tick % 12 === 0 && Math.random() < 0.2) tile.level++;
          }
          break;
        case T.AGRI:
          if (hasRoad) income += getAgriIncome(tile);
          break;
        case T.GRILL: income += 25; break;
        case T.GARAGE: income += 30; break;
        case T.GUMMY_FACTORY: income += 50; happinessDelta -= 1; break;
        case T.THRONE_ROOM: happinessDelta += 3; break;
        case T.BLUETOOTH_TOWER: happinessDelta += 5; break;
        case T.HORN_TOWER: happinessDelta += 2; break;
      }
    }
  }

  const towerPos = findTile(T.BLUETOOTH_TOWER);
  if (towerPos) happinessDelta += 2;

  if (indCount > resCount && resCount > 0)
    happinessDelta -= Math.min(10, Math.floor((indCount - resCount) * 0.5));
  if (resCount > 0 && comCount === 0) happinessDelta -= 2;

  const roadCount = countTiles(T.ROAD);
  if (roadCount > 10) happinessDelta += 1;

  state.happiness = Math.max(0, Math.min(100, state.happiness + happinessDelta * 0.5));
  const taxes = Math.floor(pop * (state.happiness / 100) * 0.5);
  income += taxes;
  const maintenance = Math.floor((resCount + comCount + indCount) * 2 + roadCount * 0.5);

  state.income = income;
  state.expenses = maintenance;
  state.population = pop;
  state.money += income - maintenance;

  updateHUD();
}

function findTile(type) {
  for (let y = 0; y < GRID_H; y++)
    for (let x = 0; x < GRID_W; x++)
      if (state.grid[y][x].type === type) return { x, y };
  return null;
}

function countTiles(type) {
  let c = 0;
  for (let y = 0; y < GRID_H; y++)
    for (let x = 0; x < GRID_W; x++)
      if (state.grid[y][x].type === type) c++;
  return c;
}

// ─── HUD ───────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('moneyVal').textContent = '$' + Math.floor(state.money).toLocaleString();
  document.getElementById('popVal').textContent = state.population.toLocaleString();
  const happyEl = document.getElementById('happyVal');
  happyEl.textContent = Math.round(state.happiness) + '%';
  happyEl.className = 'stat-val happy' + (state.happiness < 40 ? ' low' : '');
  document.getElementById('moneyVal').style.color = state.money < 0 ? '#ef4444' : '#4ade80';
}

// ─── Toast ─────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ─── Toolbar ───────────────────────────────────────────────────────
function buildToolbar() {
  const tb = document.getElementById('toolbar');
  tb.innerHTML = '';
  TOOLS.forEach(tool => {
    const btn = document.createElement('div');
    btn.className = 'tool' + (activeTool === tool.id ? ' active' : '');
    btn.innerHTML = `<div class="tool-icon">${tool.icon}</div><div class="tool-name">${tool.name}</div><div class="tool-cost">${tool.cost > 0 ? '$' + tool.cost : ''}</div>`;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      activeTool = tool.id;
      buildToolbar();
      document.getElementById('infoBar').classList.remove('show');
      haptic(8);

      // Auto-switch to build mode if selecting a building tool
      if (tool.id !== 'inspect' && tool.id !== 'drive') {
        if (interactionMode !== 'build') {
          interactionMode = 'build';
          modeToggle.textContent = '🏗️';
          modeToggle.classList.remove('pan-mode');
        }
      }

      // Drive mode
      if (tool.id === 'drive') {
        if (!myCar) {
          spawnMyCar();
        }
        showCarControls();
      } else {
        hideCarControls();
      }
    });
    tb.appendChild(btn);
  });

  // Update scroll indicators
  setTimeout(updateScrollIndicators, 50);
}

// ─── Toolbar scroll indicators ─────────────────────────────────────
const toolbarEl = document.getElementById('toolbar');
function updateScrollIndicators() {
  const leftFade = document.getElementById('scrollLeft');
  const rightFade = document.getElementById('scrollRight');
  const maxScroll = toolbarEl.scrollWidth - toolbarEl.clientWidth;
  leftFade.classList.toggle('hidden', toolbarEl.scrollLeft <= 2);
  rightFade.classList.toggle('hidden', toolbarEl.scrollLeft >= maxScroll - 2);
}
toolbarEl.addEventListener('scroll', updateScrollIndicators);

// ═══════════════════════════════════════════════════════════════════
// 🚗 CAR / DRIVING SYSTEM
// ═══════════════════════════════════════════════════════════════════

const CAR_COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#fbbf24', '#a855f7', '#06b6d4', '#ec4899', '#f97316'];
let myCar = null;
let cars = {};          // { visitorId: { x, y, dir, color, name } }
let carRef = null;
let driving = false;
const CAR_SIZE = 10;

function getMyId() {
  if (typeof FirebaseShared !== 'undefined' && FirebaseShared.visitorId) return FirebaseShared.visitorId;
  return 'local_' + ( sessionStorage.getItem('carId') || (() => {
    const id = 'anon_' + Math.random().toString(36).slice(2,8);
    sessionStorage.setItem('carId', id);
    return id;
  })());
}

function getMyName() {
  if (typeof FirebaseShared !== 'undefined' && FirebaseShared.getVisitorName) return FirebaseShared.getVisitorName();
  return 'Driver';
}

function spawnMyCar() {
  const id = getMyId();
  // Spawn near center of city on a road tile
  let spawnX = 20 * TILE + TILE/2;
  let spawnY = 20 * TILE + TILE/2;
  // Find nearest road
  let bestDist = Infinity;
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (state.grid[y][x].type === T.ROAD) {
        const d = (x - 20) ** 2 + (y - 20) ** 2;
        if (d < bestDist) {
          bestDist = d;
          spawnX = x * TILE + TILE/2;
          spawnY = y * TILE + TILE/2;
        }
      }
    }
  }

  const colorIdx = Math.abs(hashCode(id)) % CAR_COLORS.length;
  myCar = {
    x: spawnX,
    y: spawnY,
    dir: 0,  // radians
    speed: 0,
    color: CAR_COLORS[colorIdx],
    name: getMyName(),
  };
  driving = true;

  // Center camera on car
  centerCameraOnCar();

  toast('🚗 Car spawned! Use D-pad or arrow keys to drive.');
  haptic(20);

  // Save car to Firebase
  saveCar();
}

function exitCar() {
  driving = false;
  if (myCar) {
    // Remove from Firebase
    if (carRef && myCar) {
      carRef.child(getMyId()).remove();
    }
    delete cars[getMyId()];
    myCar = null;
  }
  hideCarControls();
  toast('🚪 Exited car');
}

function centerCameraOnCar() {
  if (!myCar) return;
  camX = canvas.width / 2 - myCar.x * zoom;
  camY = (canvas.height - TOOLBAR_H) / 2 + getCanvasOffsetY() - myCar.y * zoom;
  // Don't clamp when driving — let camera follow car freely
}

function hashCode(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h |= 0;
  }
  return h;
}

// ─── Car controls ──────────────────────────────────────────────────
const keys = { up: false, down: false, left: false, right: false };

window.addEventListener('keydown', e => {
  if (driving && myCar) {
    if (e.key === 'ArrowUp' || e.key === 'w') { keys.up = true; e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === 's') { keys.down = true; e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'a') { keys.left = true; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd') { keys.right = true; e.preventDefault(); }
    return;
  }

  // Non-driving keyboard
  const panSpeed = 30;
  if (e.key === 'ArrowLeft') { camX += panSpeed; clampCamera(); }
  else if (e.key === 'ArrowRight') { camX -= panSpeed; clampCamera(); }
  else if (e.key === 'ArrowUp') { camY += panSpeed; clampCamera(); }
  else if (e.key === 'ArrowDown') { camY -= panSpeed; clampCamera(); }
  else if (e.key === '=' || e.key === '+') { zoom = Math.min(3, zoom * 1.15); clampCamera(); }
  else if (e.key === '-') { zoom = Math.max(0.5, zoom / 1.15); clampCamera(); }
});

window.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
  else if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
  else if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  else if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// ─── D-Pad (mobile) ────────────────────────────────────────────────
document.querySelectorAll('.dpad-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  const start = e => {
    e.preventDefault();
    e.stopPropagation();
    keys[dir] = true;
    btn.classList.add('pressed');
    haptic(5);
  };
  const end = e => {
    e.preventDefault();
    e.stopPropagation();
    keys[dir] = false;
    btn.classList.remove('pressed');
  };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointercancel', end);
  btn.addEventListener('pointerleave', end);
});

// ─── Spawn / Exit car buttons ──────────────────────────────────────
document.getElementById('spawnCarBtn').addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  if (!myCar) {
    spawnMyCar();
  }
  showCarControls();
});

document.getElementById('exitCarBtn').addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  exitCar();
});

function showCarControls() {
  document.getElementById('dpad').classList.add('show');
  document.getElementById('carControls').classList.add('show');
  document.getElementById('spawnCarBtn').style.display = 'none';
  document.getElementById('exitCarBtn').style.display = 'block';
}

function hideCarControls() {
  document.getElementById('dpad').classList.remove('show');
  document.getElementById('carControls').classList.remove('show');
  document.getElementById('spawnCarBtn').style.display = 'block';
  document.getElementById('exitCarBtn').style.display = 'none';
}

// ─── Car physics ───────────────────────────────────────────────────
function updateCar(dt) {
  if (!myCar || !driving) return;

  const ACCEL = 0.08;
  const MAX_SPEED = 2.5;
  const TURN_SPEED = 0.06;

  // Acceleration
  if (keys.up) {
    myCar.speed = Math.min(myCar.speed + ACCEL, MAX_SPEED);
  } else if (keys.down) {
    myCar.speed = Math.max(myCar.speed - ACCEL, -MAX_SPEED * 0.5);
  } else {
    // Friction
    myCar.speed *= 0.95;
    if (Math.abs(myCar.speed) < 0.01) myCar.speed = 0;
  }

  // Steering (only when moving)
  if (Math.abs(myCar.speed) > 0.05) {
    const turnFactor = myCar.speed > 0 ? 1 : -1;
    if (keys.left) myCar.dir -= TURN_SPEED * turnFactor;
    if (keys.right) myCar.dir += TURN_SPEED * turnFactor;
  }

  // Move
  const newX = myCar.x + Math.cos(myCar.dir) * myCar.speed;
  const newY = myCar.y + Math.sin(myCar.dir) * myCar.speed;

  // Boundary check
  if (newX >= 0 && newX <= WORLD_W && newY >= 0 && newY <= WORLD_H) {
    myCar.x = newX;
    myCar.y = newY;
  } else {
    myCar.speed = 0;
  }

  // Camera follows car
  centerCameraOnCar();

  // Throttle Firebase save
  carSaveAccumulator += dt;
  if (carSaveAccumulator > 150) {
    carSaveAccumulator = 0;
    saveCar();
  }
}

let carSaveAccumulator = 0;

// ─── Render car ────────────────────────────────────────────────────
function renderCars() {
  const allCars = { ...cars };
  if (myCar) allCars[getMyId()] = myCar;

  for (const [id, car] of Object.entries(allCars)) {
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.dir);

    // Car body
    const isMine = id === getMyId();
    ctx.fillStyle = car.color || '#ef4444';
    ctx.fillRect(-CAR_SIZE/2, -CAR_SIZE/2, CAR_SIZE, CAR_SIZE);

    // Windshield
    ctx.fillStyle = 'rgba(150,200,255,0.7)';
    ctx.fillRect(CAR_SIZE/2 - 4, -CAR_SIZE/2 + 1, 2, CAR_SIZE - 2);

    // Outline for my car
    if (isMine) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(-CAR_SIZE/2 - 1, -CAR_SIZE/2 - 1, CAR_SIZE + 2, CAR_SIZE + 2);
    }

    ctx.restore();

    // Name tag (not rotated)
    if (car.name) {
      ctx.fillStyle = isMine ? '#fff' : '#aaa';
      ctx.font = '6px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(car.name, car.x, car.y - CAR_SIZE/2 - 3);
    }
  }
}

// ─── Save/load car to Firebase ─────────────────────────────────────
function saveCar() {
  if (!carRef || !myCar) return;
  try {
    carRef.child(getMyId()).set({
      x: Math.round(myCar.x * 10) / 10,
      y: Math.round(myCar.y * 10) / 10,
      dir: Math.round(myCar.dir * 100) / 100,
      color: myCar.color,
      name: myCar.name,
      updated: Date.now(),
    });
  } catch (e) {
    console.warn('Car save failed:', e);
  }
}

function listenForCars() {
  if (!carRef) return;
  carRef.on('value', snap => {
    const data = snap.val();
    if (!data) { cars = {}; return; }
    // Prune stale cars (>30s)
    const now = Date.now();
    const newCars = {};
    for (const [id, car] of Object.entries(data)) {
      if (id === getMyId()) continue;
      if (now - (car.updated || 0) > 30000) {
        carRef.child(id).remove();
        continue;
      }
      newCars[id] = car;
    }
    cars = newCars;
  });
}

// ─── Rendering ─────────────────────────────────────────────────────
function render() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(camX, camY + getCanvasOffsetY());
  ctx.scale(zoom, zoom);

  const startX = Math.max(0, Math.floor(-camX / zoom / TILE));
  const endX = Math.min(GRID_W, Math.ceil((canvas.width - camX) / zoom / TILE));
  const startY = Math.max(0, Math.floor(-(camY + getCanvasOffsetY()) / zoom / TILE));
  const endY = Math.min(GRID_H, Math.ceil((canvas.height - camY - getCanvasOffsetY() - TOOLBAR_H) / zoom / TILE));

  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      drawTile(x, y);
    }
  }

  // Grid lines at high zoom
  if (zoom > 1) {
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (let x = startX; x <= endX; x++) {
      ctx.beginPath();
      ctx.moveTo(x * TILE, startY * TILE);
      ctx.lineTo(x * TILE, endY * TILE);
      ctx.stroke();
    }
    for (let y = startY; y <= endY; y++) {
      ctx.beginPath();
      ctx.moveTo(startX * TILE, y * TILE);
      ctx.lineTo(endX * TILE, y * TILE);
      ctx.stroke();
    }
  }

  // Render all cars
  renderCars();

  ctx.restore();

  renderMinimap();
}

function drawTile(tx, ty) {
  const tile = state.grid[ty][tx];
  const data = TILE_DATA[tile.type] || TILE_DATA[T.GRASS];
  const px = tx * TILE, py = ty * TILE;

  ctx.fillStyle = data.color;
  ctx.fillRect(px, py, TILE, TILE);

  switch (tile.type) {
    case T.GRASS:
      if ((tx + ty) % 3 === 0) {
        ctx.fillStyle = '#275027';
        ctx.fillRect(px + 2, py + 2, 3, 3);
      }
      break;
    case T.WATER:
      const sh = Math.sin(state.tick * 0.05 + tx * 0.5 + ty * 0.3) * 0.5 + 0.5;
      ctx.fillStyle = `rgba(100,150,200,${sh * 0.15})`;
      ctx.fillRect(px, py, TILE, TILE);
      break;
    case T.ROAD:
      ctx.fillStyle = '#333';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#555';
      ctx.fillRect(px + TILE/2 - 1, py, 2, TILE);
      ctx.fillRect(px, py + TILE/2 - 1, TILE, 2);
      break;
    case T.RES: drawBuilding(px, py, tile.level, '#3b82f6', '#1e40af'); break;
    case T.COM: drawBuilding(px, py, tile.level, '#f59e0b', '#92400e'); break;
    case T.IND:
      drawBuilding(px, py, tile.level, '#a16207', '#713f12');
      ctx.fillStyle = '#444';
      ctx.fillRect(px + TILE - 5, py + 2, 3, 4);
      break;
    case T.AGRI:
      ctx.fillStyle = '#15803d';
      ctx.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);
      ctx.fillStyle = '#dc2626';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(px + 3 + i * 5, py + 5 + (i % 2) * 6, 2, 2);
      }
      break;
    case T.BLUETOOTH_TOWER:
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#8b5cf6';
      ctx.fillRect(px + TILE/2 - 1, py + 2, 3, TILE - 4);
      ctx.strokeStyle = '#8b5cf6';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(px + TILE/2 + 1, py + 4, 4, -Math.PI/3, Math.PI/3);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(px + TILE/2 + 1, py + 4, 7, -Math.PI/3, Math.PI/3);
      ctx.stroke();
      break;
    case T.THRONE_ROOM:
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#c9a84c';
      ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = '#1a1a1a';
      ctx.font = `${TILE - 6}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('👑', px + TILE/2, py + TILE/2);
      break;
    case T.GRILL:
      ctx.fillStyle = '#1a0a0a';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = '#fbbf24';
      ctx.font = `${TILE - 6}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🔥', px + TILE/2, py + TILE/2);
      break;
    case T.GARAGE:
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#64748b';
      ctx.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(px + 4, py + 6, TILE - 8, TILE - 10);
      ctx.fillStyle = '#fbbf24';
      ctx.font = '5px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GARAGE', px + TILE/2, py + TILE - 3);
      break;
    case T.GUMMY_FACTORY:
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#ec4899';
      ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.font = `${TILE - 8}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐻', px + TILE/2, py + TILE/2);
      break;
    case T.HORN_TOWER:
      ctx.fillStyle = '#0a1a1a';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#06b6d4';
      ctx.beginPath();
      ctx.moveTo(px + TILE/2, py + 2);
      ctx.lineTo(px + TILE - 3, py + TILE - 3);
      ctx.lineTo(px + 3, py + TILE - 3);
      ctx.closePath();
      ctx.fill();
      break;
    case T.SIGN:
      ctx.fillStyle = '#2d5a2d';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#888';
      ctx.fillRect(px + TILE/2 - 1, py + 4, 2, TILE - 4);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(px + 1, py + 2, TILE - 2, 5);
      ctx.fillStyle = '#000';
      ctx.font = '4px monospace';
      ctx.textAlign = 'center';
      const sign = ROAD_SIGNS[tile.data.signIdx || 0];
      if (sign) {
        const arrow = sign.dir === 'left' ? '◀' : sign.dir === 'right' ? '▶' : '▲';
        ctx.fillText(arrow, px + TILE/2, py + 6);
      }
      break;
  }

  if ((tile.type === T.RES || tile.type === T.COM || tile.type === T.IND || tile.type === T.AGRI) && !hasRoadAdjacent(tx, ty)) {
    ctx.fillStyle = 'rgba(239,68,68,0.15)';
    ctx.fillRect(px, py, TILE, TILE);
  }
}

function drawBuilding(px, py, level, color, darkColor) {
  const h = 4 + level * 4;
  ctx.fillStyle = darkColor;
  ctx.fillRect(px + 2, py + TILE - h - 2, TILE - 4, h);
  ctx.fillStyle = color;
  ctx.fillRect(px + 2, py + TILE - h - 2, TILE - 4, Math.min(h, 3));
  ctx.fillStyle = 'rgba(255,255,200,0.6)';
  for (let i = 0; i < level; i++) {
    ctx.fillRect(px + 4, py + TILE - 4 - i * 4, 2, 2);
    ctx.fillRect(px + TILE - 6, py + TILE - 4 - i * 4, 2, 2);
  }
}

// ─── Minimap ───────────────────────────────────────────────────────
function renderMinimap() {
  const mw = minimap.width / GRID_W;
  const mh = minimap.height / GRID_H;
  mctx.fillStyle = '#0a0a0a';
  mctx.fillRect(0, 0, minimap.width, minimap.height);
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const data = TILE_DATA[state.grid[y][x].type];
      if (data && state.grid[y][x].type !== T.GRASS) {
        mctx.fillStyle = data.color;
        mctx.fillRect(x * mw, y * mh, mw + 0.5, mh + 0.5);
      }
    }
  }

  // Cars on minimap
  const allCars = { ...cars };
  if (myCar) allCars[getMyId()] = myCar;
  for (const car of Object.values(allCars)) {
    mctx.fillStyle = car.color || '#fff';
    const cx = (car.x / TILE) * mw;
    const cy = (car.y / TILE) * mh;
    mctx.fillRect(cx - 1, cy - 1, 3, 3);
  }

  // Viewport indicator
  const vx = -camX / zoom / TILE * mw;
  const vy = -(camY + getCanvasOffsetY()) / zoom / TILE * mh;
  const vw = canvas.width / zoom / TILE * mw;
  const vh = (canvas.height - getCanvasOffsetY() - TOOLBAR_H) / zoom / TILE * mh;
  mctx.strokeStyle = 'rgba(255,255,255,0.5)';
  mctx.lineWidth = 1;
  mctx.strokeRect(vx, vy, vw, vh);
}

minimap.addEventListener('pointerdown', e => {
  e.preventDefault();
  const rect = minimap.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width;
  const my = (e.clientY - rect.top) / rect.height;
  if (myCar && driving) {
    // Navigate car toward minimap target
    myCar.dir = Math.atan2(my * WORLD_H - myCar.y, mx * WORLD_W - myCar.x);
  } else {
    camX = canvas.width / 2 - mx * WORLD_W * zoom;
    camY = (canvas.height - TOOLBAR_H) / 2 + getCanvasOffsetY() - my * WORLD_H * zoom;
    clampCamera();
  }
});

// ─── Firebase Sync ─────────────────────────────────────────────────
let firebaseReady = false;
let saveTimer = null;
let cityRef = null;

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCity, 2000);
}

function serializeCity() {
  const tiles = [];
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const t = state.grid[y][x];
      tiles.push(t.type, t.level, t.data.signIdx != null ? t.data.signIdx : -1);
    }
  }
  return {
    tiles: tiles.join(','),
    money: Math.floor(state.money),
    pop: state.population,
    happiness: Math.round(state.happiness),
    tick: state.tick,
    updated: Date.now(),
    builder: FirebaseShared ? FirebaseShared.getVisitorName() : 'Unknown',
  };
}

function deserializeCity(data) {
  if (!data || !data.tiles) return false;
  const parts = data.tiles.split(',').map(Number);
  if (parts.length !== GRID_W * GRID_H * 3) return false;
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const idx = (y * GRID_W + x) * 3;
      state.grid[y][x] = {
        type: parts[idx],
        level: parts[idx + 1],
        data: parts[idx + 2] >= 0 ? { signIdx: parts[idx + 2] } : {},
      };
    }
  }
  if (typeof data.money === 'number') state.money = data.money;
  if (typeof data.happiness === 'number') state.happiness = data.happiness;
  state.tick = data.tick || 0;
  updateHUD();
  return true;
}

async function saveCity() {
  if (!firebaseReady || !cityRef) return;
  try { await cityRef.set(serializeCity()); } catch (e) { console.warn('Save failed:', e); }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem('xinfu_city');
    if (saved) {
      const data = JSON.parse(saved);
      if (deserializeCity(data)) { toast('City loaded from local storage'); return true; }
    }
  } catch (e) {}
  return false;
}

function saveToLocalStorage() {
  try { localStorage.setItem('xinfu_city', JSON.stringify(serializeCity())); } catch (e) {}
}

// ─── Init Firebase ─────────────────────────────────────────────────
async function initFirebase() {
  if (typeof FirebaseShared === 'undefined') {
    toast('Firebase not available — using local storage');
    loadFromLocalStorage();
    return;
  }

  try {
    await FirebaseShared.init('xinfu-city', { presenceId: 'presenceBadge' });
    const badge = document.getElementById('presenceBadge');
    badge.style.display = 'block';

    if (typeof firebase !== 'undefined' && firebase.database) {
      const db = firebase.database();
      cityRef = db.ref('xinfu-city/state');
      carRef = db.ref('xinfu-city/cars');

      cityRef.on('value', snap => {
        const data = snap.val();
        if (data) {
          if (deserializeCity(data)) { toast('City synced from cloud'); updateHUD(); }
        }
      });

      cityRef.once('value', snap => { if (!snap.val()) saveCity(); });

      // Listen for other players' cars
      listenForCars();

      firebaseReady = true;
      toast('Connected to Xin Fú Cloud!');
    }
  } catch (e) {
    console.warn('Firebase init failed:', e);
    toast('Using local storage (Firebase unavailable)');
    loadFromLocalStorage();
  }
}

// ─── Main Loop ─────────────────────────────────────────────────────
let lastEconomyTick = 0;
let lastFrame = 0;

function gameLoop(timestamp) {
  const now = Date.now();
  const dt = lastFrame ? timestamp - lastFrame : 16;
  lastFrame = timestamp;

  // Economy tick every 3 seconds
  if (now - lastEconomyTick > 3000) {
    economyTick();
    lastEconomyTick = now;
    saveToLocalStorage();
  }

  // Update car physics
  updateCar(dt);

  render();
  requestAnimationFrame(gameLoop);
}

// ─── Boot ─────────────────────────────────────────────────────────
initGrid();
centerCamera();
buildToolbar();
updateHUD();
requestAnimationFrame(gameLoop);

// Start Firebase after a brief delay
setTimeout(initFirebase, 500);

setTimeout(() => toast('👑 Welcome to Xin Fú SAR! Tap 🖐️ to switch build/pan mode.'), 800);
</script>
