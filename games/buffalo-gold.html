<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Buffalo Gold — LITF Games</title>
<style>
:root{--gold:#ffd700;--copper:#c87820;--dark:#0a0500;--brown:#5c3d1e;--sunset:#e8731a;--felt:#1a0800}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050200;font-family:'Georgia','Times New Roman',serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:white;overflow:hidden}
.game-container{width:100%;max-width:500px;padding:12px;background:linear-gradient(180deg,#1a0800,#0d0300);border:3px solid var(--copper);border-radius:16px;box-shadow:0 0 50px rgba(200,120,32,0.25),inset 0 0 40px rgba(0,0,0,0.6)}

.header{text-align:center;padding:15px 10px 8px;background:linear-gradient(90deg,transparent,rgba(200,120,32,0.12),transparent);margin:-12px -12px 0;border-radius:13px 13px 0 0}
.header h1{font-size:2.2em;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,0.5),0 2px 4px rgba(0,0,0,0.8);letter-spacing:4px;font-weight:700}
.header .subtitle{font-size:0.7em;color:var(--copper);margin-top:2px;letter-spacing:1px;font-family:system-ui,sans-serif}

.balance-bar{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.5);border:1px solid rgba(200,120,32,0.3);border-radius:10px;padding:10px 15px;margin:12px 0;font-size:0.9em;font-family:system-ui,sans-serif}
.balance-bar .balance{color:var(--gold);font-weight:700;font-size:1.1em}
.balance-bar .bet-ctl{display:flex;align-items:center;gap:8px}
.balance-bar button{background:rgba(200,120,32,0.15);border:1px solid rgba(200,120,32,0.4);color:var(--gold);border-radius:8px;width:34px;height:30px;font-size:1.1em;cursor:pointer;font-weight:700}
.balance-bar button:active{background:var(--gold);color:var(--dark)}
.balance-bar .bet-val{min-width:55px;text-align:center;font-weight:600;color:var(--gold)}

.freespins-banner{display:none;background:linear-gradient(90deg,var(--sunset),var(--gold),var(--sunset));color:var(--dark);text-align:center;padding:10px;font-weight:700;border-radius:10px;margin:8px 0;font-size:1.15em;letter-spacing:1px;box-shadow:0 0 20px rgba(255,215,0,0.4)}

.win-display{text-align:center;min-height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:8px 0}
.win-display .win-amount{font-size:2em;color:var(--gold);font-weight:700;display:none;text-shadow:0 0 15px rgba(255,215,0,0.5)}
.win-display .win-amount.show{display:block;animation:jackpotFlash 0.3s ease 4}
.win-display .win-label{font-size:0.8em;color:var(--copper);font-family:system-ui,sans-serif;letter-spacing:1px}

.reels-frame{background:linear-gradient(180deg,#2a1500,#1a0800,#2a1500);border:3px solid var(--copper);border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 0 40px rgba(200,120,32,0.2),inset 0 0 25px rgba(0,0,0,0.7);position:relative}
.reels-frame::before{content:'🦬';position:absolute;left:-1px;top:50%;transform:translateY(-50%);font-size:1.4em;opacity:0.25;filter:grayscale(0.5)}
.reels-frame::after{content:'🦬';position:absolute;right:-1px;top:50%;transform:translateY(-50%);font-size:1.4em;opacity:0.25;filter:grayscale(0.5)}

.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.reel{display:flex;flex-direction:column;gap:4px}
.cell{background:linear-gradient(180deg,#2a1a0a,#150800);border:2px solid rgba(200,120,32,0.35);border-radius:8px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2.2em;position:relative;transition:all 0.3s;box-shadow:inset 0 1px 0 rgba(255,215,0,0.08),0 2px 4px rgba(0,0,0,0.5)}
.cell.winning{animation:cellWin 0.5s ease infinite alternate;border-color:var(--gold);box-shadow:0 0 20px rgba(255,215,0,0.7),inset 0 1px 0 rgba(255,215,0,0.15)}
.cell.buffalo{color:#8B4513;text-shadow:0 0 10px rgba(200,120,32,0.4)}
.cell.gold-buffalo{color:var(--gold);text-shadow:0 0 15px rgba(255,215,0,0.8);animation:goldGlow 1s ease infinite alternate}
.cell.sunset{color:var(--sunset);text-shadow:0 0 10px rgba(232,115,26,0.5)}
.cell.spin{animation:slotSpin 0.08s linear infinite}

@keyframes cellWin{0%{transform:scale(1);background:linear-gradient(180deg,#2a1a0a,#150800)}100%{transform:scale(1.1);background:linear-gradient(180deg,#3a2a1a,#2a1a0a);box-shadow:0 0 25px rgba(255,215,0,0.8)}}
@keyframes goldGlow{0%{filter:brightness(1)}100%{filter:brightness(1.4)}}
@keyframes slotSpin{0%{transform:translateY(0)}50%{transform:translateY(-5px)}100%{transform:translateY(5px)}}
@keyframes jackpotFlash{0%,100%{opacity:1}50%{opacity:0.2}}

.controls{display:flex;gap:10px;margin-top:12px}
.spin-btn{padding:16px;border:none;border-radius:12px;font-size:1.15em;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:2px;transition:all 0.15s;font-family:system-ui,sans-serif}
.spin-btn:active{transform:scale(0.96)}
.spin-btn.main{flex:1;background:linear-gradient(180deg,#ffd700,#c87820,#a06010);color:#1a0800;box-shadow:0 4px 25px rgba(200,120,32,0.5);text-shadow:0 1px 0 rgba(255,255,255,0.2)}
.spin-btn.main:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.spin-btn.max{flex:0.35;background:linear-gradient(180deg,#e8731a,#b05010);color:white;box-shadow:0 4px 15px rgba(232,115,26,0.3);text-shadow:0 1px 2px rgba(0,0,0,0.5)}

.paytable{margin-top:15px;background:rgba(0,0,0,0.4);border:1px solid rgba(200,120,32,0.2);border-radius:10px;padding:12px;font-size:0.7em;font-family:system-ui,sans-serif;opacity:0.75}
.paytable h3{color:var(--gold);margin-bottom:6px;font-size:1em;font-family:'Georgia',serif;letter-spacing:1px}
.paytable table{width:100%;border-collapse:collapse}
.paytable td{padding:3px 8px;border-bottom:1px solid rgba(200,120,32,0.15)}
.paytable td:first-child{text-align:left}
.paytable td:last-child{text-align:right;color:var(--gold)}

.commentary{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(26,8,0,0.97),rgba(10,5,0,0.97));color:var(--gold);padding:12px 15px;font-size:0.85em;display:none;z-index:100;border-top:2px solid var(--copper);font-family:system-ui,sans-serif}
.commentary .avatar{display:inline-block;background:linear-gradient(180deg,var(--gold),var(--copper));color:var(--dark);border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-size:0.7em;margin-right:10px;font-weight:700;box-shadow:0 0 10px rgba(255,215,0,0.3)}
</style>
</head>
<body>

<div class="game-container">
<div class="header">
<h1>🦬 BUFFALO GOLD</h1>
<div class="subtitle">🎙️ with Mark commentary</div>
</div>

<div class="balance-bar">
<div>Balance: <span class="balance" id="balance">$1,000</span></div>
<div class="bet-ctl">
<button onclick="changeBet(-10)">−</button>
<div class="bet-val">Bet: $<span id="bet">10</span></div>
<button onclick="changeBet(10)">+</button>
</div>
</div>

<div class="freespins-banner" id="freeBanner">🎰 FREE SPINS: <span id="freeCount">0</span> 🎰</div>

<div class="win-display">
<div class="win-label" id="winLabel"></div>
<div class="win-amount" id="winAmount">$0</div>
</div>

<div class="reels-frame">
<div class="reels" id="reels"></div>
</div>

<div class="controls">
<button class="spin-btn max" onclick="maxBet()">MAX</button>
<button class="spin-btn main" id="spinBtn" onclick="spin()">🎰 SPIN</button>
</div>

<div class="paytable">
<h3>🦬 Paytable</h3>
<table>
<tr><td>🦬 Buffalo x5</td><td>500x</td></tr>
<tr><td>🦬 Buffalo x4</td><td>100x</td></tr>
<tr><td>🦬 Buffalo x3</td><td>50x</td></tr>
<tr><td>🦅 Eagle x5</td><td>150x</td></tr>
<tr><td>🐺 Wolf x5</td><td>120x</td></tr>
<tr><td>🦌 Elk x5</td><td>100x</td></tr>
<tr><td>🌅 Sunset (Wild)</td><td>Subs + 2x</td></tr>
<tr><td>💰 Gold x3+</td><td>8 Free Spins</td></tr>
</table>
</div>
</div>

<div class="commentary" id="commentary">
<span class="avatar">M</span>
<span id="commentaryText"></span>
</div>

<script>
const SYMBOLS=['🦬','🦅','🐺','🦌','🌅','💰','A','K','Q','J'];
const WEIGHTS=[25,15,12,12,5,4,8,7,6,6];
const COLS=5,ROWS=3;
let balance=1000,bet=10,spinning=false,freeSpins=0;

const audioBase='audio/buffalo/';
const voiceLines={
  jackpot:'buffalo-jackpot.mp3',bigWin:'buffalo-big-win.mp3',win:'buffalo-win.mp3',
  spin:'buffalo-spin.mp3',lose:'buffalo-lose.mp3',intro:'buffalo-intro.mp3',
  bonus:'buffalo-bonus.mp3',fiveBuffalo:'buffalo-five-buffalo.mp3',multiplier:'buffalo-multiplier.mp3'
};

function playVoice(n){const f=voiceLines[n];if(!f)return;const a=new Audio(audioBase+f);a.volume=0.8;a.play().catch(()=>{});}
function showCommentary(t,d=4000){const el=document.getElementById('commentary');document.getElementById('commentaryText').textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',d);}
function weightedRandom(){const t=WEIGHTS.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<SYMBOLS.length;i++){r-=WEIGHTS[i];if(r<=0)return i;}return 0;}

function initReels(){
  const reels=document.getElementById('reels');reels.innerHTML='';
  for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='reel';
    for(let r=0;r<ROWS;r++){const cell=document.createElement('div');cell.className='cell';cell.id=`c${c}r${r}`;
      const idx=weightedRandom();cell.textContent=SYMBOLS[idx];applyClass(cell,idx);col.appendChild(cell);}
    reels.appendChild(col);}
}

function applyClass(cell,idx){
  cell.className='cell';
  if(idx===0)cell.classList.add('buffalo');
  if(idx===5)cell.classList.add('gold-buffalo');
  if(idx===4)cell.classList.add('sunset');
}

function getCell(c,r){return document.getElementById(`c${c}r${r}`);}
function changeBet(d){bet=Math.max(10,Math.min(100,bet+d));document.getElementById('bet').textContent=bet;}
function maxBet(){bet=100;document.getElementById('bet').textContent=bet;}
function updateBalance(){document.getElementById('balance').textContent='$'+balance.toLocaleString();}
function showWin(amount,label='WIN'){
  const el=document.getElementById('winAmount');el.textContent='$'+amount.toLocaleString();
  el.className='win-amount show';document.getElementById('winLabel').textContent=label;
  setTimeout(()=>el.className='win-amount',3000);
}

function getPayout(idx,count){
  const p={0:{3:50,4:100,5:500},1:{3:30,4:60,5:150},2:{3:25,4:50,5:120},3:{3:20,4:40,5:100},6:{3:10,4:20,5:50},7:{3:8,4:15,5:40},8:{3:5,4:10,5:30},9:{3:5,4:10,5:25}};
  return (p[idx]||{})[count]||0;
}

async function spin(){
  if(spinning)return;
  if(balance<bet&&freeSpins<=0){showCommentary("Out of cash! The buffalo waits for no one.");return;}
  spinning=true;document.getElementById('spinBtn').disabled=true;
  const isFree=freeSpins>0;
  if(isFree){freeSpins--;document.getElementById('freeCount').textContent=freeSpins;}
  else{balance-=bet;updateBalance();}

  const results=[];
  for(let c=0;c<COLS;c++){results[c]=[];
    for(let r=0;r<ROWS;r++){
      if(Math.random()<0.18)results[c][r]=0;
      else if(Math.random()<0.03)results[c][r]=5;
      else results[c][r]=weightedRandom();
    }
  }

  playVoice('spin');
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    const cell=getCell(c,r);cell.classList.add('spin');cell.textContent=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
  }

  for(let c=0;c<COLS;c++){
    await new Promise(res=>setTimeout(res,250));
    for(let r=0;r<ROWS;r++){const cell=getCell(c,r);cell.classList.remove('spin');const idx=results[c][r];cell.textContent=SYMBOLS[idx];applyClass(cell,idx);}
  }

  let totalWin=0,buffaloCount=0,scatterCount=0,hasSunset=false;
  const allCells=[];
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    const idx=results[c][r];if(idx===0)buffaloCount++;if(idx===5)scatterCount++;if(idx===4)hasSunset=true;allCells.push({c,r,idx});
  }

  const winCells=new Set();
  for(let r=0;r<ROWS;r++){let sym=results[0][r],count=1;
    for(let c=1;c<COLS;c++){if(results[c][r]===sym||results[c][r]===4){count++;}else break;}
    if(count>=3){for(let c=0;c<count;c++)winCells.add(`c${c}r${r}`);totalWin+=getPayout(sym,count);}
  }

  if(buffaloCount>=3){const bonus=[0,0,0,25,100,500][Math.min(buffaloCount,5)];totalWin+=bonus*bet;allCells.filter(c=>c.idx===0).forEach(c=>winCells.add(`c${c.r}r${c.c}`));}
  if(hasSunset&&totalWin>0)totalWin*=2;
  if(scatterCount>=3){freeSpins+=8;document.getElementById('freeBanner').style.display='block';document.getElementById('freeCount').textContent=freeSpins;playVoice('bonus');showCommentary("FREE SPINS! 8 bonus spins! Gold buffaloes upgrade your symbols!",5000);}

  winCells.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('winning');});

  if(totalWin>0){balance+=totalWin;updateBalance();
    if(buffaloCount>=5){showWin(totalWin,'🎰 JACKPOT!!! 🎰');playVoice('jackpot');showCommentary("ALL BUFFALO! BUFFALOOOO! This is the DREAM!",5000);}
    else if(totalWin>=bet*50){showWin(totalWin,'🔥 BIG WIN! 🔥');playVoice('bigWin');showCommentary("Big win! The buffalo stampede is REAL!",4000);}
    else if(buffaloCount>=4){showWin(totalWin,'🦬 FOUR BUFFALO!');playVoice('fiveBuffalo');}
    else{showWin(totalWin);playVoice('win');}
  }else{document.getElementById('winAmount').className='win-amount';document.getElementById('winLabel').textContent='';if(Math.random()<0.3)playVoice('lose');}

  setTimeout(()=>document.querySelectorAll('.cell.winning').forEach(c=>c.classList.remove('winning')),2000);
  if(freeSpins<=0)document.getElementById('freeBanner').style.display='none';
  spinning=false;document.getElementById('spinBtn').disabled=false;
}

initReels();
setTimeout(()=>{playVoice('intro');showCommentary("Welcome to Buffalo Gold! Line up buffaloes for massive payouts. Let's ride.",5000);},1000);
</script>
</body>
</html>
