          var cd = Math.max(1, Math.floor(player.atk * 0.3));
          ce.hp -= cd; addFloat(ce.x, ce.y, '-' + cd + '⚡', '#ffff44');
          if (ce.hp <= 0) killEnemy(ce);
          break;
        }
      }
    }
  } else if (elem === 'Slow') {
    bonusDmg = 1;
    if (Math.random() < 0.2) { en.slowed = Math.max(en.slowed || 0, 2); addFloat(en.x, en.y, '🐌', '#6688ff'); }
  } else if (elem === 'Heal') {
    // Lifesteal 15%
    var steal = Math.max(1, Math.floor(dmgDealt * 0.15));
    player.hp = Math.min(player.hp + steal, player.maxHp);
    addFloat(player.x, player.y, '+' + steal, '#ffcc44');
  } else if (elem === 'Summon') {
    // On kill: handled in killEnemy, here just track
  } else if (elem === 'Teleport') {
    if (Math.random() < 0.1) {
      var rx, ry, found = false;
      for (var tries = 0; tries < 20; tries++) {
        rx = Math.floor(Math.random() * MW); ry = Math.floor(Math.random() * MH);
        if (map[ry][rx] === T_FLOOR && !enemyAt(rx, ry) && !(rx === player.x && ry === player.y)) { found = true; break; }
      }
      if (found) { en.x = rx; en.y = ry; addFloat(rx, ry, '✨ Teleport!', '#88ccff'); }
    }
  } else if (elem === 'Dig') {
    // Knockback 1 tile, +3 if into wall
    var kbx = en.x + (en.x - player.x), kby = en.y + (en.y - player.y);
    if (kbx >= 0 && kbx < MW && kby >= 0 && kby < MH) {
      if (map[kby][kbx] !== T_WALL && !enemyAt(kbx, kby)) {
        en.x = kbx; en.y = kby;
        addFloat(kbx, kby, 'Knockback!', '#aa8855');
      } else if (map[kby][kbx] === T_WALL) {
        en.hp -= 3; addFloat(en.x, en.y, 'SLAM -3!', '#aa8855');
        if (en.hp <= 0) killEnemy(en);
      }
    }
  }
  if (bonusDmg > 0 && en.hp > 0) {
    en.hp -= bonusDmg;
    addFloat(en.x, en.y, '+' + bonusDmg + ' elem', elemColor);
    if (en.hp <= 0) killEnemy(en);
  }
}
// Rogue summon-on-kill: 20% chance to spawn ally from corpse
function rogueElementalKill(ex, ey) {
  var elem = getActiveElement();
  if (elem === 'Summon' && Math.random() < 0.2) {
    if (map[ey][ex] !== T_WALL && !enemyAt(ex, ey)) {
      createSummon(ex, ey);
    }
  }
}

function playerDie() {
  player.hp = 0;
  state = ST_DEAD; bgmGameOver();
  sndDeath();
  deleteSave(); // permadeath
  if (player.floor > bestFloor) {
    bestFloor = player.floor;
    try { localStorage.setItem('dc_best', bestFloor); } catch(e){}
  }
}

function showMsg(text) { msgText = text; msgTimer = 120; }

function startGame(cls) {
  initAudio();
  playerClass = cls;
  var rb = getRankBonuses();
  var baseHp = 20 + rb.hpBonus;
  if (cls.name === 'Warrior') baseHp += 3;
  player = {
    x: 5, y: 5, hp: baseHp, maxHp: baseHp,
    atk: cls.baseAtk + rb.atkBonus,
    def: cls.baseDef + rb.defBonus,
    floor: 1, kills: 0, steps: 0, gold: 0, xp: 0, level: 1,
    sightBonus: cls.sightBonus + rb.sightBonus,
    healMult: rb.healMult,
    critChance: cls.critChance,
    facing: {x:0, y:-1}
  };
  wands = [];
  activeWandIdx = 0;
  enterDownTime = 0;
  if (enterTimer) { clearTimeout(enterTimer); enterTimer = null; }
  hadWish = false;
  rankAtRunStart = getRankIdx();
  floats = []; flashes = [];
  projectiles = []; legendFlashes = [];
  familiar = null; summons = [];
  abilityCooldowns = {}; manaShieldHP = 0; smokeInvisible = 0; spiritBuffs = [];
  runStats = { dmgDealt: 0, dmgTaken: 0, healed: 0, wandZaps: 0, crits: 0, goldSpent: 0, stepsWalked: 0, killsByType: {}, maxHitDealt: 0, maxHitTaken: 0, floorsCleared: 0, shrinesActivated: 0, chestsOpened: 0, minibossesKilled: 0, barrelsSmashed: 0, scrollsRead: 0 };
  lastHitSource = '';
  seenEnemyTypes = {};
  classRangedCooldown = 0;
  turnCount = 0;
  genMap(1);
  // Wizard starts with a random wand
  if (cls.name === 'Wizard') {
    var wt = WAND_TYPES[Math.floor(Math.random() * WAND_TYPES.length)];
    addWand(wt.name, wt.charges);
    familiar = { x: player.x, y: player.y, cooldown: 0 };
    showMsg('Your familiar joins you. Wand of ' + wt.name + '.');
  } else {
    showMsg('You descend into the dungeon.');
  }
  reveal(player.x, player.y);
  state = ST_PLAY;
  saveGame();
}

// ─── Drawing ────────────────────────────────────────────────────
function draw() {
  animT += 0.016;
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, W, H);
  if (state === ST_TITLE) drawTitle();
  else if (state === ST_CLASS) drawClassSelect();
  else if (state === ST_DEAD) { drawGame(); drawDeath(); }
  else if (state === ST_WISH) { drawGame(); drawWish(); }
  else if (state === ST_SHOP) { drawGame(); drawShop(); }
  else if (state === ST_WAND_SEL) { drawGame(); drawWandSelect(); }
  else if (state === ST_PAUSE) { drawGame(); drawPauseStats(); }
  else { drawGame(); if (showMinimap) drawMinimap(); }
  if (msgTimer > 0) { msgTimer--; drawMsg(); }
  requestAnimationFrame(draw);
}

function drawTitle() {
  ctx.fillStyle = '#111';
  for (var y = 0; y < 15; y++) for (var x = 0; x < 15; x++) {
    var n = Math.sin(x * 3.7 + y * 2.3 + animT * 0.5) * 0.5 + 0.5;
    if (n > 0.6) { ctx.globalAlpha = 0.15; ctx.fillRect(x * 40, y * 40, 40, 40); }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 48px -apple-system, sans-serif'; ctx.fillStyle = '#ff8844';
  ctx.fillText('⚔ DUNGEON', W / 2, 160);
  ctx.font = '900 40px -apple-system, sans-serif'; ctx.fillStyle = '#cc6633';
  ctx.fillText('CRAWL', W / 2, 210);
  ctx.font = '16px -apple-system, sans-serif'; ctx.fillStyle = '#888';
  ctx.fillText('A tiny roguelike for your glasses', W / 2, 250);

  // Rank
  var ri = getRankIdx(); var rank = RANKS[ri];
  ctx.font = '600 20px -apple-system, sans-serif'; ctx.fillStyle = '#ff8844';
  ctx.fillText(rank.name, W / 2, 290);
  if (ri < RANKS.length - 1) {
    var next = RANKS[ri + 1];
    var prog = (totalKills - rank.threshold) / (next.threshold - rank.threshold);
    var barW = 200, barH = 8, barX = (W - barW) / 2, barY = 308;
    ctx.fillStyle = '#222'; ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#ff8844'; ctx.fillRect(barX, barY, barW * Math.min(1, prog), barH);
    ctx.font = '12px -apple-system, sans-serif'; ctx.fillStyle = '#888';
    ctx.fillText(totalKills + '/' + next.threshold + ' kills → ' + next.name, W / 2, 332);
  } else {
    ctx.font = '12px -apple-system, sans-serif'; ctx.fillStyle = '#ffcc44';
    ctx.fillText('★ MAX RANK ★  ' + totalKills + ' total kills', W / 2, 320);
  }

  if (bestFloor > 0) {
    ctx.font = '14px -apple-system, sans-serif'; ctx.fillStyle = '#ffcc44';
    ctx.fillText('Best: Floor ' + bestFloor, W / 2, 370);
  }

  // Continue / New Game options
  var hasSv = hasSave();
  if (hasSv) {
    var opts = ['Continue', 'New Game'];
    for (var i = 0; i < 2; i++) {
      var sel = (titleSel === i);
      ctx.font = sel ? '600 22px -apple-system, sans-serif' : '18px -apple-system, sans-serif';
      ctx.fillStyle = sel ? '#4a9eff' : '#666';
      var pulse = sel ? (Math.sin(animT * 3) * 0.3 + 0.7) : 0.6;
      ctx.globalAlpha = pulse;
      ctx.fillText((sel ? '▸ ' : '  ') + opts[i], W / 2, 430 + i * 36);
    }
    ctx.globalAlpha = 1;
    ctx.font = '12px -apple-system, sans-serif'; ctx.fillStyle = '#555';
    ctx.fillText('↑↓ select  ·  Enter to confirm', W / 2, 520);
  } else {
    var pulse = Math.sin(animT * 3) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.font = '600 22px -apple-system, sans-serif'; ctx.fillStyle = '#4a9eff';
    ctx.fillText('Enter to Start', W / 2, 450);
    ctx.globalAlpha = 1;
  }
}

function drawClassSelect() {
  ctx.fillStyle = '#111';
  for (var y = 0; y < 15; y++) for (var x = 0; x < 15; x++) {
    var n = Math.sin(x * 3.7 + y * 2.3 + animT * 0.5) * 0.5 + 0.5;
    if (n > 0.6) { ctx.globalAlpha = 0.15; ctx.fillRect(x * 40, y * 40, 40, 40); }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 28px -apple-system, sans-serif'; ctx.fillStyle = '#ff8844';
  ctx.fillText('Choose Your Class', W / 2, 100);

  for (var i = 0; i < CLASSES.length; i++) {
    var cls = CLASSES[i];
    var sel = (classSel === i);
    var yy = 200 + i * 100;
    // Highlight box
    if (sel) {
      ctx.fillStyle = 'rgba(74,158,255,0.08)';
      ctx.fillRect(80, yy - 30, W - 160, 70);
      ctx.strokeStyle = '#4a9eff';
      ctx.lineWidth = 2;
      ctx.strokeRect(80, yy - 30, W - 160, 70);
    }
    ctx.font = sel ? '900 24px -apple-system, sans-serif' : '600 22px -apple-system, sans-serif';
    ctx.fillStyle = sel ? cls.color : '#888';
    ctx.fillText(cls.name, W / 2, yy);
    ctx.font = '14px -apple-system, sans-serif';
    ctx.fillStyle = sel ? '#ccc' : '#555';
    ctx.fillText(cls.desc, W / 2, yy + 22);
  }

  ctx.font = '12px -apple-system, sans-serif'; ctx.fillStyle = '#555';
  ctx.fillText('↑↓ select  ·  Enter to confirm', W / 2, 540);
}

function drawGame() {
  var sightRange = 5 + (player.sightBonus || 0);
  camX = player.x - Math.floor(VISIBLE / 2);
  camY = player.y - Math.floor(VISIBLE / 2);
  if (camX < 0) camX = 0; if (camY < 0) camY = 0;
  if (camX > MW - VISIBLE) camX = MW - VISIBLE;
  if (camY > MH - VISIBLE) camY = MH - VISIBLE;

  // Map tiles
  for (var sy = 0; sy < VISIBLE; sy++) for (var sx = 0; sx < VISIBLE; sx++) {
    var tx = camX + sx, ty = camY + sy;
    var px = sx * TILE, py = sy * TILE;
    if (tx >= MW || ty >= MH || !explored[ty][tx]) {
      ctx.fillStyle = '#0a0a0a'; ctx.fillRect(px, py, TILE, TILE); continue;
    }
    var tile = map[ty][tx];
    var inSight = Math.abs(tx - player.x) + Math.abs(ty - player.y) <= sightRange;
    ctx.globalAlpha = inSight ? 1 : 0.35;
    if (tile === T_WALL) {
      ctx.fillStyle = '#222'; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#2a2a2a'; ctx.fillRect(px + 1, py + 1, TILE - 2, 2);
    } else if (tile === T_FLOOR) {
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(px, py, TILE, TILE);
      if ((tx + ty) % 3 === 0) { ctx.fillStyle = '#1e1e1e'; ctx.fillRect(px + 8, py + 8, 4, 4); }
    } else if (tile === T_STAIRS) {
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(px, py, TILE, TILE);
      ctx.font = '600 24px -apple-system, sans-serif'; ctx.fillStyle = '#44ff88';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var stairPulse = Math.sin(animT * 4) * 0.2 + 0.8;
      ctx.globalAlpha = (inSight ? 1 : 0.35) * stairPulse;
      ctx.fillText('▼', px + TILE / 2, py + TILE / 2);
    }
    ctx.globalAlpha = 1;
  }

  // Items
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (!explored[it.y][it.x]) continue;
    var sx2 = (it.x - camX) * TILE, sy2 = (it.y - camY) * TILE;
    if (sx2 < -TILE || sx2 > W || sy2 < -TILE || sy2 > H) continue;
    var inSight = Math.abs(it.x - player.x) + Math.abs(it.y - player.y) <= sightRange;
    ctx.globalAlpha = inSight ? 1 : 0.4;
    ctx.font = '600 20px -apple-system, sans-serif'; ctx.fillStyle = it.color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var bob = Math.sin(animT * 3 + it.x * 2 + it.y * 3) * 3;
    ctx.fillText(it.ch, sx2 + TILE / 2, sy2 + TILE / 2 + bob);
    ctx.globalAlpha = 1;
  }

  // Shopkeeper
  if (shopkeeper && explored[shopkeeper.y] && explored[shopkeeper.y][shopkeeper.x]) {
    var sksx = (shopkeeper.x - camX) * TILE, sksy = (shopkeeper.y - camY) * TILE;
    if (sksx >= -TILE && sksx < W && sksy >= -TILE && sksy < H) {
      var skInSight = Math.abs(shopkeeper.x - player.x) + Math.abs(shopkeeper.y - player.y) <= sightRange;
      ctx.globalAlpha = skInSight ? 1 : 0.4;
      ctx.font = '900 26px -apple-system, sans-serif'; ctx.fillStyle = '#44ff44';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('S', sksx + TILE / 2, sksy + TILE / 2);
      // Label
      if (skInSight && Math.abs(shopkeeper.x - player.x) + Math.abs(shopkeeper.y - player.y) <= 3) {
        ctx.font = '10px -apple-system, sans-serif'; ctx.fillStyle = '#44ff44';
        ctx.fillText('SHOP', sksx + TILE / 2, sksy - 4);
      }
      ctx.globalAlpha = 1;
    }
  }

  // Enemies
  for (var i = 0; i < enemies.length; i++) {
    var en = enemies[i];
    if (!explored[en.y][en.x]) continue;
    var inSight = Math.abs(en.x - player.x) + Math.abs(en.y - player.y) <= sightRange;
    if (!inSight) continue;
    var esx = (en.x - camX) * TILE, esy = (en.y - camY) * TILE;
    if (esx < -TILE || esx > W || esy < -TILE || esy > H) continue;
    // Frozen tint
    if (en.frozen > 0) {
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#aaddff';
      ctx.fillRect(esx + 4, esy + 4, TILE - 8, TILE - 8);
      ctx.globalAlpha = 1;
    }
    // Poisoned tint
    if (en.poisoned > 0) {
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#44cc44';
      ctx.fillRect(esx + 4, esy + 4, TILE - 8, TILE - 8);
      ctx.globalAlpha = 1;
    }
    // Slowed tint
    if (en.slowed > 0) {
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = '#6688ff';
      ctx.fillRect(esx + 4, esy + 4, TILE - 8, TILE - 8);
      ctx.globalAlpha = 1;
    }
    // Power aura: green (easy), yellow (fair), red (dangerous), boss = bright red pulse
    var eLvl = en.level || player.floor;
    var lvlDiff = eLvl - player.level;
    if (en.isBoss) {
      var bossPulse = 0.4 + Math.sin(animT * 5) * 0.3;
      ctx.globalAlpha = bossPulse;
      ctx.fillStyle = 'rgba(255,0,0,0.4)';
      ctx.beginPath(); ctx.arc(esx + TILE / 2, esy + TILE / 2, 24, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ff2222'; ctx.lineWidth = 2;
      ctx.globalAlpha = 0.3 + Math.sin(animT * 6) * 0.2;
      ctx.beginPath(); ctx.arc(esx + TILE / 2, esy + TILE / 2, 26 + Math.sin(animT * 3) * 3, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      var auraColor = lvlDiff >= 2 ? 'rgba(255,50,50,0.25)' : lvlDiff <= -2 ? 'rgba(50,255,50,0.2)' : 'rgba(255,255,50,0.15)';
      var auraPulse = 0.6 + Math.sin(animT * 3 + en.x * 2 + en.y) * 0.4;
      ctx.globalAlpha = auraPulse * (lvlDiff >= 2 ? 0.35 : lvlDiff <= -2 ? 0.2 : 0.15);
      ctx.fillStyle = auraColor;
      ctx.beginPath(); ctx.arc(esx + TILE / 2, esy + TILE / 2, 18, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.font = '900 26px -apple-system, sans-serif'; ctx.fillStyle = en.color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(en.ch, esx + TILE / 2, esy + TILE / 2);
    // Level number (small, top-right corner of tile)
    ctx.font = '600 10px -apple-system, sans-serif';
    ctx.fillStyle = lvlDiff >= 2 ? '#ff4444' : lvlDiff <= -2 ? '#44cc44' : '#cccc44';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('L' + eLvl, esx + TILE - 2, esy + 2);
    // HP bar
    var hpPct = en.hp / en.maxHp;
    var barW = 30, barH = 4, barX = esx + (TILE - barW) / 2, barY = esy + 2;
    ctx.fillStyle = '#333'; ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = hpPct > 0.5 ? '#44cc44' : hpPct > 0.25 ? '#cccc44' : '#cc4444';
    ctx.fillRect(barX, barY, barW * hpPct, barH);
  }

  // Summons
  for (var si = 0; si < summons.length; si++) {
    var s = summons[si];
    var ssx = (s.x - camX) * TILE, ssy = (s.y - camY) * TILE;
    if (ssx < -TILE || ssx > W || ssy < -TILE || ssy > H) continue;
    var sInSight = Math.abs(s.x - player.x) + Math.abs(s.y - player.y) <= sightRange;
    if (!sInSight) continue;
    var sTypeInfo = SUMMON_TYPES[s.sType || 'Warrior'];
    ctx.font = '18px -apple-system, sans-serif'; ctx.fillStyle = sTypeInfo.color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(sTypeInfo.ch, ssx + TILE / 2, ssy + TILE / 2);
    // HP bar
    var shpPct = s.hp / s.maxHp;
    ctx.fillStyle = '#333'; ctx.fillRect(ssx + 5, ssy + 2, 30, 3);
    ctx.fillStyle = sTypeInfo.color; ctx.fillRect(ssx + 5, ssy + 2, 30 * shpPct, 3);
  }
  // Spirit buffs
  for (var bi = 0; bi < spiritBuffs.length; bi++) {
    var b = spiritBuffs[bi];
    var bsx = (b.x - camX) * TILE, bsy = (b.y - camY) * TILE;
    if (bsx < -TILE || bsx > W || bsy < -TILE || bsy > H) continue;
    var bInSight = Math.abs(b.x - player.x) + Math.abs(b.y - player.y) <= sightRange;
    if (!bInSight) continue;
    var bPulse = Math.sin(animT * 5) * 0.3 + 0.7;
    ctx.globalAlpha = bPulse;
    ctx.font = '14px -apple-system, sans-serif'; ctx.fillStyle = '#88ccff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('👻', bsx + TILE / 2, bsy + TILE / 2);
    ctx.globalAlpha = 1;
  }

  // Familiar
  if (familiar) {
    var fsx = (familiar.x - camX) * TILE, fsy = (familiar.y - camY) * TILE;
    if (fsx >= -TILE && fsx <= W && fsy >= -TILE && fsy <= H) {
      var fInSight = Math.abs(familiar.x - player.x) + Math.abs(familiar.y - player.y) <= sightRange;
      if (fInSight) {
        var fBob = Math.sin(animT * 4) * 3;
        ctx.globalAlpha = 0.7 + Math.sin(animT * 3) * 0.15;
        ctx.font = '600 18px -apple-system, sans-serif'; ctx.fillStyle = '#aa88ff';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('f', fsx + TILE / 2, fsy + TILE / 2 + fBob);
        ctx.globalAlpha = 1;
      }
    }
  }

  // Projectiles
  for (var pi = 0; pi < projectiles.length; pi++) {
    var p = projectiles[pi];
    var psx = (p.x - camX) * TILE, psy = (p.y - camY) * TILE;
    if (psx < -TILE || psx > W || psy < -TILE || psy > H) continue;
    ctx.font = '900 18px -apple-system, sans-serif'; ctx.fillStyle = p.color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.ch, psx + TILE / 2, psy + TILE / 2);
  }

  // Player
  var ppx = (player.x - camX) * TILE, ppy = (player.y - camY) * TILE;
  // Wizard elemental shield aura
  var shieldType = getActiveShieldType();
  if (shieldType) {
    var sc = SHIELD_COLORS[shieldType] || '#aa88ff';
    var shieldPulse = 0.15 + Math.sin(animT * 4) * 0.08;
    ctx.globalAlpha = shieldPulse;
    ctx.fillStyle = sc;
    ctx.beginPath(); ctx.arc(ppx + TILE / 2, ppy + TILE / 2, 24, 0, Math.PI * 2); ctx.fill();
    // Outer ring
    ctx.strokeStyle = sc;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.3 + Math.sin(animT * 6) * 0.15;
    ctx.beginPath(); ctx.arc(ppx + TILE / 2, ppy + TILE / 2, 26 + Math.sin(animT * 3) * 2, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Rogue elemental glow
  var rogueElem = getActiveElement();
  if (rogueElem) {
    var rc = SHIELD_COLORS[rogueElem] || '#44ff88';
    ctx.globalAlpha = 0.08 + Math.sin(animT * 3) * 0.04;
    ctx.fillStyle = rc;
    ctx.beginPath(); ctx.arc(ppx + TILE / 2, ppy + TILE / 2, 20, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = 0.15 + Math.sin(animT * 2) * 0.05;
  ctx.fillStyle = playerClass ? playerClass.color : '#4a9eff';
  ctx.beginPath(); ctx.arc(ppx + TILE / 2, ppy + TILE / 2, 22, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.font = '900 28px -apple-system, sans-serif';
  ctx.fillStyle = playerClass ? playerClass.color : '#4a9eff';
  // Smoke bomb invisibility visual
  if (smokeInvisible > 0) { ctx.globalAlpha = 0.3 + Math.sin(animT * 6) * 0.15; ctx.fillStyle = '#888888'; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('@', ppx + TILE / 2, ppy + TILE / 2);
  if (smokeInvisible > 0) ctx.globalAlpha = 1;
  // Mana shield visual indicator
  if (manaShieldHP > 0) {
    ctx.strokeStyle = '#88ccff'; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6 + Math.sin(animT * 3) * 0.2;
    ctx.beginPath(); ctx.arc(ppx + TILE / 2, ppy + TILE / 2, 18, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Tile flashes
  for (var fi = flashes.length - 1; fi >= 0; fi--) {
    var fl = flashes[fi];
    var fsx = (fl.tx - camX) * TILE, fsy = (fl.ty - camY) * TILE;
    if (fsx >= 0 && fsx < W && fsy >= 0 && fsy < H) {
      ctx.globalAlpha = fl.life / 12; ctx.fillStyle = fl.color;
      ctx.fillRect(fsx, fsy, TILE, TILE); ctx.globalAlpha = 1;
    }
    fl.life--; if (fl.life <= 0) flashes.splice(fi, 1);
  }

  // Floating text
  for (var fti = floats.length - 1; fti >= 0; fti--) {
    var ft = floats[fti];
    var ftx = (ft.x - camX) * TILE + TILE / 2;
    var progress = 1 - ft.life / ft.maxLife;
    var fty = (ft.y - camY) * TILE - progress * 30;
    if (ftx >= 0 && ftx < W && fty >= -20 && fty < H) {
      ctx.globalAlpha = ft.life / ft.maxLife;
      ctx.font = '900 16px -apple-system, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000'; ctx.fillText(ft.text, ftx + 1, fty + 1);
      ctx.fillStyle = ft.color; ctx.fillText(ft.text, ftx, fty);
      ctx.globalAlpha = 1;
    }
    ft.life--; if (ft.life <= 0) floats.splice(fti, 1);
  }

  // Enemy legend flashes
  for (var li = legendFlashes.length - 1; li >= 0; li--) {
    var lf = legendFlashes[li];
    var lsx = (lf.x - camX) * TILE + TILE / 2;
    var lsy = (lf.y - camY) * TILE - 16;
    if (lsx >= 0 && lsx < W && lsy >= -30 && lsy < H) {
      var lAlpha = Math.min(1, lf.timer / 30);
      ctx.globalAlpha = lAlpha;
      // Background
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      var labelW = ctx.measureText(lf.name + ' — ' + lf.stats).width + 16;
      ctx.font = '600 12px -apple-system, sans-serif';
      labelW = ctx.measureText(lf.name + ' — ' + lf.stats).width + 16;
      ctx.fillRect(lsx - labelW / 2, lsy - 10, labelW, 20);
      // Text
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffcc44';
      ctx.fillText(lf.name + ' — ' + lf.stats, lsx, lsy);
      ctx.globalAlpha = 1;
    }
    lf.timer--;
    if (lf.timer <= 0) legendFlashes.splice(li, 1);
  }

  drawLegend();
  drawHUD();
}

function drawLegend() {
  // Collect visible glyphs
  var sightRange = 5 + (player.sightBonus || 0);
  var entries = [];
  var seen = {};
  // Always show player
  entries.push({ ch: '@', color: playerClass ? playerClass.color : '#4a9eff', label: playerClass ? playerClass.name : 'Player' });
  // Familiar
  if (familiar) {
    var fd = Math.abs(familiar.x - player.x) + Math.abs(familiar.y - player.y);
    if (fd <= sightRange) entries.push({ ch: 'f', color: '#aa88ff', label: 'Familiar' });
  }
  // Enemies in sight
  for (var i = 0; i < enemies.length; i++) {
    var en = enemies[i];
    var d = Math.abs(en.x - player.x) + Math.abs(en.y - player.y);
    if (d <= sightRange && !seen['e_' + en.name]) {
      seen['e_' + en.name] = true;
      entries.push({ ch: en.ch, color: en.color, label: en.name });
    }
  }
  // Summons in sight
  for (var i = 0; i < summons.length; i++) {
    var s = summons[i];
    var d = Math.abs(s.x - player.x) + Math.abs(s.y - player.y);
    if (d <= sightRange && !seen['summon']) {
      seen['summon'] = true;
      var stInfo = SUMMON_TYPES[summons[si].sType || 'Warrior'];
      entries.push({ ch: stInfo.ch, color: stInfo.color, label: stInfo.name + ' (' + summons[si].hp + '/' + summons[si].maxHp + ')' });
    }
  }
  // Items in sight
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (!explored[it.y] || !explored[it.y][it.x]) continue;
    var d = Math.abs(it.x - player.x) + Math.abs(it.y - player.y);
    if (d <= sightRange) {
      var ik = it.type === 'wand' ? 'wand' : it.type === 'wish' ? 'wish' : it.type;
      if (!seen['i_' + ik]) {
        seen['i_' + ik] = true;
        var lab = it.type === 'wand' ? 'Wand' : it.type === 'wish' ? 'Magic Lamp' : it.type === 'gold' ? 'Gold' : it.type === 'heal' ? 'Potion' : it.type === 'atk' ? 'Sword' : it.type === 'def' ? 'Shield' : it.name;
        entries.push({ ch: it.ch, color: it.color, label: lab });
      }
    }
  }
  // Shopkeeper
  if (shopkeeper && explored[shopkeeper.y] && explored[shopkeeper.y][shopkeeper.x]) {
    var sd = Math.abs(shopkeeper.x - player.x) + Math.abs(shopkeeper.y - player.y);
    if (sd <= sightRange && !seen['shop']) {
      seen['shop'] = true;
      entries.push({ ch: 'S', color: '#44ff44', label: 'Shop' });
    }
  }
  // Stairs
  for (var sy = Math.max(0, player.y - sightRange); sy <= Math.min(MH-1, player.y + sightRange); sy++) {
    for (var sx = Math.max(0, player.x - sightRange); sx <= Math.min(MW-1, player.x + sightRange); sx++) {
      if (explored[sy] && explored[sy][sx] && map[sy][sx] === T_STAIRS && !seen['stairs']) {
        seen['stairs'] = true;
        entries.push({ ch: '▼', color: '#44ff88', label: 'Stairs' });
      }
    }
  }
  // Shrines in sight
  for (var si = 0; si < shrines.length; si++) {
    var shr = shrines[si];
    if (shr.activated) continue;
    var sd = Math.abs(shr.x - player.x) + Math.abs(shr.y - player.y);
    if (sd <= sightRange && !seen['shrine']) {
      seen['shrine'] = true;
      entries.push({ ch: '✦', color: SHRINE_TYPES[shr.type].color, label: 'Shrine' });
    }
  }
  // Chests in sight
  for (var ci = 0; ci < chests.length; ci++) {
    var ch = chests[ci];
    if (ch.opened) continue;
    var cd = Math.abs(ch.x - player.x) + Math.abs(ch.y - player.y);
    if (cd <= sightRange && !seen['chest']) {
      seen['chest'] = true;
      entries.push({ ch: '▣', color: '#cc9944', label: 'Chest' });
    }
  }
  // Barrels in sight
  for (var bi = 0; bi < barrels.length; bi++) {
    var br = barrels[bi];
    var bd = Math.abs(br.x - player.x) + Math.abs(br.y - player.y);
    if (bd <= sightRange && !seen['barrel']) {
      seen['barrel'] = true;
      entries.push({ ch: 'o', color: '#aa7733', label: 'Barrel' });
    }
  }
  // Scrolls in sight
  for (var li = 0; li < scrolls.length; li++) {
    var scr = scrolls[li];
    var ld = Math.abs(scr.x - player.x) + Math.abs(scr.y - player.y);
    if (ld <= sightRange && !seen['scroll']) {
      seen['scroll'] = true;
      entries.push({ ch: '?', color: '#ddcc88', label: 'Scroll' });
    }
  }
  if (entries.length <= 1) return; // just player, not useful
  // Draw in bottom-right, compact
  var lineH = 14;
  var maxShow = Math.min(entries.length, 8);
  var legH = maxShow * lineH + 8;
  var legW = 90;
  var legX = W - legW - 4;
  var legY = H - legH - 28; // above bottom bar
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(legX, legY, legW, legH);
  ctx.globalAlpha = 1;
  ctx.font = '600 10px -apple-system, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (var i = 0; i < maxShow; i++) {
    var e = entries[i];
    var ey = legY + 6 + i * lineH + lineH / 2;
    ctx.fillStyle = e.color;
    ctx.fillText(e.ch, legX + 4, ey);
    ctx.fillStyle = '#999';
    ctx.fillText(e.label, legX + 20, ey);
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(13,13,13,0.85)';
  ctx.fillRect(0, 0, W, 36);
  ctx.font = '600 14px -apple-system, sans-serif';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';

  // HP
  var hpPct = player.hp / player.maxHp;
  ctx.fillStyle = hpPct > 0.5 ? '#44cc44' : hpPct > 0.25 ? '#cccc44' : '#cc4444';
  ctx.fillText('♥' + player.hp + '/' + player.maxHp, 10, 18);

  // ATK / DEF
  ctx.fillStyle = '#aaccff'; ctx.fillText('⚔' + player.atk, 120, 18);
  ctx.fillStyle = '#ffcc44'; ctx.fillText('◆' + player.def, 165, 18);

  // Level
  ctx.fillStyle = '#e8e8e8'; ctx.fillText('Lv' + player.level, 210, 18);

  // Gold
  ctx.fillStyle = '#ffdd00'; ctx.fillText('$' + player.gold, 260, 18);

  // Wand (active from inventory)
  if (wands.length > 0 && activeWandIdx < wands.length) {
    var aw = wands[activeWandIdx];
    ctx.fillStyle = '#aa88ff';
    var wandLabel = '/' + aw.type + ':' + aw.charges;
    if (wands.length > 1) wandLabel += ' (' + (activeWandIdx + 1) + '/' + wands.length + ')';
    // Show shield/element indicator
    if (getActiveShieldType()) wandLabel += ' 🛡';
    else if (getActiveElement()) wandLabel += ' ⚔';
    ctx.fillText(wandLabel, 310, 18);
  }

  // Floor + class
  ctx.textAlign = 'right';
  ctx.fillStyle = '#44ff88';
  ctx.fillText('F' + player.floor, W - 10, 12);
  ctx.fillStyle = playerClass ? playerClass.color : '#ff8844';
  ctx.font = '11px -apple-system, sans-serif';
  ctx.fillText((playerClass ? playerClass.name : '') + ' · ' + RANKS[getRankIdx()].name, W - 10, 28);

  // Nearby enemies
  var nearby = 0, closest = HEARING_RANGE + 1;
  for (var ni = 0; ni < enemies.length; ni++) {
    var ndx = enemies[ni].x - player.x, ndy = enemies[ni].y - player.y;
    var nd = Math.sqrt(ndx*ndx + ndy*ndy);
    if (nd <= HEARING_RANGE) { nearby++; if (nd < closest) closest = nd; }
  }
  if (nearby > 0) {
    ctx.fillStyle = 'rgba(13,13,13,0.85)'; ctx.fillRect(0, H - 24, W, 24);
    ctx.font = '12px -apple-system, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var warn = closest <= 2 ? '⚠️ ' : '';
    var clr = closest <= 2 ? '#ff4444' : closest <= 4 ? '#ffcc44' : '#666';
    ctx.fillStyle = clr;
    ctx.fillText(warn + '🔊 ' + nearby + ' nearby' + (closest <= 2 ? ' — CLOSE' : ''), W / 2, H - 12);
  }

  // Ability cooldown/status bar
  var abilityStr = '';
  if (smokeInvisible > 0) abilityStr += '💨' + smokeInvisible + ' ';
  if (manaShieldHP > 0) abilityStr += '🛡' + manaShieldHP + ' ';
  if (playerClass && CLASS_ABILITIES[playerClass.name]) {
    var classAbs = CLASS_ABILITIES[playerClass.name];
    for (var ai = 1; ai < classAbs.length && ai < player.level; ai++) {
      if (classAbs[ai] && classAbs[ai].type === 'active') {
        var aName = classAbs[ai].name;
        var cd = abilityCooldowns[aName] || 0;
        if (cd > 0) abilityStr += aName.charAt(0) + ':' + cd + ' ';
        else abilityStr += aName.charAt(0) + ':✓ ';
      }
    }
  }
  if (summons.length > 0) abilityStr += '★' + summons.length + '/' + MAX_SUMMONS + ' ';
  if (abilityStr) {
    ctx.fillStyle = 'rgba(13,13,13,0.8)'; ctx.fillRect(0, 36, W, 16);
    ctx.font = '10px -apple-system, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#88aacc'; ctx.fillText(abilityStr.trim(), W / 2, 44);
  }
}

function drawMinimap() {
  ctx.fillStyle = 'rgba(0,0,0,0.82)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = '600 16px -apple-system, sans-serif'; ctx.fillStyle = '#888';
  ctx.fillText('MAP — Floor ' + player.floor + '  (Enter to close)', W / 2, 8);

  var mapPad = 30, mapTop = 32;
  var cellW = (W - mapPad * 2) / MW;
  var cellH = (H - mapTop - mapPad) / MH;
  var cell = Math.min(cellW, cellH);
  var ox = (W - MW * cell) / 2;
  var oy = mapTop + (H - mapTop - mapPad - MH * cell) / 2;
  var sightRange = 5 + (player.sightBonus || 0);

  for (var ty = 0; ty < MH; ty++) for (var tx = 0; tx < MW; tx++) {
    if (!explored[ty][tx]) continue;
    var px = ox + tx * cell, py = oy + ty * cell;
    var tile = map[ty][tx];
    ctx.fillStyle = tile === T_WALL ? '#2a2a2a' : tile === T_STAIRS ? '#44ff88' : '#3a3a3a';
    ctx.fillRect(px, py, cell - 0.5, cell - 0.5);
  }
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (!explored[it.y][it.x]) continue;
    ctx.fillStyle = it.color;
    ctx.fillRect(ox + it.x * cell + cell * 0.15, oy + it.y * cell + cell * 0.15, cell * 0.7, cell * 0.7);
  }
  // Shopkeeper on minimap
  if (shopkeeper && explored[shopkeeper.y] && explored[shopkeeper.y][shopkeeper.x]) {
    ctx.fillStyle = '#44ff44';
    ctx.fillRect(ox + shopkeeper.x * cell, oy + shopkeeper.y * cell, cell, cell);
  }
  for (var i = 0; i < enemies.length; i++) {
    var en = enemies[i];
    var dist = Math.abs(en.x - player.x) + Math.abs(en.y - player.y);
    if (dist > sightRange || !explored[en.y][en.x]) continue;
    ctx.fillStyle = en.color;
    ctx.fillRect(ox + en.x * cell + cell * 0.1, oy + en.y * cell + cell * 0.1, cell * 0.8, cell * 0.8);
  }
  // Summons on minimap
  for (var si = 0; si < summons.length; si++) {
    var smInfo = SUMMON_TYPES[summons[si].sType || 'Warrior'];
    ctx.fillStyle = smInfo.color;
    ctx.fillRect(ox + summons[si].x * cell, oy + summons[si].y * cell, cell, cell);
  }
  // Shrines on minimap
  for (var si = 0; si < shrines.length; si++) {
    if (!shrines[si].activated && explored[shrines[si].y] && explored[shrines[si].y][shrines[si].x]) {
      ctx.fillStyle = SHRINE_TYPES[shrines[si].type].color;
      ctx.fillRect(ox + shrines[si].x * cell, oy + shrines[si].y * cell, cell, cell);
    }
  }
  // Chests on minimap
  for (var ci = 0; ci < chests.length; ci++) {
    if (!chests[ci].opened && explored[chests[ci].y] && explored[chests[ci].y][chests[ci].x]) {
      ctx.fillStyle = '#cc9944';
      ctx.fillRect(ox + chests[ci].x * cell, oy + chests[ci].y * cell, cell, cell);
    }
  }
  // Familiar on minimap
  if (familiar) {
    ctx.fillStyle = '#aa88ff';
    ctx.fillRect(ox + familiar.x * cell + cell * 0.1, oy + familiar.y * cell + cell * 0.1, cell * 0.8, cell * 0.8);
  }
  var pulse = 1 + Math.sin(animT * 4) * 0.3;
  var ppx = ox + player.x * cell + cell / 2;
  var ppy = oy + player.y * cell + cell / 2;
  ctx.fillStyle = playerClass ? playerClass.color : '#4a9eff';
  ctx.beginPath(); ctx.arc(ppx, ppy, cell * 1.2 * pulse, 0, Math.PI * 2); ctx.fill();

  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.font = '600 14px -apple-system, sans-serif'; ctx.fillStyle = '#888';
  var explored_count = 0, total_floor = 0;
  for (var ty2 = 0; ty2 < MH; ty2++) for (var tx2 = 0; tx2 < MW; tx2++) {
    if (map[ty2][tx2] !== T_WALL) total_floor++;
    if (explored[ty2][tx2] && map[ty2][tx2] !== T_WALL) explored_count++;
  }
  var pct = total_floor > 0 ? Math.round(explored_count / total_floor * 100) : 0;
  ctx.fillText('Explored: ' + pct + '%  ·  Enemies: ' + enemies.length + '  ·  Items: ' + items.length, W / 2, H - 10);
}

function drawWish() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // Djinni
  ctx.font = '48px -apple-system, sans-serif'; ctx.fillStyle = '#ffcc00';
  ctx.fillText('🧞', W / 2, 100);
  ctx.font = '900 28px -apple-system, sans-serif'; ctx.fillStyle = '#ffcc00';
  ctx.fillText('A Djinni Appears!', W / 2, 160);
  ctx.font = '16px -apple-system, sans-serif'; ctx.fillStyle = '#ccc';
  ctx.fillText('You are granted one wish.', W / 2, 195);

  if (!wishPickingWand) {
    for (var i = 0; i < WISH_OPTIONS.length; i++) {
      var sel = (wishSel === i);
      ctx.font = sel ? '600 20px -apple-system, sans-serif' : '16px -apple-system, sans-serif';
      ctx.fillStyle = sel ? '#ffcc00' : '#888';
      var pulse = sel ? (Math.sin(animT * 3) * 0.2 + 0.8) : 0.5;
      ctx.globalAlpha = pulse;
      ctx.fillText((sel ? '▸ ' : '  ') + WISH_OPTIONS[i], W / 2, 260 + i * 42);
    }
  } else {
    ctx.font = '600 18px -apple-system, sans-serif'; ctx.fillStyle = '#ccc';
    ctx.fillText('Choose a wand:', W / 2, 240);
    for (var i = 0; i < WAND_TYPES.length; i++) {
      var wt = WAND_TYPES[i];
      var sel = (wishWandSel === i);
      ctx.font = sel ? '600 20px -apple-system, sans-serif' : '16px -apple-system, sans-serif';
      ctx.fillStyle = sel ? wt.color : '#888';
      var pulse = sel ? (Math.sin(animT * 3) * 0.2 + 0.8) : 0.5;
      ctx.globalAlpha = pulse;
      ctx.fillText((sel ? '▸ ' : '  ') + wt.ch + ' ' + wt.name + ' (' + wt.charges + ' charges)', W / 2, 290 + i * 42);
    }
  }
  ctx.globalAlpha = 1;
  ctx.font = '12px -apple-system, sans-serif'; ctx.fillStyle = '#555';
  ctx.fillText('↑↓ select  ·  Enter to confirm', W / 2, 540);
}

function drawShop() {
  ctx.fillStyle = 'rgba(0,0,0,0.88)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = '900 32px -apple-system, sans-serif'; ctx.fillStyle = '#44ff44';
  ctx.fillText('🏪 SHOP', W / 2, 70);
  ctx.font = '600 16px -apple-system, sans-serif'; ctx.fillStyle = '#ffdd00';
  ctx.fillText('Gold: $' + player.gold, W / 2, 110);

  for (var i = 0; i < shopStock.length; i++) {
    var item = shopStock[i];
    var sel = (shopSel === i);
    var yy = 175 + i * 72;
    // Selection box
    if (sel) {
      ctx.fillStyle = 'rgba(68,255,68,0.08)';
      ctx.fillRect(60, yy - 28, W - 120, 58);
      ctx.strokeStyle = '#44ff44'; ctx.lineWidth = 2;
      ctx.strokeRect(60, yy - 28, W - 120, 58);
    }
    if (item.sold) {
      ctx.font = '600 18px -apple-system, sans-serif'; ctx.fillStyle = '#555';
      ctx.fillText(item.name + '  — SOLD', W / 2, yy);

      ctx.font = sel ? '600 20px -apple-system, sans-serif' : '18px -apple-system, sans-serif';
      ctx.fillStyle = sel ? '#e8e8e8' : '#888';
      ctx.fillText((sel ? '▸ ' : '  ') + item.name + '  — $' + item.cost, W / 2, yy);
      ctx.font = '12px -apple-system, sans-serif'; ctx.fillStyle = sel ? '#aaa' : '#666';
      ctx.fillText(item.desc, W / 2, yy + 20);
    }
  }

  ctx.font = '12px -apple-system, sans-serif'; ctx.fillStyle = '#555';

}

function drawWandSelect() {
  ctx.fillStyle = 'rgba(0,0,0,0.92)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = '900 24px -apple-system, sans-serif'; ctx.fillStyle = '#aa88ff';
  ctx.fillText('⚡ WANDS', W / 2, 36);
  ctx.font = '12px -apple-system, sans-serif'; ctx.fillStyle = '#666';
  ctx.fillText('↑↓ select  ·  Enter equip  ·  Esc cancel', W / 2, 58);

  if (wands.length === 0) {
    ctx.font = '18px -apple-system, sans-serif'; ctx.fillStyle = '#666';
    ctx.fillText('No wands in inventory', W / 2, 200);
    return;
  }

  // --- Scrollable wand list (top half) ---
  var listTop = 76, rowH = 48, maxVisible = 5;
  var listH = maxVisible * rowH;
  var scrollOffset = 0;
  if (wands.length > maxVisible) {
    scrollOffset = Math.max(0, Math.min(wandSelIdx - Math.floor(maxVisible / 2), wands.length - maxVisible));
  }

  // Clip region for list
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, listTop, W, listH);
  ctx.clip();

  for (var i = scrollOffset; i < Math.min(wands.length, scrollOffset + maxVisible); i++) {
    var w = wands[i];
    var sel = (wandSelIdx === i);
    var isActive = (i === activeWandIdx);
    var yy = listTop + (i - scrollOffset) * rowH + rowH / 2;
    var wtInfo = null;
    for (var j = 0; j < WAND_TYPES.length; j++) {
      if (WAND_TYPES[j].name === w.type) { wtInfo = WAND_TYPES[j]; break; }
    }
    var wColor = wtInfo ? wtInfo.color : '#aa88ff';
    var wIcon = wtInfo ? wtInfo.ch : '/';

    if (sel) {
      ctx.fillStyle = 'rgba(170,136,255,0.12)';
      ctx.fillRect(40, yy - 20, W - 80, 40);
      ctx.strokeStyle = '#aa88ff'; ctx.lineWidth = 1.5;
      ctx.strokeRect(40, yy - 20, W - 80, 40);
    }

    ctx.font = sel ? '600 18px -apple-system, sans-serif' : '16px -apple-system, sans-serif';
    ctx.fillStyle = sel ? wColor : '#777';
    var label = (sel ? '▸ ' : '  ') + wIcon + ' ' + w.type + '  ×' + w.charges;
    if (isActive) label += '  ★';
    ctx.fillText(label, W / 2, yy - 2);

    // Charges bar
    var maxCh = wtInfo ? wtInfo.charges * ((playerClass && playerClass.chargeMult) || 1) : w.charges;
    var barW = 120, barH = 4;
    var barX = (W - barW) / 2, barY = yy + 14;
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = wColor;
    ctx.globalAlpha = sel ? 1 : 0.4;
    ctx.fillRect(barX, barY, barW * Math.min(1, w.charges / Math.max(1, maxCh)), barH);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // Scroll indicators
  if (scrollOffset > 0) {
    ctx.font = '14px -apple-system, sans-serif'; ctx.fillStyle = '#555';
    ctx.fillText('▲ more', W / 2, listTop - 4);
  }
  if (scrollOffset + maxVisible < wands.length) {
    ctx.font = '14px -apple-system, sans-serif'; ctx.fillStyle = '#555';
    ctx.fillText('▼ more', W / 2, listTop + listH + 10);
  }

  // --- Description panel (bottom half) ---
  var descTop = listTop + listH + 24;
  var selW = wands[wandSelIdx];
  var selInfo = null;
  for (var j = 0; j < WAND_TYPES.length; j++) {
    if (WAND_TYPES[j].name === selW.type) { selInfo = WAND_TYPES[j]; break; }
  }
  var selColor = selInfo ? selInfo.color : '#aa88ff';

  // Divider
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(60, descTop - 8); ctx.lineTo(W - 60, descTop - 8); ctx.stroke();

  // Wand name
  ctx.font = '600 20px -apple-system, sans-serif'; ctx.fillStyle = selColor;
  ctx.fillText(selW.type + ' Wand', W / 2, descTop + 10);

  // Zap effect description
  var zapDesc = {
    'Fire': 'Zap: Fireball that burns target',
    'Dig': 'Zap: Breaks one wall tile',
    'Teleport': 'Zap: Blink to a random room',
    'Ice': 'Zap: Freezes target for 3 turns',
    'Poison': 'Zap: Poison DoT (2 dmg/turn, 3 turns)',
    'Lightning': 'Zap: Bolt + chain to adjacent enemy',
    'Slow': 'Zap: Halves target speed for 5 turns',
    'Heal': 'Zap: Restore 20 HP (self-cast)',
    'Summon': 'Zap: Spawn friendly ally for 10 turns'
  };
  ctx.font = '14px -apple-system, sans-serif'; ctx.fillStyle = '#aaa';
  ctx.fillText(zapDesc[selW.type] || 'Zap: Unknown effect', W / 2, descTop + 38);

  // Class-specific bonus
  var classBonus = '';
  var classColor = '#888';
  if (playerClass && playerClass.name === 'Wizard') {
    classColor = '#aa88ff';
    var shieldDesc = {
      'Fire': '🛡 Fire Shield: ATK×0.3 AoE per turn + 30% melee reflect',
      'Dig': '🛡 Earth Shield: Knockback melee attackers',
      'Teleport': '🛡 Phase Shield: 15% blink away when hit',
      'Ice': '🛡 Ice Shield: 20% freeze attackers + ranged reduction',
      'Poison': '🛡 Toxic Shield: ATK×0.2 AoE + poison attackers',
      'Lightning': '🛡 Storm Shield: ATK×0.25 all adjacent + ranged zap + 40% chain',
      'Slow': '🛡 Time Shield: Slows all adjacent + attackers',
      'Heal': '🛡 Regen Shield: +1 HP every 3 turns',
      'Summon': '🛡 Spirit Shield: 10% spawn ally when hit'
    };
    classBonus = shieldDesc[selW.type] || '';
  } else if (playerClass && playerClass.name === 'Rogue') {
    classColor = '#44ff88';
    var elemDesc = {
      'Fire': '⚔ Fire Blade: +2 dmg, 10% ignite on hits',
      'Dig': '⚔ Impact Blade: Knockback + wall slam (+3)',
      'Teleport': '⚔ Phase Blade: 10% teleport target away',
      'Ice': '⚔ Frost Blade: +1 dmg, 15% freeze on hits',
      'Poison': '⚔ Venom Blade: +1 dmg, 25% poison on hits',
      'Lightning': '⚔ Storm Blade: +2 dmg, 10% chain to adjacent',
      'Slow': '⚔ Tempo Blade: +1 dmg, 20% slow on hits',
      'Heal': '⚔ Vampiric Blade: 15% lifesteal on hits',
      'Summon': '⚔ Soul Blade: 20% spawn ally on kill'
    };
    classBonus = elemDesc[selW.type] || '';
  } else if (playerClass && playerClass.name === 'Warrior') {
    classColor = '#ff4444';
    classBonus = '⚔ No elemental bonus (Warrior uses sweep)';
  }

  if (classBonus) {
    ctx.font = '13px -apple-system, sans-serif'; ctx.fillStyle = classColor;
    ctx.fillText(classBonus, W / 2, descTop + 64);
  }

  // Charges remaining
  ctx.font = '12px -apple-system, sans-serif'; ctx.fillStyle = '#555';
  ctx.fillText(selW.charges + ' charges remaining', W / 2, descTop + 90);
}

function drawPauseStats() {
  ctx.fillStyle = 'rgba(0,0,0,0.93)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 22px -apple-system, sans-serif'; ctx.fillStyle = '#e8e8e8';
  ctx.fillText('⏸ PAUSED', W / 2, 30);
  var cColor = playerClass ? playerClass.color : '#4a9eff';
  ctx.font = '600 16px -apple-system, sans-serif'; ctx.fillStyle = cColor;
  ctx.fillText((playerClass ? playerClass.name : 'Adventurer') + '  ·  Level ' + player.level + '  ·  Floor ' + player.floor, W / 2, 52);
  var col1 = 50, col2 = 320, y = 70, lh = 16;
  function statRow(label, val, color) {
    ctx.textAlign = 'left'; ctx.font = '11px -apple-system, monospace';
    ctx.fillStyle = color; ctx.fillText(label, col1, y);
    ctx.fillStyle = '#ccc'; ctx.fillText('' + val, col2, y); y += lh;
  }
  function section(title, color) {
    y += 4; ctx.textAlign = 'center'; ctx.font = '600 12px -apple-system, sans-serif';
    ctx.fillStyle = color; ctx.fillText('— ' + title + ' —', W / 2, y); y += 15;
  }
  section('COMBAT', '#ff8844');
  statRow('Damage Dealt', runStats.dmgDealt, '#ff8844');
  statRow('Damage Taken', runStats.dmgTaken, '#ff3333');
  statRow('HP Healed', runStats.healed, '#44ff88');
  statRow('Biggest Hit Dealt', runStats.maxHitDealt, '#ffff44');
  statRow('Biggest Hit Taken', runStats.maxHitTaken, '#ff6666');
  statRow('Critical Hits', runStats.crits, '#ffcc44');
  statRow('Wand Zaps', runStats.wandZaps, '#aa88ff');
  section('EXPLORATION', '#4a9eff');
  statRow('Steps Walked', runStats.stepsWalked, '#aaddff');
  statRow('Floors Cleared', runStats.floorsCleared, '#88cc88');
  statRow('Gold Spent', runStats.goldSpent + 'g (holding ' + player.gold + 'g)', '#ffaa44');
  statRow('Total Kills', player.kills, '#ff4444');
  var killTypes = [];
  for (var k in runStats.killsByType) { if (runStats.killsByType.hasOwnProperty(k)) killTypes.push({ name: k, count: runStats.killsByType[k] }); }
  killTypes.sort(function(a, b) { return b.count - a.count; });
  if (killTypes.length > 0) {
    section('BESTIARY', '#cc6666');
    var maxShow = Math.min(killTypes.length, 5);
    for (var i = 0; i < maxShow; i++) statRow(killTypes[i].name, '×' + killTypes[i].count, '#999');
    if (killTypes.length > 5) { ctx.textAlign = 'left'; ctx.font = '11px -apple-system, monospace'; ctx.fillStyle = '#555'; ctx.fillText('...+' + (killTypes.length - 5) + ' more', col1, y); y += lh; }
  }
  section('DISCOVERIES', '#ffcc44');
  statRow('Shrines Activated', runStats.shrinesActivated, '#ffcc44');
  statRow('Chests Opened', runStats.chestsOpened, '#cc9944');
  statRow('Minibosses Killed', runStats.minibossesKilled, '#ff2222');
  statRow('Barrels Smashed', runStats.barrelsSmashed, '#aa7733');
  statRow('Scrolls Read', runStats.scrollsRead, '#ddcc88');
  // Class Abilities section
  if (playerClass && CLASS_ABILITIES[playerClass.name] && player.level > 1) {
    section('ABILITIES', playerClass.color);
    var classAbs = CLASS_ABILITIES[playerClass.name];
    for (var ai = 1; ai < classAbs.length && ai < player.level; ai++) {
      if (classAbs[ai]) {
        var abLabel = classAbs[ai].name;
        if (classAbs[ai].type === 'active') {
          var cd = abilityCooldowns[classAbs[ai].name] || 0;
          abLabel += cd > 0 ? ' (CD: ' + cd + ')' : ' (READY)';
        }
        statRow('L' + (ai + 1) + ': ' + abLabel, classAbs[ai].desc, playerClass.color);
      }
    }
  }
  // Summon status
  if (summons.length > 0) {
    section('SUMMONS (' + summons.length + '/' + MAX_SUMMONS + ')', '#cc66ff');
    for (var si = 0; si < summons.length; si++) {
      var sInfo = SUMMON_TYPES[summons[si].sType || 'Warrior'];
      statRow(sInfo.ch + ' ' + sInfo.name, 'HP:' + summons[si].hp + '/' + summons[si].maxHp + ' ATK:' + summons[si].atk, sInfo.color);
    }
  }
  var efficiency = runStats.dmgTaken > 0 ? (runStats.dmgDealt / runStats.dmgTaken).toFixed(1) : '∞';
  ctx.textAlign = 'center'; ctx.font = '600 13px -apple-system, sans-serif'; ctx.fillStyle = '#e8e8e8';
  ctx.fillText('Damage Ratio: ' + efficiency + ':1', W / 2, H - 48);
  ctx.font = '11px -apple-system, sans-serif'; ctx.fillStyle = '#555';
  ctx.fillText('Esc / Enter to resume', W / 2, H - 24);
}

function drawMsg() {
  var alpha = msgTimer > 20 ? 1 : msgTimer / 20;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(50, H - 80, W - 100, 36);
  ctx.font = '600 15px -apple-system, sans-serif'; ctx.fillStyle = '#ffcc44';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(msgText, W / 2, H - 62);
  ctx.globalAlpha = 1;
}

function drawDeath() {
  ctx.fillStyle = 'rgba(10,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 42px -apple-system, sans-serif'; ctx.fillStyle = '#cc3333';
  ctx.fillText('YOU DIED', W / 2, 130);

  // Show what killed the player
  if (lastHitSource) {
    ctx.font = '14px -apple-system, sans-serif'; ctx.fillStyle = '#ff6666';
    ctx.fillText('Killed by: ' + lastHitSource, W / 2, 155);
  }

  ctx.font = '600 16px -apple-system, sans-serif';
  ctx.fillStyle = playerClass ? playerClass.color : '#e8e8e8';
  ctx.fillText(playerClass ? playerClass.name : '', W / 2, 175);

  ctx.font = '18px -apple-system, sans-serif'; ctx.fillStyle = '#e8e8e8';
  ctx.fillText('Floor ' + player.floor + '  ·  Level ' + player.level, W / 2, 210);
  ctx.fillText('Kills: ' + player.kills + '  ·  Steps: ' + player.steps, W / 2, 240);
  ctx.fillText('Gold: ' + player.gold + '  ·  XP: ' + player.xp, W / 2, 270);

  // Rank
  var ri = getRankIdx(); var rank = RANKS[ri];
  ctx.font = '600 16px -apple-system, sans-serif'; ctx.fillStyle = '#ff8844';
  ctx.fillText(rank.name, W / 2, 305);
  if (ri < RANKS.length - 1) {
    var next = RANKS[ri + 1];
    var prog = (totalKills - rank.threshold) / (next.threshold - rank.threshold);
    var barW = 160, barH = 6, barX = (W - barW) / 2, barY = 320;
    ctx.fillStyle = '#222'; ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#ff8844'; ctx.fillRect(barX, barY, barW * Math.min(1, prog), barH);
    ctx.font = '12px -apple-system, sans-serif'; ctx.fillStyle = '#888';
    ctx.fillText('+' + player.kills + ' kills this run → ' + Math.round(prog * 100) + '% to ' + next.name, W / 2, 342);
  }
  if (getRankIdx() > rankAtRunStart) {
    ctx.font = '600 18px -apple-system, sans-serif'; ctx.fillStyle = '#ff8844';
    var rankPulse = Math.sin(animT * 4) * 0.2 + 0.8;
    ctx.globalAlpha = rankPulse;
    ctx.fillText('★ RANKED UP TO ' + rank.name.toUpperCase() + '! ★', W / 2, 375);
    ctx.globalAlpha = 1;
  }
  if (player.floor >= bestFloor && player.floor > 1) {
    ctx.fillStyle = '#ffcc44'; ctx.font = '600 18px -apple-system, sans-serif';
    ctx.fillText('★ NEW BEST: Floor ' + player.floor + ' ★', W / 2, 410);
  } else if (bestFloor > 0) {
    ctx.fillStyle = '#888'; ctx.font = '14px -apple-system, sans-serif';
    ctx.fillText('Best: Floor ' + bestFloor, W / 2, 410);
  }

  var pulse = Math.sin(animT * 3) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.font = '600 22px -apple-system, sans-serif'; ctx.fillStyle = '#4a9eff';
  ctx.fillText('Enter to Try Again', W / 2, 470);
  ctx.font = '14px -apple-system, sans-serif'; ctx.fillStyle = '#666';
  ctx.fillText('Esc: Title Screen', W / 2, 500);
  ctx.globalAlpha = 1;
}

// ─── Input ──────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === 'm' || e.key === 'M') { bgmToggle(); return; }
  e.preventDefault();

  if (state === ST_TITLE) {
    var hasSv = hasSave();
    if (hasSv) {
      if (e.key === 'ArrowUp') { titleSel = 0; }
      else if (e.key === 'ArrowDown') { titleSel = 1; }
      else if (e.key === 'Enter') {
        initAudio();
        if (titleSel === 0) { restoreGame(); }
        else { deleteSave(); classSel = 0; state = ST_CLASS; }
      }
    } else {
      if (e.key === 'Enter') { initAudio(); classSel = 0; state = ST_CLASS; }
    }
    return;
  }

  if (state === ST_CLASS) {
    if (e.key === 'ArrowUp') {
      classSel = (classSel - 1 + CLASSES.length) % CLASSES.length;
      if (classSel === 0) sndClassWarrior();
      else if (classSel === 1) sndClassRogue();
      else sndClassWizard();
    } else if (e.key === 'ArrowDown') {
      classSel = (classSel + 1) % CLASSES.length;
      if (classSel === 0) sndClassWarrior();
      else if (classSel === 1) sndClassRogue();
      else sndClassWizard();
    } else if (e.key === 'Enter') {
      startGame(CLASSES[classSel]);
    }
    return;
  }

  if (state === ST_WISH) {
    if (!wishPickingWand) {
      if (e.key === 'ArrowUp') wishSel = (wishSel - 1 + WISH_OPTIONS.length) % WISH_OPTIONS.length;
      else if (e.key === 'ArrowDown') wishSel = (wishSel + 1) % WISH_OPTIONS.length;
      else if (e.key === 'Enter') {
        if (wishSel === 0) { // Full HP
          player.hp = player.maxHp;
          sndWishGranted(); addFloat(player.x, player.y, 'Full HP!', '#44ff88');
          showMsg('Wish granted! Full HP restore!');
          state = ST_PLAY;
        } else if (wishSel === 1) { // +3 ATK
          player.atk += 3;
          sndWishGranted(); addFloat(player.x, player.y, 'ATK+3!', '#ffcc44');
          showMsg('Wish granted! +3 Attack Power!');
          state = ST_PLAY;
        } else if (wishSel === 2) { // +3 DEF
          player.def += 3;
          sndWishGranted(); addFloat(player.x, player.y, 'DEF+3!', '#4a9eff');
          showMsg('Wish granted! +3 Defense!');
          state = ST_PLAY;
        } else if (wishSel === 3) { // Reveal floor
          revealAll();
          sndWishGranted(); addFloat(player.x, player.y, 'Map revealed!', '#ffcc00');
          showMsg('Wish granted! The entire floor is revealed!');
          state = ST_PLAY;
        } else if (wishSel === 4) { // Wand pick
          wishPickingWand = true; wishWandSel = 0;
        }
        if (state === ST_PLAY) saveGame();
      }
    } else {
      if (e.key === 'ArrowUp') wishWandSel = (wishWandSel - 1 + WAND_TYPES.length) % WAND_TYPES.length;
      else if (e.key === 'ArrowDown') wishWandSel = (wishWandSel + 1) % WAND_TYPES.length;
      else if (e.key === 'Enter') {
        var wt = WAND_TYPES[wishWandSel];
        addWand(wt.name, wt.charges);
        sndWishGranted();
        addFloat(player.x, player.y, wt.ch + ' ' + wt.name + '!', wt.color);
        showMsg('Wish granted! Wand of ' + wt.name + '!');
        state = ST_PLAY;
        saveGame();
      } else if (e.key === 'Escape' || e.key === 'Backspace') {
        wishPickingWand = false;
      }
    }
    return;
  }

  if (state === ST_SHOP) {
    if (e.key === 'ArrowUp') shopSel = (shopSel - 1 + shopStock.length) % shopStock.length;
    else if (e.key === 'ArrowDown') shopSel = (shopSel + 1) % shopStock.length;
    else if (e.key === 'Enter') {
      var item = shopStock[shopSel];
      if (item.sold) {
        showMsg('Already sold!');
      } else if (player.gold < item.cost) {
        sndShopFail();
        showMsg('Not enough gold! Need $' + item.cost);
      } else {
        player.gold -= item.cost; runStats.goldSpent += item.cost;
        item.sold = true;
        sndShopBuy();
        if (item.name === 'Health Potion') {
          var heal = Math.ceil(player.maxHp * 0.5);
          player.hp = Math.min(player.hp + heal, player.maxHp);
          showMsg('Healed +' + heal + ' HP!');
          addFloat(player.x, player.y, '+' + heal, '#44ff88');
        } else if (item.name === 'ATK Boost') {
          player.atk += 1;
          showMsg('ATK +1!');
          addFloat(player.x, player.y, '⚔+1', '#ffcc44');
        } else if (item.name === 'DEF Boost') {
          player.def += 1;
          showMsg('DEF +1!');
          addFloat(player.x, player.y, '🛡+1', '#4a9eff');
        } else if (item.name === 'Sight Scroll') {
          player.sightBonus += 1;
          reveal(player.x, player.y);
          showMsg('Sight +1!');
          addFloat(player.x, player.y, '👁+1', '#88ccff');
        } else if (item.name === 'Wand') {
          var wt = WAND_TYPES[Math.floor(Math.random() * WAND_TYPES.length)];
          addWand(wt.name, wt.charges);
          showMsg('Got Wand of ' + wt.name + '!');
          addFloat(player.x, player.y, wt.ch + wt.name, wt.color);
        }
        saveGame();
      }
    } else if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      state = ST_PLAY;
      showMsg('Thanks for shopping!');
    }
    return;
  }

  if (state === ST_DEAD) {
    if (e.key === 'Enter') { classSel = 0; state = ST_CLASS; }
    if (e.key === 'Escape' || e.key === 'Backspace') state = ST_TITLE;
    return;
  }

  if (state === ST_WAND_SEL) {
    if (e.key === 'ArrowUp') { wandSelIdx = (wandSelIdx - 1 + wands.length) % wands.length; sndWandSelect(); }
    else if (e.key === 'ArrowDown') { wandSelIdx = (wandSelIdx + 1) % wands.length; sndWandSelect(); }
    else if (e.key === 'Enter') {
      activeWandIdx = wandSelIdx;
      sndWandSelect();
      var aw = wands[activeWandIdx];
      showMsg('Equipped Wand of ' + aw.type);
      state = ST_PLAY;
    }
    else if (e.key === 'Escape' || e.key === 'Backspace') {
      state = ST_PLAY;
    }
    return;
  }

  if (state === ST_PLAY) {
    // Enter: long-press opens wand select, short press zaps or toggles minimap
    if (e.key === 'Enter') {
      if (showMinimap) { showMinimap = false; return; }
      enterDownTime = Date.now();
      if (enterTimer) clearTimeout(enterTimer);
      enterTimer = setTimeout(function() {
        enterTimer = null;
        if (wands.length > 1) {
          wandSelIdx = activeWandIdx;
          state = ST_WAND_SEL;
        }
      }, 300);
      return;
    }
    if (showMinimap) return;
    if (e.key === 'ArrowUp') tryMove(0, -1);
    else if (e.key === 'ArrowDown') tryMove(0, 1);
    else if (e.key === 'ArrowLeft') tryMove(-1, 0);
    else if (e.key === 'ArrowRight') tryMove(1, 0);
    else if (e.key === 'Escape' || e.key === 'Backspace') { state = ST_PAUSE; return; }
  }

  // Pause screen
  if (state === ST_PAUSE) {
    if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'Enter') { state = ST_PLAY; return; }
    return;
  }
});

// Keyup handler for short-press Enter detection
document.addEventListener('keyup', function(e) {
  if (e.key !== 'Enter') return;
  if (state === ST_PLAY && enterDownTime > 0) {
    var held = Date.now() - enterDownTime;
    enterDownTime = 0;
    if (enterTimer) { clearTimeout(enterTimer); enterTimer = null; }
    // Only fire on short press (< 300ms) and if wand select didn't open
    if (held < 300) {
      if (wands.length > 0 && activeWandIdx < wands.length && wands[activeWandIdx].charges > 0) {
        if (zapWand()) { moveEnemies(); tickTurn(); saveGame(); }
        else if (useActiveAbility()) { moveEnemies(); tickTurn(); saveGame(); }
      } else if (useActiveAbility()) {
        moveEnemies(); tickTurn(); saveGame();
      } else {
        showMinimap = true;
      }
    }
  }
});

draw();
})();
</script>
<script>
/* === MRBD D-pad Fix === */
(function() {
  // Prevent MRBD browser from intercepting D-pad for spatial navigation
  document.addEventListener('keydown', function(e) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key)) {
      e.preventDefault();
    }
  }, true); // capture phase to beat browser's handler
  // Auto-focus canvas and click-to-refocus
  var c = document.querySelector('canvas');
  if (c) {
    if (!c.getAttribute('tabindex')) c.setAttribute('tabindex', '0');
    c.style.outline = 'none';
    c.focus();
    c.addEventListener('click', function() { c.focus(); });
    c.addEventListener('touchstart', function() { c.focus(); });
  }
  // Disable focusable elements during gameplay to prevent arrow-key focus stealing
  document.querySelectorAll('a, button, input, select, textarea').forEach(function(el) {
    el.setAttribute('tabindex', '-1');
  });
})();
/* === End MRBD D-pad Fix === */
</script>
<script src="../touch-controls.js"></script>
