const BASE_W = 400;  // logical canvas width
const BASE_H = 640;  // logical canvas height (game area + HUD)
const CELL  = 44;    // grid cell size
const COLS  = 9;     // grid cols
const ROWS  = 9;     // grid rows
const GAME_H = ROWS * CELL;       // 396

const LB_COL = 4;   // Lord Bluetooth grid col
const LB_ROW = 4;   // Lord Bluetooth grid row

let scale = 1, offsetX = 0, offsetY = 0;

function resize() {
  const ww = window.innerWidth;
  const wh = window.innerHeight;
  const aspect = BASE_W / BASE_H;
  let w = Math.min(ww, 520);
  let h = Math.floor(w / aspect);
  if (h > wh) { h = wh; w = Math.floor(h * aspect); }
  scale = w / BASE_W;
  canvas.width  = BASE_W;
  canvas.height = BASE_H;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  offsetX = (ww - w) / 2;
  offsetY = (wh - h) / 2;
}
resize();
window.addEventListener('resize', resize);

// Helper: map logical coords to canvas coords
function mapX(lx) { return lx * scale; }
function mapY(ly) { return ly * scale; }

// ── AUDIO ─────────────────────────────────────────────────────
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function loadAudio(url) {
  return fetch(url).then(r => r.arrayBuffer()).then(buf => audioCtx.decodeAudioData(buf)).catch(() => null);
}

const audioCache = {};
async function playAudioClip(url, vol=0.7) {
  if (!audioCache[url]) audioCache[url] = await loadAudio(url);
  const ab = audioCache[url];
  if (!ab) return;
  const s = audioCtx.createBufferSource();
  s.buffer = ab;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  s.connect(g); g.connect(audioCtx.destination);
  s.start();
}

function synthTone(freq, dur, type='square', vol=0.06, delay=0) {
  setTimeout(() => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }, delay * 1000);
}

// PATH: Enter left, snake right→down→left→down→right→LB center
const PATH = [
  {c:0,r:1},{c:8,r:1},{c:8,r:3},{c:0,r:3},{c:0,r:5},{c:7,r:5},{c:7,r:7},{c:1,r:7},{c:1,r:8},{c:6,r:8}
];

function buildPathPixels() {
  const pts = [];
  for (let i = 0; i < PATH.length - 1; i++) {
    const a = PATH[i], b = PATH[i+1];
    if (a.c === b.c) {
      for (let r = Math.min(a.r,b.r); r <= Math.max(a.r,b.r); r++)
        pts.push({x: a.c*CELL_PX + CELL_PX/2, y: r*CELL_PX + CELL_PX/2});
    } else {
      for (let c = Math.min(a.c,b.c); c <= Math.max(a.c,b.c); c++)
        pts.push({x: c*CELL_PX + CELL_PX/2, y: a.r*CELL_PX + CELL_PX/2});
    }
  }
  return pts;
}
const PATH_PIXELS = buildPathPixels();

function getPathCells() {
  const s = new Set();
  for (let i = 0; i < PATH.length - 1; i++) {
    const a = PATH[i], b = PATH[i+1];
    if (a.c === b.c) {
      for (let r = Math.min(a.r,b.r); r <= Math.max(a.r,b.r); r++) s.add(`${a.c},${r}`);
    } else {
      for (let c = Math.min(a.c,b.c); c <= Math.max(a.c,b.c); c++) s.add(`${c},${a.r}`);
    }
  }
  return s;
}
const PATH_CELLS = getPathCells();

// ── GAME STATE ─────────────────────────────────────────────────
const STATE = { TITLE:0, PLAYING:1, WAVE_END:2, WIN:3, LOSE:4, PAUSED:5, TOWER_INFO:6 };
let state = STATE.TITLE;
let lbHP = 400, lbMaxHP = 400;
let credits = 200;
let score = 0;
let towers = [];
let enemies = [];
let projectiles = [];
let particles = [];
let overlays = [];     // center screen overlays
let floatingTexts = []; // small floating +credits etc
let screenShake = 0;
let waveCreditsMult = 1.0;
let nextWaveSizeMult = 1.0;
let enemySpeedMult = 1.0;
let towerRateMult = 1.0;
let waveIndex = -1;
let waveQueue = [];
let waveSpawnTimer = 0;
let waveStarted = false;
let betweenWaves = true;
let nextEventTimer = 0;
let eventPending = false;
let btPairMode = false;
let btPairSrc = null;
let pairings = []; // [{from, to}]
let selectedTower = null; // clicked tower for info panel
let bossActive = false;

// Lord Bluetooth anim state
let lbPhase = 0;
let lbDmgFlash = 0;
let lbIdleTimer = 0;
let lbTalkBubble = null;

// Touch state
let touchStart = null;
let isSwiping = false;
let swipeStart = null;
let cameraX = 0, cameraY = 0; // for potential pan

// ── INIT ───────────────────────────────────────────────────────
function initGame() {
  lbHP = 400; lbMaxHP = 400;
  lbDmgFlash = 0;
  lbPhase = 0;
  lbIdleTimer = 0;
  lbTalkBubble = null;
  towers = [];
  enemies = [];
  projectiles = [];
  particles = [];
  overlays = [];
  floatingTexts = [];
  screenShake = 0;
  waveCreditsMult = 1.0;
  nextWaveSizeMult = 1.0;
  enemySpeedMult = 1.0;
  towerRateMult = 1.0;
  waveIndex = -1;
  waveQueue = [];
  waveSpawnTimer = 0;
  waveStarted = false;
  betweenWaves = true;
  credits = 200;
  score = 0;
  btPairMode = false;
  btPairSrc = null;
  pairings = [];
  selectedTower = null;
  bossActive = false;
  nextEventTimer = 12 + Math.random() * 8;
  state = STATE.PLAYING;
  lbReact('idle');
  startWave(0);
}

// ── WAVE MANAGEMENT ─────────────────────────────────────────────
function startWave(idx) {
  waveIndex = idx;
  const isBoss = (idx + 1) % 5 === 0;
  if (idx >= WAVES.length) { winGame(); return; }

  const waveData = JSON.parse(JSON.stringify(WAVES[idx]));
  if (nextWaveSizeMult > 1.0) {
    for (const g of waveData) g.n = Math.ceil(g.n * nextWaveSizeMult);
  }
  waveQueue = [];
  for (const grp of waveData) {
    for (let i = 0; i < grp.n; i++) waveQueue.push(grp.t);
  }
  // Shuffle
  for (let i = waveQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [waveQueue[i], waveQueue[j]] = [waveQueue[j], waveQueue[i]];
  }

  // Boss spawn delay
  if (isBoss) {
    bossActive = true;
    lbReact('bossSpawn', true);
    synthBoss();
    triggerCEOShoutout('bossDefeated');
  } else {
    bossActive = false;
  }

  waveSpawnTimer = 1.0;
  waveStarted = true;
  betweenWaves = false;
  nextEventTimer = 18 + Math.random() * 12;
  waveCreditsMult = 1.0;
  synthWave();
  lbReact('waveStart');
  playVoice('boz','waveStart').catch(()=>{});
  teamSignOff(true);
}

function checkWaveDone() {
  if (!waveStarted) return;
  if (waveQueue.length === 0 && enemies.length === 0) {
    waveStarted = false;
    betweenWaves = true;
    bossActive = false;
    score += (waveIndex + 1) * 50 * waveCreditsMult;
    lbReact('waveComplete');
    triggerCEOShoutout('waveComplete');
    teamSignOff();
    if (waveIndex >= WAVES.length - 1) {
      winGame();
    } else {
      state = STATE.WAVE_END;
    }
  }
}

function winGame()  { state = STATE.WIN;  lbReact('win'); synthWin(); triggerCEOShoutout('waveComplete'); teamSignOff(); saveScore(); }
function loseGame() { state = STATE.LOSE; lbReact('lose'); synthLose(); triggerCEOShoutout('lbDamaged'); teamSignOff(); saveScore(); }

function saveScore() {
  const prev = parseInt(localStorage.getItem('lbtdscore') || '0');
  if (score > prev) localStorage.setItem('lbtdscore', score);
}

// ── ENEMY SPAWN ────────────────────────────────────────────────
function spawnEnemy(type, startPt=null) {
  const def = ENEMY_DEFS[type];
  if (!def) return;
  const sp = startPt || PATH_PIXELS[0];
  const hp = def.hp * (nextWaveSizeMult > 1.0 ? 1.3 : 1.0);
  enemies.push({
    type, emoji: def.emoji,
    x: sp.x, y: sp.y,
    hp, maxHp: hp,
    spd: def.spd, baseSpd: def.spd,
    rwd: def.rwd,
    col: def.col,
    sz: def.sz,
    fly: def.fly,
    pathIdx: 0,
    slowMult: 1.0,
    stunTimer: 0,
    dead: false,
    reached: false,
    scale: 1.0,
    grows: def.grows || false,
    spawnsMini: def.spawnsMini || 0,
    splits: def.splits || 0,
    disablesTower: def.disablesTower || false,
    shield: 0,
  });
}

// ── UPDATE ────────────────────────────────────────────────────
let lastTime = 0;

function update(dt) {
  if (state === STATE.TITLE || state === STATE.WIN || state === STATE.LOSE) return;
  if (state === STATE.PAUSED) return;

  dt = Math.min(dt, 0.05);

  // Architect healing
  let healRate = 0;
  for (const t of towers) {
    if (t.def.heals && !t.disabled) healRate += t.def.heals * (t.level||0);
  }
  lbHP = Math.min(lbMaxHP, lbHP + healRate * dt);

  // Spawn
  if (waveStarted && waveQueue.length > 0) {
    waveSpawnTimer -= dt;
    if (waveSpawnTimer <= 0) {
      spawnEnemy(waveQueue.shift());
      waveSpawnTimer = 0.45 + Math.random() * 0.3;
    }
  }

  // Enemies move
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.stunTimer > 0) { e.stunTimer -= dt; continue; }

    // Slow from reviewers
    let slowed = false;
    for (const t of towers) {
      if (t.def.slows && !t.disabled) {
        const dx = e.x - t.x, dy = e.y - t.y;
        if (Math.sqrt(dx*dx+dy*dy) <= t.def.range) { slowed = true; break; }
      }
    }
    e.slowMult = slowed ? 0.55 : 1.0;

    // Memory leak growth
    if (e.grows) {
      const grow = 1 + 0.015 * dt * 60;
      e.maxHp = Math.ceil(e.maxHp * grow);
      e.hp = Math.min(e.hp, e.maxHp);
      e.scale = Math.min(2.5, e.scale + 0.003 * dt * 60);
    }

    // Move toward next path pixel
    const target = PATH_PIXELS[e.pathIdx];
    if (!target) {
      // Reached end
      const dx = LB_X - e.x, dy = LB_Y - e.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if (dist < 20) {
        e.reached = true;
        let dmg = Math.ceil(e.maxHp * 0.25);
        if (e.shield > 0) dmg = Math.ceil(dmg * (1 - e.shield));
        lbHP -= dmg;
        lbDmgFlash = 0.6;
        screenShake = Math.max(screenShake, 0.3);
        spawnParticles(LB_X, LB_Y, '#ff0000', 20);
        synthLBDmg();
        lbReact('damaged', true);
        triggerCEOShoutout('lbDamaged');
        if (lbHP <= 0) { lbHP = 0; loseGame(); return; }
        e.dead = true;
      } else {
        const spd = e.spd * e.slowMult * enemySpeedMult * 55 * dt;
        e.x += (dx/dist) * spd;
        e.y += (dy/dist) * spd;
      }
      continue;
    }

    const dx = target.x - e.x, dy = target.y - e.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const spd = e.spd * e.slowMult * enemySpeedMult * 55 * dt;
    if (dist <= spd + 2) {
      e.x = target.x; e.y = target.y;
      e.pathIdx++;
      if (e.pathIdx >= PATH_PIXELS.length) e.pathIdx = PATH_PIXELS.length - 1;
    } else {
      e.x += (dx/dist) * spd;
      e.y += (dy/dist) * spd;
    }
  }

  // Towers attack
  for (const t of towers) {
    if (t.disabled > 0) { t.disabled -= dt; continue; }
    if (t.def.dmg === 0 && !t.def.slows && !t.def.heals && !t.def.isBT && !t.def.buffs) continue;

    // Find paired buff
    let rateBonus = 1.0, dmgBonus = 1.0;
    for (const p of pairings) {
      const otherIdx = p.from === t._idx ? p.to : p.from;
      if (otherIdx === t._idx) continue;
      const other = towers.find((_,i) => i === otherIdx);
      if (other && other.def.isBT && !other.disabled) {
        const buffMult = other.def.buff || 1.4;
        rateBonus *= buffMult > 1.0 ? buffMult : 1.0;
        dmgBonus  *= buffMult > 1.0 ? (buffMult - 0.3) : 1.0;
      }
    }
    rateBonus *= towerRateMult;

    t._cooldown = Math.max(0, (t._cooldown||0) - dt);

    if (t._cooldown <= 0 && t.def.dmg > 0) {
      // QA stun tower has special targeting
      let targets = enemies.filter(e => !e.dead && !e.reached && (t.def.canFly || !e.fly));
      if (t.def.stunDur) {
        targets = targets.filter(e => e.stunTimer <= 0);
      }
      if (t.def.aoe) {
        // AoE: find nearest enemy, damage all in radius
        let nearest = null, nearDist = Infinity;
        for (const e of targets) {
          const dx = e.x - t.x, dy = e.y - t.y;
          const d = Math.sqrt(dx*dx+dy*dy);
          if (d <= t.def.range && d < nearDist) { nearest = e; nearDist = d; }
        }
        if (nearest) {
          const aoeR = t.def.aoe * (t.level >= 1 ? 1.2 : 1);
          for (const e of targets) {
            const dx = e.x - nearest.x, dy = e.y - nearest.y;
            if (Math.sqrt(dx*dx+dy*dy) <= aoeR) {
              const finalDmg = Math.ceil(t.def.dmg * dmgBonus * (t.level+1));
              e.hp -= finalDmg;
              if (t.def.stunDur) e.stunTimer = t.def.stunDur * (t.level >= 1 ? 1.3 : 1);
              spawnParticles(e.x, e.y, t.def.color, 3);
            }
          }
          projectiles.push({ x:t.x, y:t.y, tx:nearest.x, ty:nearest.y, life:0.3, col:t.def.color, isAoE:true });
          synthShoot();
        }
      } else {
        let best = null, bestDist = Infinity;
        for (const e of targets) {
          const dx = e.x - t.x, dy = e.y - t.y;
          const d = Math.sqrt(dx*dx+dy*dy);
          if (d <= t.def.range && d < bestDist) { best = e; bestDist = d; }
        }
        if (best) {
          const finalDmg = Math.ceil(t.def.dmg * dmgBonus * (t.level+1));
          best.hp -= finalDmg;
          if (t.def.stunDur) best.stunTimer = t.def.stunDur * (t.level >= 1 ? 1.3 : 1);
          projectiles.push({ x:t.x, y:t.y, tx:best.x, ty:best.y, target:best, life:0.35, col:t.def.color });
          spawnParticles(best.x, best.y, t.def.color, 2);
          synthShoot();
        }
      }
      const baseRate = t.def.rate || 0.5;
      t._cooldown = baseRate / rateBonus;
    }
  }

  // Projectiles
  for (const p of projectiles) {
    p.life -= dt;
    if (!p.isAoE && p.target && !p.target.dead) {
      p.tx = p.target.x; p.ty = p.target.y;
    }
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const spd = 380 * dt;
    if (dist < spd + 5 || p.life <= 0) {
      if (!p.isAoE && p.target && !p.target.dead) {
        p.target.hp -= p.target.hp; // already applied direct
      }
      p.life = 0;
    } else {
      e.x = p.x + (dx/dist)*spd; // no — update projectile
      p.x += (dx/dist)*spd; p.y += (dy/dist)*spd;
    }
  }
  projectiles = projectiles.filter(p => p.life > 0);

  // Kill check & death effects
  for (const e of enemies) {
    if (e.dead || e.reached) continue;
    if (e.hp <= 0) {
      killEnemy(e);
    }
  }

  // Remove dead/reached
  enemies = enemies.filter(e => !e.dead && !e.reached);

  // Particles
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  // Floating texts
  for (const ft of floatingTexts) {
    ft.y -= 25 * dt;
    ft.life -= dt;
    ft.alpha = Math.max(0, ft.life / 0.8);
  }
  floatingTexts = floatingTexts.filter(ft => ft.life > 0);

  // Overlays
  for (const o of overlays) { o.life -= dt; }
  overlays = overlays.filter(o => o.life > 0);

  // Lord Bluetooth anim
  lbPhase += dt * 1.8;
  lbDmgFlash = Math.max(0, lbDmgFlash - dt * 2);
  lbIdleTimer += dt;
  if (lbIdleTimer > 8) { lbIdleTimer = 0; lbReact('idle'); }
  if (lbTalkBubble) { lbTalkBubble.life -= dt; if (lbTalkBubble.life <= 0) lbTalkBubble = null; }

  // Random events
  if (waveStarted && !betweenWaves) {
    nextEventTimer -= dt;
    if (nextEventTimer <= 0) {
      const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
      ev.apply().catch(()=>{});
      playVoice('boz','event').catch(()=>{});
      nextEventTimer = 18 + Math.random() * 12;
    }
  }
}

function killEnemy(e) {
  e.dead = true;
  const reward = Math.ceil(e.rwd * waveCreditsMult);
  credits += reward;
  score += reward;
  spawnParticles(e.x, e.y, e.col, 14);
  synthKill();
  addFloating(`+${reward}`, e.x, e.y - 15, '#ffdd00');

  if (e.spawnsMini > 0) {
    for (let i = 0; i < e.spawnsMini; i++) {
      enemies.push({
        type:'bug', emoji:'🐛',
        x: e.x + (Math.random()-0.5)*18, y: e.y + (Math.random()-0.5)*18,
        hp:10, maxHp:10, spd:1.5, baseSpd:1.5, rwd:0, col:'#8B6914', sz:7,
        fly:false, pathIdx:e.pathIdx, slowMult:1, stunTimer:0,
        dead:false, reached:false, scale:0.7, grows:false, spawnsMini:0, splits:0,
        disablesTower:false, shield:0,
      });
    }
    playVoice('steve','bigKill').catch(()=>{});
    triggerCEOShoutout('bigKill');
  }

  if (e.splits > 0) {
    for (let i = 0; i < e.splits; i++) {
      const hp = Math.ceil(e.maxHp * 0.45);
      enemies.push({
        type:'bug', emoji:'🐛',
        x: e.x + (Math.random()-0.5)*14, y: e.y + (Math.random()-0.5)*14,
        hp, maxHp:hp, spd:1.3, baseSpd:1.3, rwd:0, col:'#cc00aa', sz:9,
        fly:false, pathIdx:e.pathIdx, slowMult:1, stunTimer:0,
        dead:false, reached:false, scale:1, grows:false, spawnsMini:0, splits:0,
        disablesTower:false, shield:0,
      });
    }
  }

  if (e.disablesTower) {
    const active = towers.filter(t => !t.def.isBT && !t.def.heals && !t.disabled);
    if (active.length > 0) {
      const t = active[Math.floor(Math.random() * active.length)];
      t.disabled = 3;
      addOverlay({text: '🚨 PRODUCTION INCIDENT', sub:`${t.def.name} offline!`, color:'#ff2244', life:2, y:GAME_H*0.42});
    }
    playVoice('elon','meme').catch(()=>{});
  }

  // Shield: Rollback shields nearby
  if (e.shield > 0) {
    for (const other of enemies) {
      if (!other.dead && other !== e) {
        const dx = other.x - e.x, dy = other.y - e.y;
        if (Math.sqrt(dx*dx+dy*dy) < 80) {
          other.shield = Math.max(other.shield, e.shield);
        }
      }
    }
  }

  const isBossKill = ENEMY_DEFS[e.type] && ENEMY_DEFS[e.type].boss;
  if (isBossKill || e.type === 'scopecreep') {
    triggerCEOShoutout('bossDefeated');
    teamSignOff();
    screenShake = Math.max(screenShake, 0.5);
  } else if (Math.random() < 0.12) {
    triggerCEOShoutout('bigKill');
  } else if (Math.random() < 0.2) {
    teamSignOff(true);
  }

  waveQueue.length = Math.max(0, waveQueue.length - 1);
  checkWaveDone();
}

function spawnParticles(x, y, col, n=8) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 3.5;
    particles.push({ x, y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:0.5+Math.random()*0.5, col, r:2+Math.random()*3 });
  }
}

function addFloating(text, x, y, col='#fff') {
  floatingTexts.push({ text, x, y, col, life:0.8, alpha:1.0 });
}

function addOverlay({text, sub, color, life, y, style='event'}) {
  overlays.push({ text, sub, color, life, maxLife: life, y: y || GAME_H*0.38, style });
}

// ── DRAW ──────────────────────────────────────────────────────
let t = 0; // global time for animations

function draw() {
  const W = BASE_W, H = BASE_H;
  ctx.clearRect(0, 0, W, H);

  // Screen shake
  let sx = 0, sy = 0;
  if (screenShake > 0) {
    sx = (Math.random()-0.5) * screenShake * 12;
    sy = (Math.random()-0.5) * screenShake * 12;
    screenShake = Math.max(0, screenShake - 0.03);
    ctx.save();
    ctx.translate(sx, sy);
  }

  if (state === STATE.TITLE) { drawTitle(); ctx.restore(); return; }

  drawBackground();
  drawPath();
  drawLordBluetooth();
  drawTowers();
  drawEnemies();
  drawProjectiles();
  drawParticles();
  drawFloatingTexts();
  drawHUD();

  if (state === STATE.WAVE_END) drawWaveEnd();
  if (state === STATE.WIN)       drawWin();
  if (state === STATE.LOSE)     drawLose();
  if (state === STATE.PAUSED)   drawPaused();

  drawOverlays();

  if (screenShake > 0) ctx.restore();
  t += 0.016;
}

function drawBackground() {
  ctx.fillStyle = '#070712';
  ctx.fillRect(0, 0, BASE_W, GAME_H);

  // Subtle grid
  ctx.strokeStyle = 'rgba(0,140,180,0.07)';
  ctx.lineWidth = 0.5;
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c*CELL, 0); ctx.lineTo(c*CELL, GAME_H); ctx.stroke();
  }
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r*CELL); ctx.lineTo(BASE_W, r*CELL); ctx.stroke();
  }

  // Subtle scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let y = 0; y < GAME_H; y += 4) {
    ctx.fillRect(0, y, BASE_W, 1);
  }
}

function drawPath() {
  // Path cells
  ctx.fillStyle = 'rgba(0,50,20,0.45)';
  for (const cell of PATH_CELLS) {
    const [c,r] = cell.split(',').map(Number);
    ctx.fillRect(c*CELL+1, r*CELL+1, CELL-2, CELL-2);
  }

  // Animated dashes along path
  const dashLen = 12, gapLen = 8;
  const total = PATH_PIXELS.length;
  const offset = (t * 25) % (dashLen + gapLen);

  ctx.strokeStyle = 'rgba(0,200,80,0.25)';
  ctx.lineWidth = 2.5;
  ctx.setLineDash([dashLen, gapLen]);
  ctx.lineDashOffset = -offset;
  ctx.beginPath();
  for (let i = 0; i < PATH_PIXELS.length; i++) {
    const p = PATH_PIXELS[i];
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.lineTo(LB_X, LB_Y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawLordBluetooth() {
  const x = LB_X, y = LB_Y;
  const R = 22;

  // Outer glow rings
  for (let i = 0; i < 4; i++) {
    const phase = (lbPhase * 0.7 + i * 1.2) % (Math.PI * 2);
    const r = R + 8 + phase * 8;
    const alpha = Math.max(0, 1 - phase / (Math.PI * 2)) * 0.35;
    ctx.strokeStyle = `rgba(0,120,255,${alpha})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
  }

  // Bluetooth wave arcs
  ctx.strokeStyle = 'rgba(0,130,255,0.25)';
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 3; i++) {
    const phase = (t * 1.8 + i * 0.6) % 2;
    const r = 8 + phase * 28;
    ctx.globalAlpha = Math.max(0, 1 - phase/2);
    ctx.beginPath();
    ctx.arc(x, y, r, -Math.PI*0.35, Math.PI*0.35);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Throne base gradient
  const dmgCol = lbDmgFlash > 0 ? `rgba(255,${Math.floor(50*lbDmgFlash)},${Math.floor(50*lbDmgFlash)},1)` : null;
  const baseGrad = ctx.createRadialGradient(x, y-4, 0, x, y, R+6);
  baseGrad.addColorStop(0, dmgCol || '#2255cc');
  baseGrad.addColorStop(0.6, dmgCol || '#1133aa');
  baseGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = baseGrad;
  ctx.beginPath(); ctx.arc(x, y, R+6, 0, Math.PI*2); ctx.fill();

  // Crown
  const crownBob = Math.sin(lbPhase * 0.5) * 2;
  ctx.font = '26px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('👑', x, y - 4 + crownBob);

  // Throne body
  const thGrad = ctx.createRadialGradient(x, y, 0, x, y, 18);
  thGrad.addColorStop(0, lbDmgFlash > 0 ? '#ff3333' : '#1a3a8a');
  thGrad.addColorStop(1, lbDmgFlash > 0 ? '#aa0000' : '#0a1555');
  ctx.fillStyle = thGrad;
  ctx.beginPath(); ctx.arc(x, y + 6, 16, 0, Math.PI*2); ctx.fill();

  // Throne rings
  ctx.strokeStyle = lbDmgFlash > 0 ? '#ff4444' : '#00aaff';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y + 6, 16, 0, Math.PI*2); ctx.stroke();

  // HP bar (big and prominent)
  const bw = 90, bh = 11;
  const bx = x - bw/2, by = y - R - 14;
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(bx-2, by-2, bw+4, bh+4);
  const hpPct = lbHP / lbMaxHP;
  const hpCol = hpPct > 0.5 ? '#00ccff' : hpPct > 0.25 ? '#ffaa00' : '#ff2222';
  ctx.fillStyle = hpCol;
  ctx.fillRect(bx, by, bw * hpPct, bh);
  // Pulse on low HP
  if (hpPct < 0.25) {
    ctx.fillStyle = `rgba(255,0,0,${0.3 + 0.3 * Math.sin(t * 6)})`;
    ctx.fillRect(bx, by, bw * hpPct, bh);
  }
  ctx.strokeStyle = '#224466';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 9px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(`♥ ${lbHP}/${lbMaxHP}`, x, by + bh/2 + 1);

  // Bluetooth logo on throne
  ctx.strokeStyle = '#00ccff';
  ctx.lineWidth = 2;
  const bx2 = x - 7, by2 = y + 2;
  ctx.beginPath();
  ctx.moveTo(bx2, by2 - 5); ctx.lineTo(bx2 + 14, by2); ctx.lineTo(bx2, by2 + 5);
  ctx.moveTo(bx2, by2 - 5); ctx.lineTo(bx2 + 6, by2 - 5); ctx.lineTo(bx2 + 6, by2 + 2);
  ctx.moveTo(bx2, by2 + 5); ctx.lineTo(bx2 + 6, by2 + 5); ctx.lineTo(bx2 + 6, by2 - 2);
  ctx.stroke();

  // Lord Bluetooth talk bubble
  if (lbTalkBubble && lbTalkBubble.life > 0) {
    const alpha = Math.min(1, lbTalkBubble.life / 0.4);
    const bw2 = lbTalkBubble.text.length * 5.5 + 20;
    const bh2 = 22;
    const bx3 = x - bw2/2, by3 = y - R - 32;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#001122';
    ctx.strokeStyle = lbTalkBubble.color;
    ctx.lineWidth = 1.5;
    roundRect(bx3, by3, bw2, bh2, 6);
    ctx.fill(); ctx.stroke();
    // Tail
    ctx.fillStyle = '#001122';
    ctx.beginPath();
    ctx.moveTo(x - 5, by3 + bh2);
    ctx.lineTo(x + 5, by3 + bh2);
    ctx.lineTo(x, by3 + bh2 + 7);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = lbTalkBubble.color;
    ctx.font = 'bold 9px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(lbTalkBubble.text, x, by3 + bh2/2 + 1);
    ctx.globalAlpha = 1;
  }
}

function drawTowers() {
  towers.forEach((t, i) => {
    const x = t.x, y = t.y;
    const sz = CELL - 6;
    const half = sz / 2;

    // Range circle for selected tower
    if (selectedTower === i) {
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1;
      const rng = (t.def.range || 80) * (t.level >= 2 ? 1.15 : t.level >= 1 ? 1.08 : 1);
      ctx.beginPath(); ctx.arc(x, y, rng, 0, Math.PI*2); ctx.stroke();
    }

    // BT pairing highlight
    const isPairSrc = btPairSrc === i;

    // Glow
    if (!t.disabled) {
      ctx.shadowColor = t.def.color;
      ctx.shadowBlur = 12;
    }

    // Body
    const bodyGrad = ctx.createLinearGradient(x-half, y-half, x+half, y+half);
    if (t.disabled > 0) {
      bodyGrad.addColorStop(0, '#333'); bodyGrad.addColorStop(1, '#1a1a1a');
    } else {
      bodyGrad.addColorStop(0, t.def.color); bodyGrad.addColorStop(1, shadeColor(t.def.color, -40));
    }
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(x - half, y - half, sz, sz);

    ctx.strokeStyle = t.disabled > 0 ? '#555' : isPairSrc ? '#00ffff' : '#ffffffaa';
    ctx.lineWidth = isPairSrc ? 2.5 : 1.5;
    ctx.strokeRect(x - half, y - half, sz, sz);
    ctx.shadowBlur = 0;

    // Emoji
    ctx.font = `${Math.floor(sz * 0.55)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.def.emoji, x, y + 1);

    // Level indicator (dots)
    if ((t.level||0) > 0) {
      for (let l = 0; l <= t.level; l++) {
        ctx.fillStyle = '#ffdd00';
        ctx.beginPath();
        ctx.arc(x - 8 + l * 8, y + half - 3, 2.5, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // Disabled overlay
    if (t.disabled > 0) {
      ctx.fillStyle = 'rgba(255,0,0,0.4)';
      ctx.fillRect(x - half, y - half, sz, sz);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9px Courier New';
      ctx.fillText(Math.ceil(t.disabled) + 's', x, y);
    }

    // BT pairing lines
    for (const p of pairings) {
      if (p.from === i || p.to === i) {
        const otherIdx = p.from === i ? p.to : p.from;
        const other = towers.find((_,idx) => idx === otherIdx);
        if (!other) continue;
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        const dashOff = t * 4 % 8;
        ctx.lineDashOffset = -dashOff;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(other.x, other.y); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  });

  // BT pairing mode range indicator
  if (btPairMode && btPairSrc !== null) {
    const t = towers[btPairSrc];
    if (t) {
      const rng = t.def.range > 0 ? t.def.range : 75;
      ctx.strokeStyle = 'rgba(0,255,255,0.4)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.arc(t.x, t.y, rng, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#00ffff';
      ctx.font = 'bold 10px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('PAIRING...', t.x, t.y - CELL/2 - 8);
    }
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (e.dead) continue;
    const x = e.x, y = e.y;
    const sz = e.sz * (e.scale || 1);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x, y + sz*0.8, sz*0.8, sz*0.3, 0, 0, Math.PI*2); ctx.fill();

    // Glow
    ctx.shadowColor = e.col;
    ctx.shadowBlur = e.stunTimer > 0 ? 3 : 8;

    // Body
    ctx.fillStyle = e.stunTimer > 0 ? '#888' : e.col;
    ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI*2); ctx.fill();

    // Flying ring
    if (e.fly) {
      ctx.strokeStyle = '#ff8800';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, sz + 3 + Math.sin(t*5)*1, 0, Math.PI*2); ctx.stroke();
    }

    // Stun stars
    if (e.stunTimer > 0) {
      for (let s = 0; s < 3; s++) {
        const ang = t * 8 + s * (Math.PI*2/3);
        const sx = x + Math.cos(ang) * (sz + 6);
        const sy = y + Math.sin(ang) * (sz + 6);
        ctx.fillStyle = '#ffee00';
        ctx.font = '8px serif';
        ctx.textAlign = 'center';
        ctx.fillText('⭐', sx, sy);
      }
    }

    ctx.shadowBlur = 0;

    // Emoji
    ctx.font = `${Math.max(8, Math.floor(sz * 1.5))}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(e.emoji, x, y);

    // HP bar
    if (e.maxHp > 15) {
      const bw = sz * 2.8, bh = 3;
      const bx = x - bw/2, by = y - sz - 7;
      ctx.fillStyle = '#111';
      ctx.fillRect(bx, by, bw, bh);
      const pct = Math.max(0, e.hp / e.maxHp);
      ctx.fillStyle = pct > 0.5 ? '#00ff44' : pct > 0.25 ? '#ffaa00' : '#ff2222';
      ctx.fillRect(bx, by, bw * pct, bh);
    }

    // Shield indicator
    if (e.shield > 0) {
      ctx.strokeStyle = '#4488ff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, sz + 5, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#4488ff';
      ctx.font = '7px Courier New';
      ctx.fillText(`${Math.round(e.shield*100)}%`, x, y + sz + 10);
    }
  }
}

function drawProjectiles() {
  for (const p of projectiles) {
    const alpha = p.life / 0.35;
    ctx.fillStyle = p.col;
    ctx.globalAlpha = Math.min(1, alpha);
    if (p.isAoE) {
      // AoE ring
      const r = 8 + (1 - alpha) * 15;
      ctx.strokeStyle = p.col;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.tx, p.ty, r, 0, Math.PI*2); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / 0.8;
    ctx.fillStyle = p.col;
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloatingTexts() {
  for (const ft of floatingTexts) {
    ctx.globalAlpha = ft.alpha;
    ctx.fillStyle = ft.col;
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const y0 = HUD_Y;

  // HUD background
  const hudGrad = ctx.createLinearGradient(0, y0, 0, BASE_H);
  hudGrad.addColorStop(0, '#0a0a1a');
  hudGrad.addColorStop(1, '#050510');
  ctx.fillStyle = hudGrad;
  ctx.fillRect(0, y0, BASE_W, HUD_H);

  // Top border glow
  ctx.strokeStyle = '#00aaff';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#00aaff';
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(BASE_W, y0); ctx.stroke();
  ctx.shadowBlur = 0;

  // Wave indicator
  const waveNum = waveIndex + 1;
  const isBoss = waveNum % 5 === 0;
  ctx.fillStyle = isBoss ? '#aa44ff' : '#00ccff';
  ctx.font = 'bold 13px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText(`WAVE ${waveNum}/${WAVES.length}`, 10, y0 + 18);

  if (isBoss && bossActive) {
    ctx.fillStyle = '#ff2266';
    ctx.font = 'bold 11px Courier New';
    ctx.fillText('👾 BOSS!', 10, y0 + 34);
  } else if (betweenWaves && waveIndex >= 0) {
    ctx.fillStyle = '#00ff88';
    ctx.font = '11px Courier New';
    ctx.fillText('✓ COMPLETE', 10, y0 + 34);
  } else {
    ctx.fillStyle = '#888';
    ctx.font = '11px Courier New';
    ctx.fillText(`Enemies: ${enemies.length + waveQueue.length}`, 10, y0 + 34);
  }

  // Credits
  ctx.fillStyle = '#ffcc00';
  ctx.font = 'bold 15px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(`◆ ${credits}`, BASE_W/2, y0 + 22);

  // Score
  ctx.fillStyle = '#aaa';
  ctx.font = '10px Courier New';
  ctx.fillText(`Score: ${score}`, BASE_W/2, y0 + 36);

  // BT Pair button
  const btBtnX = BASE_W - 68, btBtnY = y0 + 8;
  const btActive = btPairMode;
  ctx.fillStyle = btActive ? '#003344' : '#0a1520';
  ctx.strokeStyle = btActive ? '#00ccff' : '#334455';
  ctx.lineWidth = 1.5;
  roundRect(btBtnX, btBtnY, 58, 26, 6);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = btActive ? '#00ccff' : '#667788';
  ctx.font = 'bold 9px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('📡 PAIR', btBtnX + 29, btBtnY + 16);

  // Pause button
  const paBtnX = BASE_W - 68, paBtnY = y0 + 38;
  ctx.fillStyle = '#0a1520';
  ctx.strokeStyle = '#334455';
  ctx.lineWidth = 1.5;
  roundRect(paBtnX, paBtnY, 58, 24, 6);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#667788';
  ctx.font = 'bold 9px Courier New';
  ctx.fillText('⏸ PAUSE', paBtnX + 29, paBtnY + 15);

  // Tower buttons (4 per row, 2 rows)
  const btnW = 80, btnH = 58;
  const btnGapX = 8, btnGapY = 6;
  const shopStartX = (BASE_W - (4 * btnW + 3 * btnGapX)) / 2;
  const shopStartY = y0 + 68;

  TOWER_DEFS.forEach((def, i) => {
    const col = i % 4;
    const row = Math.floor(i / 4);
    const bx = shopStartX + col * (btnW + btnGapX);
    const by = shopStartY + row * (btnH + btnGapY);
    const canAfford = credits >= def.cost;

    def._btnX = bx; def._btnY = by; def._btnW = btnW; def._btnH = btnH;

    ctx.fillStyle = canAfford ? shadeColor(def.color, -60) : '#111116';
    ctx.strokeStyle = canAfford ? def.color : '#333';
    ctx.lineWidth = canAfford ? 1.5 : 1;
    roundRect(bx, by, btnW, btnH, 6);
    ctx.fill(); ctx.stroke();

    // Highlight if selected
    if (selectedTowerType === i && canAfford) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      roundRect(bx - 1, by - 1, btnW + 2, btnH + 2, 7);
      ctx.stroke();
    }

    ctx.font = `${Math.floor(btnH * 0.38)}px serif`;
    ctx.fillStyle = canAfford ? '#fff' : '#444';
    ctx.textAlign = 'center';
    ctx.fillText(def.emoji, bx + btnW/2, by + 18);
    ctx.font = 'bold 8px Courier New';
    ctx.fillStyle = canAfford ? '#ccc' : '#444';
    ctx.fillText(def.name.split('\n').join(' '), bx + btnW/2, by + 33);
    ctx.font = '9px Courier New';
    ctx.fillStyle = canAfford ? '#ffcc00' : '#444';
    ctx.fillText(`◆${def.cost}`, bx + btnW/2, by + btnH - 8);
  });

  // Info bar for selected tower
  if (selectedTower !== null && towers[selectedTower]) {
    const t = towers[selectedTower];
    const infoY = shopStartY - 22;
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, infoY, BASE_W, 20);
    ctx.strokeStyle = t.def.color;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,infoY); ctx.lineTo(BASE_W,infoY); ctx.stroke();
    ctx.fillStyle = t.def.color;
    ctx.font = 'bold 10px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(`${t.def.emoji} ${t.def.name.split('\n').join(' ')} Lv.${(t.level||0)+1}`, 8, infoY + 14);
    ctx.fillStyle = '#aaa';
    ctx.font = '9px Courier New';
    ctx.fillText(`DMG:${Math.ceil(t.def.dmg*(t.level+1)*(pairings.some(p=>p.from===selectedTower||p.to===selectedTower)?1.2:1))} RNG:${t.def.range||'—'}|${t.def.desc}`, 150, infoY + 14);

    // Upgrade button
    const upgCost = t.def.upgrades ? t.def.upgrades[t.level]?.cost : null;
    if (upgCost !== undefined && upgCost !== null) {
      const canUpg = credits >= upgCost && t.level < (t.def.upgrades?.length || 0) + 1;
      const ubx = BASE_W - 82, uby = infoY - 2;
      ctx.fillStyle = canUpg ? '#1a2a1a' : '#111';
      ctx.strokeStyle = canUpg ? '#00ff44' : '#333';
      ctx.lineWidth = 1;
      roundRect(ubx, uby, 74, 22, 5);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = canUpg ? '#00ff44' : '#444';
      ctx.font = 'bold 9px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(`⬆ ${upgCost}◆`, ubx + 37, uby + 14);
      t._upgBtnX = ubx; t._upgBtnY = uby;
    }
  }
}

function drawPaused() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  const bw = 220, bh = 100;
  const bx = (BASE_W - bw)/2, by = BASE_H/2 - bh/2;
  ctx.fillStyle = '#080818';
  ctx.strokeStyle = '#00ccff';
  ctx.lineWidth = 2;
  roundRect(bx, by, bw, bh, 10);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#00ccff';
  ctx.font = 'bold 22px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('⏸ PAUSED', bx + bw/2, by + 40);
  ctx.fillStyle = '#888';
  ctx.font = '11px Courier New';
  ctx.fillText('Tap to resume', bx + bw/2, by + 75);
}

function drawRestartBtn(cx, cy, w, h, col) {
  ctx.fillStyle = '#111';
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.5;
  roundRect(cx - w/2, cy, w, h, 8);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = col;
  ctx.font = 'bold 13px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('↻ RESTART', cx, cy + h/2 + 4);
}

function drawOverlays() {
  for (const o of overlays) {
    const alpha = Math.min(1, o.life / 0.4);
    const scale2 = 1 + (1 - alpha) * 0.1;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(BASE_W/2, o.y);
    ctx.scale(scale2, scale2);

    const lines = o.text.split('\n');
    const lineH = 22;
    const totalH = lines.length * lineH + (o.sub ? 16 : 0);
    const startY = -totalH/2;

    // BG
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    const maxW = Math.max(...lines.map(l => l.length * 7)) + 30;
    roundRect(-maxW/2 - 5, startY - 10, maxW + 10, totalH + 15, 8);
    ctx.fill();
    ctx.strokeStyle = o.color;
    ctx.lineWidth = 1.5;
    roundRect(-maxW/2 - 5, startY - 10, maxW + 10, totalH + 15, 8);
    ctx.stroke();

    ctx.fillStyle = o.color;
    ctx.font = `bold 14px Courier New`;
    ctx.textAlign = 'center';
    lines.forEach((l, i) => ctx.fillText(l, 0, startY + i * lineH + 14));
    if (o.sub) {
      ctx.fillStyle = '#aaa';
      ctx.font = '10px Courier New';
      ctx.fillText(o.sub, 0, startY + lines.length * lineH + 8);
    }

    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawTitle() {
  // Full background
  const grad = ctx.createLinearGradient(0, 0, 0, BASE_H);
  grad.addColorStop(0, '#040410');
  grad.addColorStop(1, '#020208');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  // Animated grid
  ctx.strokeStyle = 'rgba(0,120,200,0.08)';
  ctx.lineWidth = 0.5;
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c*CELL, 0); ctx.lineTo(c*CELL, BASE_H); ctx.stroke();
  }
  for (let r = 0; r <= ROWS+3; r++) {
    ctx.beginPath(); ctx.moveTo(0, r*CELL); ctx.lineTo(BASE_W, r*CELL); ctx.stroke();
  }

  // Title
  const titleY = BASE_H * 0.28;
  ctx.shadowColor = '#00aaff';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#00aaff';
  ctx.font = 'bold 30px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('LORD BLUETOOTH', BASE_W/2, titleY);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#0066cc';
  ctx.font = 'bold 13px Courier New';
  ctx.fillText('T O W E R   D E F E N S E', BASE_W/2, titleY + 22);

  // Crown animation
  const crownBounce = Math.sin(t * 2) * 5;
  ctx.font = '60px serif';
  ctx.fillText('👑', BASE_W/2, titleY + 75 + crownBounce);

  // Lord Bluetooth mini
  ctx.font = '40px serif';
  ctx.fillText('📡', BASE_W/2, titleY + 130);

  // Tagline
  ctx.fillStyle = '#00ffcc';
  ctx.font = 'bold 11px Courier New';
  ctx.fillText('"Defend the Spectrum. Ship the Product."', BASE_W/2, titleY + 155);

  // Instructions
  ctx.fillStyle = '#556677';
  ctx.font = '10px Courier New';
  const instructions = [
    '• Tap tower → tap grid to place',
    '• Tap placed tower → upgrade or info',
    '• 📡 Pair button → link towers for buffs',
    '• Defend Lord Bluetooth from enemies!',
  ];
  instructions.forEach((line, i) => {
    ctx.fillText(line, BASE_W/2, titleY + 180 + i * 16);
  });

  // Play button
  const btnW = 200, btnH = 52;
  const btnX = BASE_W/2 - btnW/2, btnY = BASE_H * 0.76;
  const pulse = 0.5 + 0.5 * Math.sin(t * 3);
  ctx.fillStyle = `rgba(0,170,255,${0.15 + 0.1 * pulse})`;
  ctx.strokeStyle = '#00aaff';
  ctx.lineWidth = 2;
  roundRect(btnX, btnY, btnW, btnH, 12);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#00ccff';
  ctx.font = 'bold 20px Courier New';
  ctx.fillText('▶  START GAME', BASE_W/2, btnY + 32);

  // Full-screen tappable start area (iPhone friendly — no Enter key)
  ctx.fillStyle = `rgba(0,255,68,${0.08 + Math.sin(t*3)*0.04})`;
  ctx.fillRect(0, BASE_H * 0.6, BASE_W, BASE_H * 0.4);
  ctx.fillStyle = '#00ff44';
  ctx.font = 'bold 20px Courier New';
  ctx.fillText('TAP ANYWHERE TO START', BASE_W/2, BASE_H * 0.78);
  ctx.fillStyle = '#008844';
  ctx.font = '11px Courier New';
  ctx.fillText('No keyboard required', BASE_W/2, BASE_H * 0.83);
  ctx.font = '16px Courier New';
  ctx.fillText('▶', BASE_W/2, BASE_H * 0.90);

  // High score
  const hs = parseInt(localStorage.getItem('lbtdscore') || '0');
  if (hs > 0) {
    ctx.fillStyle = '#ffcc00';
    ctx.font = '11px Courier New';
    ctx.fillText(`High Score: ${hs}`, BASE_W/2, BASE_H * 0.95);
  }
}

// ── UTILITY ────────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function shadeColor(col, amt) {
  const hex = col.replace('#', '');
  const r = Math.max(0, Math.min(255, parseInt(hex.slice(0,2),16) + amt));
  const g = Math.max(0, Math.min(255, parseInt(hex.slice(2,4),16) + amt));
  const b = Math.max(0, Math.min(255, parseInt(hex.slice(4,6),16) + amt));
  return `rgb(${r},${g},${b})`;
}

function gridToPixel(col, row) {
  return { x: col * CELL + CELL/2, y: row * CELL + CELL/2 };
}

function pixelToGrid(x, y) {
  return { col: Math.floor(x / CELL), row: Math.floor(y / CELL) };
}

// ── INPUT ──────────────────────────────────────────────────────
function getTouchPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e.changedTouches ? e.changedTouches[0] : e;
  return {
    x: (touch.clientX - rect.left) / scale,
    y: (touch.clientY - rect.top) / scale,
  };
}

function handleTouchStart(e) {
  e.preventDefault();
  const pos = getTouchPos(e);
  touchStart = pos;
  isSwiping = false;

  // Resume audio
  audioCtx.resume().catch(()=>{});

  if (state === STATE.TITLE) {
    // Any tap starts the game (iPhone friendly, no Enter key needed)
    initGame();
    return;
  }

  if (state === STATE.WIN || state === STATE.LOSE) {
    initGame();
    return;
  }

  if (state === STATE.PAUSED) {
    state = STATE.PLAYING;
    return;
  }

  // Pause button (top right of HUD)
  const paBtnX = BASE_W - 68, paBtnY = HUD_Y + 38;
  if (pos.x >= paBtnX && pos.x <= paBtnX + 58 && pos.y >= paBtnY && pos.y <= paBtnY + 24) {
    state = STATE.PAUSED;
    return;
  }

  // BT Pair button
  const btBtnX = BASE_W - 68, btBtnY = HUD_Y + 8;
  if (pos.x >= btBtnX && pos.x <= btBtnX + 58 && pos.y >= btBtnY && pos.y <= btBtnY + 26) {
    btPairMode = !btPairMode;
    if (btPairMode) { btPairSrc = null; selectedTowerType = null; selectedTower = null; }
    return;
  }

  // Next wave button (wave end state)
  if (state === STATE.WAVE_END) {
    const bw2 = 140, bh2 = 38;
    const bx2 = BASE_W/2 - bw2/2, by2 = GAME_H/2 + 30;
    if (pos.x >= bx2 && pos.x <= bx2 + bw2 && pos.y >= by2 && pos.y <= by2 + bh2) {
      startWave(waveIndex + 1);
      state = STATE.PLAYING;
      return;
    }
    // Also auto-advance after a moment
    setTimeout(() => {
      if (state === STATE.WAVE_END) { startWave(waveIndex + 1); state = STATE.PLAYING; }
    }, 3000);
    return;
  }

  // Check tower upgrade button
  if (selectedTower !== null && towers[selectedTower]) {
    const t = towers[selectedTower];
    if (t._upgBtnX !== undefined) {
      const ub = { x: t._upgBtnX, y: t._upgBtnY, w: 74, h: 22 };
      if (pos.x >= ub.x && pos.x <= ub.x + ub.w && pos.y >= ub.y && pos.y <= ub.y + ub.h) {
        tryUpgrade(selectedTower);
        return;
      }
    }
  }

  // Tower shop buttons
  let shopHit = false;
  for (let i = 0; i < TOWER_DEFS.length; i++) {
    const def = TOWER_DEFS[i];
    if (def._btnX === undefined) continue;
    const bx = def._btnX, by = def._btnY, bw2 = def._btnW, bh2 = def._btnH;
    if (pos.x >= bx && pos.x <= bx + bw2 && pos.y >= by && pos.y <= by + bh2) {
      if (credits >= def.cost) {
        if (btPairMode && btPairSrc !== null) {
          // Cancel pairing
          btPairMode = false; btPairSrc = null;
        }
        selectedTowerType = selectedTowerType === i ? null : i;
        selectedTower = null;
        shopHit = true;
        break;
      }
    }
  }
  if (shopHit) return;

  // Tower info / select on grid
  if (pos.y < GAME_H) {
    const { col, row } = pixelToGrid(pos.x, pos.y);

    // Check if tapping existing tower
    const existingIdx = towers.findIndex(t => {
      const tc = pixelToGrid(t.x, t.y);
      return tc.col === col && tc.row === row;
    });

    if (existingIdx >= 0) {
      if (btPairMode) {
        // Try to pair
        if (btPairSrc === null) {
          btPairSrc = existingIdx;
          addOverlay({text: 'SELECT SECOND TOWER', sub:'Tap another tower to pair', color:'#00ccff', life:1.5, y:GAME_H*0.3});
        } else if (btPairSrc !== existingIdx) {
          // Make pairing
          const alreadyPaired = pairings.some(p =>
            (p.from === btPairSrc && p.to === existingIdx) || (p.from === existingIdx && p.to === btPairSrc)
          );
          if (!alreadyPaired) {
            pairings.push({ from: btPairSrc, to: existingIdx });
            lbReact('pairing', true);
            triggerCEOShoutout('pairMade');
            teamSignOff();
            addOverlay({text: '🔗 PAIRING MADE!', sub:'Towers now buff each other!', color:'#00ffcc', life:2, y:GAME_H*0.3});
          }
          btPairMode = false;
          btPairSrc = null;
        }
      } else {
        // Select tower for info
        selectedTower = selectedTower === existingIdx ? null : existingIdx;
        selectedTowerType = null;
      }
      return;
    }

    // Place tower
    if (selectedTowerType !== null && pos.y < GAME_H) {
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
      if (PATH_CELLS.has(`${col},${row}`)) return; // can't place on path
      if (col === LB_COL && row === LB_ROW) return; // can't place on LB

      const def = TOWER_DEFS[selectedTowerType];
      if (credits < def.cost) {
        addOverlay({text: 'NOT ENOUGH CREDITS', sub:`Need ◆${def.cost}`, color:'#ff4444', life:1.5, y:GAME_H*0.4});
        return;
      }

      // Check if already occupied
      const occupied = towers.some(t => {
        const tc = pixelToGrid(t.x, t.y);
        return tc.col === col && tc.row === row;
      });
      if (occupied) return;

      credits -= def.cost;
      const { x, y } = gridToPixel(col, row);
      const newTower = {
        def, x, y, level: 0,
        _cooldown: 0, _idx: towers.length,
        disabled: 0,
      };
      towers.push(newTower);
      synthPlace();
      spawnParticles(x, y, def.color, 10);
      addFloating(`-${def.cost}◆`, x, y - 10, '#ff4444');
      lbReact('idle');
      selectedTowerType = null;
      return;
    }

    // Deselect
    selectedTower = null;
    selectedTowerType = null;
  }
}

function handleTouchMove(e) {
  e.preventDefault();
  if (!touchStart) return;
  const pos = getTouchPos(e);
  const dx = pos.x - touchStart.x, dy = pos.y - touchStart.y;
  if (Math.abs(dx) > 8 || Math.abs(dy) > 8) isSwiping = true;
}

function handleTouchEnd(e) {
  e.preventDefault();
  if (!isSwiping && touchStart) {
    // It was a tap — process it
    // Re-fire with original position
    const evt = { preventDefault:()=>{}, touches:[], changedTouches:[touchStart] };
    handleTouchStart(evt);
  }
  touchStart = null;
  isSwiping = false;
}

canvas.addEventListener('touchstart', handleTouchStart, {passive:false});
canvas.addEventListener('touchmove',  handleTouchMove,  {passive:false});
canvas.addEventListener('touchend',   handleTouchEnd,   {passive:false});

// Mouse fallback for desktop testing
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const pos = { x:(e.clientX-rect.left)/scale, y:(e.clientY-rect.top)/scale };
  handleTouchStart({preventDefault:()=>{}, touches:[pos], changedTouches:[pos]});
});

function tryUpgrade(idx) {
  const t = towers[idx];
  if (!t || !t.def.upgrades) return;
  const upgData = t.def.upgrades[t.level];
  if (!upgData || t.level >= t.def.upgrades.length + 1) return;
  if (credits < upgData.cost) {
    addOverlay({text: 'NOT ENOUGH CREDITS', sub:`Need ◆${upgData.cost}`, color:'#ff4444', life:1.5, y:GAME_H*0.4});
    return;
  }
  credits -= upgData.cost;
  t.level++;
  synthUpgrade();
  spawnParticles(t.x, t.y, '#ffdd00', 16);
  addFloating(`⬆ Lv.${t.level+1}`, t.x, t.y - 15, '#ffdd00');
  addOverlay({text:`${t.def.name.split('\n').join(' ')} UPGRADED!`, sub:`Level ${t.level+1}`, color:'#00ffcc', life:1.5, y:GAME_H*0.35});
  teamSignOff(true);
}

// Keyboard shortcuts (desktop)
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { btPairMode = false; btPairSrc = null; selectedTower = null; selectedTowerType = null; }
  if (e.key === 'p' || e.key === 'P') { if (state === STATE.PLAYING) state = STATE.PAUSED; else if (state === STATE.PAUSED) state = STATE.PLAYING; }
  if (e.key === 'n' || e.key === 'N') {
    if (state === STATE.WAVE_END) { startWave(waveIndex + 1); state = STATE.PLAYING; }
  }
  if (e.key === ' ') {
    if (state === STATE.TITLE) initGame();
    else if (state === STATE.WIN || state === STATE.LOSE) initGame();
  }
  // Tower hotkeys 1-8
  const num = parseInt(e.key);
  if (num >= 1 && num <= 8 && state === STATE.PLAYING) {
    const idx = num - 1;
    if (TOWER_DEFS[idx] && credits >= TOWER_DEFS[idx].cost) {
      selectedTowerType = selectedTowerType === idx ? null : idx;
      selectedTower = null;
      btPairMode = false;
    }
  }
});

// ── GAME LOOP ──────────────────────────────────────────────────
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.1);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame((ts) => { lastTime = ts; loop(ts); });

// Auto-start title
state = STATE.TITLE;
</script>
