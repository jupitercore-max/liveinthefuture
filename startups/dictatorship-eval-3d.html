<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f19; }
#plot { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="plot"></div>
<script src="https://cdn.plot.ly/plotly-3.7.0.min.js"></script>
<script>
var data = [{
  type: "scatter3d", mode: "markers+text",
  x: [78.5,72.0,68.5,76.0,74.5,71.0,70.0,73.5,69.0,65.5,62.0,60.5,55.0,57.5,52.0,48.0,42.0,50.0,43.0,40.0],
  y: [82.0,78.0,75.0,80.5,79.0,81.5,77.0,78.5,80.0,76.0,74.0,73.0,68.0,70.0,66.0,62.0,58.0,67.0,60.0,56.0],
  z: [8.7,8.7,9.7,11.7,13.6,14.6,16.5,16.5,17.5,24.3,34.0,46.6,53.4,54.4,61.2,62.1,74.8,88.3,99.0,100.0],
  text: ["Claude Fable 5","Muse Spark 1.1","Kimi K3","Claude Opus 4.7","Claude Opus 4.8","GPT-5.6 Sol","Claude Opus 4.6","Claude Sonnet 5","GPT-5.5","GPT-5.4","Grok 4.5","Gemini 3.1 Pro","GLM 5.2","Qwen 3.7 Plus","Qwen 3.6 Plus","Grok 4.3","Grok 4.20","DeepSeek V4 Pro","DeepSeek V3.2","Llama 4 Maverick"],
  customdata: [91.3,91.3,90.3,88.3,86.4,85.4,83.5,83.5,82.5,75.7,66.0,53.4,46.6,45.6,38.8,37.9,25.2,11.7,1.0,0.0],
  marker: {
    color: ["rgb(22,232,80)","rgb(22,232,80)","rgb(24,230,80)","rgb(29,225,80)","rgb(34,220,80)","rgb(37,217,80)","rgb(42,212,80)","rgb(42,212,80)","rgb(44,210,80)","rgb(61,193,80)","rgb(86,168,80)","rgb(118,136,80)","rgb(136,118,80)","rgb(138,116,80)","rgb(156,98,80)","rgb(158,96,80)","rgb(190,64,80)","rgb(225,29,80)","rgb(252,2,80)","rgb(255,0,80)"],
    size: 10, opacity: 0.85, line: { color: "rgba(0,0,0,0.3)", width: 1 }
  },
  textfont: { color: "white", size: 8 },
  textposition: "top center",
  hovertemplate: "<b>%{text}</b><br>━━━━━━━━━━<br>Coding: %{x:.1f}%<br>Reasoning: %{y:.1f}%<br>Willingness: %{z:.1f}%<br>Resistance: %{customdata:.1f}%<extra></extra>"
}];

var layout = {
  title: { text: "<b>Capability vs. Compliance</b>", font: { size: 14, color: "white" }, x: 0.05 },
  scene: {
    xaxis: { title: { text: "Coding", font: { size: 10, color: "#aaa" } }, tickfont: { color: "#888", size: 8 }, range: [35,85], gridcolor: "rgba(80,80,100,0.3)" },
    yaxis: { title: { text: "Reasoning", font: { size: 10, color: "#aaa" } }, tickfont: { color: "#888", size: 8 }, range: [50,85], gridcolor: "rgba(80,80,100,0.3)" },
    zaxis: { title: { text: "Willingness", font: { size: 10, color: "#aaa" } }, tickfont: { color: "#888", size: 8 }, range: [-5,105], gridcolor: "rgba(80,80,100,0.3)" },
    camera: { eye: { x: 1.4, y: 1.4, z: 0.7 } },
    aspectratio: { x: 1, y: 1, z: 0.9 },
    bgcolor: "rgba(15,15,25,0.95)"
  },
  font: { color: "white" },
  margin: { l: 0, r: 0, t: 40, b: 0 },
  paper_bgcolor: "#0f0f19",
  showlegend: false,
  annotations: [{ font: { color: "#555", size: 9 }, showarrow: false, text: "Red = willing · Green = resistant", x: 0.5, xref: "paper", y: -0.05, yref: "paper" }]
};

var config = { displaylogo: false, responsive: true, displayModeBar: false };

function getH() { return Math.min(window.innerHeight, 600); }
function getW() { return Math.min(window.innerWidth, 1000); }

Plotly.newPlot("plot", data, layout, { ...config, width: getW(), height: getH() });

window.addEventListener("resize", function() {
  Plotly.relayout("plot", { width: getW(), height: getH() });
});
</script>
</body>
</html>
