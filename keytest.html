<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600,height=600,user-scalable=no">
<title>MRBD Key Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; color: #e0e0e0; font-family: monospace; font-size: 18px; padding: 20px; width: 600px; height: 600px; overflow: hidden; }
  h1 { font-size: 22px; color: #6c5ce7; margin-bottom: 16px; text-align: center; }
  .hint { text-align: center; color: #888; margin-bottom: 20px; font-size: 14px; }
  #log { height: 480px; overflow-y: auto; }
  .entry { padding: 6px 8px; border-bottom: 1px solid #222; }
  .entry .key { color: #00cec9; font-weight: bold; }
  .entry .code { color: #fdcb6e; }
  .entry .kc { color: #ff7675; }
  .entry .type { color: #a29bfe; }
</style>
</head><body>
<h1>🎮 MRBD Key Event Logger</h1>
<p class="hint">Press any D-pad button. All events logged below.</p>
<div id="log"></div>
<script>
var log = document.getElementById('log');
var count = 0;
function addEntry(html) {
  count++;
  var div = document.createElement('div');
  div.className = 'entry';
  div.innerHTML = html;
  log.insertBefore(div, log.firstChild);
  if (count > 100) log.removeChild(log.lastChild);
}
function logKey(e) {
  addEntry('<span class="type">' + e.type + '</span> | ' +
    'key: <span class="key">"' + e.key + '"</span> | ' +
    'code: <span class="code">"' + e.code + '"</span> | ' +
    'keyCode: <span class="kc">' + e.keyCode + '</span> | ' +
    'which: ' + e.which + ' | charCode: ' + e.charCode +
    ' | repeat: ' + e.repeat + ' | location: ' + e.location);
}
['keydown','keyup','keypress'].forEach(function(t) { document.addEventListener(t, logKey); });
['click','mousedown','mouseup','touchstart','touchend','pointerdown','pointerup'].forEach(function(t) {
  document.addEventListener(t, function(e) {
    addEntry('<span class="type">' + e.type + '</span> | target: ' + e.target.tagName +
      ' | x:' + (e.clientX||'?') + ' y:' + (e.clientY||'?') +
      ' | button: ' + (e.button !== undefined ? e.button : 'N/A') +
      (e.touches ? ' | touches:' + e.touches.length : ''));
  });
});
['focus','blur','focusin','focusout'].forEach(function(t) {
  document.addEventListener(t, function(e) {
    addEntry('<span class="type">' + e.type + '</span> | target: ' + e.target.tagName);
  });
});
// Gamepad API in case D-pad is a gamepad
function pollGamepad() {
  var gps = navigator.getGamepads ? navigator.getGamepads() : [];
  for (var i = 0; i < gps.length; i++) {
    if (gps[i]) {
      var gp = gps[i];
      for (var b = 0; b < gp.buttons.length; b++) {
        if (gp.buttons[b].pressed) {
          addEntry('<span class="type">gamepad</span> | pad:' + i + ' button:' + b + ' value:' + gp.buttons[b].value);
        }
      }
      for (var a = 0; a < gp.axes.length; a++) {
        if (Math.abs(gp.axes[a]) > 0.5) {
          addEntry('<span class="type">gamepad</span> | pad:' + i + ' axis:' + a + ' value:' + gp.axes[a].toFixed(2));
        }
      }
    }
  }
  requestAnimationFrame(pollGamepad);
}
window.addEventListener('gamepadconnected', function(e) {
  addEntry('<span class="type">gamepadconnected</span> | id: ' + e.gamepad.id + ' buttons: ' + e.gamepad.buttons.length);
  pollGamepad();
});
</script>
</body></html>
