<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://rayhe.net/fov.html" />
  <meta property="og:title" content="FOV Calculator" />
  <meta property="og:url" content="https://rayhe.net/fov.html" />
  <meta property="og:site_name" content="rayhe.net" />
  <meta name="twitter:card" content="summary" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOV Calculator</title>

  <!-- Favicons -->
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" sizes="16x16 32x32 64x64" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">

  <script>
    (function(){var t=localStorage.getItem('theme');
    if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))
    document.documentElement.classList.add('dark');})();
  </script>

  <style>
    :root {
      --accent: #1E90FF;
      --accent-hover: #0066CC;
      --bg: #fafafa;
      --text: #1a1a1a;
      --text-muted: #666;
      --border: #ddd;
      --card-bg: #fff;
      --radius: 8px;
      --font-mono: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
    }

    html.dark {
      --accent: #4da6ff;
      --accent-hover: #80bfff;
      --bg: #1a1a1a;
      --text: #e0e0e0;
      --text-muted: #999;
      --border: #333;
      --card-bg: #252525;
    }

    .theme-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      padding: 6px 12px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      z-index: 9999;
      opacity: 0.5;
      transition: opacity 0.15s;
    }
    .theme-toggle:hover { opacity: 1; }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-mono);
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 30px;
    }

    header a {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    h1 {
      font-size: 1.5rem;
      margin: 10px 0;
      font-weight: 700;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Calculator Layout */
    .calculator-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 30px;
      position: sticky;
      top: 10px;
      z-index: 100;
      background: var(--bg);
      padding: 10px 0;
    }

    @media (max-width: 800px) {
      .calculator-layout {
        grid-template-columns: 1fr;
        position: static;
      }
    }

    /* Input Card */
    .input-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group:last-child {
      margin-bottom: 0;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-row input[type="range"] {
      flex: 1;
      cursor: pointer;
    }

    .input-row input[type="number"] {
      width: 90px;
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 600;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      text-align: right;
    }

    .input-row input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .input-row select {
      flex: 1;
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
    }

    .input-row select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .input-unit {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-width: 30px;
    }

    /* Results Display */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .result-item {
      background: var(--bg);
      padding: 16px;
      border-radius: var(--radius);
      text-align: center;
    }

    .result-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .result-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }

    .result-item.highlight {
      background: var(--accent);
      color: #fff;
    }

    .result-item.highlight .result-value {
      color: #fff;
    }

    .result-item.highlight .result-label {
      color: rgba(255,255,255,0.8);
    }

    /* Visualization */
    .viz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .viz-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    #displayCanvas {
      width: 100%;
      height: auto;
      border-radius: var(--radius);
      background: var(--card-bg);
    }

    /* Reference Table */
    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .reference-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .reference-table th {
      background: var(--bg);
      padding: 12px 10px;
      text-align: left;
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    .reference-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }

    .reference-table tr:last-child td {
      border-bottom: none;
    }

    .reference-table tr:hover td {
      background: var(--bg);
    }

    .reference-table .device-name {
      font-weight: 600;
      color: var(--text);
    }

    .reference-table .numeric {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .reference-table .highlight-cell {
      color: var(--accent);
      font-weight: 600;
    }

    .table-section {
      margin-bottom: 30px;
    }

    .table-scroll {
      overflow-x: auto;
    }

    /* Clickable row */
    .reference-table tr.clickable {
      cursor: pointer;
    }

    .reference-table tr.clickable:hover td {
      background: rgba(30, 144, 255, 0.05);
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <a href="/">&larr; rayhe.net</a>
      <h1>FOV Calculator</h1>
      <p class="subtitle">Calculate field of view and pixels per degree for displays</p>
    </header>

    <div class="calculator-layout">
      <div class="input-card">
        <div class="input-group">
          <label>Screen Size</label>
          <div class="input-row">
            <input type="range" id="screenSize" min="1" max="120" value="15.6" step="0.1" oninput="updateValues()">
            <input type="number" id="screenSizeInput" min="1" max="120" value="15.6" step="0.1" oninput="syncSlider('screenSize', this.value)">
            <span class="input-unit">in</span>
          </div>
        </div>

        <div class="input-group">
          <label>Aspect Ratio</label>
          <div class="input-row">
            <select id="aspectRatio" onchange="updateValues()">
              <option value="16/9">16:9 (Widescreen)</option>
              <option value="16/10">16:10 (MacBook)</option>
              <option value="3/2">3:2 (Surface)</option>
              <option value="4/3">4:3 (Classic)</option>
              <option value="21/9">21:9 (Ultrawide)</option>
              <option value="32/9">32:9 (Super Ultrawide)</option>
              <option value="1/1">1:1 (Square)</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label>Viewing Distance</label>
          <div class="input-row">
            <input type="range" id="distance" min="6" max="240" value="24" step="1" oninput="updateValues()">
            <input type="number" id="distanceInput" min="6" max="240" value="24" step="1" oninput="syncSlider('distance', this.value)">
            <span class="input-unit">in</span>
          </div>
        </div>

        <div class="input-group">
          <label>Horizontal Resolution</label>
          <div class="input-row">
            <input type="range" id="horizontalResolution" min="320" max="7680" value="1920" step="1" oninput="updateValues()">
            <input type="number" id="horizontalResolutionInput" min="320" max="7680" value="1920" step="1" oninput="syncSlider('horizontalResolution', this.value)">
            <span class="input-unit">px</span>
          </div>
        </div>

        <div class="results-grid">
          <div class="result-item">
            <div class="result-value" id="hfov">--</div>
            <div class="result-label">H-FOV</div>
          </div>
          <div class="result-item">
            <div class="result-value" id="vfov">--</div>
            <div class="result-label">V-FOV</div>
          </div>
          <div class="result-item">
            <div class="result-value" id="dfov">--</div>
            <div class="result-label">D-FOV</div>
          </div>
          <div class="result-item highlight">
            <div class="result-value" id="ppd">--</div>
            <div class="result-label">PPD</div>
          </div>
        </div>
      </div>

      <div class="viz-card">
        <div class="viz-title">FOV Visualization</div>
        <canvas id="displayCanvas" width="500" height="550"></canvas>
      </div>
    </div>

    <div class="table-section">
      <div class="section-title">XR Headsets (click to load)</div>
      <div class="table-scroll">
        <table class="reference-table" id="xrTable">
          <thead>
            <tr>
              <th>Device</th>
              <th class="numeric">H-FOV</th>
              <th class="numeric">V-FOV</th>
              <th class="numeric">D-FOV</th>
              <th class="numeric">PPD</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="table-section">
      <div class="section-title">Common Displays (click to load)</div>
      <div class="table-scroll">
        <table class="reference-table" id="displaysTable">
          <thead>
            <tr>
              <th>Device</th>
              <th class="numeric">Size</th>
              <th class="numeric">Distance</th>
              <th class="numeric">Resolution</th>
              <th class="numeric">H-FOV</th>
              <th class="numeric">V-FOV</th>
              <th class="numeric">D-FOV</th>
              <th class="numeric">PPD</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function updateValues() {
      const screenSize = parseFloat(document.getElementById('screenSize').value);
      document.getElementById('screenSizeInput').value = screenSize;

      const aspectRatio = document.getElementById('aspectRatio').value.split('/');
      const aspectWidth = parseFloat(aspectRatio[0]);
      const aspectHeight = parseFloat(aspectRatio[1]);

      const distance = parseFloat(document.getElementById('distance').value);
      document.getElementById('distanceInput').value = distance;

      const horizontalResolution = parseFloat(document.getElementById('horizontalResolution').value);
      document.getElementById('horizontalResolutionInput').value = horizontalResolution;

      const fovs = calcFOVs(screenSize, distance, aspectWidth, aspectHeight, horizontalResolution);
      document.getElementById('dfov').textContent = fovs.dfov.toFixed(1) + '°';
      document.getElementById('hfov').textContent = fovs.hfov.toFixed(1) + '°';
      document.getElementById('vfov').textContent = fovs.vfov.toFixed(1) + '°';
      document.getElementById('ppd').textContent = fovs.ppd.toFixed(1);

      drawVisualization(screenSize, distance, fovs.hfov, fovs.vfov, aspectWidth, aspectHeight);
    }

    function calcFOVs(screenSize, distance, aspectWidth, aspectHeight, horizontalResolution) {
      const diagonal = Math.sqrt(aspectWidth ** 2 + aspectHeight ** 2);
      const width = screenSize * aspectWidth / diagonal;
      const height = screenSize * aspectHeight / diagonal;
      const dfov = 2 * Math.atan(screenSize / (2 * distance)) * 180 / Math.PI;
      const hfov = 2 * Math.atan(width / (2 * distance)) * 180 / Math.PI;
      const vfov = 2 * Math.atan(height / (2 * distance)) * 180 / Math.PI;
      const ppd = horizontalResolution / hfov;
      return { dfov, hfov, vfov, ppd };
    }

    function syncSlider(sliderId, value) {
      document.getElementById(sliderId).value = value;
      updateValues();
    }

    function loadPreset(screenSize, distance, aspectRatio, resolution) {
      document.getElementById('screenSize').value = screenSize;
      document.getElementById('screenSizeInput').value = screenSize;
      document.getElementById('distance').value = distance;
      document.getElementById('distanceInput').value = distance;
      document.getElementById('horizontalResolution').value = resolution;
      document.getElementById('horizontalResolutionInput').value = resolution;

      // Find matching aspect ratio option
      const select = document.getElementById('aspectRatio');
      for (let option of select.options) {
        const [w, h] = option.value.split('/').map(Number);
        if (Math.abs(w/h - aspectRatio) < 0.01) {
          select.value = option.value;
          break;
        }
      }

      updateValues();
    }

    function loadXRPreset(device) {
      // For XR headsets, we directly set the FOV values since they don't have
      // traditional screen size/distance parameters
      document.getElementById('hfov').textContent = device.hfov + '°';
      document.getElementById('vfov').textContent = device.vfov + '°';
      document.getElementById('dfov').textContent = device.dfov + '°';
      document.getElementById('ppd').textContent = device.ppd.toFixed(1);

      // Draw visualization with XR FOV values
      drawVisualization(0, 0, device.hfov, device.vfov, 16, 9);
    }

    function generateTables() {
      // XR Headsets (fixed specs, no calculation needed)
      const xrDevices = [
        { name: 'Apple Vision Pro', hfov: 100, vfov: 90, dfov: 120, ppd: 34 },
        { name: 'Samsung Galaxy XR', hfov: 109, vfov: 100, dfov: 120, ppd: 35.5 },
        { name: 'Meta Quest 3S', hfov: 96, vfov: 90, dfov: 110, ppd: 20 },
        { name: 'Meta Quest 3', hfov: 110, vfov: 96, dfov: 120, ppd: 25 },
        { name: 'Meta Quest Pro', hfov: 106, vfov: 96, dfov: 117, ppd: 22 },
        { name: 'PSVR 2', hfov: 110, vfov: 110, dfov: 110, ppd: 19 },
        { name: 'Xreal Air 2 Ultra', hfov: 52, vfov: 29, dfov: 57, ppd: 42 },
        { name: 'Rokid Max 2', hfov: 50, vfov: 28, dfov: 55, ppd: 44 },
        { name: 'Viture Pro XR', hfov: 43, vfov: 24, dfov: 48, ppd: 46 },
      ];

      const xrBody = document.querySelector('#xrTable tbody');
      xrDevices.forEach(device => {
        const row = document.createElement('tr');
        row.className = 'clickable';
        row.onclick = () => loadXRPreset(device);
        row.innerHTML = `
          <td class="device-name">${device.name}</td>
          <td class="numeric">${device.hfov}°</td>
          <td class="numeric">${device.vfov}°</td>
          <td class="numeric">${device.dfov}°</td>
          <td class="numeric highlight-cell">${device.ppd}</td>
        `;
        xrBody.appendChild(row);
      });

      // Common displays
      const displays = [
        { name: 'iPhone 16 Pro Max @ 12"', size: 6.9, distance: 12, aspectW: 19.5, aspectH: 9, resolution: 2868 },
        { name: 'Samsung Galaxy S24 Ultra @ 12"', size: 6.8, distance: 12, aspectW: 19.5, aspectH: 9, resolution: 3120 },
        { name: 'iPad Pro 13" M4 @ 18"', size: 13, distance: 18, aspectW: 4, aspectH: 3, resolution: 2752 },
        { name: 'MacBook Pro 16" M4 @ 20"', size: 16.2, distance: 20, aspectW: 16, aspectH: 10, resolution: 3456 },
        { name: 'Studio Display 27" @ 24"', size: 27, distance: 24, aspectW: 16, aspectH: 9, resolution: 5120 },
        { name: 'Pro Display XDR 32" @ 24"', size: 32, distance: 24, aspectW: 16, aspectH: 9, resolution: 6016 },
        { name: 'Nintendo Switch OLED @ 12"', size: 7, distance: 12, aspectW: 16, aspectH: 9, resolution: 1280 },
        { name: 'Steam Deck OLED @ 14"', size: 7.4, distance: 14, aspectW: 16, aspectH: 10, resolution: 1280 },
        { name: 'PS Portal @ 12"', size: 8, distance: 12, aspectW: 16, aspectH: 9, resolution: 1920 },
        { name: '55" 4K TV @ 8ft', size: 55, distance: 96, aspectW: 16, aspectH: 9, resolution: 3840 },
        { name: '65" 4K TV @ 8ft', size: 65, distance: 96, aspectW: 16, aspectH: 9, resolution: 3840 },
        { name: '77" 4K OLED TV @ 8ft', size: 77, distance: 96, aspectW: 16, aspectH: 9, resolution: 3840 },
        { name: '85" 4K TV @ 10ft', size: 85, distance: 120, aspectW: 16, aspectH: 9, resolution: 3840 },
        { name: '98" 4K TV @ 10ft', size: 98, distance: 120, aspectW: 16, aspectH: 9, resolution: 3840 },
        { name: 'TCL 115" 4K TV @ 12ft', size: 115, distance: 144, aspectW: 16, aspectH: 9, resolution: 3840 },
        { name: 'Movie Theater (IMAX)', size: 720, distance: 1080, aspectW: 1.9, aspectH: 1, resolution: 4096 },
      ];

      const displaysBody = document.querySelector('#displaysTable tbody');
      displays.forEach(display => {
        const fovs = calcFOVs(display.size, display.distance, display.aspectW, display.aspectH, display.resolution);
        const row = document.createElement('tr');
        row.className = 'clickable';
        row.onclick = () => loadPreset(display.size, display.distance, display.aspectW / display.aspectH, display.resolution);
        row.innerHTML = `
          <td class="device-name">${display.name}</td>
          <td class="numeric">${display.size}"</td>
          <td class="numeric">${display.distance}"</td>
          <td class="numeric">${display.resolution}px</td>
          <td class="numeric">${fovs.hfov.toFixed(1)}°</td>
          <td class="numeric">${fovs.vfov.toFixed(1)}°</td>
          <td class="numeric">${fovs.dfov.toFixed(1)}°</td>
          <td class="numeric highlight-cell">${fovs.ppd.toFixed(1)}</td>
        `;
        displaysBody.appendChild(row);
      });
    }

    function drawVisualization(screenSize, distance, hfov, vfov, aspectW, aspectH) {
      const canvas = document.getElementById('displayCanvas');
      if (!canvas.getContext) return;

      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const padding = 30;
      const sectionGap = 15;

      // Clear canvas
      const isDark = document.documentElement.classList.contains('dark');
      ctx.fillStyle = isDark ? '#252525' : '#f8f8f8';
      ctx.fillRect(0, 0, width, height);

      // Each section gets one third of the height minus gaps
      const sectionHeight = (height - sectionGap * 2) / 3;

      // Calculate diagonal FOV
      const dfov = Math.sqrt(hfov * hfov + vfov * vfov);

      // Draw function for FOV cone - each section is self-contained
      function drawFOVSection(sectionTop, sectionH, fov, color, label, viewLabel) {
        const centerY = sectionTop + sectionH / 2;
        const eyeX = padding;
        const fovRad = (fov / 2) * Math.PI / 180;
        const tanFov = Math.tan(fovRad);

        // Calculate scale so cone fits within this section
        const maxConeHeight = (sectionH / 2) - 12;
        const availableWidth = width - padding * 2 - 80;

        // Scale based on whichever constraint is tighter
        const scaleByHeight = maxConeHeight / tanFov;
        const scaleByWidth = availableWidth;
        const lineLength = Math.min(scaleByHeight, scaleByWidth);

        const halfHeight = lineLength * tanFov;

        // FOV cone (filled)
        ctx.beginPath();
        ctx.moveTo(eyeX, centerY);
        ctx.lineTo(eyeX + lineLength, centerY - halfHeight);
        ctx.lineTo(eyeX + lineLength, centerY + halfHeight);
        ctx.closePath();
        ctx.fillStyle = color + '20';
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Screen representation
        const screenHeight = halfHeight * 2 * 0.9;
        ctx.fillStyle = isDark ? '#888' : '#333';
        ctx.fillRect(eyeX + lineLength - 3, centerY - screenHeight/2, 6, screenHeight);

        // Eye
        ctx.beginPath();
        ctx.arc(eyeX, centerY, 5, 0, Math.PI * 2);
        ctx.fillStyle = isDark ? '#888' : '#333';
        ctx.fill();

        // Label to the right of cone
        ctx.font = '600 11px system-ui, sans-serif';
        ctx.fillStyle = color;
        ctx.textAlign = 'left';
        ctx.fillText(`${label}: ${fov.toFixed(1)}°`, eyeX + lineLength + 15, centerY + 4);

        // Section title
        ctx.font = '10px system-ui, sans-serif';
        ctx.fillStyle = '#999';
        ctx.textAlign = 'left';
        ctx.fillText(viewLabel, eyeX, sectionTop + 12);
      }

      // Draw function for front view of screen
      function drawFrontView(sectionTop, sectionH) {
        const centerX = width / 2;
        const centerY = sectionTop + sectionH / 2;

        // Calculate screen dimensions to fit in section
        const maxWidth = width - padding * 2 - 60;
        const maxHeight = sectionH - 30;

        // Use aspect ratio to determine screen size
        let screenW, screenH;
        if (aspectW / aspectH > maxWidth / maxHeight) {
          screenW = maxWidth;
          screenH = maxWidth * (aspectH / aspectW);
        } else {
          screenH = maxHeight;
          screenW = maxHeight * (aspectW / aspectH);
        }

        const left = centerX - screenW / 2;
        const top = centerY - screenH / 2;

        // Draw screen rectangle
        ctx.fillStyle = isDark ? '#333' : '#e8e8e8';
        ctx.fillRect(left, top, screenW, screenH);
        ctx.strokeStyle = isDark ? '#888' : '#333';
        ctx.lineWidth = 3;
        ctx.strokeRect(left, top, screenW, screenH);

        // Draw diagonal line
        ctx.beginPath();
        ctx.moveTo(left, top + screenH);
        ctx.lineTo(left + screenW, top);
        ctx.strokeStyle = '#2D9D4D';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 3]);
        ctx.stroke();
        ctx.setLineDash([]);

        // H-FOV label (bottom)
        ctx.font = '600 10px system-ui, sans-serif';
        ctx.fillStyle = '#E63946';
        ctx.textAlign = 'center';
        ctx.fillText(`H-FOV: ${hfov.toFixed(1)}°`, centerX, top + screenH + 14);

        // Draw H-FOV arrows
        ctx.strokeStyle = '#E63946';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(left + 5, top + screenH + 6);
        ctx.lineTo(left + screenW - 5, top + screenH + 6);
        ctx.stroke();
        // Arrow heads
        ctx.beginPath();
        ctx.moveTo(left + 5, top + screenH + 6);
        ctx.lineTo(left + 10, top + screenH + 3);
        ctx.lineTo(left + 10, top + screenH + 9);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(left + screenW - 5, top + screenH + 6);
        ctx.lineTo(left + screenW - 10, top + screenH + 3);
        ctx.lineTo(left + screenW - 10, top + screenH + 9);
        ctx.closePath();
        ctx.fill();

        // V-FOV label (right side)
        ctx.fillStyle = '#457B9D';
        ctx.save();
        ctx.translate(left + screenW + 14, centerY);
        ctx.rotate(Math.PI / 2);
        ctx.textAlign = 'center';
        ctx.fillText(`V-FOV: ${vfov.toFixed(1)}°`, 0, 0);
        ctx.restore();

        // Draw V-FOV arrows
        ctx.strokeStyle = '#457B9D';
        ctx.beginPath();
        ctx.moveTo(left + screenW + 6, top + 5);
        ctx.lineTo(left + screenW + 6, top + screenH - 5);
        ctx.stroke();
        // Arrow heads
        ctx.beginPath();
        ctx.moveTo(left + screenW + 6, top + 5);
        ctx.lineTo(left + screenW + 3, top + 10);
        ctx.lineTo(left + screenW + 9, top + 10);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(left + screenW + 6, top + screenH - 5);
        ctx.lineTo(left + screenW + 3, top + screenH - 10);
        ctx.lineTo(left + screenW + 9, top + screenH - 10);
        ctx.closePath();
        ctx.fill();

        // D-FOV label (on diagonal)
        ctx.fillStyle = '#2D9D4D';
        ctx.save();
        const angle = Math.atan2(-screenH, screenW);
        ctx.translate(centerX, centerY);
        ctx.rotate(angle);
        ctx.textAlign = 'center';
        ctx.fillText(`D-FOV: ${dfov.toFixed(1)}°`, 0, -8);
        ctx.restore();

        // Section title
        ctx.font = '10px system-ui, sans-serif';
        ctx.fillStyle = '#999';
        ctx.textAlign = 'left';
        ctx.fillText('Front View', padding, sectionTop + 12);
      }

      // Draw H-FOV in top section
      drawFOVSection(0, sectionHeight, hfov, '#E63946', 'H-FOV', 'Top View');

      // Divider line
      ctx.strokeStyle = isDark ? '#444' : '#ddd';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padding, sectionHeight + sectionGap / 2);
      ctx.lineTo(width - padding, sectionHeight + sectionGap / 2);
      ctx.stroke();

      // Draw V-FOV in middle section
      drawFOVSection(sectionHeight + sectionGap, sectionHeight, vfov, '#457B9D', 'V-FOV', 'Side View');

      // Divider line
      ctx.beginPath();
      ctx.moveTo(padding, sectionHeight * 2 + sectionGap * 1.5);
      ctx.lineTo(width - padding, sectionHeight * 2 + sectionGap * 1.5);
      ctx.stroke();

      // Draw front view in bottom section
      drawFrontView(sectionHeight * 2 + sectionGap * 2, sectionHeight);
    }

    // Initialize
    window.onload = function() {
      updateValues();
      generateTables();
    };
  </script>
  <script>
    (function() {
      var btn = document.createElement('button');
      btn.className = 'theme-toggle';
      function label() {
        var t = localStorage.getItem('theme');
        btn.textContent = t === 'dark' ? 'dark' : t === 'light' ? 'light' : 'auto';
      }
      btn.addEventListener('click', function() {
        var t = localStorage.getItem('theme');
        var next = !t ? 'dark' : t === 'dark' ? 'light' : null;
        if (next) localStorage.setItem('theme', next); else localStorage.removeItem('theme');
        var isDark = next === 'dark' || (!next && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
        label();
      });
      label();
      document.body.appendChild(btn);
    })();
  </script>
</body>
</html>
