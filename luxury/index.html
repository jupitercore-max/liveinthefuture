<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Luxury Influencer Soundboard — LITF</title>
<meta name="description" content="25 ridiculous things luxury influencers actually say. A soundboard.">
<meta property="og:title" content="The Luxury Influencer Soundboard">
<meta property="og:description" content="25 ridiculous things luxury influencers actually say. Tap to play.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8d48b;
    --gold-dark: #a07c2a;
    --bg: #0d0d0d;
    --card-bg: #1a1a1a;
    --card-hover: #222;
    --card-active: #2a2214;
    --text: #f0ece2;
    --text-muted: #8a8578;
    --border: #2a2720;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    text-align: center;
    padding: 3rem 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #161310 0%, var(--bg) 100%);
  }

  .hero h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }

  .hero .subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .hero .tagline {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--text-muted);
    margin-top: 0.5rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1px;
    padding: 1px;
    max-width: 1200px;
    margin: 0 auto;
    background: var(--border);
  }

  .card {
    background: var(--card-bg);
    padding: 1.5rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 120px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .card:hover {
    background: var(--card-hover);
  }

  .card:active, .card.playing {
    background: var(--card-active);
  }

  .card.playing {
    box-shadow: inset 0 0 0 1px var(--gold-dark);
  }

  .card .number {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 0.75rem;
    color: var(--gold-dark);
    margin-bottom: 0.5rem;
    letter-spacing: 0.1em;
  }

  .card .quote {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--text);
  }

  .card .play-icon {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 28px;
    height: 28px;
    border: 1.5px solid var(--gold-dark);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.4;
    transition: opacity 0.15s ease;
  }

  .card:hover .play-icon { opacity: 0.7; }
  .card.playing .play-icon {
    opacity: 1;
    border-color: var(--gold);
    animation: pulse 1s ease infinite;
  }

  .play-icon svg {
    width: 12px;
    height: 12px;
    fill: var(--gold);
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.7; }
  }

  .footer {
    text-align: center;
    padding: 3rem 1.5rem;
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-top: 1px solid var(--border);
  }

  .footer a {
    color: var(--gold-dark);
    text-decoration: none;
  }

  .footer a:hover { color: var(--gold); }

  /* volume indicator */
  .volume-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold));
    width: 0%;
    transition: width 0.1s linear;
    z-index: 100;
  }

  @media (max-width: 600px) {
    .hero { padding: 2rem 1rem 1.5rem; }
    .hero h1 { font-size: 1.6rem; }
    .grid { grid-template-columns: 1fr; }
    .card { padding: 1.25rem; min-height: 100px; }
    .card .quote { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>The Luxury Influencer<br>Soundboard</h1>
  <p class="tagline">"It's not a purchase, it's a personality."</p>
  <p class="subtitle">25 things they actually say &middot; Tap to play</p>
</div>

<div class="grid" id="grid"></div>

<div class="volume-bar" id="volumeBar"></div>

<div class="footer">
  <a href="/">Live in the Future</a> &middot; For entertainment purposes only &middot; No SAs were harmed
</div>

<script>
const quotes = [
  { id: 1, text: "It\u2019s not a purchase, it\u2019s an investment piece.", file: "audio/quote_01.mp3" },
  { id: 2, text: "My SA literally texted me at six AM about this. We have a relationship.", file: "audio/quote_02.mp3" },
  { id: 3, text: "I\u2019ve been on the waitlist for eleven months and honestly? I would do it again.", file: "audio/quote_03.mp3" },
  { id: 4, text: "This is not just a bag. This is generational wealth.", file: "audio/quote_04.mp3" },
  { id: 5, text: "The packaging alone is worth the price of admission. Look at this ribbon.", file: "audio/quote_05.mp3" },
  { id: 6, text: "I don\u2019t collect bags, I curate a portfolio.", file: "audio/quote_06.mp3" },
  { id: 7, text: "If you have to ask the price, this video isn\u2019t for you, babe.", file: "audio/quote_07.mp3" },
  { id: 8, text: "They only made seven of these in this colorway for the entire world.", file: "audio/quote_08.mp3" },
  { id: 9, text: "I literally cried in the boutique. My SA surprised me with the call.", file: "audio/quote_09.mp3" },
  { id: 10, text: "This is giving quiet luxury but also please notice me.", file: "audio/quote_10.mp3" },
  { id: 11, text: "I had to spend forty thousand dollars in ancillary purchases just to be offered this bag. Totally worth it.", file: "audio/quote_11.mp3" },
  { id: 12, text: "Van Cleef doesn\u2019t do sales. Van Cleef does legacy.", file: "audio/quote_12.mp3" },
  { id: 13, text: "My husband doesn\u2019t understand why I need three Alhambras but that\u2019s okay because I didn\u2019t marry him for his taste.", file: "audio/quote_13.mp3" },
  { id: 14, text: "This is my everyday Birkin. I have a separate one for travel.", file: "audio/quote_14.mp3" },
  { id: 15, text: "The craftsmanship! One artisan, one bag, eighteen hours. Meanwhile I can barely commit to a skincare routine.", file: "audio/quote_15.mp3" },
  { id: 16, text: "I\u2019m not materialistic. I just appreciate the art of French leather goods.", file: "audio/quote_16.mp3" },
  { id: 17, text: "Price per wear, this Kelly is basically free.", file: "audio/quote_17.mp3" },
  { id: 18, text: "I would never buy a rep. My SA can smell a replica from across the room.", file: "audio/quote_18.mp3" },
  { id: 19, text: "If Herm\u00e8s calls, you answer. I don\u2019t care if you\u2019re in surgery.", file: "audio/quote_19.mp3" },
  { id: 20, text: "This unboxing is giving me more serotonin than my therapist ever could.", file: "audio/quote_20.mp3" },
  { id: 21, text: "I told myself no more orange boxes this month. Anyway, here\u2019s three orange boxes.", file: "audio/quote_21.mp3" },
  { id: 22, text: "The leather is Togo. If you know, you know. If you don\u2019t, swipe up.", file: "audio/quote_22.mp3" },
  { id: 23, text: "I didn\u2019t choose the luxury lifestyle. The luxury lifestyle put me on a waitlist and I became obsessed.", file: "audio/quote_23.mp3" },
  { id: 24, text: "My collection is insured for more than my house and I live in a very nice house.", file: "audio/quote_24.mp3" },
  { id: 25, text: "This is a limited edition that they swear will never be restocked but we\u2019ll see about that in six months when they need their quarterly numbers.", file: "audio/quote_25.mp3" }
];

// iOS AudioContext unlock
let audioCtx;
function ensureAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

document.addEventListener('touchstart', ensureAudioContext, { once: true });
document.addEventListener('click', ensureAudioContext, { once: true });

const grid = document.getElementById('grid');
const volumeBar = document.getElementById('volumeBar');
let currentAudio = null;
let currentCard = null;

const playSvg = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const stopSvg = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

quotes.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = q.id;
  card.innerHTML = `
    <span class="number">${String(q.id).padStart(2, '0')}</span>
    <p class="quote">\u201C${q.text}\u201D</p>
    <div class="play-icon">${playSvg}</div>
  `;

  const audio = new Audio();
  audio.preload = 'none';
  audio.src = q.file;

  card.addEventListener('click', () => {
    ensureAudioContext();

    // If this card is already playing, stop it
    if (currentCard === card) {
      stopCurrent();
      return;
    }

    // Stop any other playing audio
    stopCurrent();

    // Play this one
    audio.currentTime = 0;
    audio.play().catch(() => {});
    card.classList.add('playing');
    card.querySelector('.play-icon').innerHTML = stopSvg;
    currentAudio = audio;
    currentCard = card;
  });

  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      volumeBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
    }
  });

  audio.addEventListener('ended', () => {
    card.classList.remove('playing');
    card.querySelector('.play-icon').innerHTML = playSvg;
    volumeBar.style.width = '0%';
    currentAudio = null;
    currentCard = null;
  });

  grid.appendChild(card);
});

function stopCurrent() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  if (currentCard) {
    currentCard.classList.remove('playing');
    currentCard.querySelector('.play-icon').innerHTML = playSvg;
  }
  volumeBar.style.width = '0%';
  currentAudio = null;
  currentCard = null;
}
</script>
</body>
</html>
