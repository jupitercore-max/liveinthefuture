<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <!-- OpenStenoMask Schematic — Block Diagram -->
  
  <!-- Background -->
  <rect width="900" height="650" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#00d9ff" font-size="20" font-weight="bold">OpenStenoMask — Electrical Block Diagram</text>
  <text x="450" y="48" text-anchor="middle" fill="#888" font-size="11">v1.0 · CERN-OHL-S v2 · GPL-3.0</text>
  
  <!-- ========== USB-C Section ========== -->
  <g>
    <rect x="20" y="280" width="80" height="100" rx="5" fill="#16213e" stroke="#00d9ff" stroke-width="1.5"/>
    <text x="60" y="310" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">USB-C</text>
    <text x="60" y="330" text-anchor="middle" fill="#aaa" font-size="9">5V Power</text>
    <text x="60" y="345" text-anchor="middle" fill="#aaa" font-size="9">USB Data</text>
    <text x="60" y="365" text-anchor="middle" fill="#aaa" font-size="9">UAC 1.0</text>
  </g>
  
  <!-- ========== LDO Section ========== -->
  <g>
    <rect x="140" y="280" width="80" height="60" rx="5" fill="#16213e" stroke="#0f3460" stroke-width="1.5"/>
    <text x="180" y="305" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">AP2112K</text>
    <text x="180" y="320" text-anchor="middle" fill="#aaa" font-size="9">3.3V LDO</text>
    <text x="180" y="335" text-anchor="middle" fill="#0f0" font-size="9">100mA</text>
  </g>
  
  <!-- Power line USB-C → LDO -->
  <line x1="100" y1="300" x2="140" y2="300" stroke="#ff9500" stroke-width="2"/>
  <text x="120" y="295" text-anchor="middle" fill="#ff9500" font-size="8">VBUS</text>
  
  <!-- ========== RP2040 Section ========== -->
  <g>
    <rect x="270" y="200" width="200" height="260" rx="8" fill="#0f3460" stroke="#00d9ff" stroke-width="2"/>
    <text x="370" y="230" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">RP2040</text>
    <text x="370" y="248" text-anchor="middle" fill="#aaa" font-size="10">Dual M0+ @ 133MHz</text>
    
    <!-- PIO blocks -->
    <rect x="285" y="265" width="55" height="30" rx="3" fill="#1a1a4e" stroke="#533483"/>
    <text x="312" y="284" text-anchor="middle" fill="#e94560" font-size="9">PIO 0</text>
    
    <rect x="345" y="265" width="55" height="30" rx="3" fill="#1a1a4e" stroke="#533483"/>
    <text x="372" y="284" text-anchor="middle" fill="#e94560" font-size="9">PIO 1</text>
    
    <rect x="405" y="265" width="55" height="30" rx="3" fill="#1a1a4e" stroke="#533483"/>
    <text x="432" y="284" text-anchor="middle" fill="#e94560" font-size="9">PIO 2</text>
    
    <!-- DSP blocks -->
    <rect x="285" y="310" width="80" height="25" rx="3" fill="#1a1a4e" stroke="#e94560"/>
    <text x="325" y="327" text-anchor="middle" fill="#fff" font-size="8">CIC Decimator</text>
    
    <rect x="375" y="310" width="85" height="25" rx="3" fill="#1a1a4e" stroke="#e94560"/>
    <text x="417" y="327" text-anchor="middle" fill="#fff" font-size="8">Spectral Sub.</text>
    
    <rect x="285" y="345" width="80" height="25" rx="3" fill="#1a1a4e" stroke="#e94560"/>
    <text x="325" y="362" text-anchor="middle" fill="#fff" font-size="8">5-Band EQ</text>
    
    <rect x="375" y="345" width="85" height="25" rx="3" fill="#1a1a4e" stroke="#e94560"/>
    <text x="417" y="362" text-anchor="middle" fill="#fff" font-size="8">Compressor</text>
    
    <!-- USB block -->
    <rect x="310" y="380" width="115" height="25" rx="3" fill="#1a1a4e" stroke="#00d9ff"/>
    <text x="367" y="397" text-anchor="middle" fill="#fff" font-size="8">USB Audio (UAC 1.0)</text>
    
    <!-- GPIO -->
    <rect x="285" y="415" width="55" height="20" rx="3" fill="#1a1a4e" stroke="#0f0"/>
    <text x="312" y="429" text-anchor="middle" fill="#0f0" font-size="8">LED</text>
    
    <rect x="350" y="415" width="55" height="20" rx="3" fill="#1a1a4e" stroke="#0f0"/>
    <text x="377" y="429" text-anchor="middle" fill="#0f0" font-size="8">MUTE</text>
  </g>
  
  <!-- Power line LDO → RP2040 -->
  <line x1="220" y1="300" x2="270" y2="300" stroke="#0f0" stroke-width="2"/>
  <text x="245" y="295" text-anchor="middle" fill="#0f0" font-size="8">3V3</text>
  
  <!-- ========== Microphone Section ========== -->
  <!-- Mic 1 -->
  <g>
    <rect x="530" y="180" width="100" height="55" rx="5" fill="#1a1a4e" stroke="#00d9ff" stroke-width="1.5"/>
    <text x="580" y="202" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Mic 1 (Voice)</text>
    <text x="580" y="218" text-anchor="middle" fill="#00d9ff" font-size="8">Knowles SPH0641</text>
    <text x="580" y="230" text-anchor="middle" fill="#888" font-size="8">PDM · 65dBA SNR</text>
  </g>
  
  <!-- Mic 2 -->
  <g>
    <rect x="530" y="250" width="100" height="55" rx="5" fill="#1a1a4e" stroke="#00d9ff" stroke-width="1.5"/>
    <text x="580" y="272" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Mic 2 (Voice)</text>
    <text x="580" y="288" text-anchor="middle" fill="#00d9ff" font-size="8">Knowles SPH0641</text>
    <text x="580" y="300" text-anchor="middle" fill="#888" font-size="8">+3dB sum gain</text>
  </g>
  
  <!-- Ref Mic -->
  <g>
    <rect x="530" y="320" width="100" height="55" rx="5" fill="#1a1a4e" stroke="#ff9500" stroke-width="1.5"/>
    <text x="580" y="342" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Mic 3 (Ref)</text>
    <text x="580" y="358" text-anchor="middle" fill="#ff9500" font-size="8">Knowles SPH0641</text>
    <text x="580" y="370" text-anchor="middle" fill="#888" font-size="8">Exterior · noise</text>
  </g>
  
  <!-- PDM lines from mics to RP2040 -->
  <line x1="530" y1="207" x2="470" y2="280" stroke="#e94560" stroke-width="1.5"/>
  <text x="495" y="210" text-anchor="middle" fill="#e94560" font-size="7">PDM 1</text>
  
  <line x1="530" y1="277" x2="470" y2="280" stroke="#e94560" stroke-width="1.5"/>
  <text x="495" y="270" text-anchor="middle" fill="#e94560" font-size="7">PDM 2</text>
  
  <line x1="530" y1="347" x2="470" y2="280" stroke="#ff9500" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="495" y="340" text-anchor="middle" fill="#ff9500" font-size="7">PDM Ref</text>
  
  <!-- ========== USB data line ========== -->
  <line x1="100" y1="390" x2="270" y2="392" stroke="#00d9ff" stroke-width="1.5"/>
  <text x="185" y="387" text-anchor="middle" fill="#00d9ff" font-size="8">D+/D−</text>
  
  <!-- ========== Optional BLE Section ========== -->
  <g opacity="0.5">
    <rect x="530" y="430" width="100" height="50" rx="5" fill="#1a1a4e" stroke="#fff" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="580" y="452" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">nRF5340</text>
    <text x="580" y="468" text-anchor="middle" fill="#aaa" font-size="8">(Optional BLE)</text>
    
    <line x1="470" y1="430" x2="530" y2="455" stroke="#fff" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="500" y="440" text-anchor="middle" fill="#aaa" font-size="7">I²S</text>
  </g>
  
  <!-- ========== Signal Flow ========== -->
  <g>
    <text x="700" y="100" text-anchor="middle" fill="#888" font-size="10" font-weight="bold">SIGNAL FLOW</text>
    
    <text x="700" y="125" fill="#00d9ff" font-size="9">→ Voice (PDM digital)</text>
    <text x="700" y="140" fill="#ff9500" font-size="9">→ Noise reference (PDM)</text>
    <text x="700" y="155" fill="#0f0" font-size="9">→ 3.3V power</text>
    <text x="700" y="170" fill="#e94560" font-size="9">→ Processed audio</text>
    <text x="700" y="185" fill="#fff" font-size="9" opacity="0.5">→ Optional BLE path</text>
  </g>
  
  <!-- ========== Specs Box ========== -->
  <g>
    <rect x="680" y="220" width="200" height="140" rx="5" fill="#0f3460" stroke="#533483" stroke-width="1"/>
    <text x="780" y="240" text-anchor="middle" fill="#00d9ff" font-size="11" font-weight="bold">SPECIFICATIONS</text>
    <text x="695" y="260" fill="#fff" font-size="9">Sample rate: 16 kHz</text>
    <text x="695" y="275" fill="#fff" font-size="9">Bit depth: 16-bit (USB)</text>
    <text x="695" y="290" fill="#fff" font-size="9">Latency: ~12 ms (wired)</text>
    <text x="695" y="305" fill="#fff" font-size="9">SNR: >60 dBA</text>
    <text x="695" y="320" fill="#fff" font-size="9">Power: 80 mW (16mA@5V)</text>
    <text x="695" y="335" fill="#fff" font-size="9">Interface: USB UAC 1.0</text>
    <text x="695" y="350" fill="#fff" font-size="9">BOM: $25 wired / $31 BLE</text>
  </g>
  
  <!-- ========== Footer ========== -->
  <text x="450" y="620" text-anchor="middle" fill="#444" font-size="9">OpenStenoMask v1.0 · Open Source (CERN-OHL-S v2 / GPL-3.0) · Prior Art · github.com/jupitercore-max/liveinthefuture</text>
</svg>
