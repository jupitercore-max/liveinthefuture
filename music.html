  <link rel="canonical" href="https://liveinthefuture.org/music/" />

  <style>
    :root {
      --bg: #0d0d0d;
      --bg-raised: #141414;
      --bg-card: #1a1a1a;
      --border: #222;
      --text: #e0e0e0;
      --text-muted: #888;
      --accent: #4a9eff;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.7; font-size: 16px; }
    body { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: var(--text-muted); margin-bottom: 2rem; }
    .section-title { font-size: 1.1rem; font-weight: 600; color: var(--accent); margin: 2.5rem 0 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .track { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; border-radius: 8px; transition: background 0.15s; cursor: pointer; }
    .track:hover { background: var(--bg-card); }
    .track.active { background: var(--bg-card); border-left: 3px solid var(--accent); }
    .track-name { flex: 1; font-size: 0.95rem; }
    .track-category { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    audio { width: 100%; border-radius: 6px; margin: 1rem 0; }
    .now-playing { position: sticky; top: 0; background: var(--bg); padding: 1rem 0; z-index: 10; border-bottom: 1px solid var(--border); margin-bottom: 1rem; display: none; }
    .now-playing.visible { display: block; }
    .now-playing-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .now-playing-title strong { color: var(--text); }
    nav { margin-bottom: 2rem; }
    nav a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
    nav a:hover { color: var(--text); }
    .tag { display: inline-block; background: var(--bg-card); color: var(--text-muted); font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 3px; margin-left: 0.5rem; }
    .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .filter-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 0.35rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: all 0.15s; }
    .filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(74,158,255,0.08); }
    .footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.8rem; }
  </style>

    const categories = [...new Set(tracks.map(t => t.cat))];
    let activeCat = null;
    let audio = document.getElementById('globalAudio');
    let activeTrackEl = null;

    // Build filter buttons
    const filterBar = document.getElementById('filterBar');
    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn active';
    allBtn.textContent = 'All';
    allBtn.onclick = () => filter(null);
    filterBar.appendChild(allBtn);
    categories.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = c;
      btn.onclick = () => filter(c);
      filterBar.appendChild(btn);
    });

    function renderList(filterCat) {
      const list = document.getElementById('trackList');
      list.innerHTML = '';
      const filtered = filterCat ? tracks.filter(t => t.cat === filterCat) : tracks;
      let lastCat = '';
      filtered.forEach((t, i) => {
        if (t.cat !== lastCat) {
          lastCat = t.cat;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = t.cat;
          list.appendChild(h);
        }
        const el = document.createElement('div');
        el.className = 'track';
        el.dataset.idx = tracks.indexOf(t);
        const label = document.createElement('span');
        label.className = 'track-name';
        label.textContent = t.name;
        el.appendChild(label);
        if (t.voices) {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = t.voices;
          el.appendChild(tag);
        }
        el.onclick = () => play(tracks.indexOf(t), el);
        list.appendChild(el);
      });
    }

    function filter(cat) {
      activeCat = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent === (cat || 'All')));
      renderList(cat);
    }

    function play(idx, el) {
      const t = tracks[idx];
      const url = (t.base || BASE) + t.file;
      if (audio.src && audio.src.endsWith(t.file) && !audio.paused) {
        audio.pause();
        document.getElementById('nowPlaying').classList.remove('visible');
        el.classList.remove('active');
        return;
      }
      audio.src = url;
      audio.play().catch(() => {});
      document.getElementById('npTitle').textContent = t.name;
      document.getElementById('nowPlaying').classList.add('visible');
      if (activeTrackEl) activeTrackEl.classList.remove('active');
      el.classList.add('active');
      activeTrackEl = el;
    }

    audio.addEventListener('ended', () => {
      document.getElementById('nowPlaying').classList.remove('visible');
      if (activeTrackEl) activeTrackEl.classList.remove('active');
    });

    renderList(null);
  </script>

</html>
