<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#533483;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Phone silhouettes -->
  <g opacity="0.15">
    <rect x="100" y="200" width="60" height="100" rx="8" fill="#e94560"/>
    <rect x="200" y="180" width="60" height="100" rx="8" fill="#e94560"/>
    <rect x="300" y="220" width="60" height="100" rx="8" fill="#e94560"/>
    <rect x="400" y="190" width="60" height="100" rx="8" fill="#e94560"/>
    <rect x="500" y="210" width="60" height="100" rx="8" fill="#e94560"/>
    <rect x="700" y="200" width="60" height="100" rx="8" fill="#533483"/>
    <rect x="800" y="180" width="60" height="100" rx="8" fill="#533483"/>
    <rect x="900" y="220" width="60" height="100" rx="8" fill="#533483"/>
    <rect x="1000" y="190" width="60" height="100" rx="8" fill="#533483"/>
  </g>
  <!-- Central divide -->
  <line x1="600" y1="100" x2="600" y2="500" stroke="#e94560" stroke-width="2" opacity="0.4" stroke-dasharray="8,6"/>
  <!-- Left: consumer crowd dots -->
  <g fill="#e94560" opacity="0.5">
    <circle cx="150" cy="400" r="4"/><circle cx="180" cy="390" r="3"/><circle cx="210" cy="410" r="5"/>
    <circle cx="250" cy="395" r="3"/><circle cx="280" cy="415" r="4"/><circle cx="320" cy="400" r="3"/>
    <circle cx="350" cy="385" r="5"/><circle cx="390" cy="405" r="4"/><circle cx="420" cy="395" r="3"/>
    <circle cx="460" cy="410" r="4"/><circle cx="490" cy="390" r="5"/><circle cx="520" cy="405" r="3"/>
    <circle cx="160" cy="430" r="3"/><circle cx="200" cy="440" r="4"/><circle cx="240" cy="435" r="3"/>
    <circle cx="290" cy="445" r="5"/><circle cx="340" cy="430" r="3"/><circle cx="380" cy="440" r="4"/>
    <circle cx="430" cy="435" r="3"/><circle cx="470" cy="445" r="4"/><circle cx="510" cy="430" r="3"/>
    <circle cx="550" cy="440" r="4"/>
  </g>
  <!-- Right: sparse worker dots -->
  <g fill="#533483" opacity="0.3">
    <circle cx="700" cy="400" r="4"/><circle cx="800" cy="420" r="3"/><circle cx="900" cy="390" r="4"/>
    <circle cx="1000" cy="410" r="3"/><circle cx="1050" cy="430" r="3"/>
  </g>
  <!-- Labels -->
  <text x="350" y="520" font-family="system-ui" font-size="16" fill="#e94560" text-anchor="middle" opacity="0.7">2.5M consumers — 6 weeks</text>
  <text x="850" y="520" font-family="system-ui" font-size="16" fill="#533483" text-anchor="middle" opacity="0.7">400K workers — 18 months</text>
</svg>
