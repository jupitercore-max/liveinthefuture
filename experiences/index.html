<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://liveinthefuture.org/experiences/" />
  <meta property="og:title" content="Experiences — Live in the Future" />
  <meta property="og:url" content="https://liveinthefuture.org/experiences/" />
  <meta property="og:site_name" content="Live in the Future" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../images/favicon-192.png">
  <link rel="apple-touch-icon" href="../images/favicon-192.png">
  <link rel="shortcut icon" type="image/png" href="../favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0">
<title>Experiences — Live in the Future</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0d0d0d;
  color: #e8e8e8;
  width: 600px;
  height: 600px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
.header {
  height: 50px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid #222;
  background: #111;
}
.header .logo { font-size: 14px; color: #888; }
.header h1 { font-size: 22px; margin-left: 12px; font-weight: 600; }
.list {
  height: 550px;
  overflow-y: auto;
  padding: 12px 16px;
  scroll-behavior: smooth;
}
.card {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  margin-bottom: 8px;
  background: #1a1a1a;
  border-radius: 10px;
  border: 2px solid transparent;
  transition: border-color 0.15s ease, background-color 0.15s ease;
  cursor: default;
}
.card.focused {
  border-color: #4a9eff;
  background: rgba(74, 158, 255, 0.1);
}
.card .emoji { font-size: 32px; margin-right: 14px; flex-shrink: 0; }
.card .info { flex: 1; min-width: 0; }
.card .title { font-size: 20px; font-weight: 600; color: #fff; }
.card .type {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: #2a2a2a;
  color: #aaa;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.card .desc { font-size: 14px; color: #999; margin-top: 4px; }
.hint {
  text-align: center;
  padding: 12px;
  font-size: 13px;
  color: #555;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
</style>
</head>
<body>
<div class="header">
  <span class="logo">LITF</span>
  <h1>✨ Experiences</h1>
</div>
<div class="list" id="list"></div>
<div class="hint">↑↓ Navigate · Enter Open · Esc Back</div>

<script>
var experiences = [
  // A-tier (76-89) — sorted by score, highest first
  { emoji: '🫁', title: 'Breathe', score: 80, type: 'Wellness', desc: 'Guided breathing with mic biofeedback — sync score, rank progression, harmony tones', path: 'breathe/' },
  { emoji: '🔊', title: 'Noise Generator', score: 80, type: 'Focus Tool', desc: 'Adaptive masking — noise auto-adjusts to your environment via mic. 8 sounds, sleep timer.', path: 'noise/' },
  { emoji: '🧬', title: 'Particle Life', score: 78, type: 'Simulation', desc: 'Emergent artificial life — mic-reactive ecosystem, spatial stereo, shepherd with pulse ability', path: 'particle-life/' },
  { emoji: '🎵', title: 'Metronome', score: 80, type: 'Music Tool', desc: 'Adaptive beat coaching — mic detects your timing per beat, emphasizes beats you rush/drag. Plus timing precision display, woodblock clicks, tap tempo, 10 presets', path: 'metronome/' },
  { emoji: '🧘', title: 'Neck Stretch', score: 78, type: 'Wellness', desc: 'Head-tracked guided stretches with breathing biofeedback — beat your sync score per routine', path: 'neck-stretch/' },
  { emoji: '🧭', title: 'Compass', score: 78, type: 'Utility', desc: 'Live heading with saved waypoints — Geiger-counter audio guidance through bone conduction (orientation sensor, no mic)', path: 'compass/' },
  { emoji: '⚡', title: 'Reaction Tester', score: 78, type: 'Reflex Tool', desc: 'Directional audio reaction test — mic interference masks cues in noisy rooms, streak mode, 3 input modes', path: 'reaction/' },
  { emoji: '🧍', title: 'Posture Coach', score: 78, type: 'Wellness', desc: 'Posture tracking with procedural micro-drills — continuous bone conduction drone encodes slouch angle, mic breathing biofeedback', path: 'posture/' },
  { emoji: '✨', title: 'Starfield Warp', score: 80, type: 'Ambient', desc: 'Fly through space — head-tracked depth parallax, Deep Space: audio-only navigation with sonar ping (↑ for 1s clarity burst, 3/waypoint), bone conduction beacon, mic turbulence', path: 'starfield/' },
  { emoji: '🎯', title: 'Focus Timer', score: 78, type: 'Productivity', desc: 'Pomodoro with mic-based focus quality tracking — detects speech distractions via glasses mic, challenge cards, ambient soundscapes', path: 'focus/' },
  { emoji: '⏱', title: 'Intervals', score: 76, type: 'Fitness', desc: 'HIIT timer with Smart Rest — mic detects breathing to extend recovery until you calm down', path: 'intervals/' },
  { emoji: '🚶', title: 'Step Counter', score: 76, type: 'Fitness', desc: 'Walk Quests with breathing-pace coaching — mic detects exertion, cadence audio adapts to breathing, 8 challenges, 8-rank progression', path: 'steps/' },
  { emoji: '👂', title: 'Tinnitus Relief', score: 76, type: 'Wellness', desc: 'Bone conduction tinnitus therapy — mic-adaptive masking adjusts to your environment', path: 'tinnitus/' },
  { emoji: '🌊', title: 'Flow Fields', score: 76, type: 'Generative Art', desc: 'Head-tracked viewport into infinite Perlin noise — turn your head to explore, mic shapes flow character, D-pad cursor sculpts particles', path: 'flow-fields/' },
  // B-tier (60-75)
  { emoji: '🎹', title: 'Synth', score: 74, type: 'Instrument', desc: 'Mic-reactive synthesizer — ambient sound modulates the filter, environment IS the patch', path: 'synth/' },
  { emoji: '📡', title: 'Morse Trainer', score: 74, type: 'Skill', desc: 'Learn morse by ear, tap, or mic key — 6 modes including call-and-response (hear via bone conduction, tap back via mic)', path: 'morse/' },
  { emoji: '🎤', title: 'Pitch Trainer', score: 74, type: 'Music Tool', desc: 'Sing to match target notes — adaptive quiz targets your weak intervals, 5 training modes', path: 'pitch-trainer/' },
  { emoji: '🎸', title: 'Chromatic Tuner', score: 74, type: 'Music Tool', desc: 'Tune any instrument hands-free — reference tone through bone conduction, preferences persist', path: 'tuner/' },
  { emoji: '📊', title: 'Spectrum Analyzer', score: 74, type: 'Audio Tool', desc: 'Real-time frequency analysis — find any hum, compare with reference tone playback, unlock 10 achievements', path: 'spectrum/' },
  { emoji: '🌍', title: 'Earthquakes', score: 72, type: 'Visualization', desc: 'Real-time global seismic activity — head-tracked spatial audio pans quakes by bearing, tunable alert thresholds, MMI estimation', path: 'earthquakes/' },
  { emoji: '🔢', title: 'Tally', score: 72, type: 'Utility', desc: 'Count anything hands-free — clap to count, Blitz speed challenge with combos, multiple counters, targets', path: 'tally/' },
  { emoji: '🔊', title: 'Decibel Meter', score: 70, type: 'Safety Tool', desc: 'Monitor sound levels with NIOSH dose tracking, continuous pitch feedback through bone conduction', path: 'decibel/' },
];

var listEl = document.getElementById('list');
var focusIndex = 0;

function render() {
  listEl.innerHTML = '';
  for (var i = 0; i < experiences.length; i++) {
    var x = experiences[i];
    var card = document.createElement('div');
    card.className = 'card' + (i === focusIndex ? ' focused' : '');
    card.setAttribute('data-idx', i);
    card.innerHTML = '<div class="emoji">' + x.emoji + '</div>' +
      '<div class="info">' +
        '<div class="title">' + x.title + ' <span style="font-size:14px;opacity:0.7;color:' + (x.score >= 90 ? '#facc15' : x.score >= 76 ? '#4a9eff' : x.score >= 60 ? '#9ca3af' : '#ef4444') + '">' + x.score + '</span></div>' +
        '<span class="type">' + x.type + '</span>' +
        '<div class="desc">' + x.desc + '</div>' +
      '</div>';
    listEl.appendChild(card);
  }
  var focused = listEl.querySelector('.focused');
  if (focused) focused.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

document.addEventListener('keydown', function(e) {
  e.preventDefault();
  if (e.key === 'ArrowDown') {
    focusIndex = Math.min(experiences.length - 1, focusIndex + 1);
    render();
  } else if (e.key === 'ArrowUp') {
    focusIndex = Math.max(0, focusIndex - 1);
    render();
  } else if (e.key === 'Enter') {
    window.location.href = experiences[focusIndex].path;
  } else if (e.key === 'Escape' || e.key === 'Backspace') {
    window.location.href = '../';
  }
});

render();
</script>
</body>
</html>
