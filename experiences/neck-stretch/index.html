<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Neck Stretch — LITF</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;width:600px;height:600px;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{display:block}

/* Mobile responsive: scale 600x600 canvas to fit viewport */
@media (max-width: 600px) {
  html,body{width:100%!important;height:100%!important;margin:0;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw!important;max-height:100vh!important;width:auto!important;height:auto!important;aspect-ratio:1/1}
}
@media (max-height: 600px) and (max-width: 600px) {
  canvas{max-height:100vh!important;max-width:100vh!important}
}
</style>
</head>
<body>
<canvas id="c" width="600" height="600" tabindex="0"></canvas>
<script>
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 600, H = 600;
  var CX = W/2, CY = H/2;

  // State
  var state = 'menu'; // menu, calibrating, exercise, complete, rest
  var headAlpha = 0, headBeta = 0, headGamma = 0;
  var calAlpha = 0, calBeta = 0, calGamma = 0;
  var relPitch = 0, relYaw = 0, relRoll = 0;
  var smoothPitch = 0, smoothYaw = 0, smoothRoll = 0;
  var hasOrientation = false;
  var orientationPermission = false;

  // Audio
  var audioCtx = null;
  var guideOsc = null;
  var guideGain = null;
  var audioInited = false;

  // Mic
  var micFailed = true; // assume failure until proven otherwise
  var micLevel = 0;
  var micSmooth = 0;
  var micAnalyser = null;
  var micDataArray = null;
  var micStream = null;

  // Ambient soundscape (mic-reactive)
  var ambEnabled = true;
  var ambientType = 0; // 0=Warm, 1=Rain, 2=Wind
  var ambientTypeNames = ['Warm', 'Rain', 'Wind'];
  var ambientSource = null, ambientFilter = null, ambientFilter2 = null, ambientGainNode = null;
  var ambientActive = false;
  var noiseBuf = null;

  // Breathing detection
  var breathTrend = 0; // smoothed volume derivative
  var breathSmooth = 0;
  var prevBreathLevel = 0;
  var breathSyncScore = 0; // 0-1, how steady the breathing is
  var breathHarmOsc = null, breathHarmGain = null;
  var breathCycleCount = 0; // tracks inhale/exhale transitions
  var lastBreathDir = 0; // -1 exhale, 1 inhale

  // Breathing guide — core mechanic during holds
  var breathGuidePhase = 0; // 0-1 position in breath cycle
  var breathPaces = [
    { name: 'Slow', len: 10 },
    { name: 'Medium', len: 8 },
    { name: 'Fast', len: 6 }
  ];
  var breathPaceIdx = 1; // default Medium
  var breathGuideMatch = 0; // 0-1 sync with guide rhythm
  var sessionBreathSync = 0; // cumulative for session summary
  var sessionBreathSamples = 0;

  // Routines
  var routines = [
    { name: 'Quick Relief', icon: '⚡', duration: '2 min', steps: [
      { dir: 'Look Left', axis: 'yaw', target: -30, hold: 5 },
      { dir: 'Look Right', axis: 'yaw', target: 30, hold: 5 },
      { dir: 'Tilt Left', axis: 'roll', target: -25, hold: 5 },
      { dir: 'Tilt Right', axis: 'roll', target: 25, hold: 5 },
      { dir: 'Look Down', axis: 'pitch', target: 25, hold: 5 },
      { dir: 'Look Up', axis: 'pitch', target: -20, hold: 5 }
    ]},
    { name: 'Deep Stretch', icon: '🧘', duration: '4 min', steps: [
      { dir: 'Look Left', axis: 'yaw', target: -35, hold: 8 },
      { dir: 'Look Right', axis: 'yaw', target: 35, hold: 8 },
      { dir: 'Tilt Left', axis: 'roll', target: -30, hold: 8 },
      { dir: 'Tilt Right', axis: 'roll', target: 30, hold: 8 },
      { dir: 'Look Down', axis: 'pitch', target: 30, hold: 8 },
      { dir: 'Look Up', axis: 'pitch', target: -25, hold: 8 },
      { dir: 'Roll Left-Down', axis: 'roll', target: -25, hold: 6 },
      { dir: 'Roll Right-Down', axis: 'roll', target: 25, hold: 6 },
      { dir: 'Chin Tuck', axis: 'pitch', target: 10, hold: 10 },
      { dir: 'Center & Hold', axis: 'pitch', target: 0, hold: 5 }
    ]},
    { name: 'Tension Buster', icon: '💥', duration: '3 min', steps: [
      { dir: 'Chin Tuck', axis: 'pitch', target: 10, hold: 8 },
      { dir: 'Look Left', axis: 'yaw', target: -40, hold: 6 },
      { dir: 'Look Right', axis: 'yaw', target: 40, hold: 6 },
      { dir: 'Tilt Left Ear→Shoulder', axis: 'roll', target: -35, hold: 8 },
      { dir: 'Tilt Right Ear→Shoulder', axis: 'roll', target: 35, hold: 8 },
      { dir: 'Look Down & Hold', axis: 'pitch', target: 35, hold: 10 },
      { dir: 'Gentle Look Up', axis: 'pitch', target: -15, hold: 6 },
      { dir: 'Return to Center', axis: 'pitch', target: 0, hold: 3 }
    ]}
  ];

  var selectedRoutine = 0;
  var currentStep = 0;
  var stepPhase = 'move'; // move, hold, transition
  var exercisePaused = false;
  var holdTimer = 0;
  var holdRequired = 0;
  var atTarget = false;
  var atTargetTimer = 0;
  var transitionTimer = 0;
  var sessionComplete = false;
  var rom = { pitch: { min: 0, max: 0 }, yaw: { min: 0, max: 0 }, roll: { min: 0, max: 0 } };
  var sessionCount = 0;
  var streak = 0;
  var lastSessionDate = '';
  var bestROM = { pitch: 0, yaw: 0, roll: 0 };

  // Rank system — cumulative sessions unlock bonuses
  var ranks = [
    { name: 'Beginner',   threshold: 0,   icon: '🌱', holdZoneBonus: 0, decayMult: 2.0 },
    { name: 'Regular',    threshold: 3,   icon: '🌿', holdZoneBonus: 1, decayMult: 1.8 },
    { name: 'Dedicated',  threshold: 8,   icon: '🍃', holdZoneBonus: 1, decayMult: 1.5 },
    { name: 'Flexible',   threshold: 15,  icon: '🌳', holdZoneBonus: 2, decayMult: 1.2 },
    { name: 'Limber',     threshold: 25,  icon: '🎋', holdZoneBonus: 2, decayMult: 1.0 },
    { name: 'Consistent', threshold: 40,  icon: '🏔️', holdZoneBonus: 3, decayMult: 0.8 },
    { name: 'Supple',     threshold: 60,  icon: '🧘', holdZoneBonus: 3, decayMult: 0.5 },
    { name: 'Zen Master', threshold: 100, icon: '✨', holdZoneBonus: 4, decayMult: 0.3 }
  ];

  function getRankIdx() {
    var idx = 0;
    for (var i = ranks.length - 1; i >= 0; i--) {
      if (sessionCount >= ranks[i].threshold) { idx = i; break; }
    }
    return idx;
  }

  function getRankBonuses() {
    var r = ranks[getRankIdx()];
    return { holdZoneBonus: r.holdZoneBonus, decayMult: r.decayMult };
  }

  var prevRankIdx = 0;
  var rankUpShow = 0; // timer for rank-up display

  // Best breath sync per routine (persisted)
  var bestSync = [0, 0, 0]; // one per routine index

  // Load stats
  try {
    var saved = JSON.parse(localStorage.getItem('litf_neck_stretch'));
    if (saved) {
      sessionCount = saved.sessionCount || 0;
      streak = saved.streak || 0;
      lastSessionDate = saved.lastSessionDate || '';
      if (saved.ambEnabled !== undefined) ambEnabled = saved.ambEnabled;
      if (saved.ambientType !== undefined) ambientType = saved.ambientType;
      if (saved.breathPaceIdx !== undefined) breathPaceIdx = saved.breathPaceIdx;
      if (saved.bestROM) {
        bestROM.pitch = saved.bestROM.pitch || 0;
        bestROM.yaw = saved.bestROM.yaw || 0;
        bestROM.roll = saved.bestROM.roll || 0;
      }
      if (saved.bestSync) {
        for (var i = 0; i < 3; i++) bestSync[i] = saved.bestSync[i] || 0;
      }
    }
  } catch(e) {}
  prevRankIdx = getRankIdx();

  // Init audio
  function initAudio() {
    if (audioInited) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      guideOsc = audioCtx.createOscillator();
      guideGain = audioCtx.createGain();
      guideOsc.type = 'sine';
      guideOsc.frequency.value = 440;
      guideGain.gain.value = 0;
      guideOsc.connect(guideGain);
      guideGain.connect(audioCtx.destination);
      guideOsc.start();
      audioInited = true;
    } catch(e) {}
  }

  function playTone(freq, dur, vol) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    g.gain.setTargetAtTime(0, audioCtx.currentTime + (dur || 0.15), 0.05);
    o.stop(audioCtx.currentTime + (dur || 0.15) + 0.2);
  }

  function playChime() {
    playTone(523, 0.1, 0.12);
    setTimeout(function(){ playTone(659, 0.1, 0.12); }, 100);
    setTimeout(function(){ playTone(784, 0.15, 0.12); }, 200);
  }

  function playComplete() {
    playTone(523, 0.12, 0.15);
    setTimeout(function(){ playTone(659, 0.12, 0.15); }, 120);
    setTimeout(function(){ playTone(784, 0.12, 0.15); }, 240);
    setTimeout(function(){ playTone(1047, 0.2, 0.15); }, 360);
  }

  // Mic init
  function initMic() {
    if (!audioCtx) return;
    micFailed = true;
    try {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        micFailed = false;
        micStream = stream;
        var src = audioCtx.createMediaStreamSource(stream);
        micAnalyser = audioCtx.createAnalyser();
        micAnalyser.fftSize = 256;
        micDataArray = new Uint8Array(micAnalyser.frequencyBinCount);
        src.connect(micAnalyser);
        initAmbient();
      }).catch(function() { micFailed = true; });
    } catch(e) { micFailed = true; }
  }

  function updateMic() {
    if (!micAnalyser || !micDataArray) return;
    micAnalyser.getByteTimeDomainData(micDataArray);
    var sum = 0;
    for (var i = 0; i < micDataArray.length; i++) {
      var v = (micDataArray[i] - 128) / 128;
      sum += v * v;
    }
    micLevel = Math.sqrt(sum / micDataArray.length);
    micSmooth += (micLevel - micSmooth) * 0.08;

    // Breathing detection: track volume trend derivative
    var delta = micSmooth - prevBreathLevel;
    breathTrend += (delta - breathTrend) * 0.06;
    breathSmooth += (micSmooth - breathSmooth) * 0.03;
    prevBreathLevel = micSmooth;

    // Track breath cycles (inhale/exhale transitions)
    var dir = breathTrend > 0.0003 ? 1 : (breathTrend < -0.0003 ? -1 : 0);
    if (dir !== 0 && dir !== lastBreathDir) {
      if (lastBreathDir !== 0) breathCycleCount++;
      lastBreathDir = dir;
    }

    // Sync score: steadiness of breathing (low variance = good)
    var steadiness = 1 - Math.min(Math.abs(breathTrend) * 800, 1);
    breathSyncScore += (steadiness - breathSyncScore) * 0.02;

    // Match against breathing guide: inhale phase=0-0.5, exhale phase=0.5-1
    if (stepPhase === 'hold') {
      var guideExpecting = breathGuidePhase < 0.5 ? 1 : -1; // 1=inhale, -1=exhale
      var micDir = breathTrend > 0.0002 ? 1 : (breathTrend < -0.0002 ? -1 : 0);
      var match = 0;
      if (micDir === guideExpecting) match = 1;
      else if (micDir === 0) match = 0.5; // neutral is ok
      else match = 0;
      breathGuideMatch += (match - breathGuideMatch) * 0.04;
      sessionBreathSync += breathGuideMatch;
      sessionBreathSamples++;
    }
  }

  // Ambient soundscape — noise-buffer based, 3 types (Warm/Rain/Wind)
  function createNoiseBuffer() {
    if (!audioCtx) return null;
    var sr = audioCtx.sampleRate;
    var buf = audioCtx.createBuffer(1, sr * 2, sr);
    var data = buf.getChannelData(0);
    for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function startAmbient() {
    if (!audioCtx || !ambEnabled) return;
    stopAmbient();
    if (!noiseBuf) noiseBuf = createNoiseBuffer();

    ambientSource = audioCtx.createBufferSource();
    ambientSource.buffer = noiseBuf;
    ambientSource.loop = true;

    ambientFilter = audioCtx.createBiquadFilter();
    ambientFilter2 = audioCtx.createBiquadFilter();
    ambientGainNode = audioCtx.createGain();

    switch (ambientType) {
      case 0: // Warm — deep brown noise, meditative
        ambientFilter.type = 'lowpass';
        ambientFilter.frequency.value = 180;
        ambientFilter.Q.value = 0.7;
        ambientFilter2.type = 'lowpass';
        ambientFilter2.frequency.value = 300;
        ambientFilter2.Q.value = 0.5;
        break;
      case 1: // Rain — bandpass at high freq
        ambientFilter.type = 'bandpass';
        ambientFilter.frequency.value = 4500;
        ambientFilter.Q.value = 0.4;
        ambientFilter2.type = 'highpass';
        ambientFilter2.frequency.value = 800;
        ambientFilter2.Q.value = 0.3;
        break;
      case 2: // Wind — low bandpass
        ambientFilter.type = 'lowpass';
        ambientFilter.frequency.value = 600;
        ambientFilter.Q.value = 0.8;
        ambientFilter2.type = 'lowpass';
        ambientFilter2.frequency.value = 1200;
        ambientFilter2.Q.value = 0.3;
        break;
    }

    ambientGainNode.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    var targetVol = 0.04; // subtle ambient
    ambientGainNode.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.8);

    ambientSource.connect(ambientFilter);
    ambientFilter.connect(ambientFilter2);
    ambientFilter2.connect(ambientGainNode);
    ambientGainNode.connect(audioCtx.destination);
    ambientSource.start();
    ambientActive = true;
  }

  function stopAmbient() {
    if (!ambientActive) return;
    try {
      if (ambientGainNode) {
        ambientGainNode.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.3);
        var src = ambientSource;
        setTimeout(function() {
          try { src.stop(); src.disconnect(); } catch(e) {}
        }, 1500);
      }
    } catch(e) {
      try { if (ambientSource) { ambientSource.stop(); ambientSource.disconnect(); } } catch(e2) {}
    }
    ambientSource = null;
    ambientFilter = null;
    ambientFilter2 = null;
    ambientGainNode = null;
    ambientActive = false;
  }

  function initAmbient() {
    // Start ambient if enabled, init breathing harmony
    if (ambEnabled) startAmbient();

    // Breathing harmony oscillator (reward for steady breathing during holds)
    if (!breathHarmOsc && audioCtx) {
      try {
        breathHarmOsc = audioCtx.createOscillator();
        breathHarmGain = audioCtx.createGain();
        breathHarmOsc.type = 'triangle';
        breathHarmOsc.frequency.value = 220; // A3
        breathHarmGain.gain.value = 0;
        breathHarmOsc.connect(breathHarmGain);
        breathHarmGain.connect(audioCtx.destination);
        breathHarmOsc.start();
      } catch(e) {}
    }
  }

  function updateAmbient() {
    if (!audioCtx) return;
    // Handle ambient on/off and state transitions
    if (!ambEnabled || state !== 'exercise') {
      if (ambientActive) stopAmbient();
      if (breathHarmGain) breathHarmGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
      return;
    }
    // Start ambient if enabled but not yet active
    if (ambEnabled && !ambientActive) startAmbient();

    // During holds: breathing guide harmony — reward sync with guide
    if (stepPhase === 'hold' && breathHarmGain) {
      // Harmony tone scales with guide match quality (not just steadiness)
      var harmVol = breathGuideMatch > 0.35 ? (breathGuideMatch - 0.35) * 0.06 : 0;
      // Pitch follows guide: rises on inhale, falls on exhale
      var harmPitch = breathGuidePhase < 0.5
        ? 220 + (breathGuidePhase / 0.5) * 110  // 220→330Hz inhale
        : 330 - ((breathGuidePhase - 0.5) / 0.5) * 110; // 330→220Hz exhale
      breathHarmOsc.frequency.setTargetAtTime(harmPitch, audioCtx.currentTime, 0.08);
      breathHarmGain.gain.setTargetAtTime(harmVol, audioCtx.currentTime, 0.1);
    } else if (breathHarmGain) {
      breathHarmGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
    }
  }

  // Update breathing guide phase — runs during holds
  function updateBreathGuide(dt) {
    if (stepPhase !== 'hold') { breathGuidePhase = 0; return; }
    var cycleLen = breathPaces[breathPaceIdx].len;
    breathGuidePhase += dt / cycleLen;
    if (breathGuidePhase >= 1) breathGuidePhase -= 1;
  }

  // Orientation
  function handleOrientation(e) {
    hasOrientation = true;
    headAlpha = e.alpha || 0;
    headBeta = e.beta || 0;
    headGamma = e.gamma || 0;
  }

  function requestOrientation() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function(perm) {
        if (perm === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
          orientationPermission = true;
        }
      }).catch(function(){});
    } else {
      window.addEventListener('deviceorientation', handleOrientation);
      orientationPermission = true;
    }
  }

  function calibrate() {
    calAlpha = headAlpha;
    calBeta = headBeta;
    calGamma = headGamma;
  }

  function getRelative() {
    relPitch = headBeta - calBeta;
    relYaw = headAlpha - calAlpha;   // alpha = compass heading = yaw
    relRoll = headGamma - calGamma;  // gamma = left/right tilt = roll
    // Normalize yaw (alpha wraps 0-360)
    if (relYaw > 180) relYaw -= 360;
    if (relYaw < -180) relYaw += 360;
    // Smooth
    smoothPitch += (relPitch - smoothPitch) * 0.15;
    smoothYaw += (relYaw - smoothYaw) * 0.15;
    smoothRoll += (relRoll - smoothRoll) * 0.15;
  }

  function getAxisValue(axis) {
    if (axis === 'pitch') return smoothPitch;
    if (axis === 'yaw') return smoothYaw;
    if (axis === 'roll') return smoothRoll;
    return 0;
  }

  function updateROM() {
    rom.pitch.min = Math.min(rom.pitch.min, smoothPitch);
    rom.pitch.max = Math.max(rom.pitch.max, smoothPitch);
    rom.yaw.min = Math.min(rom.yaw.min, smoothYaw);
    rom.yaw.max = Math.max(rom.yaw.max, smoothYaw);
    rom.roll.min = Math.min(rom.roll.min, smoothRoll);
    rom.roll.max = Math.max(rom.roll.max, smoothRoll);
  }

  // Guide tone — pitch drops as you approach target
  function updateGuideTone(axis, target) {
    if (!guideGain || !guideOsc) return;
    var val = getAxisValue(axis);
    var dist = Math.abs(val - target);
    var maxDist = Math.abs(target) + 15;
    var norm = Math.min(dist / maxDist, 1);
    // High pitch = far, low pitch = close, silence = at target
    if (dist < 3) {
      guideGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
    } else {
      var freq = 220 + norm * 440; // 220-660Hz
      guideOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
      guideGain.gain.setTargetAtTime(0.06, audioCtx.currentTime, 0.05);
    }
  }

  function silenceGuide() {
    if (guideGain && audioCtx) {
      guideGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
    }
  }

  // Demo mode for when no orientation sensor
  var demoAngle = 0;
  var demoTarget = 0;
  var demoAxis = 'pitch';
  function updateDemo() {
    if (hasOrientation) return;
    // Simulate slow movement toward target
    demoAngle += (demoTarget - demoAngle) * 0.02;
    if (state === 'exercise') {
      var step = routines[selectedRoutine].steps[currentStep];
      demoTarget = step.target;
      demoAxis = step.axis;
    }
    if (demoAxis === 'pitch') smoothPitch = demoAngle;
    else if (demoAxis === 'yaw') smoothYaw = demoAngle;
    else if (demoAxis === 'roll') smoothRoll = demoAngle;
  }

  // Save stats
  function saveStats() {
    try {
      localStorage.setItem('litf_neck_stretch', JSON.stringify({
        sessionCount: sessionCount,
        streak: streak,
        lastSessionDate: lastSessionDate,
        bestROM: bestROM,
        ambEnabled: ambEnabled,
        ambientType: ambientType,
        breathPaceIdx: breathPaceIdx,
        bestSync: bestSync
      }));
    } catch(e) {}
  }

  function playRankUp() {
    playTone(523, 0.1, 0.12);
    setTimeout(function(){ playTone(659, 0.1, 0.12); }, 100);
    setTimeout(function(){ playTone(784, 0.1, 0.12); }, 200);
    setTimeout(function(){ playTone(1047, 0.18, 0.14); }, 300);
  }

  // Drawing helpers
  function drawText(text, x, y, size, color, align) {
    ctx.font = (size || 16) + 'px system-ui, sans-serif';
    ctx.fillStyle = color || '#e0e0e0';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
  }

  function drawCircle(x, y, r, color, lineWidth) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    if (lineWidth) {
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    } else {
      ctx.fillStyle = color;
      ctx.fill();
    }
  }

  // Draw menu
  function drawMenu() {
    var rIdx = getRankIdx();
    var rank = ranks[rIdx];
    var nextRank = rIdx < ranks.length - 1 ? ranks[rIdx + 1] : null;

    // Title
    drawText('🧘 Neck Stretch', CX, 50, 28, '#ffffff');
    drawText('Head-tracked guided stretches', CX, 80, 14, '#888');

    // Rank display
    drawText(rank.icon + ' ' + rank.name, CX, 112, 16, '#4a9eff');
    if (nextRank) {
      var prog = (sessionCount - rank.threshold) / (nextRank.threshold - rank.threshold);
      // Progress bar
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(180, 125, 240, 8);
      ctx.fillStyle = '#4a9eff';
      ctx.fillRect(180, 125, 240 * Math.min(prog, 1), 8);
      drawText(sessionCount + '/' + nextRank.threshold + ' sessions → ' + nextRank.icon + ' ' + nextRank.name, CX, 148, 11, '#666');
    } else {
      drawText('Max rank! ' + sessionCount + ' sessions', CX, 140, 11, '#666');
    }

    // Sensor status
    if (hasOrientation) {
      drawText('✅ Head tracking active', CX, 170, 12, '#4CAF50');
    } else {
      drawText('📱 Demo mode (no sensor)', CX, 170, 12, '#FF9800');
    }
    if (!micFailed) {
      drawText('🎤 Mic active — breath sync + ' + (ambEnabled ? ambientTypeNames[ambientType] + ' soundscape' : 'sound OFF'), CX, 186, 11, ambEnabled ? '#4a9eff' : '#666');
    }

    // Routines
    for (var i = 0; i < routines.length; i++) {
      var r = routines[i];
      var y = 220 + i * 80;
      var selected = i === selectedRoutine;

      // Card background
      ctx.fillStyle = selected ? '#1a3a5c' : '#1a1a1a';
      ctx.strokeStyle = selected ? '#4a9eff' : '#333';
      ctx.lineWidth = selected ? 2 : 1;
      ctx.beginPath();
      ctx.roundRect(80, y - 25, 440, 60, 12);
      ctx.fill();
      ctx.stroke();

      // Focus ring
      if (selected) {
        ctx.strokeStyle = '#4a9eff';
        ctx.lineWidth = 2;
        ctx.setLineDash([4,4]);
        ctx.beginPath();
        ctx.roundRect(76, y - 29, 448, 68, 14);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      drawText(r.icon, 120, y, 22);
      drawText(r.name, 250, y - 5, 17, selected ? '#ffffff' : '#ccc', 'left');
      var cardInfo = r.steps.length + ' stretches · ' + r.duration;
      if (bestSync[i] > 0) {
        var sg = bestSync[i] >= 75 ? 'S' : bestSync[i] >= 60 ? 'A' : bestSync[i] >= 45 ? 'B' : bestSync[i] >= 30 ? 'C' : 'D';
        cardInfo += '  ·  🫁 ' + bestSync[i] + '% (' + sg + ')';
      }
      drawText(cardInfo, 250, y + 16, 12, '#888', 'left');
    }

    // Rank bonus info
    var bonuses = getRankBonuses();
    if (bonuses.holdZoneBonus > 0) {
      drawText('Rank bonus: +' + bonuses.holdZoneBonus + '° hold zone · ' + (bonuses.decayMult < 2 ? 'Slower drift penalty' : ''), CX, 485, 12, '#4a9eff');
    }

    // Stats
    if (sessionCount > 0) {
      drawText('Sessions: ' + sessionCount + (streak > 1 ? '  🔥 ' + streak + ' day streak' : ''), CX, 510, 13, '#666');
    }

    // Sound status
    var soundStatus = ambEnabled ? '🔊 ' + ambientTypeNames[ambientType] + ' soundscape' : '🔇 Sound off';
    drawText(soundStatus, CX, 535, 12, ambEnabled ? '#4a9eff' : '#555');

    // Controls
    drawText('↑↓ Select · Enter Start · ← Sound · → Type · Esc Back', CX, 560, 13, '#555');
  }

  // Draw calibration
  var calCountdown = 3;
  var calStart = 0;
  function drawCalibrating() {
    var elapsed = (Date.now() - calStart) / 1000;
    var remaining = Math.max(0, calCountdown - elapsed);

    drawText('🎯 Calibrating', CX, 180, 24, '#ffffff');
    drawText('Look straight ahead', CX, 220, 16, '#aaa');
    drawText('Keep your head level', CX, 250, 14, '#888');

    // Countdown circle
    var progress = elapsed / calCountdown;
    drawCircle(CX, 360, 60, '#1a1a1a');
    ctx.beginPath();
    ctx.arc(CX, 360, 60, -Math.PI/2, -Math.PI/2 + progress * Math.PI * 2);
    ctx.strokeStyle = '#4a9eff';
    ctx.lineWidth = 4;
    ctx.stroke();
    drawText(Math.ceil(remaining).toString(), CX, 360, 36, '#ffffff');

    if (remaining <= 0) {
      calibrate();
      state = 'exercise';
      currentStep = 0;
      stepPhase = 'move';
      holdTimer = 0;
      atTarget = false;
      atTargetTimer = 0;
      rom = { pitch: { min: 0, max: 0 }, yaw: { min: 0, max: 0 }, roll: { min: 0, max: 0 } };
      playTone(440, 0.15, 0.1);
    }
  }

  // Draw exercise
  var lastTick = Date.now();
  function drawExercise() {
    var routine = routines[selectedRoutine];
    var step = routine.steps[currentStep];
    var now = Date.now();
    var dt = exercisePaused ? 0 : (now - lastTick) / 1000;
    lastTick = now;

    getRelative();
    updateROM();
    updateDemo();
    if (!exercisePaused) updateMic();
    updateAmbient();
    if (!exercisePaused) updateBreathGuide(dt);

    var axisVal = getAxisValue(step.axis);
    var dist = Math.abs(axisVal - step.target);
    var bonuses = getRankBonuses();
    var threshold = 5 + bonuses.holdZoneBonus; // degrees — wider at higher ranks
    var isClose = dist < threshold;

    // Header
    var rk = ranks[getRankIdx()];
    drawText(routine.icon + ' ' + routine.name, CX, 30, 16, '#888');
    drawText(rk.icon + ' ' + rk.name + '  ·  ' + (currentStep + 1) + '/' + routine.steps.length, CX, 55, 13, '#555');

    // Direction instruction
    var dirColor = isClose ? '#4CAF50' : '#4a9eff';
    drawText(step.dir, CX, 100, 28, dirColor);

    // Target visualization — circle with head dot
    var vizCX = CX, vizCY = 280, vizR = 130;

    // Background circle
    drawCircle(vizCX, vizCY, vizR, '#1a1a1a');
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(vizCX, vizCY, vizR, 0, Math.PI * 2);
    ctx.stroke();

    // Cross hairs
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(vizCX - vizR, vizCY);
    ctx.lineTo(vizCX + vizR, vizCY);
    ctx.moveTo(vizCX, vizCY - vizR);
    ctx.lineTo(vizCX, vizCY + vizR);
    ctx.stroke();

    // Target zone
    var tNormX = 0, tNormY = 0;
    if (step.axis === 'yaw') tNormX = step.target / 50;
    else if (step.axis === 'pitch') tNormY = step.target / 50;
    else if (step.axis === 'roll') tNormX = step.target / 50;

    var targetX = vizCX + tNormX * vizR;
    var targetY = vizCY + tNormY * vizR;

    // Target glow
    var glowAlpha = 0.2 + 0.1 * Math.sin(now / 300);
    ctx.beginPath();
    ctx.arc(targetX, targetY, 25, 0, Math.PI * 2);
    ctx.fillStyle = isClose ? 'rgba(76,175,80,' + glowAlpha + ')' : 'rgba(74,158,255,' + glowAlpha + ')';
    ctx.fill();

    // Target ring
    drawCircle(targetX, targetY, 18, isClose ? '#4CAF50' : '#4a9eff', 2);
    drawCircle(targetX, targetY, 4, isClose ? '#4CAF50' : '#4a9eff');

    // Head position dot — map based on current step axis
    var hNormX, hNormY;
    if (step.axis === 'roll') {
      hNormX = smoothRoll / 50;
      hNormY = smoothPitch / 50;
    } else {
      hNormX = smoothYaw / 50;
      hNormY = smoothPitch / 50;
    }
    hNormX = Math.max(-1, Math.min(1, hNormX));
    hNormY = Math.max(-1, Math.min(1, hNormY));
    var headX = vizCX + hNormX * vizR;
    var headY = vizCY + hNormY * vizR;

    // Trail line from center to head
    ctx.beginPath();
    ctx.moveTo(vizCX, vizCY);
    ctx.lineTo(headX, headY);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Head dot
    drawCircle(headX, headY, 12, '#ffffff');
    drawCircle(headX, headY, 8, isClose ? '#4CAF50' : '#ff6b6b');

    // Guide audio
    if (stepPhase === 'move') {
      updateGuideTone(step.axis, step.target);
    }

    // Phase logic
    if (stepPhase === 'move') {
      if (isClose) {
        atTargetTimer += dt;
        if (atTargetTimer > 0.5 && !atTarget) {
          atTarget = true;
          stepPhase = 'hold';
          holdTimer = 0;
          holdRequired = step.hold;
          silenceGuide();
          playTone(523, 0.1, 0.1);
        }
      } else {
        atTargetTimer = Math.max(0, atTargetTimer - dt * 2);
      }

      // Move prompt
      var arrow = '→';
      if (step.target < 0) arrow = '←';
      if (step.axis === 'pitch' && step.target > 0) arrow = '↓';
      if (step.axis === 'pitch' && step.target < 0) arrow = '↑';
      drawText(arrow + ' Move to target', CX, 440, 16, '#4a9eff');
      drawText(Math.round(dist) + '° away', CX, 465, 13, '#666');

    } else if (stepPhase === 'hold') {
      // Breath sync bonus: good breathing speeds hold up to 35%
      var breathBonus = !micFailed ? breathGuideMatch * 0.35 : 0;
      holdTimer += dt * (1 + breathBonus);
      var holdProg = Math.min(holdTimer / holdRequired, 1);

      // Check still at target
      if (!isClose) {
        // Drifted away
        drawText('⚠ Hold the position', CX, 440, 16, '#FF9800');
        holdTimer = Math.max(0, holdTimer - dt * bonuses.decayMult); // Softer at higher ranks
      } else {
        if (!micFailed && breathBonus > 0.15) {
          drawText('✋ Hold · 🫁 Breathing ×' + (1 + breathBonus).toFixed(1), CX, 440, 16, '#4CAF50');
        } else {
          drawText('✋ Hold...', CX, 440, 16, '#4CAF50');
        }
      }

      // Breathing guide ring (left of hold bar)
      if (!micFailed) {
        var bRingX = 115, bRingY = 480, bRingR = 20;
        // Ring background
        drawCircle(bRingX, bRingY, bRingR, '#1a1a1a');
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(bRingX, bRingY, bRingR, 0, Math.PI * 2);
        ctx.stroke();

        // Breath phase arc: inhale fills top, exhale fills bottom
        var isInhale = breathGuidePhase < 0.5;
        var phaseProgress = isInhale ? breathGuidePhase / 0.5 : (breathGuidePhase - 0.5) / 0.5;
        // Expanding/contracting inner circle
        var innerR = isInhale ? 4 + phaseProgress * (bRingR - 6) : (bRingR - 2) - phaseProgress * (bRingR - 6);
        var syncColor = breathGuideMatch > 0.6 ? '#4CAF50' : (breathGuideMatch > 0.3 ? '#FF9800' : '#666');
        ctx.beginPath();
        ctx.arc(bRingX, bRingY, innerR, 0, Math.PI * 2);
        ctx.fillStyle = syncColor;
        ctx.globalAlpha = 0.3 + breathGuideMatch * 0.4;
        ctx.fill();
        ctx.globalAlpha = 1;

        // Label
        drawText(isInhale ? 'In' : 'Out', bRingX, bRingY, 10, '#ccc');
        drawText(breathPaces[breathPaceIdx].name, bRingX, bRingY + bRingR + 10, 9, '#555');
      }

      // Hold progress bar
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(150, 475, 300, 12);
      ctx.fillStyle = holdProg >= 1 ? '#4CAF50' : '#4a9eff';
      ctx.fillRect(150, 475, 300 * holdProg, 12);
      drawText(Math.ceil(holdRequired - holdTimer) + 's', CX, 505, 13, '#888');

      // Gentle hold tone (subtle pulse)
      if (audioCtx && guideOsc) {
        var holdFreq = 330 + 20 * Math.sin(now / 500);
        guideOsc.frequency.setTargetAtTime(holdFreq, audioCtx.currentTime, 0.1);
        guideGain.gain.setTargetAtTime(isClose ? 0.03 : 0, audioCtx.currentTime, 0.05);
      }

      if (holdProg >= 1) {
        silenceGuide();
        // Next step or complete
        currentStep++;
        if (currentStep >= routine.steps.length) {
          state = 'complete';
          sessionComplete = true;
          sessionCount++;
          // Silence ambient on complete
          stopAmbient();
          if (breathHarmGain && audioCtx) breathHarmGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
          // Update bestROM
          var romPitch = Math.round(rom.pitch.max - rom.pitch.min);
          var romYaw = Math.round(Math.abs(rom.yaw.max - rom.yaw.min));
          var romRoll = Math.round(Math.abs(rom.roll.max - rom.roll.min));
          if (romPitch > bestROM.pitch) bestROM.pitch = romPitch;
          if (romYaw > bestROM.yaw) bestROM.yaw = romYaw;
          if (romRoll > bestROM.roll) bestROM.roll = romRoll;
          // Streak logic
          var today = new Date().toISOString().slice(0, 10);
          var yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
          if (lastSessionDate === yesterday || lastSessionDate === today) {
            if (lastSessionDate !== today) streak++;
          } else {
            streak = 1;
          }
          lastSessionDate = today;
          // Check rank up
          var newRankIdx = getRankIdx();
          if (newRankIdx > prevRankIdx) {
            rankUpShow = 180; // ~3 seconds at 60fps
            prevRankIdx = newRankIdx;
            saveStats();
            setTimeout(function(){ playRankUp(); }, 500);
          } else {
            saveStats();
            playComplete();
          }
        } else {
          stepPhase = 'move';
          atTarget = false;
          atTargetTimer = 0;
          playChime();
        }
      }
    }

    // Pause overlay
    if (exercisePaused) {
      ctx.fillStyle = 'rgba(13,13,13,0.7)';
      ctx.fillRect(0, 0, W, H);
      drawText('⏸ PAUSED', CX, 280, 32, '#ffffff');
      drawText('Enter to resume · Esc to quit', CX, 320, 14, '#888');
      drawText('← Sound · → Type · ↑↓ Breath pace', CX, 345, 12, '#555');
    }

    // Step progress dots at bottom
    var dotY = 555;
    var dotSpacing = Math.min(20, (400) / routine.steps.length);
    var startX = CX - (routine.steps.length - 1) * dotSpacing / 2;
    for (var i = 0; i < routine.steps.length; i++) {
      var dx = startX + i * dotSpacing;
      if (i < currentStep) {
        drawCircle(dx, dotY, 5, '#4CAF50');
      } else if (i === currentStep) {
        drawCircle(dx, dotY, 6, '#4a9eff');
      } else {
        drawCircle(dx, dotY, 4, '#333');
      }
    }

    // Mic + ambient indicator (top-right)
    if (!micFailed && ambEnabled) {
      var micBarH = micSmooth * 200;
      ctx.fillStyle = 'rgba(74,158,255,0.15)';
      ctx.fillRect(565, 50 - micBarH/2, 8, micBarH);
      drawText('🎤', 569, 30, 10, '#4a9eff');
      // Breathing sync indicator during holds
      if (stepPhase === 'hold' && breathSyncScore > 0.4) {
        var bAlpha = (breathSyncScore - 0.4) * 1.6;
        drawCircle(569, 70, 5, 'rgba(76,175,80,' + bAlpha.toFixed(2) + ')');
      }
    } else if (micFailed) {
      drawText('🔇', 569, 30, 10, '#555');
    }
    // Ambient toggle hint
    drawText('↑↓ Breath pace · ← Sound · → Type · Enter Pause', CX, 530, 11, '#444');
  }

  // Draw complete screen
  function drawComplete() {
    var rIdx = getRankIdx();
    var rank = ranks[rIdx];
    var nextRank = rIdx < ranks.length - 1 ? ranks[rIdx + 1] : null;

    drawText('✅ Session Complete!', CX, 80, 28, '#4CAF50');
    drawText(routines[selectedRoutine].icon + ' ' + routines[selectedRoutine].name, CX, 115, 16, '#888');

    // Rank-up announcement
    if (rankUpShow > 0) {
      rankUpShow--;
      var alpha = Math.min(1, rankUpShow / 30);
      var glow = 0.3 + 0.2 * Math.sin(Date.now() / 200);
      ctx.fillStyle = 'rgba(74,158,255,' + (glow * alpha) + ')';
      ctx.fillRect(100, 135, 400, 40);
      drawText('⬆ Rank Up! ' + rank.icon + ' ' + rank.name, CX, 155, 18, '#ffffff');
    } else {
      drawText(rank.icon + ' ' + rank.name, CX, 150, 16, '#4a9eff');
    }

    // Rank progress
    if (nextRank) {
      var prog = (sessionCount - rank.threshold) / (nextRank.threshold - rank.threshold);
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(180, 170, 240, 6);
      ctx.fillStyle = '#4a9eff';
      ctx.fillRect(180, 170, 240 * Math.min(prog, 1), 6);
      drawText(sessionCount + '/' + nextRank.threshold + ' → ' + nextRank.icon + ' ' + nextRank.name, CX, 190, 11, '#666');
    }

    // ROM summary
    drawText('Range of Motion', CX, 225, 18, '#ffffff');

    var romPitch = Math.round(rom.pitch.max - rom.pitch.min);
    var romYaw = Math.round(Math.abs(rom.yaw.max - rom.yaw.min));
    var romRoll = Math.round(Math.abs(rom.roll.max - rom.roll.min));
    var romData = [
      { label: 'Pitch (nod)', range: romPitch + '°', best: bestROM.pitch + '°', isNew: romPitch >= bestROM.pitch && romPitch > 0 },
      { label: 'Yaw (turn)', range: romYaw + '°', best: bestROM.yaw + '°', isNew: romYaw >= bestROM.yaw && romYaw > 0 },
      { label: 'Roll (tilt)', range: romRoll + '°', best: bestROM.roll + '°', isNew: romRoll >= bestROM.roll && romRoll > 0 }
    ];

    for (var i = 0; i < romData.length; i++) {
      var ry = 270 + i * 50;
      drawText(romData[i].label, CX - 50, ry, 14, '#aaa', 'right');
      drawText(romData[i].range, CX + 20, ry, 20, romData[i].isNew ? '#4CAF50' : '#4a9eff', 'left');
      if (romData[i].isNew) {
        drawText('NEW BEST', CX + 80, ry, 10, '#4CAF50', 'left');
      } else {
        drawText('best: ' + romData[i].best, CX + 80, ry, 10, '#555', 'left');
      }
    }

    // Stats
    drawText('Total sessions: ' + sessionCount, CX, 440, 14, '#666');
    if (!micFailed && sessionBreathSamples > 0) {
      var avgSync = Math.round((sessionBreathSync / sessionBreathSamples) * 100);
      var syncGrade = avgSync >= 75 ? 'S' : avgSync >= 60 ? 'A' : avgSync >= 45 ? 'B' : avgSync >= 30 ? 'C' : 'D';
      var gradeColor = syncGrade === 'S' ? '#FFD700' : syncGrade === 'A' ? '#4CAF50' : syncGrade === 'B' ? '#4a9eff' : '#FF9800';
      var isNewBestSync = avgSync > (bestSync[selectedRoutine] || 0) && avgSync > 0;
      if (isNewBestSync) {
        bestSync[selectedRoutine] = avgSync;
        saveStats();
      }
      var syncText = '🫁 Breath sync: ' + avgSync + '% (' + syncGrade + ')  ·  ' + breathCycleCount + ' cycles';
      if (isNewBestSync) syncText += '  ⭐ NEW BEST';
      drawText(syncText, CX, 460, 13, isNewBestSync ? '#FFD700' : gradeColor);
    } else if (!micFailed) {
      drawText('🫁 Breathe with the guide to earn sync bonus', CX, 460, 12, '#555');
    }
    if (streak > 1) {
      drawText('🔥 ' + streak + ' day streak', CX, 480, 16, '#FF9800');
    }

    // Bonus info
    var bonuses = getRankBonuses();
    if (bonuses.holdZoneBonus > 0) {
      drawText('Rank perks: +' + bonuses.holdZoneBonus + '° hold zone · ' + Math.round((1 - bonuses.decayMult/2) * 100) + '% drift forgiveness', CX, 500, 12, '#4a9eff');
    }

    drawText('Enter: Again · Esc: Menu', CX, 540, 14, '#555');
  }

  // Main draw loop
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, W, H);

    if (state === 'menu') drawMenu();
    else if (state === 'calibrating') drawCalibrating();
    else if (state === 'exercise') drawExercise();
    else if (state === 'complete') drawComplete();

    requestAnimationFrame(draw);
  }

  // Input
  document.addEventListener('keydown', function(e) {
    initAudio();
    if (!orientationPermission) requestOrientation();
    if (micFailed && audioInited) initMic();

    var key = e.key;

    if (state === 'menu') {
      if (key === 'Escape') {
        window.location.href = '../';
      } else if (key === 'ArrowUp') {
        selectedRoutine = (selectedRoutine - 1 + routines.length) % routines.length;
        playTone(440, 0.05, 0.05);
      } else if (key === 'ArrowDown') {
        selectedRoutine = (selectedRoutine + 1) % routines.length;
        playTone(440, 0.05, 0.05);
      } else if (key === 'Enter') {
        state = 'calibrating';
        exercisePaused = false;
        calStart = Date.now();
        breathCycleCount = 0; // reset breath tracking per session
        breathGuidePhase = 0;
        breathGuideMatch = 0;
        sessionBreathSync = 0;
        sessionBreathSamples = 0;
        playTone(330, 0.1, 0.1);
      } else if (key === 'ArrowLeft') {
        ambEnabled = !ambEnabled;
        saveStats();
        playTone(ambEnabled ? 523 : 330, 0.08, 0.06);
      } else if (key === 'ArrowRight') {
        if (ambEnabled) {
          ambientType = (ambientType + 1) % 3;
          saveStats();
          playTone(500 + ambientType * 80, 0.1, 0.04);
        }
      }
    } else if (state === 'exercise') {
      if (key === 'Escape') {
        state = 'menu';
        exercisePaused = false;
        silenceGuide();
        stopAmbient();
        playTone(220, 0.1, 0.08);
      } else if (key === 'Enter') {
        exercisePaused = !exercisePaused;
        playTone(exercisePaused ? 330 : 523, 0.1, 0.08);
      } else if (key === 'ArrowLeft') {
        ambEnabled = !ambEnabled;
        if (!ambEnabled) stopAmbient();
        else if (state === 'exercise') startAmbient();
        saveStats();
        playTone(ambEnabled ? 523 : 330, 0.08, 0.06);
      } else if (key === 'ArrowRight') {
        if (ambEnabled) {
          ambientType = (ambientType + 1) % 3;
          stopAmbient();
          startAmbient();
          saveStats();
          playTone(500 + ambientType * 80, 0.1, 0.04);
        }
      } else if (key === 'ArrowUp') {
        breathPaceIdx = (breathPaceIdx - 1 + breathPaces.length) % breathPaces.length;
        saveStats();
        playTone(440 + breathPaceIdx * 60, 0.06, 0.06);
      } else if (key === 'ArrowDown') {
        breathPaceIdx = (breathPaceIdx + 1) % breathPaces.length;
        saveStats();
        playTone(440 + breathPaceIdx * 60, 0.06, 0.06);
      }
    } else if (state === 'complete') {
      if (key === 'Enter') {
        state = 'calibrating';
        exercisePaused = false;
        calStart = Date.now();
        currentStep = 0;
        stepPhase = 'move';
        atTarget = false;
        atTargetTimer = 0;
        breathCycleCount = 0;
        breathGuidePhase = 0;
        breathGuideMatch = 0;
        sessionBreathSync = 0;
        sessionBreathSamples = 0;
        playTone(330, 0.1, 0.1);
      } else if (key === 'Escape') {
        state = 'menu';
      }
    } else if (state === 'calibrating') {
      if (key === 'Escape') {
        state = 'menu';
      }
    }
  });

  // Polyfill roundRect
  if (!ctx.roundRect) {
    ctx.roundRect = function(x, y, w, h, r) {
      if (typeof r === 'number') r = [r,r,r,r];
      ctx.beginPath();
      ctx.moveTo(x + r[0], y);
      ctx.lineTo(x + w - r[1], y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r[1]);
      ctx.lineTo(x + w, y + h - r[2]);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
      ctx.lineTo(x + r[3], y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r[3]);
      ctx.lineTo(x, y + r[0]);
      ctx.quadraticCurveTo(x, y, x + r[0], y);
      ctx.closePath();
    };
  }

  // Start
  requestOrientation();
  lastTick = Date.now();
  draw();
})();
</script>
<script>
/* === MRBD D-pad Fix === */
(function() {
  // Prevent MRBD browser from intercepting D-pad for spatial navigation
  document.addEventListener('keydown', function(e) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key)) {
      e.preventDefault();
    }
  }, true); // capture phase to beat browser's handler
  // Auto-focus canvas and click-to-refocus
  var c = document.querySelector('canvas');
  if (c) {
    if (!c.getAttribute('tabindex')) c.setAttribute('tabindex', '0');
    c.style.outline = 'none';
    c.focus();
    c.addEventListener('click', function() { c.focus(); });
    c.addEventListener('touchstart', function() { c.focus(); });
  }
  // Disable focusable elements during gameplay to prevent arrow-key focus stealing
  document.querySelectorAll('a, button, input, select, textarea').forEach(function(el) {
    el.setAttribute('tabindex', '-1');
  });
})();
/* === End MRBD D-pad Fix === */
</script>
<script src="../../touch-controls.js"></script>
</body>
</html>
