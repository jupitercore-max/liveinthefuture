<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Intervals — HIIT Timer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d0d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#e0e0e0;user-select:none}
canvas{display:block;width:600px;height:600px}

/* Mobile responsive: scale 600x600 canvas to fit viewport */
@media (max-width: 600px) {
  html,body{width:100%!important;height:100%!important;margin:0;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw!important;max-height:100vh!important;width:auto!important;height:auto!important;aspect-ratio:1/1}
}
@media (max-height: 600px) and (max-width: 600px) {
  canvas{max-height:100vh!important;max-width:100vh!important}
}
</style>
</head>
<body>
<canvas id="c" width="600" height="600" tabindex="0"></canvas>
<script>
(function(){
"use strict";

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 600, H = 600;

/* ─── Audio Context (lazy init on first interaction) ─── */
var audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}

function playTone(freq, dur, type) {
  ensureAudio();
  if (!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function beepWork() { playTone(880, 0.15, "square"); setTimeout(function(){ playTone(1100, 0.15, "square"); }, 160); setTimeout(function(){ playTone(1320, 0.2, "square"); }, 320); }
function beepRest() { playTone(440, 0.3, "sine"); }
function beepDone() { playTone(660, 0.15, "sine"); setTimeout(function(){ playTone(880, 0.15, "sine"); }, 180); setTimeout(function(){ playTone(1100, 0.15, "sine"); }, 360); setTimeout(function(){ playTone(1320, 0.3, "sine"); }, 540); }
function tick3() { playTone(600, 0.08, "triangle"); }

/* ─── Achievement Unlock Chime ─── */
function playAchievementChime() {
  ensureAudio();
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var notes = [523, 659, 784, 1047]; /* C5 E5 G5 C6 major arpeggio */
  for (var i = 0; i < notes.length; i++) {
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = notes[i];
    g.gain.setValueAtTime(0, t + i * 0.12);
    g.gain.linearRampToValueAtTime(0.2, t + i * 0.12 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.4);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t + i * 0.12);
    osc.stop(t + i * 0.12 + 0.45);
  }
}

/* ─── Continuous Heartbeat Pulse System ─── */
var heartbeatOn = true;
try { var hbStored = localStorage.getItem("intervals_heartbeat"); if (hbStored !== null) heartbeatOn = hbStored === "1"; } catch(e){}
var lastHeartbeatTime = 0;
var halfwayFired = false;

function playHeartbeat(freq, gain) {
  ensureAudio();
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.6, t + 0.08);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.12);
}

function playHalfwayTap() {
  ensureAudio();
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  for (var i = 0; i < 2; i++) {
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.value = 550;
    g.gain.setValueAtTime(0.12, t + i * 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.06);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t + i * 0.1); osc.stop(t + i * 0.1 + 0.08);
  }
}

function updateHeartbeat(now) {
  if (!heartbeatOn) return;
  if (state !== STATE_RUNNING || countdown321 > 0) return;

  var p = getPreset();
  var phaseDuration = isWork ? p.work : p.rest;
  var secsLeft = timeLeft / 1000;
  var progress = 1 - (secsLeft / phaseDuration);

  if (!halfwayFired && progress >= 0.5 && phaseDuration >= 10) {
    halfwayFired = true;
    playHalfwayTap();
    lastHeartbeatTime = now;
    return;
  }

  var bpm, freq, gain;
  if (isWork) {
    var t = progress;
    if (t < 0.7) {
      bpm = 72 + t / 0.7 * 48;
      freq = 400 + t / 0.7 * 150;
    } else {
      var late = (t - 0.7) / 0.3;
      bpm = 120 + late * 80;
      freq = 550 + late * 250;
    }
    /* Exertion-responsive heartbeat: breathing intensity modulates BPM */
    if (smartRest && micInited && micBaseline > 0.001) {
      var exRatio = micLevel / micBaseline;
      var exMod = exRatio < 1.8 ? 0.85 : exRatio < 3.0 ? 1.0 : exRatio < 5.0 ? 1.15 : 1.3;
      bpm = bpm * exMod;
      freq = freq * (0.9 + exMod * 0.1);
    }
    gain = 0.08 + progress * 0.06;
  } else {
    bpm = 50;
    freq = 300;
    gain = 0.06;
  }

  var interval = 60000 / bpm;
  if (now - lastHeartbeatTime >= interval) {
    playHeartbeat(freq, gain);
    lastHeartbeatTime = now;
  }
}

/* ─── Microphone for Smart Rest ─── */
var micStream = null;
var micAnalyser = null;
var micData = null;
var micLevel = 0;
var micBaseline = 0.15;
var micInited = false;
var smartRest = false;
try { var srVal = localStorage.getItem("intervals_smartrest"); if (srVal !== null) smartRest = srVal === "1"; } catch(e){}
var restExtended = false;
var restExtendStart = 0;
var recoveryCalm = 0;
var recoveryReady = false;

/* ─── Work-Phase Exertion Monitoring ─── */
var exertionZone = '--';
var lowExertionTime = 0;
var nudgePlayed = false;
var roundExertion = [];
var workExertionSum = 0;
var workExertionSamples = 0;

function classifyExertion() {
  if (!micInited || micBaseline < 0.001) return '--';
  var ratio = micLevel / micBaseline;
  if (ratio < 1.8) return 'EASY';
  if (ratio < 3.0) return 'MODERATE';
  if (ratio < 5.0) return 'HARD';
  return 'MAX';
}

function initMic() {
  if (micInited) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    micStream = stream;
    ensureAudio();
    if (!audioCtx) return;
    var src = audioCtx.createMediaStreamSource(stream);
    micAnalyser = audioCtx.createAnalyser();
    micAnalyser.fftSize = 256;
    src.connect(micAnalyser);
    micData = new Uint8Array(micAnalyser.frequencyBinCount);
    micInited = true;
  }).catch(function() { smartRest = false; });
}

function sampleMic() {
  if (!micAnalyser || !micData) return;
  micAnalyser.getByteTimeDomainData(micData);
  var sum = 0;
  for (var i = 0; i < micData.length; i++) {
    var v = (micData[i] - 128) / 128;
    sum += v * v;
  }
  var rms = Math.sqrt(sum / micData.length);
  micLevel = micLevel * 0.85 + rms * 0.15;
  micBaseline = micBaseline * 0.997 + micLevel * 0.003;
}

function playRecoveryChime() {
  ensureAudio();
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var notes = [392, 494, 587]; /* G4 B4 D5 — calm ascending major */
  for (var i = 0; i < notes.length; i++) {
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = notes[i];
    g.gain.setValueAtTime(0, t + i * 0.15);
    g.gain.linearRampToValueAtTime(0.25, t + i * 0.15 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.5);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t + i * 0.15);
    osc.stop(t + i * 0.15 + 0.55);
  }
}

/* ─── Exertion Nudge (gentle ascending sine through bone conduction) ─── */
function playExertionNudge() {
  ensureAudio();
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(330, t);
  osc.frequency.linearRampToValueAtTime(440, t + 0.2);
  g.gain.setValueAtTime(0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.4);
}

/* ─── Presets ─── */
var presets = [
  { name: "TABATA", work: 20, rest: 10, rounds: 8 },
  { name: "HIIT 30/30", work: 30, rest: 30, rounds: 10 },
  { name: "EMOM", work: 40, rest: 20, rounds: 10 },
  { name: "BOXING", work: 180, rest: 60, rounds: 12 },
  { name: "PLANK", work: 30, rest: 15, rounds: 6 },
  { name: "CUSTOM", work: 45, rest: 15, rounds: 8 }
];

/* ─── Achievements ─── */
var ACHIEVEMENTS = [
  { id: "first_sweat",   icon: "💪", name: "First Sweat",     desc: "Complete your first workout" },
  { id: "tabata_og",     icon: "⚡", name: "Tabata OG",       desc: "Complete a Tabata session" },
  { id: "twelve_rounds", icon: "🥊", name: "Twelve Rounds",   desc: "Complete a full Boxing session" },
  { id: "plank_party",   icon: "🧘", name: "Plank Party",     desc: "Complete a Plank session" },
  { id: "no_mercy",      icon: "🔥", name: "No Mercy",        desc: "Complete a workout with 0s rest" },
  { id: "centurion",     icon: "💯", name: "Centurion",       desc: "Accumulate 100 total rounds" },
  { id: "five_hundred",  icon: "🏅", name: "Five Hundred",    desc: "Accumulate 500 total rounds" },
  { id: "iron_hour",     icon: "⏰", name: "Iron Hour",       desc: "Accumulate 60 min total work time" },
  { id: "five_alive",    icon: "🖐", name: "High Five",       desc: "Complete 5 workouts" },
  { id: "twenty_strong", icon: "🏆", name: "Twenty Strong",   desc: "Complete 20 workouts" },
  { id: "speed_demon",   icon: "👹", name: "Speed Demon",     desc: "Complete with 5s work intervals" },
  { id: "all_rounder",   icon: "🌟", name: "All-Rounder",     desc: "Use all 6 presets at least once" }
];

/* ─── Persistent Stats ─── */
var stats = { workouts: 0, rounds: 0, workSecs: 0, presetsUsed: {}, unlocked: {} };
function loadStats() {
  try {
    var s = localStorage.getItem("intervals_stats");
    if (s) {
      var parsed = JSON.parse(s);
      stats.workouts = parsed.workouts || 0;
      stats.rounds = parsed.rounds || 0;
      stats.workSecs = parsed.workSecs || 0;
      stats.presetsUsed = parsed.presetsUsed || {};
      stats.unlocked = parsed.unlocked || {};
    }
  } catch(e) {}
}
function saveStats() {
  try { localStorage.setItem("intervals_stats", JSON.stringify(stats)); } catch(e) {}
}
loadStats();

/* Achievement toast queue */
var toastQueue = [];
var activeToast = null;
var toastTimer = 0;

function showToast(achv) {
  toastQueue.push(achv);
}

function updateToast(now) {
  if (activeToast) {
    if (now - toastTimer > 3000) { activeToast = null; }
    return;
  }
  if (toastQueue.length > 0) {
    activeToast = toastQueue.shift();
    toastTimer = now;
    playAchievementChime();
  }
}

function drawToast(now) {
  if (!activeToast) return;
  var elapsed = now - toastTimer;
  var alpha = 1;
  if (elapsed < 300) alpha = elapsed / 300;
  else if (elapsed > 2500) alpha = 1 - (elapsed - 2500) / 500;
  if (alpha <= 0) return;

  ctx.save();
  ctx.globalAlpha = alpha;

  /* Toast background */
  var tw = 380, th = 60;
  var tx = (W - tw) / 2, ty = 20;
  ctx.fillStyle = "#1a1a2e";
  ctx.strokeStyle = "#ffaa00";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(tx, ty, tw, th, 12);
  ctx.fill();
  ctx.stroke();

  /* Icon */
  ctx.font = "28px sans-serif";
  ctx.textAlign = "left";
  ctx.fillStyle = "#fff";
  ctx.fillText(activeToast.icon, tx + 16, ty + 40);

  /* Text */
  ctx.fillStyle = "#ffaa00";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText("UNLOCKED", tx + 56, ty + 24);
  ctx.fillStyle = "#fff";
  ctx.font = "14px sans-serif";
  ctx.fillText(activeToast.name + " — " + activeToast.desc, tx + 56, ty + 44);

  ctx.restore();
}

function checkAchievements(presetName) {
  var newUnlocks = [];

  function tryUnlock(id) {
    if (!stats.unlocked[id]) {
      stats.unlocked[id] = Date.now();
      for (var i = 0; i < ACHIEVEMENTS.length; i++) {
        if (ACHIEVEMENTS[i].id === id) { newUnlocks.push(ACHIEVEMENTS[i]); break; }
      }
    }
  }

  /* First workout */
  if (stats.workouts >= 1) tryUnlock("first_sweat");

  /* Preset-specific */
  if (presetName === "TABATA") tryUnlock("tabata_og");
  if (presetName === "BOXING") tryUnlock("twelve_rounds");
  if (presetName === "PLANK") tryUnlock("plank_party");

  /* Zero rest */
  var p = getPreset();
  if (p.rest === 0) tryUnlock("no_mercy");

  /* Speed demon: 5s work */
  if (p.work === 5) tryUnlock("speed_demon");

  /* Cumulative */
  if (stats.rounds >= 100) tryUnlock("centurion");
  if (stats.rounds >= 500) tryUnlock("five_hundred");
  if (stats.workSecs >= 3600) tryUnlock("iron_hour");
  if (stats.workouts >= 5) tryUnlock("five_alive");
  if (stats.workouts >= 20) tryUnlock("twenty_strong");

  /* All presets used */
  var allUsed = true;
  for (var i = 0; i < presets.length; i++) {
    if (!stats.presetsUsed[presets[i].name]) { allUsed = false; break; }
  }
  if (allUsed) tryUnlock("all_rounder");

  if (newUnlocks.length > 0) {
    saveStats();
    for (var j = 0; j < newUnlocks.length; j++) {
      showToast(newUnlocks[j]);
    }
  }
}

/* ─── State ─── */
var STATE_MENU = 0, STATE_EDIT = 1, STATE_RUNNING = 2, STATE_PAUSED = 3, STATE_COMPLETE = 4, STATE_BADGES = 5;
var state = STATE_MENU;
var presetIdx = 0;
var editField = 0;
var badgeScroll = 0;

/* Timer state */
var currentRound = 1;
var isWork = true;
var timeLeft = 0;
var totalTime = 0;
var lastTick = 0;
var countdown321 = 0;
var countdownStart = 0;

/* Animation */
var pulsePhase = 0;
var flashAlpha = 0;
var flashColor = "#00ff88";

/* ─── Helpers ─── */
function fmtTime(secs) {
  var m = Math.floor(secs / 60);
  var s = secs % 60;
  if (m > 0) return m + ":" + (s < 10 ? "0" : "") + s;
  return "" + s;
}

function getPreset() { return presets[presetIdx]; }

function totalWorkoutTime() {
  var p = getPreset();
  return p.rounds * (p.work + p.rest) - p.rest;
}

function countUnlocked() {
  var n = 0;
  for (var k in stats.unlocked) { if (stats.unlocked.hasOwnProperty(k)) n++; }
  return n;
}

/* ─── Drawing ─── */
function drawMenu() {
  ctx.fillStyle = "#0d0d0d";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#00ff88";
  ctx.font = "bold 36px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("⏱ INTERVALS", W/2, 52);

  ctx.fillStyle = "#666";
  ctx.font = "14px sans-serif";
  ctx.fillText("HIIT / Workout Timer", W/2, 72);

  /* Stats bar */
  var unlockCount = countUnlocked();
  if (stats.workouts > 0) {
    ctx.fillStyle = "#444";
    ctx.font = "12px sans-serif";
    ctx.fillText(stats.workouts + " workouts · " + stats.rounds + " rounds · " + unlockCount + "/" + ACHIEVEMENTS.length + " 🏆", W/2, 92);
  }

  /* Preset cards */
  for (var i = 0; i < presets.length; i++) {
    var p = presets[i];
    var y = 104 + i * 68;
    var selected = (i === presetIdx);

    ctx.fillStyle = selected ? "#1a3a2a" : "#141414";
    ctx.strokeStyle = selected ? "#00ff88" : "#333";
    ctx.lineWidth = selected ? 2 : 1;
    ctx.beginPath();
    ctx.roundRect(40, y, W - 80, 56, 8);
    ctx.fill();
    ctx.stroke();

    if (selected) {
      ctx.fillStyle = "#00ff88";
      ctx.beginPath();
      ctx.arc(60, y + 28, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = selected ? "#00ff88" : "#aaa";
    ctx.font = "bold 18px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(p.name, 80, y + 23);

    ctx.fillStyle = selected ? "#ccc" : "#666";
    ctx.font = "14px sans-serif";
    ctx.fillText(fmtTime(p.work) + " work · " + fmtTime(p.rest) + " rest · " + p.rounds + " rounds", 80, y + 42);

    var total = p.rounds * (p.work + p.rest) - p.rest;
    ctx.textAlign = "right";
    ctx.fillStyle = selected ? "#888" : "#555";
    ctx.fillText(fmtTime(total), W - 60, y + 34);
    ctx.textAlign = "left";
  }

  /* Footer */
  if (smartRest) {
    ctx.fillStyle = "#4488ff";
    ctx.font = "12px sans-serif";
    ctx.fillText("🎤 Mic ON — exertion during work, recovery during rest", W/2, H - 40);
  }
  ctx.fillStyle = "#555";
  ctx.font = "13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("↑↓ Select · Enter Start · → Edit · ← Badges", W/2, H - 20);
}

function drawBadges() {
  ctx.fillStyle = "#0d0d0d";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#ffaa00";
  ctx.font = "bold 28px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("🏆 ACHIEVEMENTS", W/2, 48);

  var unlockCount = countUnlocked();
  ctx.fillStyle = "#888";
  ctx.font = "16px sans-serif";
  ctx.fillText(unlockCount + " / " + ACHIEVEMENTS.length + " unlocked", W/2, 72);

  /* Scrollable list */
  var visibleCount = 6;
  var rowH = 76;
  var startY = 95;

  for (var vi = 0; vi < visibleCount; vi++) {
    var idx = badgeScroll + vi;
    if (idx >= ACHIEVEMENTS.length) break;
    var a = ACHIEVEMENTS[idx];
    var unlocked = !!stats.unlocked[a.id];
    var y = startY + vi * rowH;
    var selected = (vi === 0 && badgeScroll === idx); /* highlight top visible for scroll context */

    ctx.fillStyle = unlocked ? "#1a2a1a" : "#111";
    ctx.strokeStyle = unlocked ? "#00ff8844" : "#222";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(30, y, W - 60, 66, 8);
    ctx.fill();
    ctx.stroke();

    /* Icon */
    ctx.font = "30px sans-serif";
    ctx.textAlign = "left";
    if (unlocked) {
      ctx.fillStyle = "#fff";
      ctx.fillText(a.icon, 48, y + 42);
    } else {
      ctx.fillStyle = "#333";
      ctx.fillText("🔒", 48, y + 42);
    }

    /* Name */
    ctx.fillStyle = unlocked ? "#fff" : "#555";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText(a.name, 92, y + 26);

    /* Description */
    ctx.fillStyle = unlocked ? "#aaa" : "#444";
    ctx.font = "13px sans-serif";
    ctx.fillText(a.desc, 92, y + 48);

    /* Unlocked check */
    if (unlocked) {
      ctx.fillStyle = "#00ff88";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("✓", W - 50, y + 38);
      ctx.textAlign = "left";
    }
  }

  /* Scroll indicators */
  ctx.textAlign = "center";
  if (badgeScroll > 0) {
    ctx.fillStyle = "#666";
    ctx.font = "14px sans-serif";
    ctx.fillText("▲ more", W/2, startY - 5);
  }
  if (badgeScroll + visibleCount < ACHIEVEMENTS.length) {
    ctx.fillStyle = "#666";
    ctx.font = "14px sans-serif";
    ctx.fillText("▼ more", W/2, startY + visibleCount * rowH + 15);
  }

  /* Stats summary */
  ctx.fillStyle = "#444";
  ctx.font = "12px sans-serif";
  ctx.fillText(stats.workouts + " workouts · " + stats.rounds + " rounds · " + fmtTime(stats.workSecs) + " work", W/2, H - 45);

  ctx.fillStyle = "#555";
  ctx.font = "13px sans-serif";
  ctx.fillText("↑↓ Scroll · Esc/→ Back", W/2, H - 20);
}

function drawEdit() {
  var p = getPreset();
  ctx.fillStyle = "#0d0d0d";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#ffaa00";
  ctx.font = "bold 28px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("✏️ EDIT — " + p.name, W/2, 60);

  var fields = [
    { label: "WORK", value: fmtTime(p.work), unit: "" },
    { label: "REST", value: fmtTime(p.rest), unit: "" },
    { label: "ROUNDS", value: "" + p.rounds, unit: "" }
  ];

  for (var i = 0; i < fields.length; i++) {
    var y = 140 + i * 130;
    var sel = (i === editField);

    ctx.fillStyle = sel ? "#ffaa00" : "#666";
    ctx.font = "16px sans-serif";
    ctx.fillText(fields[i].label, W/2, y);

    ctx.fillStyle = sel ? "#fff" : "#aaa";
    ctx.font = "bold 64px sans-serif";
    ctx.fillText(fields[i].value, W/2, y + 70);

    if (sel) {
      ctx.fillStyle = "#ffaa00";
      ctx.font = "14px sans-serif";
      ctx.fillText("← − 5     + 5 →", W/2, y + 95);
    }
  }

  ctx.fillStyle = "#555";
  ctx.font = "13px sans-serif";
  ctx.fillText("↑↓ Field · ←→ Adjust · Enter Save · Esc Back", W/2, H - 30);
}

function drawRunning(now) {
  ctx.fillStyle = "#0d0d0d";
  ctx.fillRect(0, 0, W, H);

  var p = getPreset();

  if (flashAlpha > 0) {
    ctx.fillStyle = flashColor;
    ctx.globalAlpha = flashAlpha;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    flashAlpha *= 0.92;
    if (flashAlpha < 0.01) flashAlpha = 0;
  }

  if (countdown321 > 0) {
    var elapsed = (now - countdownStart) / 1000;
    var num = Math.ceil(3 - elapsed);
    if (num < 1) num = 1;

    ctx.fillStyle = "#ffaa00";
    ctx.font = "bold 180px sans-serif";
    ctx.textAlign = "center";
    var scale = 1 + (1 - ((3 - elapsed) % 1)) * 0.15;
    ctx.save();
    ctx.translate(W/2, H/2 + 40);
    ctx.scale(scale, scale);
    ctx.fillText("" + num, 0, 0);
    ctx.restore();

    ctx.fillStyle = "#888";
    ctx.font = "20px sans-serif";
    ctx.fillText("GET READY", W/2, H/2 + 120);

    ctx.fillStyle = "#555";
    ctx.font = "14px sans-serif";
    ctx.fillText(p.name + " · " + p.rounds + " rounds", W/2, H/2 - 100);

    /* Draw toast even during countdown */
    updateToast(now);
    drawToast(now);
    return;
  }

  var phaseColor = isWork ? "#00ff88" : "#4488ff";
  var phaseLabel = isWork ? "WORK" : "REST";

  ctx.fillStyle = "#555";
  ctx.font = "16px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("ROUND " + currentRound + " / " + p.rounds, W/2, 40);

  var dotSpacing = Math.min(24, (W - 100) / p.rounds);
  var dotStartX = W/2 - (p.rounds - 1) * dotSpacing / 2;
  for (var i = 0; i < p.rounds; i++) {
    var dx = dotStartX + i * dotSpacing;
    ctx.beginPath();
    ctx.arc(dx, 65, 5, 0, Math.PI * 2);
    if (i < currentRound - 1) {
      ctx.fillStyle = "#00ff88";
      ctx.fill();
    } else if (i === currentRound - 1) {
      ctx.fillStyle = phaseColor;
      ctx.fill();
      pulsePhase += 0.05;
      ctx.globalAlpha = 0.3 + 0.3 * Math.sin(pulsePhase);
      ctx.beginPath();
      ctx.arc(dx, 65, 10, 0, Math.PI * 2);
      ctx.fillStyle = phaseColor;
      ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  var cx = W/2, cy = 280, radius = 160;
  var phaseDuration = isWork ? p.work : p.rest;
  var progress = 1 - (timeLeft / 1000 / phaseDuration);
  if (progress < 0) progress = 0;
  if (progress > 1) progress = 1;

  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 12;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, radius, -Math.PI/2, -Math.PI/2 + progress * Math.PI * 2);
  ctx.strokeStyle = phaseColor;
  ctx.lineWidth = 12;
  ctx.lineCap = "round";
  ctx.stroke();
  ctx.lineCap = "butt";

  ctx.fillStyle = phaseColor;
  ctx.font = "bold 28px sans-serif";
  ctx.fillText(phaseLabel, cx, cy - 50);

  var secsLeft = Math.ceil(timeLeft / 1000);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 96px sans-serif";
  ctx.fillText(fmtTime(secsLeft), cx, cy + 30);

  ctx.fillStyle = "#666";
  ctx.font = "16px sans-serif";
  if (restExtended) {
    var extSecs = Math.floor((now - restExtendStart) / 1000);
    ctx.fillText("+" + fmtTime(extSecs) + " recovery", cx, cy + 60);
  } else {
    ctx.fillText("of " + fmtTime(phaseDuration), cx, cy + 60);
  }

  if (state === STATE_PAUSED) {
    ctx.fillStyle = "#ffaa00";
    ctx.font = "bold 22px sans-serif";
    ctx.fillText("⏸ PAUSED", cx, cy + 120);
  }

  /* Smart Rest: breathing recovery indicator during rest */
  if (smartRest && micInited && !isWork && countdown321 === 0) {
    var barW = 160, barH = 6;
    var barX = (W - barW) / 2, barY = cy + 90;
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW, barH, 3);
    ctx.fill();
    var lvl = Math.min(1, micLevel / Math.max(0.01, micBaseline * 3));
    ctx.fillStyle = recoveryReady ? "#00ff88" : (lvl > 0.5 ? "#ff6644" : "#ffaa00");
    ctx.beginPath();
    ctx.roundRect(barX, barY, Math.max(2, barW * lvl), barH, 3);
    ctx.fill();
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = recoveryReady ? "#00ff88" : "#888";
    ctx.fillText(restExtended ? (recoveryReady ? "✓ RECOVERED" : "🎤 RECOVERING...") : "🎤 Smart Rest", W/2, barY + 20);
  }

  /* Work-phase exertion indicator */
  if (smartRest && micInited && isWork && countdown321 === 0) {
    var exBarW = 160, exBarH = 6;
    var exBarX = (W - exBarW) / 2, exBarY = cy + 90;
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath();
    ctx.roundRect(exBarX, exBarY, exBarW, exBarH, 3);
    ctx.fill();
    var exLvl = Math.min(1, micLevel / Math.max(0.01, micBaseline * 5));
    var exColors = {'EASY': '#66bb6a', 'MODERATE': '#ffca28', 'HARD': '#ff7043', 'MAX': '#ff1744', '--': '#555'};
    var exCol = exColors[exertionZone] || '#555';
    ctx.fillStyle = exCol;
    ctx.beginPath();
    ctx.roundRect(exBarX, exBarY, Math.max(2, exBarW * exLvl), exBarH, 3);
    ctx.fill();
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = exCol;
    ctx.fillText("🎤 " + (exertionZone === '--' ? "CALIBRATING" : exertionZone), W/2, exBarY + 20);
  }

  if (isWork && currentRound <= p.rounds) {
    ctx.fillStyle = "#4488ff";
    ctx.font = "14px sans-serif";
    ctx.fillText("Next: " + fmtTime(p.rest) + " rest", cx, H - 80);
  } else if (!isWork && currentRound < p.rounds) {
    ctx.fillStyle = "#00ff88";
    ctx.font = "14px sans-serif";
    ctx.fillText("Next: Round " + (currentRound + 1) + " · " + fmtTime(p.work) + " work", cx, H - 80);
  }

  var totalElapsed = 0;
  for (var r = 1; r < currentRound; r++) { totalElapsed += p.work + p.rest; }
  totalElapsed += phaseDuration - Math.ceil(timeLeft / 1000);
  if (!isWork) totalElapsed += p.work;
  var totalDur = totalWorkoutTime();
  ctx.fillStyle = "#444";
  ctx.font = "13px sans-serif";
  ctx.fillText(fmtTime(totalElapsed) + " / " + fmtTime(totalDur), cx, H - 55);

  ctx.fillStyle = "#555";
  ctx.font = "13px sans-serif";
  ctx.fillText("Enter Pause · ↑ Pulse " + (heartbeatOn ? "ON" : "OFF") + " · ↓ Mic " + (smartRest ? "🎤" : "OFF") + " · Esc Quit", W/2, H - 25);

  if (heartbeatOn && state === STATE_RUNNING && countdown321 === 0) {
    var p2 = getPreset();
    var pd2 = isWork ? p2.work : p2.rest;
    var prog2 = 1 - (timeLeft / 1000 / pd2);
    var bpm2 = isWork ? (prog2 < 0.7 ? 72 + prog2 / 0.7 * 48 : 120 + (prog2 - 0.7) / 0.3 * 80) : 50;
    if (isWork && smartRest && micInited && micBaseline > 0.001) {
      var exR = micLevel / micBaseline;
      bpm2 *= exR < 1.8 ? 0.85 : exR < 3.0 ? 1.0 : exR < 5.0 ? 1.15 : 1.3;
    }
    var beatPhase = ((now - lastHeartbeatTime) / (60000 / bpm2));
    var dotAlpha = Math.max(0, 1 - beatPhase * 2.5);
    ctx.globalAlpha = dotAlpha * 0.6;
    ctx.fillStyle = isWork ? "#00ff88" : "#4488ff";
    ctx.beginPath();
    ctx.arc(W - 40, 40, 6 + dotAlpha * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = isWork ? "#00ff88" : "#4488ff";
    ctx.globalAlpha = 0.4;
    ctx.font = "14px sans-serif";
    ctx.fillText("♥", W - 40, 62);
    ctx.globalAlpha = 1;
  }

  /* Draw achievement toasts over everything */
  updateToast(now);
  drawToast(now);
}

function drawComplete() {
  ctx.fillStyle = "#0d0d0d";
  ctx.fillRect(0, 0, W, H);

  var p = getPreset();

  ctx.fillStyle = "#00ff88";
  ctx.font = "bold 48px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("🏆 DONE!", W/2, 150);

  ctx.fillStyle = "#fff";
  ctx.font = "bold 28px sans-serif";
  ctx.fillText(p.name, W/2, 200);

  ctx.fillStyle = "#aaa";
  ctx.font = "20px sans-serif";
  ctx.fillText(p.rounds + " rounds completed", W/2, 240);

  var totalDur = totalWorkoutTime();
  ctx.fillStyle = "#00ff88";
  ctx.font = "bold 64px sans-serif";
  ctx.fillText(fmtTime(totalDur), W/2, 330);

  ctx.fillStyle = "#666";
  ctx.font = "16px sans-serif";
  ctx.fillText("total workout time", W/2, 360);

  /* Exertion summary (if mic was active during work) */
  if (roundExertion.length > 0) {
    var avgEx = 0;
    for (var re = 0; re < roundExertion.length; re++) avgEx += roundExertion[re];
    avgEx /= roundExertion.length;
    var exLabel = avgEx < 1.8 ? 'EASY' : avgEx < 3.0 ? 'MODERATE' : avgEx < 5.0 ? 'HARD' : 'MAX';
    var exColors = {'EASY': '#66bb6a', 'MODERATE': '#ffca28', 'HARD': '#ff7043', 'MAX': '#ff1744'};
    ctx.fillStyle = exColors[exLabel] || '#888';
    ctx.font = "bold 18px sans-serif";
    ctx.fillText("🎤 Avg Exertion: " + exLabel, W/2, 395);
  }

  /* Lifetime stats */
  var unlockCount = countUnlocked();
  ctx.fillStyle = "#555";
  ctx.font = "14px sans-serif";
  ctx.fillText("Lifetime: " + stats.workouts + " workouts · " + stats.rounds + " rounds · " + unlockCount + "/" + ACHIEVEMENTS.length + " 🏆", W/2, 420);

  ctx.fillStyle = "#555";
  ctx.font = "13px sans-serif";
  ctx.fillText("Enter Restart · Esc Menu · ← Badges", W/2, H - 30);

  /* Draw achievement toasts over everything */
  var now = performance.now();
  updateToast(now);
  drawToast(now);
}

/* ─── Timer Logic ─── */
function startWorkout() {
  var p = getPreset();
  currentRound = 1;
  isWork = true;
  timeLeft = p.work * 1000;
  totalTime = 0;
  state = STATE_RUNNING;
  countdown321 = 3;
  countdownStart = performance.now();
  flashAlpha = 0;
  pulsePhase = 0;
  halfwayFired = false;
  lastHeartbeatTime = 0;
  restExtended = false;
  recoveryCalm = 0;
  recoveryReady = false;
  exertionZone = '--';
  lowExertionTime = 0;
  nudgePlayed = false;
  roundExertion = [];
  workExertionSum = 0;
  workExertionSamples = 0;
  ensureAudio();
  if (smartRest) initMic();
}

function completeWorkout() {
  var p = getPreset();
  state = STATE_COMPLETE;
  beepDone();
  flashAlpha = 0.4;
  flashColor = "#ffaa00";

  /* Update stats */
  stats.workouts++;
  stats.rounds += p.rounds;
  stats.workSecs += p.rounds * p.work;
  stats.presetsUsed[p.name] = true;
  saveStats();

  /* Check achievements */
  checkAchievements(p.name);
}

function updateTimer(now) {
  if (state !== STATE_RUNNING) return;

  if (countdown321 > 0) {
    var elapsed = (now - countdownStart) / 1000;
    var prevNum = countdown321;
    var curNum = Math.ceil(3 - elapsed);
    if (curNum < prevNum && curNum >= 1) {
      tick3();
      countdown321 = curNum;
    }
    if (elapsed >= 3) {
      countdown321 = 0;
      lastTick = now;
      beepWork();
      flashAlpha = 0.3;
      flashColor = "#00ff88";
    }
    return;
  }

  var dt = now - lastTick;
  lastTick = now;

  /* Smart Rest: extended rest — timer frozen, waiting for recovery */
  if (restExtended) {
    if (micInited) {
      sampleMic();
      var thresh = Math.max(micBaseline * 1.5, 0.02);
      if (micLevel < thresh) recoveryCalm += dt / 1000;
      else recoveryCalm = Math.max(0, recoveryCalm - dt / 1500);
      if (recoveryCalm >= 2.5 && !recoveryReady) {
        recoveryReady = true;
        playRecoveryChime();
        flashAlpha = 0.15;
        flashColor = "#00ff88";
      }
    }
    var pExt = getPreset();
    var maxExt = Math.max(pExt.rest * 2, 15) * 1000;
    if (recoveryReady || (now - restExtendStart > maxExt)) {
      if (currentRound >= pExt.rounds) { completeWorkout(); return; }
      currentRound++;
      isWork = true;
      timeLeft = pExt.work * 1000;
      beepWork();
      flashAlpha = 0.25;
      flashColor = "#00ff88";
      halfwayFired = false;
      lastHeartbeatTime = now;
      restExtended = false;
      recoveryCalm = 0;
      recoveryReady = false;
      lowExertionTime = 0;
      nudgePlayed = false;
    }
    updateHeartbeat(now);
    return;
  }

  /* Smart Rest: sample mic during normal rest countdown */
  if (smartRest && micInited && !isWork) {
    sampleMic();
    var sThresh = Math.max(micBaseline * 1.5, 0.02);
    if (micLevel < sThresh) recoveryCalm += dt / 1000;
    else recoveryCalm = Math.max(0, recoveryCalm - dt / 1500);
    if (recoveryCalm >= 2.5 && !recoveryReady) {
      recoveryReady = true;
      playRecoveryChime();
    }
  }

  /* Work-phase exertion monitoring: mic detects breathing intensity */
  if (smartRest && micInited && isWork && countdown321 === 0) {
    sampleMic();
    exertionZone = classifyExertion();
    workExertionSum += micLevel / Math.max(0.001, micBaseline);
    workExertionSamples++;
    if (exertionZone === 'EASY') {
      lowExertionTime += dt / 1000;
      if (lowExertionTime >= 3 && !nudgePlayed) {
        playExertionNudge();
        nudgePlayed = true;
      }
    } else {
      lowExertionTime = 0;
      nudgePlayed = false;
    }
  }

  timeLeft -= dt;

  var secsLeft = Math.ceil(timeLeft / 1000);
  var prevSecs = Math.ceil((timeLeft + dt) / 1000);
  if (secsLeft <= 3 && secsLeft >= 1 && secsLeft !== prevSecs) {
    tick3();
  }

  if (timeLeft <= 0) {
    var p = getPreset();
    if (isWork) {
      if (currentRound >= p.rounds) {
        /* Save final round exertion before completing */
        if (workExertionSamples > 0) roundExertion.push(workExertionSum / workExertionSamples);
        completeWorkout();
        return;
      }
      /* Save round exertion data */
      if (workExertionSamples > 0) roundExertion.push(workExertionSum / workExertionSamples);
      workExertionSum = 0; workExertionSamples = 0;
      isWork = false;
      timeLeft = p.rest * 1000;
      beepRest();
      flashAlpha = 0.25;
      flashColor = "#4488ff";
      halfwayFired = false;
      lastHeartbeatTime = now;
      recoveryCalm = 0;
      recoveryReady = false;
    } else {
      /* Smart Rest: extend rest if still breathing hard (min 10s rest to apply) */
      if (smartRest && micInited && !recoveryReady && p.rest >= 10) {
        restExtended = true;
        restExtendStart = now;
        return;
      }
      currentRound++;
      isWork = true;
      timeLeft = p.work * 1000;
      beepWork();
      flashAlpha = 0.25;
      flashColor = "#00ff88";
      halfwayFired = false;
      lastHeartbeatTime = now;
      restExtended = false;
      recoveryCalm = 0;
      recoveryReady = false;
      lowExertionTime = 0;
      nudgePlayed = false;
    }
  }

  updateHeartbeat(now);
}

/* ─── Input ─── */
document.addEventListener("keydown", function(e) {
  e.preventDefault();
  var key = e.key;

  if (state === STATE_MENU) {
    if (key === "ArrowUp") {
      presetIdx = (presetIdx - 1 + presets.length) % presets.length;
    } else if (key === "ArrowDown") {
      presetIdx = (presetIdx + 1) % presets.length;
    } else if (key === "Enter") {
      startWorkout();
    } else if (key === "ArrowRight") {
      state = STATE_EDIT;
      editField = 0;
    } else if (key === "ArrowLeft") {
      state = STATE_BADGES;
      badgeScroll = 0;
    }
  } else if (state === STATE_BADGES) {
    if (key === "ArrowUp") {
      badgeScroll = Math.max(0, badgeScroll - 1);
    } else if (key === "ArrowDown") {
      badgeScroll = Math.min(ACHIEVEMENTS.length - 1, badgeScroll + 1);
    } else if (key === "Escape" || key === "ArrowRight" || key === "Enter") {
      state = STATE_MENU;
    }
  } else if (state === STATE_EDIT) {
    var p = getPreset();
    if (key === "ArrowUp") {
      editField = (editField - 1 + 3) % 3;
    } else if (key === "ArrowDown") {
      editField = (editField + 1) % 3;
    } else if (key === "ArrowLeft") {
      if (editField === 0) p.work = Math.max(5, p.work - 5);
      else if (editField === 1) p.rest = Math.max(0, p.rest - 5);
      else p.rounds = Math.max(1, p.rounds - 1);
    } else if (key === "ArrowRight") {
      if (editField === 0) p.work = Math.min(600, p.work + 5);
      else if (editField === 1) p.rest = Math.min(300, p.rest + 5);
      else p.rounds = Math.min(99, p.rounds + 1);
    } else if (key === "Enter" || key === "Escape") {
      state = STATE_MENU;
    }
  } else if (state === STATE_RUNNING) {
    if (key === "Enter") {
      state = STATE_PAUSED;
    } else if (key === "Escape") {
      state = STATE_MENU;
    } else if (key === "ArrowUp") {
      heartbeatOn = !heartbeatOn;
      try { localStorage.setItem("intervals_heartbeat", heartbeatOn ? "1" : "0"); } catch(e){}
    } else if (key === "ArrowDown") {
      smartRest = !smartRest;
      try { localStorage.setItem("intervals_smartrest", smartRest ? "1" : "0"); } catch(e){}
      if (smartRest && !micInited) initMic();
    }
  } else if (state === STATE_PAUSED) {
    if (key === "Enter") {
      state = STATE_RUNNING;
      lastTick = performance.now();
      lastHeartbeatTime = performance.now();
    } else if (key === "Escape") {
      state = STATE_MENU;
    } else if (key === "ArrowUp") {
      heartbeatOn = !heartbeatOn;
      try { localStorage.setItem("intervals_heartbeat", heartbeatOn ? "1" : "0"); } catch(e){}
    } else if (key === "ArrowDown") {
      smartRest = !smartRest;
      try { localStorage.setItem("intervals_smartrest", smartRest ? "1" : "0"); } catch(e){}
      if (smartRest && !micInited) initMic();
    }
  } else if (state === STATE_COMPLETE) {
    if (key === "Enter") {
      startWorkout();
    } else if (key === "Escape") {
      state = STATE_MENU;
    } else if (key === "ArrowLeft") {
      state = STATE_BADGES;
      badgeScroll = 0;
    }
  }
});

/* ─── Main Loop ─── */
function frame() {
  var now = performance.now();
  updateTimer(now);

  if (state === STATE_MENU) drawMenu();
  else if (state === STATE_BADGES) drawBadges();
  else if (state === STATE_EDIT) drawEdit();
  else if (state === STATE_RUNNING || state === STATE_PAUSED) drawRunning(now);
  else if (state === STATE_COMPLETE) drawComplete();

  requestAnimationFrame(frame);
}

frame();
})();
</script>
<script>
/* === MRBD D-pad Fix === */
(function() {
  // Prevent MRBD browser from intercepting D-pad for spatial navigation
  document.addEventListener('keydown', function(e) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key)) {
      e.preventDefault();
    }
  }, true); // capture phase to beat browser's handler
  // Auto-focus canvas and click-to-refocus
  var c = document.querySelector('canvas');
  if (c) {
    if (!c.getAttribute('tabindex')) c.setAttribute('tabindex', '0');
    c.style.outline = 'none';
    c.focus();
    c.addEventListener('click', function() { c.focus(); });
    c.addEventListener('touchstart', function() { c.focus(); });
  }
  // Disable focusable elements during gameplay to prevent arrow-key focus stealing
  document.querySelectorAll('a, button, input, select, textarea').forEach(function(el) {
    el.setAttribute('tabindex', '-1');
  });
})();
/* === End MRBD D-pad Fix === */
</script>
<script src="../../touch-controls.js"></script>
