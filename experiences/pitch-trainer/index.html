<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Pitch Trainer — LITF</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d0d;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block}

/* Mobile responsive: scale 600x600 canvas to fit viewport */
@media (max-width: 600px) {
  html,body{width:100%!important;height:100%!important;margin:0;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw!important;max-height:100vh!important;width:auto!important;height:auto!important;aspect-ratio:1/1}
}
@media (max-height: 600px) and (max-width: 600px) {
  canvas{max-height:100vh!important;max-width:100vh!important}
}
</style>
</head>
<body>
<canvas id="c" width="600" height="600" tabindex="0"></canvas>
<script>
(function(){
"use strict";

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");

// --- Audio context ---
var audioCtx = null;
var analyser = null;
var micStream = null;
var micFailed = false;
var micActive = false;
var dataArray = null;
var bufferLength = 0;

// --- State machine ---
var STATE_TITLE = 0;
var STATE_PLAYING = 1;
var STATE_SPEED = 2;
var STATE_SPEED_COUNTDOWN = 3;
var STATE_SPEED_RESULT = 4;
var gameState = STATE_TITLE;
var menuIdx = 0; // which mode is highlighted on title

// --- State ---
var NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var modes = ["Free","Scale","Intervals","Random","Speed Challenge"];
var modeDescriptions = [
  "Random notes in one octave",
  "Walk up the C major scale",
  "Common interval pairs",
  "Random notes across octaves",
  "60s timed interval recognition"
];
var modeIdx = 0;
var targetNote = 9; // A = index 9
var targetOctave = 4; // A4 = 440Hz
var detectedPitch = 0;
var detectedNote = -1;
var detectedOctave = 0;
var detectedCents = 0;
var matchStrength = 0;
var matchSmooth = 0;
var streakCount = 0;
var bestStreak = 0;
var totalAttempts = 0;
var totalHits = 0;
var holdTimer = 0;
var noteCompleted = false;
var showSuccess = 0;
var scaleNotes = [0,2,4,5,7,9,11];
var scaleIdx = 0;
var intervalPairs = [[0,4],[0,7],[0,5],[0,3],[0,9],[0,12],[0,2],[0,10]];
var intervalNames = ["M3","P5","P4","m3","M6","Oct","M2","m7"];
var intervalLabels = ["Major 3rd","Perfect 5th","Perfect 4th","Minor 3rd","Major 6th","Octave","Major 2nd","Minor 7th"];
var intervalIdx = 0;
var intervalAccuracy = {}; // {idx: {hits:N, attempts:N}}
var refPlaying = false;
var refOsc = null;
var refGain = null;

// --- Speed Challenge state ---
var speedTimer = 0; // ms remaining
var speedScore = 0;
var speedCombo = 0;
var speedBestCombo = 0;
var speedCorrect = 0;
var speedTotal = 0;
var speedOptions = []; // [{idx, name, label}]
var speedCorrectDir = -1; // 0=left,1=up,2=right,3=down
var speedPlaying = false; // interval tones playing
var speedAnswered = false;
var speedCountdown = 0; // frames for 3-2-1 countdown
var speedLastTime = 0; // performance.now() for timer
var speedBestScore = 0;
var speedGrade = "";
var speedCurrentInterval = -1; // which interval is playing
var speedRefOsc1 = null;
var speedRefOsc2 = null;
var speedRefGain1 = null;
var speedRefGain2 = null;
var speedPenaltyFlash = 0;
var speedComboFlash = 0;
var SPEED_DURATION = 60000; // 60 seconds
var SPEED_DIRS = ["←","↑","→","↓"];
var SPEED_DIR_KEYS = ["ArrowLeft","ArrowUp","ArrowRight","ArrowDown"];

function loadSpeedBest() {
  try {
    var d = JSON.parse(localStorage.getItem("pitch_speed_best"));
    if (d) speedBestScore = d.best || 0;
  } catch(e){}
}
function saveSpeedBest() {
  try {
    localStorage.setItem("pitch_speed_best", JSON.stringify({best: speedBestScore}));
  } catch(e){}
}
loadSpeedBest();

// --- Rank progression ---
var RANKS = [
  {name:"Listener",    threshold:0,   bonus:""},
  {name:"Hummer",      threshold:15,  bonus:"+20% match window"},
  {name:"Vocalist",    threshold:50,  bonus:"Faster confirm"},
  {name:"Harmonist",   threshold:120, bonus:"+40% match window"},
  {name:"Melodist",    threshold:250, bonus:"Quick confirm"},
  {name:"Tonalist",    threshold:500, bonus:"+60% match window"},
  {name:"Ear Master",  threshold:1000,bonus:"Instant confirm"},
  {name:"Perfect Pitch",threshold:2000,bonus:"All bonuses max"}
];
var persistentHits = 0;
var persistentBest = 0;
var persistentSessions = 0;
var currentRank = 0;
var prevRank = 0;
var rankUpFlash = 0;

function loadStats() {
  try {
    var d = JSON.parse(localStorage.getItem("pitch_stats"));
    if (d) {
      persistentHits = d.totalHits || 0;
      persistentBest = d.bestStreak || 0;
      persistentSessions = d.sessions || 0;
    }
  } catch(e){}
  currentRank = getRankIdx(persistentHits);
  prevRank = currentRank;
}

function saveStats() {
  try {
    localStorage.setItem("pitch_stats", JSON.stringify({
      totalHits: persistentHits,
      bestStreak: persistentBest,
      sessions: persistentSessions
    }));
  } catch(e){}
}

function getRankIdx(hits) {
  var r = 0;
  for (var i = RANKS.length - 1; i >= 0; i--) {
    if (hits >= RANKS[i].threshold) { r = i; break; }
  }
  return r;
}

function getRankBonuses() {
  var r = currentRank;
  var matchMult = 1.0;
  if (r >= 1) matchMult = 1.2;
  if (r >= 3) matchMult = 1.4;
  if (r >= 5) matchMult = 1.6;
  if (r >= 7) matchMult = 1.8;
  var hold = 30;
  if (r >= 2) hold = 25;
  if (r >= 4) hold = 20;
  if (r >= 6) hold = 15;
  if (r >= 7) hold = 12;
  return {matchMult: matchMult, holdFrames: hold};
}

function playRankUpChime() {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var notes = [523.25, 659.25, 783.99, 1046.50];
  for (var i = 0; i < notes.length; i++) {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = notes[i];
    g.gain.setValueAtTime(0, t + i * 0.12);
    g.gain.linearRampToValueAtTime(0.15, t + i * 0.12 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.5);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t + i * 0.12);
    o.stop(t + i * 0.12 + 0.5);
  }
}

function playMenuTick() {
  if (!audioCtx) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.value = 440 + menuIdx * 80;
  g.gain.setValueAtTime(0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.1);
}

function playStartChime() {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(440, t);
  o.frequency.linearRampToValueAtTime(880, t + 0.15);
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.3);
}

loadStats();

// --- Adaptive interval quiz ---
function loadIntervalAccuracy() {
  try {
    var d = JSON.parse(localStorage.getItem("pitch_interval_acc"));
    if (d) intervalAccuracy = d;
  } catch(e){}
}

function saveIntervalAccuracy() {
  try {
    localStorage.setItem("pitch_interval_acc", JSON.stringify(intervalAccuracy));
  } catch(e){}
}

function getIntervalWeight(idx) {
  var acc = intervalAccuracy[idx];
  if (!acc || acc.attempts < 3) return 2; // untested: moderate weight
  var pct = acc.hits / acc.attempts;
  if (pct < 0.4) return 4; // very weak: 4x
  if (pct < 0.6) return 3; // weak: 3x
  if (pct < 0.8) return 2; // ok: 2x
  return 1; // strong: 1x
}

function pickWeightedInterval() {
  var totalWeight = 0;
  var weights = [];
  for (var i = 0; i < intervalPairs.length; i++) {
    var w = getIntervalWeight(i);
    weights.push(w);
    totalWeight += w;
  }
  var roll = Math.random() * totalWeight;
  var cumulative = 0;
  for (var j = 0; j < weights.length; j++) {
    cumulative += weights[j];
    if (roll < cumulative) return j;
  }
  return weights.length - 1;
}

function getIntervalAccPct(idx) {
  var acc = intervalAccuracy[idx];
  if (!acc || acc.attempts === 0) return -1; // no data
  return Math.round((acc.hits / acc.attempts) * 100);
}

loadIntervalAccuracy();

// --- Helpers ---
function noteFreq(note, octave) {
  return 440 * Math.pow(2, (note - 9 + (octave - 4) * 12) / 12);
}

function freqToNote(freq) {
  if (freq < 20) return {note: -1, octave: 0, cents: 0};
  var semitones = 12 * Math.log2(freq / 440) + 9 + 48;
  var rounded = Math.round(semitones);
  var cents = Math.round((semitones - rounded) * 100);
  var note = ((rounded % 12) + 12) % 12;
  var octave = Math.floor(rounded / 12);
  return {note: note, octave: octave, cents: cents};
}

// --- Autocorrelation pitch detection ---
function detectPitch() {
  if (!analyser || !dataArray) return 0;
  analyser.getFloatTimeDomainData(dataArray);

  var rms = 0;
  for (var i = 0; i < bufferLength; i++) rms += dataArray[i] * dataArray[i];
  rms = Math.sqrt(rms / bufferLength);
  if (rms < 0.01) return 0;

  var SIZE = bufferLength;
  var maxSamples = Math.floor(SIZE / 2);
  var bestOffset = -1;
  var bestCorrelation = 0;
  var foundGoodCorrelation = false;
  var correlations = new Float32Array(maxSamples);

  for (var offset = 20; offset < maxSamples; offset++) {
    var correlation = 0;
    for (var j = 0; j < maxSamples; j++) {
      correlation += Math.abs(dataArray[j] - dataArray[j + offset]);
    }
    correlation = 1 - (correlation / maxSamples);
    correlations[offset] = correlation;

    if (correlation > 0.9 && !foundGoodCorrelation) {
      foundGoodCorrelation = true;
    }
    if (foundGoodCorrelation) {
      if (correlation > bestCorrelation) {
        bestCorrelation = correlation;
        bestOffset = offset;
      } else if (correlation < bestCorrelation - 0.01) {
        break;
      }
    }
  }

  if (bestCorrelation > 0.85 && bestOffset > 0) {
    var prev = correlations[bestOffset - 1] || 0;
    var next = correlations[bestOffset + 1] || 0;
    var shift = (next - prev) / (2 * (2 * correlations[bestOffset] - prev - next));
    if (Math.abs(shift) < 1) bestOffset += shift;
    var sampleRate = audioCtx ? audioCtx.sampleRate : 44100;
    return sampleRate / bestOffset;
  }
  return 0;
}

// --- Mic init ---
function initMic() {
  if (micActive || micFailed) return;
  micFailed = true;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    navigator.mediaDevices.getUserMedia({audio: true}).then(function(stream) {
      micStream = stream;
      micFailed = false;
      micActive = true;
      persistentSessions++;
      saveStats();
      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0.8;
      bufferLength = analyser.fftSize;
      dataArray = new Float32Array(bufferLength);
      source.connect(analyser);
    }).catch(function() {
      micFailed = true;
    });
  } catch(e) {
    micFailed = true;
  }
}

// --- Reference tone ---
function playRef() {
  if (!audioCtx) return;
  stopRef();
  refOsc = audioCtx.createOscillator();
  refGain = audioCtx.createGain();
  refOsc.type = "sine";
  refOsc.frequency.value = noteFreq(targetNote, targetOctave);
  refGain.gain.value = 0.15;
  refOsc.connect(refGain);
  refGain.connect(audioCtx.destination);
  refOsc.start();
  refPlaying = true;
  setTimeout(function(){ stopRef(); }, 1500);
}

function stopRef() {
  if (refOsc) {
    try { refOsc.stop(); } catch(e){}
    refOsc = null;
  }
  refPlaying = false;
}

// --- Success sound ---
function playSuccess() {
  if (!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(523, audioCtx.currentTime);
  osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
  osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}

// --- Next note ---
function nextNote() {
  noteCompleted = false;
  holdTimer = 0;
  totalAttempts++;

  if (modeIdx === 0) {
    targetNote = Math.floor(Math.random() * 12);
  } else if (modeIdx === 1) {
    scaleIdx = (scaleIdx + 1) % scaleNotes.length;
    if (scaleIdx === 0) targetOctave = targetOctave === 5 ? 3 : targetOctave + 1;
    targetNote = scaleNotes[scaleIdx];
  } else if (modeIdx === 2) {
    intervalIdx = pickWeightedInterval();
    var pair = intervalPairs[intervalIdx];
    targetNote = (pair[0] + pair[1]) % 12;
    // Track attempt for this interval
    if (!intervalAccuracy[intervalIdx]) intervalAccuracy[intervalIdx] = {hits:0, attempts:0};
    intervalAccuracy[intervalIdx].attempts++;
  } else {
    targetNote = Math.floor(Math.random() * 12);
    targetOctave = 3 + Math.floor(Math.random() * 3);
  }
}

// --- Speed Challenge functions ---
function playSpeedCountdownBeep(n) {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var freq = n === 0 ? 880 : 440 + (3 - n) * 110;
  var dur = n === 0 ? 0.3 : 0.15;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = n === 0 ? "triangle" : "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}

function playSpeedInterval() {
  if (!audioCtx) return;
  stopSpeedInterval();
  var baseNote = Math.floor(Math.random() * 7); // C3 to F#3
  var baseOctave = 3 + Math.floor(Math.random() * 2);
  var pair = intervalPairs[speedCurrentInterval];
  var freq1 = noteFreq(baseNote, baseOctave);
  var freq2 = noteFreq((baseNote + pair[1]) % 12, baseOctave + Math.floor((baseNote + pair[1]) / 12));
  var t = audioCtx.currentTime;
  // First tone
  speedRefOsc1 = audioCtx.createOscillator();
  speedRefGain1 = audioCtx.createGain();
  speedRefOsc1.type = "sine";
  speedRefOsc1.frequency.value = freq1;
  speedRefGain1.gain.setValueAtTime(0, t);
  speedRefGain1.gain.linearRampToValueAtTime(0.18, t + 0.02);
  speedRefGain1.gain.setValueAtTime(0.18, t + 0.35);
  speedRefGain1.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  speedRefOsc1.connect(speedRefGain1);
  speedRefGain1.connect(audioCtx.destination);
  speedRefOsc1.start(t);
  speedRefOsc1.stop(t + 0.5);
  // Second tone
  speedRefOsc2 = audioCtx.createOscillator();
  speedRefGain2 = audioCtx.createGain();
  speedRefOsc2.type = "sine";
  speedRefOsc2.frequency.value = freq2;
  speedRefGain2.gain.setValueAtTime(0, t + 0.5);
  speedRefGain2.gain.linearRampToValueAtTime(0.18, t + 0.52);
  speedRefGain2.gain.setValueAtTime(0.18, t + 0.85);
  speedRefGain2.gain.exponentialRampToValueAtTime(0.001, t + 0.95);
  speedRefOsc2.connect(speedRefGain2);
  speedRefGain2.connect(audioCtx.destination);
  speedRefOsc2.start(t + 0.5);
  speedRefOsc2.stop(t + 1.0);
  speedPlaying = true;
}

function stopSpeedInterval() {
  try { if (speedRefOsc1) speedRefOsc1.stop(); } catch(e){}
  try { if (speedRefOsc2) speedRefOsc2.stop(); } catch(e){}
  speedRefOsc1 = null; speedRefOsc2 = null;
  speedPlaying = false;
}

function playSpeedCorrect() {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(660, t);
  o.frequency.setValueAtTime(880, t + 0.06);
  g.gain.setValueAtTime(0.1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.2);
}

function playSpeedWrong() {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = "sawtooth";
  o.frequency.value = 150;
  g.gain.setValueAtTime(0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.25);
}

function playSpeedTick() {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.value = 1000;
  g.gain.setValueAtTime(0.04, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.05);
}

function generateSpeedRound() {
  // Pick an interval for the question
  speedCurrentInterval = Math.floor(Math.random() * intervalPairs.length);
  speedAnswered = false;
  // Generate 4 options: correct + 3 distractors
  var correct = speedCurrentInterval;
  var distractors = [];
  for (var i = 0; i < intervalPairs.length; i++) {
    if (i !== correct) distractors.push(i);
  }
  // Shuffle distractors and take 3
  for (var j = distractors.length - 1; j > 0; j--) {
    var k = Math.floor(Math.random() * (j + 1));
    var tmp = distractors[j]; distractors[j] = distractors[k]; distractors[k] = tmp;
  }
  var opts = [correct, distractors[0], distractors[1], distractors[2]];
  // Shuffle options
  for (var m = opts.length - 1; m > 0; m--) {
    var n = Math.floor(Math.random() * (m + 1));
    var t2 = opts[m]; opts[m] = opts[n]; opts[n] = t2;
  }
  speedOptions = [];
  speedCorrectDir = -1;
  for (var p = 0; p < 4; p++) {
    speedOptions.push({idx: opts[p], name: intervalNames[opts[p]], label: intervalLabels[opts[p]]});
    if (opts[p] === correct) speedCorrectDir = p;
  }
  // Play the interval
  playSpeedInterval();
}

function speedGetGrade(score) {
  if (score >= 80) return "S";
  if (score >= 60) return "A";
  if (score >= 45) return "B";
  if (score >= 30) return "C";
  if (score >= 15) return "D";
  return "F";
}

function startSpeedChallenge() {
  speedScore = 0;
  speedCombo = 0;
  speedBestCombo = 0;
  speedCorrect = 0;
  speedTotal = 0;
  speedTimer = SPEED_DURATION;
  speedPenaltyFlash = 0;
  speedComboFlash = 0;
  speedCountdown = 180; // 3 seconds at 60fps
  speedLastTime = 0;
  gameState = STATE_SPEED_COUNTDOWN;
  playSpeedCountdownBeep(3);
}

function handleSpeedAnswer(dirIdx) {
  if (speedAnswered) return;
  speedAnswered = true;
  speedTotal++;
  stopSpeedInterval();
  if (dirIdx === speedCorrectDir) {
    speedCorrect++;
    speedCombo++;
    if (speedCombo > speedBestCombo) speedBestCombo = speedCombo;
    var pts = 1 + (speedCombo - 1) * 0.5;
    speedScore += pts;
    speedComboFlash = 20;
    playSpeedCorrect();
    // Track interval accuracy
    if (!intervalAccuracy[speedCurrentInterval]) intervalAccuracy[speedCurrentInterval] = {hits:0, attempts:0};
    intervalAccuracy[speedCurrentInterval].hits++;
    intervalAccuracy[speedCurrentInterval].attempts++;
    saveIntervalAccuracy();
  } else {
    speedCombo = 0;
    speedTimer = Math.max(0, speedTimer - 2000); // -2 seconds
    speedPenaltyFlash = 30;
    playSpeedWrong();
    if (!intervalAccuracy[speedCurrentInterval]) intervalAccuracy[speedCurrentInterval] = {hits:0, attempts:0};
    intervalAccuracy[speedCurrentInterval].attempts++;
    saveIntervalAccuracy();
  }
  // Next round after brief delay
  setTimeout(function() {
    if (gameState === STATE_SPEED && speedTimer > 0) {
      generateSpeedRound();
    }
  }, 400);
}

// --- Start session ---
function startPlaying() {
  modeIdx = menuIdx;
  if (modeIdx === 4) {
    // Speed Challenge mode
    startSpeedChallenge();
    return;
  }
  scaleIdx = 0;
  intervalIdx = 0;
  streakCount = 0;
  totalAttempts = 0;
  totalHits = 0;
  bestStreak = 0;
  holdTimer = 0;
  noteCompleted = false;
  targetNote = 9;
  targetOctave = 4;
  gameState = STATE_PLAYING;
  playStartChime();
  nextNote();
  // First note doesn't count as "attempt" in the traditional sense
  totalAttempts = 0;
}

// --- Input ---
var keys = {};
document.addEventListener("keydown", function(e) {
  if (keys[e.key]) return;
  keys[e.key] = true;

  if (!micActive && !micFailed) initMic();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

  if (gameState === STATE_TITLE) {
    if (e.key === "ArrowUp") {
      menuIdx = ((menuIdx - 1) + modes.length) % modes.length;
      playMenuTick();
    } else if (e.key === "ArrowDown") {
      menuIdx = (menuIdx + 1) % modes.length;
      playMenuTick();
    } else if (e.key === "Enter") {
      startPlaying();
    }
    // ArrowLeft on title = back to index (handled by browser/MRBD)
  } else if (gameState === STATE_SPEED) {
    // Speed Challenge: directions select answer
    for (var si = 0; si < SPEED_DIR_KEYS.length; si++) {
      if (e.key === SPEED_DIR_KEYS[si]) {
        handleSpeedAnswer(si);
        break;
      }
    }
    if (e.key === "Enter") {
      // Replay current interval
      if (!speedAnswered && speedCurrentInterval >= 0) {
        playSpeedInterval();
      }
    } else if (e.key === "Escape") {
      stopSpeedInterval();
      gameState = STATE_TITLE;
    }
  } else if (gameState === STATE_SPEED_RESULT) {
    if (e.key === "Enter") {
      startSpeedChallenge(); // retry
    } else if (e.key === "Escape") {
      gameState = STATE_TITLE;
    }
  } else if (gameState === STATE_PLAYING) {
    if (e.key === "ArrowLeft") {
      targetNote = ((targetNote - 1) + 12) % 12;
      holdTimer = 0; noteCompleted = false;
    } else if (e.key === "ArrowRight") {
      targetNote = (targetNote + 1) % 12;
      holdTimer = 0; noteCompleted = false;
    } else if (e.key === "ArrowUp") {
      if (targetOctave < 6) targetOctave++;
      holdTimer = 0; noteCompleted = false;
    } else if (e.key === "ArrowDown") {
      if (targetOctave > 2) targetOctave--;
      holdTimer = 0; noteCompleted = false;
    } else if (e.key === "Enter") {
      if (noteCompleted) {
        nextNote();
      } else {
        playRef();
      }
    } else if (e.key === "Escape") {
      // Return to title
      stopRef();
      if (modeIdx === 2) saveIntervalAccuracy();
      gameState = STATE_TITLE;
    }
  }
  e.preventDefault();
});

document.addEventListener("keyup", function(e) {
  keys[e.key] = false;
});

function drawPlaying() {
  // Detect pitch
  var rawPitch = detectPitch();
  if (rawPitch > 0) {
    detectedPitch = detectedPitch * 0.7 + rawPitch * 0.3;
    var info = freqToNote(detectedPitch);
    detectedNote = info.note;
    detectedOctave = info.octave;
    detectedCents = info.cents;
  } else {
    detectedPitch = 0;
    detectedNote = -1;
    detectedCents = 0;
  }

  // Match calculation
  var targetFreq = noteFreq(targetNote, targetOctave);
  if (detectedPitch > 0) {
    var centsDiff = 1200 * Math.log2(detectedPitch / targetFreq);
    matchStrength = Math.max(0, 1 - Math.abs(centsDiff) / 100);
    matchSmooth = matchSmooth * 0.85 + matchStrength * 0.15;

    var bonuses = getRankBonuses();
    var matchThreshold = 0.85 / bonuses.matchMult;
    matchThreshold = Math.max(0.5, matchThreshold);
    var reqFrames = bonuses.holdFrames;
    if (matchStrength > matchThreshold && !noteCompleted) {
      holdTimer++;
      if (holdTimer >= reqFrames) {
        noteCompleted = true;
        showSuccess = 60;
        totalHits++;
        persistentHits++;
        streakCount++;
        if (streakCount > bestStreak) bestStreak = streakCount;
        if (streakCount > persistentBest) persistentBest = streakCount;
        // Track interval accuracy
        if (modeIdx === 2 && intervalAccuracy[intervalIdx]) {
          intervalAccuracy[intervalIdx].hits++;
          saveIntervalAccuracy();
        }
        prevRank = currentRank;
        currentRank = getRankIdx(persistentHits);
        if (currentRank > prevRank) {
          rankUpFlash = 120;
          playRankUpChime();
        } else {
          playSuccess();
        }
        saveStats();
      }
    } else if (matchStrength < 0.5) {
      holdTimer = Math.max(0, holdTimer - 2);
    }
  } else {
    matchSmooth = matchSmooth * 0.95;
    holdTimer = Math.max(0, holdTimer - 1);
  }

  if (showSuccess > 0) showSuccess--;

  // --- Header ---
  ctx.fillStyle = "#888";
  ctx.font = "14px system-ui";
  ctx.textAlign = "left";
  ctx.fillText("🎤 " + modes[modeIdx], 20, 28);
  ctx.textAlign = "right";

  ctx.fillText(micActive ? "🎤 Listening" : (micFailed ? "🎤 Unavailable" : "🎤 Press any key"), 580, 28);

  // Rank bar below header
  var rankY = 38;

  var rankPct = 1;

    var rangeStart = RANKS[currentRank].threshold;
    var rangeEnd = nextRank.threshold;
    rankPct = Math.min(1, (persistentHits - rangeStart) / (rangeEnd - rangeStart));
  }
  ctx.textAlign = "left";
  ctx.font = "bold 12px system-ui";
  ctx.fillStyle = currentRank >= 7 ? "#ffd700" : currentRank >= 5 ? "#c0a0ff" : currentRank >= 3 ? "#4af" : "#8a8";
  ctx.fillText("⭐ " + rankName, 20, rankY + 12);
  var pbX = 160, pbW = 300, pbH = 8;
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(pbX, rankY + 6, pbW, pbH);
  var pbColor = currentRank >= 7 ? "#ffd700" : currentRank >= 5 ? "#c0a0ff" : "#4a9";
  ctx.fillStyle = pbColor;
  ctx.fillRect(pbX, rankY + 6, pbW * rankPct, pbH);
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 1;
  ctx.strokeRect(pbX, rankY + 6, pbW, pbH);
  ctx.textAlign = "right";
  ctx.font = "11px system-ui";
  ctx.fillStyle = "#666";

  } else {
    ctx.fillText(persistentHits + " notes · MAX RANK", 580, rankY + 13);
  }

  // Rank up flash overlay
  if (rankUpFlash > 0) {
    rankUpFlash--;
    var ruAlpha = Math.min(1, rankUpFlash / 60) * 0.12;
    ctx.fillStyle = "rgba(255,215,0," + ruAlpha + ")";

      ctx.fillStyle = "rgba(255,215,0," + Math.min(1, (rankUpFlash - 60) / 40) + ")";
      ctx.fillText("⭐ RANK UP: " + RANKS[currentRank].name + " ⭐", 300, 240);
      ctx.font = "16px system-ui";

      ctx.fillText(RANKS[currentRank].bonus, 300, 270);
    }
  }

  // --- Target note (large) ---
  var targetColor = noteCompleted ? "#4f4" : (showSuccess > 0 ? "#4f4" : "#fff");
  ctx.fillStyle = targetColor;
  ctx.font = "bold 72px system-ui";
  ctx.textAlign = "center";

  ctx.fillStyle = "#666";
  ctx.font = "16px system-ui";
  ctx.fillText(Math.round(targetFreq) + " Hz", 300, 152);

  // --- Interval name + accuracy (Intervals mode only) ---
  if (modeIdx === 2) {
    var iName = intervalNames[intervalIdx] + " — " + intervalLabels[intervalIdx];
    var iPct = getIntervalAccPct(intervalIdx);
    ctx.font = "14px system-ui";
    if (iPct >= 0 && iPct < 60) {
      ctx.fillStyle = "#e55"; // weak = red
      iName += "  ⚠ " + iPct + "%";
    } else if (iPct >= 60 && iPct < 80) {
      ctx.fillStyle = "#da4"; // ok = amber
      iName += "  " + iPct + "%";
    } else if (iPct >= 80) {
      ctx.fillStyle = "#4a9"; // strong = green
      iName += "  " + iPct + "%";
    } else {
      ctx.fillStyle = "#888"; // no data
    }
    ctx.fillText(iName, 300, 170);
  }

  // --- Pitch meter (arc gauge) ---
  var cx = 300, cy = 300, radius = 120;
  var startAngle = Math.PI * 0.75;
  var endAngle = Math.PI * 0.25;
  var totalAngle = endAngle + 2 * Math.PI - startAngle;

  // Background arc
  ctx.beginPath();
  ctx.arc(cx, cy, radius, startAngle, endAngle);
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 20;
  ctx.lineCap = "round";
  ctx.stroke();

  // Zone colors
  var zones = [
    {start: 0, end: 0.2, color: "#a44"},
    {start: 0.2, end: 0.35, color: "#a84"},
    {start: 0.35, end: 0.45, color: "#aa4"},
    {start: 0.45, end: 0.55, color: "#4a4"},
    {start: 0.55, end: 0.65, color: "#aa4"},
    {start: 0.65, end: 0.8, color: "#a84"},
    {start: 0.8, end: 1, color: "#a44"}
  ];

  for (var z = 0; z < zones.length; z++) {
    var zs = startAngle + zones[z].start * totalAngle;
    var ze = startAngle + zones[z].end * totalAngle;
    if (ze > Math.PI * 2) { zs -= Math.PI * 2; ze -= Math.PI * 2; }
    ctx.beginPath();
    ctx.arc(cx, cy, radius, zs, ze);
    ctx.strokeStyle = zones[z].color + "40";
    ctx.lineWidth = 20;
    ctx.lineCap = "butt";
    ctx.stroke();
  }

  // Tick marks
  for (var t = 0; t <= 10; t++) {
    var tickAngle = startAngle + (t / 10) * totalAngle;
    var inner = radius - 14;
    var outer = radius + 14;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(tickAngle) * inner, cy + Math.sin(tickAngle) * inner);
    ctx.lineTo(cx + Math.cos(tickAngle) * outer, cy + Math.sin(tickAngle) * outer);
    ctx.strokeStyle = "#444";
    ctx.lineWidth = t === 5 ? 3 : 1;
    ctx.stroke();
  }

  // Labels
  ctx.font = "12px system-ui";
  ctx.fillStyle = "#666";
  ctx.textAlign = "center";
  var flatAngle = startAngle + 0.1 * totalAngle;
  ctx.fillText("♭ Flat", cx + Math.cos(flatAngle) * (radius + 30), cy + Math.sin(flatAngle) * (radius + 30));
  var sharpAngle = startAngle + 0.9 * totalAngle;
  ctx.fillText("Sharp ♯", cx + Math.cos(sharpAngle) * (radius + 30), cy + Math.sin(sharpAngle) * (radius + 30));

  // Needle
  if (detectedPitch > 0) {
    var centsDiff2 = 1200 * Math.log2(detectedPitch / targetFreq);
    var clamped = Math.max(-50, Math.min(50, centsDiff2));
    var needlePos = 0.5 + clamped / 100;
    var needleAngle = startAngle + needlePos * totalAngle;

    if (matchStrength > 0.85) {
      ctx.beginPath();
      ctx.arc(cx + Math.cos(needleAngle) * radius, cy + Math.sin(needleAngle) * radius, 15, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(68,255,68,0.3)";
      ctx.fill();
    }

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(needleAngle) * (radius - 5), cy + Math.sin(needleAngle) * (radius - 5));
    var needleColor = matchStrength > 0.85 ? "#4f4" : (matchStrength > 0.5 ? "#ff4" : "#f44");
    ctx.strokeStyle = needleColor;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx + Math.cos(needleAngle) * radius, cy + Math.sin(needleAngle) * radius, 8, 0, Math.PI * 2);
    ctx.fillStyle = needleColor;
    ctx.fill();
  }

  // Center display
  if (detectedPitch > 0) {
    ctx.fillStyle = matchStrength > 0.85 ? "#4f4" : "#ccc";
    ctx.font = "bold 36px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(NOTE_NAMES[detectedNote] + detectedOctave, cx, cy + 5);

    ctx.font = "16px system-ui";
    ctx.fillStyle = detectedCents > 0 ? "#a84" : (detectedCents < 0 ? "#a84" : "#4a4");
    var centsLabel = detectedCents > 0 ? "+" + detectedCents + "¢" : detectedCents + "¢";
    ctx.fillText(centsLabel, cx, cy + 28);
  } else {
    ctx.fillStyle = "#444";
    ctx.font = "20px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("Sing or hum...", cx, cy + 10);
  }

  // Hold progress ring
  var holdReqNow = getRankBonuses().holdFrames;
  if (!noteCompleted && holdTimer > 0) {
    var holdPct = holdTimer / holdReqNow;
    ctx.beginPath();
    ctx.arc(cx, cy, 50, -Math.PI / 2, -Math.PI / 2 + holdPct * Math.PI * 2);
    ctx.strokeStyle = "#4a9";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.stroke();
  }

  // Success flash
  if (showSuccess > 30) {
    ctx.fillStyle = "rgba(68,255,68," + ((showSuccess - 30) / 30 * 0.15) + ")";
    ctx.fillRect(0, 0, 600, 600);
  }

  // --- Stats bar ---
  var statsY = 450;
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(20, statsY, 560, 60);

  ctx.font = "13px system-ui";
  ctx.textAlign = "center";

  var accuracy = totalAttempts > 0 ? Math.round((totalHits / totalAttempts) * 100) : 0;
  ctx.fillStyle = "#888";
  ctx.fillText("Accuracy", 80, statsY + 20);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText(accuracy + "%", 80, statsY + 46);

  ctx.font = "13px system-ui";
  ctx.fillStyle = "#888";
  ctx.fillText("Streak", 220, statsY + 20);
  ctx.fillStyle = streakCount > 0 ? "#4f4" : "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText("" + streakCount, 220, statsY + 46);

  ctx.font = "13px system-ui";
  ctx.fillStyle = "#888";
  ctx.fillText("Best", 340, statsY + 20);
  ctx.fillStyle = "#ffd700";
  ctx.font = "bold 20px system-ui";
  ctx.fillText("" + persistentBest, 340, statsY + 46);

  ctx.font = "13px system-ui";
  ctx.fillStyle = "#888";
  ctx.fillText("Session", 460, statsY + 20);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText(totalHits + "/" + totalAttempts, 460, statsY + 46);

  // --- Footer with D-pad hints ---
  ctx.font = "12px system-ui";
  ctx.fillStyle = "#555";
  ctx.textAlign = "center";
  if (noteCompleted) {
    ctx.fillStyle = "#4a9";
    ctx.fillText("✓ Matched! Enter: next note   ←→: note   ↑↓: octave", 300, 540);
  } else if (refPlaying) {
    ctx.fillStyle = "#48a";
    ctx.fillText("♪ Playing reference tone...", 300, 540);
  } else {
    ctx.fillText("Enter: hear reference   ←→: note   ↑↓: octave", 300, 540);
  }

  // --- Navigation ---
  ctx.fillStyle = "#333";
  ctx.font = "11px system-ui";
  ctx.textAlign = "left";
  ctx.fillText("Esc: menu", 20, 590);
  ctx.textAlign = "right";
  ctx.fillText(modes[modeIdx], 580, 590);
}

// --- Speed Challenge: Countdown ---
function drawSpeedCountdown() {
  speedCountdown--;
  var sec = Math.ceil(speedCountdown / 60);
  if (sec <= 0) {
    // Start the actual challenge
    gameState = STATE_SPEED;
    speedLastTime = performance.now();
    generateSpeedRound();
    playSpeedCountdownBeep(0);
    return;
  }
  // Play beep at each second transition
  var prevSec = Math.ceil((speedCountdown + 1) / 60);
  if (sec !== prevSec && sec > 0) playSpeedCountdownBeep(sec);

  ctx.fillStyle = "#0d0d0d";
  ctx.fillRect(0, 0, 600, 600);
  ctx.textAlign = "center";
  ctx.font = "bold 16px system-ui";
  ctx.fillStyle = "#888";
  ctx.fillText("SPEED CHALLENGE", 300, 200);
  ctx.font = "14px system-ui";
  ctx.fillStyle = "#666";
  ctx.fillText("Hear the interval — pick the name", 300, 225);
  ctx.font = "bold 120px system-ui";
  var alpha = 0.5 + 0.5 * Math.abs(Math.sin(speedCountdown * 0.1));
  ctx.fillStyle = "rgba(68,170,153," + alpha + ")";
  ctx.fillText("" + sec, 300, 360);
  ctx.font = "14px system-ui";
  ctx.fillStyle = "#555";
  ctx.fillText("←↑→↓ = answer   Enter = replay", 300, 430);
}

// --- Speed Challenge: Active gameplay ---
function drawSpeed() {
  // Update timer
  var now = performance.now();
  if (speedLastTime > 0) {
    speedTimer -= (now - speedLastTime);
  }
  speedLastTime = now;

  // Timer tick at <10s
  if (speedTimer <= 10000 && speedTimer > 0) {
    var tickPhase = Math.floor(speedTimer / 500);
    var prevPhase = Math.floor((speedTimer + (now - speedLastTime + 16)) / 500);
    if (tickPhase !== prevPhase) playSpeedTick();
  }

  if (speedTimer <= 0) {
    speedTimer = 0;
    stopSpeedInterval();
    // Compute grade and save
    speedGrade = speedGetGrade(speedScore);
    if (speedScore > speedBestScore) {
      speedBestScore = speedScore;
      saveSpeedBest();
    }
    // Add to persistent stats
    persistentHits += speedCorrect;
    persistentSessions++;
    prevRank = currentRank;
    currentRank = getRankIdx(persistentHits);
    if (currentRank > prevRank) rankUpFlash = 120;
    saveStats();
    gameState = STATE_SPEED_RESULT;
    return;
  }

  // Decay flashes
  if (speedPenaltyFlash > 0) speedPenaltyFlash--;
  if (speedComboFlash > 0) speedComboFlash--;

  // --- Draw ---
  // Penalty flash background
  if (speedPenaltyFlash > 0) {
    var pAlpha = speedPenaltyFlash / 30 * 0.08;
    ctx.fillStyle = "rgba(200,40,40," + pAlpha + ")";
  } else {
    ctx.fillStyle = "#0d0d0d";
  }
  ctx.fillRect(0, 0, 600, 600);

  // Header
  ctx.textAlign = "left";
  ctx.font = "bold 14px system-ui";
  ctx.fillStyle = "#4a9";
  ctx.fillText("⚡ SPEED CHALLENGE", 20, 28);

  // Timer bar
  var timerPct = speedTimer / SPEED_DURATION;
  var barW = 560;
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(20, 42, barW, 12);
  var timerColor = timerPct > 0.3 ? "#4a9" : (timerPct > 0.15 ? "#da4" : "#e44");
  ctx.fillStyle = timerColor;
  ctx.fillRect(20, 42, barW * timerPct, 12);
  // Timer text
  ctx.textAlign = "right";
  ctx.font = "bold 14px system-ui";
  ctx.fillStyle = timerColor;
  var secLeft = Math.ceil(speedTimer / 1000);
  ctx.fillText(secLeft + "s", 580, 28);

  // Score and combo
  ctx.textAlign = "center";
  ctx.font = "bold 18px system-ui";
  ctx.fillStyle = "#e0e0e0";
  ctx.fillText("Score: " + Math.floor(speedScore), 300, 82);
  if (speedCombo > 1) {
    var comboAlpha = speedComboFlash > 0 ? 1 : 0.7;
    ctx.font = "bold 14px system-ui";
    ctx.fillStyle = "rgba(255,215,0," + comboAlpha + ")";
    ctx.fillText("🔥 " + speedCombo + "× combo", 300, 102);
  }

  // Instruction
  ctx.font = "15px system-ui";
  ctx.fillStyle = "#777";
  ctx.fillText("What interval do you hear?", 300, 140);

  // Currently playing indicator
  if (speedCurrentInterval >= 0) {
    var playingLabel = speedAnswered ? "" : (speedPlaying ? "♪ ♪" : "");
    if (playingLabel) {
      ctx.font = "24px system-ui";
      ctx.fillStyle = "#4a9";
      ctx.fillText(playingLabel, 300, 175);
    }
  }

  // --- 4 option cards in cross layout ---
  // ← left, ↑ up, → right, ↓ down
  var cardW = 180, cardH = 60;
  var cx2 = 300, cy2 = 310;
  var positions = [
    {x: cx2 - 220, y: cy2 - cardH/2},  // ← left
    {x: cx2 - cardW/2, y: cy2 - 120},    // ↑ up
    {x: cx2 + 40, y: cy2 - cardH/2},     // → right
    {x: cx2 - cardW/2, y: cy2 + 60}      // ↓ down
  ];

  for (var oi = 0; oi < 4; oi++) {
    var opt = speedOptions[oi];
    if (!opt) continue;
    var pos = positions[oi];
    var isCorrectShown = speedAnswered && oi === speedCorrectDir;
    var isWrongShown = speedAnswered && oi !== speedCorrectDir;

    // Card background
    if (isCorrectShown) {
      ctx.fillStyle = "#1a3a28";
    } else if (isWrongShown && speedAnswered) {
      ctx.fillStyle = "#1a1a1a";
    } else {
      ctx.fillStyle = "#1a1a1a";
    }
    ctx.fillRect(pos.x, pos.y, cardW, cardH);
    if (isCorrectShown) {
      ctx.strokeStyle = "#4f4";
      ctx.lineWidth = 2;
      ctx.strokeRect(pos.x, pos.y, cardW, cardH);
    }

    // Direction label
    ctx.textAlign = "left";
    ctx.font = "bold 16px system-ui";
    ctx.fillStyle = isCorrectShown ? "#4f4" : (speedAnswered ? "#555" : "#4a9");
    ctx.fillText(SPEED_DIRS[oi], pos.x + 10, pos.y + 24);

    // Interval name
    ctx.textAlign = "left";
    ctx.font = "bold 18px system-ui";
    ctx.fillStyle = isCorrectShown ? "#4f4" : (speedAnswered ? "#666" : "#e0e0e0");
    ctx.fillText(opt.name, pos.x + 36, pos.y + 24);

    // Full label
    ctx.font = "12px system-ui";
    ctx.fillStyle = isCorrectShown ? "#8d8" : (speedAnswered ? "#444" : "#888");
    ctx.fillText(opt.label, pos.x + 10, pos.y + 46);
  }

  // Penalty text
  if (speedPenaltyFlash > 15) {
    ctx.textAlign = "center";
    ctx.font = "bold 16px system-ui";
    ctx.fillStyle = "rgba(230,60,60," + ((speedPenaltyFlash - 15) / 15) + ")";
    ctx.fillText("-2s", 300, 440);
  }

  // Stats bar
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(20, 470, 560, 50);
  ctx.textAlign = "center";
  ctx.font = "11px system-ui";
  ctx.fillStyle = "#666";
  ctx.fillText("CORRECT", 140, 486);
  ctx.fillText("ACCURACY", 300, 486);
  ctx.fillText("BEST COMBO", 460, 486);
  ctx.font = "bold 18px system-ui";
  ctx.fillStyle = "#ccc";
  ctx.fillText(speedCorrect + "/" + speedTotal, 140, 510);
  var acc2 = speedTotal > 0 ? Math.round((speedCorrect / speedTotal) * 100) : 0;
  ctx.fillStyle = acc2 >= 80 ? "#4f4" : (acc2 >= 50 ? "#da4" : "#e44");
  ctx.fillText(acc2 + "%", 300, 510);
  ctx.fillStyle = "#ffd700";
  ctx.fillText("" + speedBestCombo, 460, 510);

  // Footer
  ctx.font = "12px system-ui";
  ctx.fillStyle = "#555";
  ctx.textAlign = "center";
  ctx.fillText("←↑→↓ answer   Enter replay   Esc quit", 300, 556);
}

// --- Speed Challenge: Result screen ---
function drawSpeedResult() {
  ctx.fillStyle = "#0d0d0d";
  ctx.fillRect(0, 0, 600, 600);

  // Rank up flash
  if (rankUpFlash > 0) {
    rankUpFlash--;
    var ruAlpha2 = Math.min(1, rankUpFlash / 60) * 0.1;
    ctx.fillStyle = "rgba(255,215,0," + ruAlpha2 + ")";
    ctx.fillRect(0, 0, 600, 600);
  }

  ctx.textAlign = "center";
  ctx.font = "bold 16px system-ui";
  ctx.fillStyle = "#888";
  ctx.fillText("SPEED CHALLENGE COMPLETE", 300, 80);

  // Grade
  var gradeColors = {S:"#ffd700",A:"#4f4",B:"#4af",C:"#da4",D:"#a84",F:"#e44"};
  ctx.font = "bold 100px system-ui";
  ctx.fillStyle = gradeColors[speedGrade] || "#e0e0e0";
  ctx.fillText(speedGrade, 300, 210);

  // Score
  ctx.font = "bold 28px system-ui";
  ctx.fillStyle = "#e0e0e0";
  ctx.fillText("Score: " + Math.floor(speedScore), 300, 260);

  if (Math.floor(speedScore) >= speedBestScore && speedBestScore > 0) {
    ctx.font = "bold 14px system-ui";
    ctx.fillStyle = "#ffd700";
    ctx.fillText("★ NEW BEST!", 300, 284);
  }

  // Stats grid
  var statY = 310;
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(60, statY, 480, 100);

  ctx.font = "11px system-ui";
  ctx.fillStyle = "#666";
  ctx.fillText("CORRECT", 150, statY + 20);
  ctx.fillText("ACCURACY", 300, statY + 20);
  ctx.fillText("BEST COMBO", 450, statY + 20);
  ctx.font = "bold 22px system-ui";
  ctx.fillStyle = "#ccc";
  ctx.fillText(speedCorrect + "/" + speedTotal, 150, statY + 50);
  var acc3 = speedTotal > 0 ? Math.round((speedCorrect / speedTotal) * 100) : 0;
  ctx.fillStyle = acc3 >= 80 ? "#4f4" : (acc3 >= 50 ? "#da4" : "#e44");
  ctx.fillText(acc3 + "%", 300, statY + 50);
  ctx.fillStyle = "#ffd700";
  ctx.fillText("" + speedBestCombo, 450, statY + 50);

  ctx.font = "11px system-ui";
  ctx.fillStyle = "#666";
  ctx.fillText("BEST SCORE", 150, statY + 72);
  ctx.fillText("RANK", 450, statY + 72);
  ctx.font = "bold 16px system-ui";
  ctx.fillStyle = "#aaa";
  ctx.fillText("" + Math.floor(speedBestScore), 150, statY + 92);
  ctx.fillStyle = currentRank >= 7 ? "#ffd700" : currentRank >= 5 ? "#c0a0ff" : currentRank >= 3 ? "#4af" : "#8a8";
  ctx.fillText("⭐ " + RANKS[currentRank].name, 450, statY + 92);

  // Rank up notification
  if (currentRank > prevRank) {
    ctx.font = "bold 16px system-ui";
    ctx.fillStyle = "#ffd700";
    ctx.fillText("⭐ RANK UP: " + RANKS[currentRank].name + " ⭐", 300, statY + 130);
  }

  // Footer
  ctx.font = "14px system-ui";
  ctx.fillStyle = "#555";
  ctx.fillText("Enter: retry   Esc: menu", 300, 520);

  // Grade legend
  ctx.font = "11px system-ui";
  ctx.fillStyle = "#444";
  ctx.fillText("S:80+  A:60+  B:45+  C:30+  D:15+  F:<15", 300, 556);
}

draw();

})();
</script>
<script>
/* === MRBD D-pad Fix === */
(function() {
  document.addEventListener('keydown', function(e) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key)) {
      e.preventDefault();
    }
  }, true);
  var c = document.querySelector('canvas');
  if (c) {
    if (!c.getAttribute('tabindex')) c.setAttribute('tabindex', '0');
    c.style.outline = 'none';
    c.focus();
    c.addEventListener('click', function() { c.focus(); });
    c.addEventListener('touchstart', function() { c.focus(); });
  }
  document.querySelectorAll('a, button, input, select, textarea').forEach(function(el) {
    el.setAttribute('tabindex', '-1');
  });
})();
/* === End MRBD D-pad Fix === */
</script>
<script src="../../touch-controls.js"></script>
</body>
</html>
