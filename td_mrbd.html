<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0">
  <title>Tower Defense - Hypernova WebApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      width: 600px;
      height: 600px;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c" width="600" height="600"></canvas>
<script>
(function() {
  // ═══════════════════════════════════════════════════
  //  MRBD Tower Defense — D-pad only (5 buttons)
  //  ArrowUp/Down/Left/Right + Enter + Backspace/Esc
  // ═══════════════════════════════════════════════════

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 600, H = 600;

  // ── Grid ──
  var GRID = 40;
  var COLS = 15, ROWS = 15;

  // ── States ──
  var S_MENU = 0, S_PLAY = 1, S_PICK = 2, S_SELECT = 3, S_OVER = 4, S_PAUSE = 5, S_WAVE_READY = 6;
  var state = S_MENU;
  var curX = 7, curY = 7;
  var wave = 0, baseHp = 20, maxHp = 20, kills = 0, gold = 120;
  var enemies = [], cannons = [], bullets = [], particles = [];
  var spawnTimer = 0, spawnCount = 0, spawnTotal = 0, waveActive = false;
  var tick = 0, selCannon = null, pickSpec = 0, autoAdvanceTimer = 0;
  var msg = '', msgTimer = 0;
  var totalWaves = 0;

  // ── Path: S-curve ──
  var PATH = [
    {x:2,y:-1},{x:2,y:2},{x:12,y:2},{x:12,y:5},{x:2,y:5},
    {x:2,y:8},{x:12,y:8},{x:12,y:11},{x:7,y:11},{x:7,y:14},{x:7,y:16}
  ];
  var pathPx = [];
  for (var i = 0; i < PATH.length; i++) {
    pathPx.push({x: PATH[i].x * GRID + GRID/2, y: PATH[i].y * GRID + GRID/2});
  }

  // Mark path cells
  var pathCells = {};
  for (var i = 0; i < PATH.length - 1; i++) {
    var a = PATH[i], b = PATH[i+1];
    var steps = Math.max(Math.abs(b.x-a.x), Math.abs(b.y-a.y));
    for (var s = 0; s <= steps; s++) {
      var t = steps === 0 ? 0 : s/steps;
      var cx = Math.round(a.x + (b.x-a.x)*t);
      var cy = Math.round(a.y + (b.y-a.y)*t);
      if (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) pathCells[cx+','+cy] = true;
    }
  }

  // Path length
  var pathLen = 0;
  for (var i = 1; i < pathPx.length; i++) {
    var dx = pathPx[i].x - pathPx[i-1].x, dy = pathPx[i].y - pathPx[i-1].y;
    pathLen += Math.sqrt(dx*dx + dy*dy);
  }

  function pathPos(prog) {
    var tgt = prog * pathLen, traveled = 0;
    for (var i = 1; i < pathPx.length; i++) {
      var dx = pathPx[i].x - pathPx[i-1].x, dy = pathPx[i].y - pathPx[i-1].y;
      var seg = Math.sqrt(dx*dx + dy*dy);
      if (traveled + seg >= tgt) {
        var t = seg === 0 ? 0 : (tgt - traveled) / seg;
        return {x: pathPx[i-1].x + dx*t, y: pathPx[i-1].y + dy*t};
      }
      traveled += seg;
    }
    return pathPx[pathPx.length - 1];
  }

  // ── Enemies ──
  var ETYPES = [
    {type:'scout', w:1, hp:30, spd:1.8, col:'#ff4444', r:8, gold:8, shape:'circle'},
    {type:'grunt', w:1, hp:50, spd:1.2, col:'#ff9900', r:10, gold:10, shape:'circle'},
    {type:'tank',  w:5, hp:180,spd:0.6, col:'#bb66ff', r:14, gold:25, shape:'hex'},
    {type:'speed', w:8, hp:35, spd:3.0, col:'#44ff44', r:7,  gold:12, shape:'diamond'},
    {type:'boss',  w:10,hp:600,spd:0.4, col:'#ff0044', r:18, gold:100,shape:'oct'}
  ];

  // ── Cannons ──
  var SPECS = [
    {name:'Blaster', col:'#4a9eff', dmg:10, rate:3.0, rng:100, cost:50, ico:'●'},
    {name:'Sniper',  col:'#ff4466', dmg:35, rate:0.8, rng:180, cost:80, ico:'◆'},
    {name:'Rapid',   col:'#44ff88', dmg:5,  rate:8.0, rng:70,  cost:60, ico:'▲'}
  ];

  // ── Audio System ──
  var audioCtx = null, audioMuted = false;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(ex) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function sfxShoot(specIdx) {
    if (!audioCtx || audioMuted) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    // Different pitch per cannon type
    if (specIdx === 1) { // Sniper — long sweep
      o.type = 'sawtooth'; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(200, t+0.15);
      g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
      o.start(t); o.stop(t+0.15);
    } else if (specIdx === 2) { // Rapid — short burst
      o.type = 'square'; o.frequency.setValueAtTime(1200, t); o.frequency.exponentialRampToValueAtTime(800, t+0.04);
      g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.04);
      o.start(t); o.stop(t+0.05);
    } else { // Blaster — standard pew
      o.type = 'square'; o.frequency.setValueAtTime(600, t); o.frequency.exponentialRampToValueAtTime(300, t+0.08);
      g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.08);
      o.start(t); o.stop(t+0.1);
    }
  }
  function sfxHit() {
    if (!audioCtx || audioMuted) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(100, t+0.06);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.06);
    o.start(t); o.stop(t+0.07);
  }
  function sfxCrit() {
    if (!audioCtx || audioMuted) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.setValueAtTime(1800, t); o.frequency.exponentialRampToValueAtTime(2400, t+0.1);
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.12);
    o.start(t); o.stop(t+0.13);
  }
  function sfxDeath(isBoss) {
    if (!audioCtx || audioMuted) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if (isBoss) {
      o.type = 'sawtooth'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(30, t+0.4);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.4);
      o.start(t); o.stop(t+0.4);
      // Noise burst for bass
      var buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.3, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length, 2);
      var n = audioCtx.createBufferSource(); n.buffer = buf;
      var ng = audioCtx.createGain(); n.connect(ng); ng.connect(audioCtx.destination);
      ng.gain.setValueAtTime(0.15, t); ng.gain.exponentialRampToValueAtTime(0.001, t+0.3);
      n.start(t); n.stop(t+0.3);
    } else {
      o.type = 'sine'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(60, t+0.1);
      g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
      o.start(t); o.stop(t+0.12);
    }
  }
  function sfxWaveStart(isBoss) {
    if (!audioCtx || audioMuted) return;
    var t = audioCtx.currentTime;
    if (isBoss) {
      // Ominous low horn
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sawtooth'; o.frequency.setValueAtTime(80, t); o.frequency.linearRampToValueAtTime(60, t+0.5);
      g.gain.setValueAtTime(0.15, t); g.gain.linearRampToValueAtTime(0, t+0.6);
      o.start(t); o.stop(t+0.6);
    } else {
      // Ascending 3-note chime
      var notes = [523, 659, 784]; // C5, E5, G5
      for (var ni = 0; ni < 3; ni++) {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'triangle'; o.frequency.value = notes[ni];
        var nt = t + ni*0.08;
        g.gain.setValueAtTime(0.1, nt); g.gain.exponentialRampToValueAtTime(0.001, nt+0.15);
        o.start(nt); o.stop(nt+0.15);
      }
    }
  }
  function sfxWaveClear() {
    if (!audioCtx || audioMuted) return;
    var t = audioCtx.currentTime;
    var chord = [523, 659, 784]; // C major
    for (var ci = 0; ci < 3; ci++) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine'; o.frequency.value = chord[ci];
      g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.4);
      o.start(t); o.stop(t+0.4);
    }
  }
  function sfxPlace() {
    if (!audioCtx || audioMuted) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'triangle'; o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(800, t+0.08);
    g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
    o.start(t); o.stop(t+0.12);
  }
  function sfxSell() {
    if (!audioCtx || audioMuted) return;
    var t = audioCtx.currentTime;
    for (var si = 0; si < 3; si++) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine'; o.frequency.value = 1200 - si*200;
      var st = t + si*0.06;
      g.gain.setValueAtTime(0.08, st); g.gain.exponentialRampToValueAtTime(0.001, st+0.08);
      o.start(st); o.stop(st+0.09);
    }
  }
  function sfxDamage() {
    if (!audioCtx || audioMuted) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(60, t+0.15);
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
    o.start(t); o.stop(t+0.16);
  }
  function sfxGameOver() {
    if (!audioCtx || audioMuted) return;
    var t = audioCtx.currentTime;
    var notes = [392, 349, 330, 262]; // G4→F4→E4→C4 descending
    for (var gi = 0; gi < 4; gi++) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sawtooth'; o.frequency.value = notes[gi];
      var gt = t + gi*0.2;
      g.gain.setValueAtTime(0.1, gt); g.gain.exponentialRampToValueAtTime(0.001, gt+0.25);
      o.start(gt); o.stop(gt+0.25);
    }
  }
  function sfxLevelUp() {
    if (!audioCtx || audioMuted) return;
    var t = audioCtx.currentTime;
    var notes = [523, 659, 784, 1047]; // C5→E5→G5→C6
    for (var li = 0; li < 4; li++) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'triangle'; o.frequency.value = notes[li];
      var lt = t + li*0.08;
      g.gain.setValueAtTime(0.1, lt); g.gain.exponentialRampToValueAtTime(0.001, lt+0.2);
      o.start(lt); o.stop(lt+0.2);
    }
  }
  var shootSoundThrottle = 0;

  // ── Helpers ──
  function announce(t, dur) { msg = t; msgTimer = dur || 70; }
  function canPlace(gx, gy) {
    if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return false;
    if (pathCells[gx+','+gy]) return false;
    for (var i = 0; i < cannons.length; i++) {
      if (cannons[i].gx === gx && cannons[i].gy === gy) return false;
    }
    return true;
  }
  function cannonAt(gx, gy) {
    for (var i = 0; i < cannons.length; i++) {
      if (cannons[i].gx === gx && cannons[i].gy === gy) return cannons[i];
    }
    return null;
  }

  // ── Wave System ──
  function startWave() {
    wave++;
    waveActive = true;
    spawnTimer = 0; spawnCount = 0;
    spawnTotal = wave % 10 === 0 ? 1 : 5 + wave * 2;
    sfxWaveStart(wave % 10 === 0);
    announce(wave % 10 === 0 ? '💀 BOSS WAVE ' + wave : '⚔ WAVE ' + wave, 90);
    gold += 10 + wave * 2;
    state = S_PLAY;
  }

  function spawnEnemy() {
    var avail = [];
    for (var i = 0; i < ETYPES.length; i++) {
      if (ETYPES[i].w <= wave) avail.push(ETYPES[i]);
    }
    var def;
    if (wave % 10 === 0 && spawnCount === 0) {
      def = ETYPES[4]; // boss
    } else {
      def = avail[Math.floor(Math.random() * avail.length)];
    }
    var hpScale = def.type === 'boss' ? 1 + (wave-10)*0.5 : 1 + (wave-1)*0.15;
    if (hpScale < 1) hpScale = 1;
    enemies.push({
      type: def.type, hp: def.hp*hpScale, maxHp: def.hp*hpScale,
      spd: def.spd, col: def.col, r: def.r, gold: def.gold,
      shape: def.shape, prog: 0, dead: false, flash: 0
    });
    spawnCount++;
  }

  // ── Simulation ──
  function simTick() {
    tick++;
    shootSoundThrottle = Math.max(0, shootSoundThrottle - 1);
    // Spawn
    if (waveActive && spawnCount < spawnTotal) {
      spawnTimer--;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = wave % 10 === 0 ? 60 : 15 + Math.floor(Math.random()*10);
      }
    }
    // Move enemies
    for (var i = enemies.length-1; i >= 0; i--) {
      var e = enemies[i];
      if (e.dead) continue;
      e.prog += (e.spd * 0.4) / pathLen;
      e.flash = Math.max(0, e.flash - 1);
      if (e.prog >= 1) {
        baseHp = Math.max(0, baseHp - (e.type === 'boss' ? 5 : 1));
        sfxDamage();
        e.dead = true;
        if (baseHp <= 0) { sfxGameOver(); state = S_OVER; totalWaves = wave; }
      }
    }
    // Cannon fire
    for (var ci = 0; ci < cannons.length; ci++) {
      var c = cannons[ci];
      c.cd = Math.max(0, c.cd - 1);
      if (c.cd > 0) continue;
      var best = null, bd = Infinity;
      for (var ei = 0; ei < enemies.length; ei++) {
        var e = enemies[ei];
        if (e.dead) continue;
        var p = pathPos(e.prog);
        var dx = p.x-c.px, dy = p.y-c.py, d = Math.sqrt(dx*dx+dy*dy);
        if (d <= c.rng && d < bd) { best = e; bd = d; }
      }
      if (best) {
        var p = pathPos(best.prog);
        c.cd = Math.round(60/c.rate);
        c.angle = Math.atan2(p.y-c.py, p.x-c.px);
        var dmg = c.dmg * (1 + c.lvl*0.15);
        var crit = Math.random() < 0.1 + c.lvl*0.01;
        if (crit) dmg *= 2;
        bullets.push({x:c.px, y:c.py, tx:p.x, ty:p.y, dmg:dmg, spd:8, col:c.col, tgt:best, crit:crit, owner:c});
        if (shootSoundThrottle <= 0) { sfxShoot(c.specIdx || 0); shootSoundThrottle = 3; }
      }
    }
    // Move bullets
    for (var i = bullets.length-1; i >= 0; i--) {
      var b = bullets[i];
      var dx = b.tx-b.x, dy = b.ty-b.y, d = Math.sqrt(dx*dx+dy*dy);
      if (d < b.spd) {
        if (b.tgt && !b.tgt.dead) {
          b.tgt.hp -= b.dmg;
          b.tgt.flash = 6;
          if (b.crit) sfxCrit();
          if (b.tgt.hp <= 0) {
            b.tgt.dead = true;
            kills++;
            gold += b.tgt.gold;
            sfxDeath(b.tgt.type === 'boss');
            // XP to owner cannon
            if (b.owner) {
              b.owner.xp += b.tgt.gold;
              var need = 50 + b.owner.lvl*40;
              while (b.owner.xp >= need) {
                b.owner.xp -= need;
                b.owner.lvl++;
                need = 50 + b.owner.lvl*40;
                sfxLevelUp();
                announce('⬆ Lv'+b.owner.lvl+' '+b.owner.name, 50);
              }
            }
            // Death particles
            var ep = pathPos(b.tgt.prog);
            for (var dp = 0; dp < 6; dp++) {
              particles.push({x:ep.x, y:ep.y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4,
                life:20, max:20, col:b.tgt.col, sz:3});
            }
          }
          particles.push({x:b.tx, y:b.ty, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2,
            life:10, max:10, col:'#fff', sz:b.crit?5:2});
        }
        bullets.splice(i, 1);
      } else {
        b.x += (dx/d)*b.spd;
        b.y += (dy/d)*b.spd;
      }
    }
    // Particles
    for (var i = particles.length-1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
    // Remove dead
    for (var i = enemies.length-1; i >= 0; i--) {
      if (enemies[i].dead) enemies.splice(i, 1);
    }
    // Wave complete — auto-advance after 2s
    if (waveActive && spawnCount >= spawnTotal && enemies.length === 0) {
      waveActive = false;
      sfxWaveClear();
      announce('✓ WAVE '+wave+' CLEAR', 70);
      state = S_WAVE_READY;
      autoAdvanceTimer = 120; // 2 seconds at 60fps
    }
    // Auto-advance countdown
    if (state === S_WAVE_READY && autoAdvanceTimer > 0) {
      autoAdvanceTimer--;
      if (autoAdvanceTimer <= 0) {
        startWave();
      }
    }
    if (msgTimer > 0) msgTimer--;
  }

  // ── Drawing ──
  function drawShape(x, y, r, shape, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    if (shape === 'hex') {
      for (var s = 0; s < 6; s++) {
        var a = (s/6)*Math.PI*2;
        if (s === 0) ctx.moveTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
        else ctx.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
      }
      ctx.closePath();
    } else if (shape === 'diamond') {
      ctx.moveTo(x, y-r); ctx.lineTo(x+r, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r, y);
      ctx.closePath();
    } else if (shape === 'oct') {
      for (var s = 0; s < 8; s++) {
        var a = (s/8)*Math.PI*2 - Math.PI/8;
        if (s === 0) ctx.moveTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
        else ctx.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
      }
      ctx.closePath();
    } else {
      ctx.arc(x, y, r, 0, Math.PI*2);
    }
    ctx.fill();
  }

  function draw() {
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, W, H);

    if (state === S_MENU) return drawMenu();
    if (state === S_OVER) return drawGameOver();

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (var x = 0; x <= W; x += GRID) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (var y = 0; y <= H; y += GRID) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Path glow
    ctx.strokeStyle = '#1a3355';
    ctx.lineWidth = GRID*0.8;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pathPx[0].x, pathPx[0].y);
    for (var i = 1; i < pathPx.length; i++) ctx.lineTo(pathPx[i].x, pathPx[i].y);
    ctx.stroke();

    // Path line
    ctx.strokeStyle = '#2a5588';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(pathPx[0].x, pathPx[0].y);
    for (var i = 1; i < pathPx.length; i++) ctx.lineTo(pathPx[i].x, pathPx[i].y);
    ctx.stroke();

    // Flow dots
    for (var d = 0; d < 8; d++) {
      var prog = ((d/8) + tick*0.001) % 1;
      var dp = pathPos(prog);
      ctx.fillStyle = 'rgba(74,158,255,0.3)';
      ctx.beginPath(); ctx.arc(dp.x, dp.y, 2, 0, Math.PI*2); ctx.fill();
    }

    // Base
    var bp = pathPx[pathPx.length - 2];
    ctx.fillStyle = baseHp > maxHp*0.3 ? '#224488' : '#882222';
    ctx.fillRect(bp.x-GRID, bp.y-GRID/2, GRID*2, GRID);
    ctx.fillStyle = '#e8e8e8'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('🏠 '+baseHp+'/'+maxHp, bp.x, bp.y+5);

    // Cannons
    for (var i = 0; i < cannons.length; i++) {
      var c = cannons[i];
      // Range ring on selected
      if (selCannon === c) {
        ctx.strokeStyle = 'rgba(74,158,255,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(c.px, c.py, c.rng, 0, Math.PI*2); ctx.stroke();
      }
      // Body
      ctx.fillStyle = c.col;
      ctx.beginPath(); ctx.arc(c.px, c.py, 14, 0, Math.PI*2); ctx.fill();
      // Barrel
      var a = c.angle || 0;
      ctx.strokeStyle = c.col; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(c.px, c.py);
      ctx.lineTo(c.px+Math.cos(a)*18, c.py+Math.sin(a)*18); ctx.stroke();
      // Level badge
      if (c.lvl > 0) {
        ctx.fillStyle = '#ffd700'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(c.lvl, c.px, c.py-18);
      }
      // Selection ring
      if (selCannon === c) {
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(c.px, c.py, 18, 0, Math.PI*2); ctx.stroke();
      }
    }

    // Enemies
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead) continue;
      var p = pathPos(e.prog);
      var col = e.flash > 0 ? '#ffffff' : e.col;
      drawShape(p.x, p.y, e.r, e.shape, col);
      if (e.type === 'boss') {
        ctx.shadowColor = e.col; ctx.shadowBlur = 10;
        drawShape(p.x, p.y, e.r, e.shape, col);
        ctx.shadowBlur = 0;
      }
      // HP bar
      var pct = e.hp / e.maxHp;
      if (pct < 1) {
        var bw = e.r*2.5;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(p.x-bw/2, p.y-e.r-8, bw, 4);
        ctx.fillStyle = pct > 0.5 ? '#44ff44' : pct > 0.25 ? '#ffaa00' : '#ff4444';
        ctx.fillRect(p.x-bw/2, p.y-e.r-8, bw*pct, 4);
      }
    }

    // Bullets
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.fillStyle = b.col;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.crit?4:2.5, 0, Math.PI*2); ctx.fill();
      if (b.crit) { ctx.shadowColor='#ffd700'; ctx.shadowBlur=6; ctx.fill(); ctx.shadowBlur=0; }
    }

    // Particles
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = p.life / p.max;
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x-p.sz/2, p.y-p.sz/2, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;

    // Cursor
    if (state === S_PLAY || state === S_WAVE_READY || state === S_PICK) {
      var cx = curX*GRID + GRID/2, cy = curY*GRID + GRID/2;
      var pulse = 0.5 + 0.5*Math.sin(tick*0.15);

      if (state === S_PICK) {
        // Placement preview — cursor locked, showing spec picker
        var spec = SPECS[pickSpec];
        var valid = canPlace(curX, curY);
        if (valid) {
          ctx.strokeStyle = 'rgba(74,255,136,'+(0.4+0.3*pulse)+')';
          ctx.fillStyle = 'rgba(74,255,136,0.08)';
          ctx.beginPath(); ctx.arc(cx, cy, spec.rng, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        } else {
          ctx.strokeStyle = 'rgba(255,68,68,'+(0.5+0.3*pulse)+')';
        }
        ctx.lineWidth = 2;
        ctx.strokeRect(curX*GRID+2, curY*GRID+2, GRID-4, GRID-4);

        // Spec picker panel
        drawSpecPicker(cx, cy);
      } else {
        // Normal crosshair
        ctx.strokeStyle = 'rgba(74,158,255,'+(0.4+0.4*pulse)+')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx-10, cy); ctx.lineTo(cx-4, cy);
        ctx.moveTo(cx+4, cy); ctx.lineTo(cx+10, cy);
        ctx.moveTo(cx, cy-10); ctx.lineTo(cx, cy-4);
        ctx.moveTo(cx, cy+4); ctx.lineTo(cx, cy+10);
        ctx.stroke();

        // Context hint near cursor
        var existing = cannonAt(curX, curY);
        if (existing) {
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(cx-40, cy+20, 80, 18);
          ctx.fillStyle = existing.col; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(existing.name+' Lv'+existing.lvl, cx, cy+33);
        } else if (canPlace(curX, curY)) {
          ctx.fillStyle = 'rgba(74,158,255,0.4)'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('⊕ Place', cx, cy+24);
        }
      }
    }

    // ── HUD ──
    // Top bar
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, 36);
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e8e8e8'; ctx.fillText('⚔ W'+wave, 10, 25);
    ctx.textAlign = 'center';
    ctx.fillStyle = baseHp <= 5 ? '#ff4444' : '#e8e8e8';
    ctx.fillText('❤ '+baseHp, W/2-60, 25);
    ctx.fillStyle = '#ffd700'; ctx.fillText('💰 '+gold, W/2+60, 25);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#aaa'; ctx.fillText('💀 '+kills, W-10, 25);

    // Bottom bar
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, H-30, W, 30);
    ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    if (state === S_WAVE_READY) {
      ctx.fillStyle = '#44ff88';
      var secs = Math.ceil(autoAdvanceTimer / 60);
      ctx.fillText('▶ Wave '+(wave+1)+' in '+secs+'s   ENTER: Now   ↑↓←→: Move', W/2, H-10);
    } else if (state === S_PLAY) {
      ctx.fillStyle = '#888';
      ctx.fillText('↑↓←→ Move   ENTER: Place/Select   ◀ Pause', W/2, H-10);
    } else if (state === S_PICK) {
      ctx.fillStyle = '#44ff88';
      ctx.fillText('↑↓ Spec   ENTER: Confirm   ◀ Cancel', W/2, H-10);
    } else if (state === S_SELECT) {
      ctx.fillStyle = '#ffd700';
      ctx.fillText('ENTER: Sell $'+Math.floor(selCannon ? selCannon.sell : 0)+'   ◀ Back', W/2, H-10);
    } else if (state === S_PAUSE) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e8e8e8'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('⏸ PAUSED', W/2, H/2-10);
      ctx.fillStyle = '#888'; ctx.font = '16px sans-serif';
      ctx.fillText('ENTER or ◀ to Resume', W/2, H/2+25);
    }

    // Announcement
    if (msgTimer > 0) {
      var alpha = Math.min(1, msgTimer/20);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(W/2-150, 46, 300, 36);
      ctx.strokeStyle = '#4a9eff'; ctx.lineWidth = 1;
      ctx.strokeRect(W/2-150, 46, 300, 36);
      ctx.fillStyle = '#e8e8e8'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(msg, W/2, 70);
      ctx.globalAlpha = 1;
    }

    // Selected cannon info panel
    if (state === S_SELECT && selCannon) {
      var sc = selCannon;
      ctx.fillStyle = 'rgba(0,0,0,0.9)';
      ctx.fillRect(W/2-130, H-105, 260, 72);
      ctx.strokeStyle = sc.col; ctx.lineWidth = 1;
      ctx.strokeRect(W/2-130, H-105, 260, 72);
      ctx.fillStyle = sc.col; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(sc.name + ' Lv'+sc.lvl, W/2, H-87);
      ctx.fillStyle = '#ccc'; ctx.font = '12px sans-serif';
      var eDmg = Math.round(sc.dmg*(1+sc.lvl*0.15));
      ctx.fillText('DMG:'+eDmg+'  RATE:'+sc.rate.toFixed(1)+'  RNG:'+sc.rng, W/2, H-71);
      var need = 50+sc.lvl*40;
      ctx.fillText('XP: '+sc.xp+'/'+need+'  |  Sell: $'+Math.floor(sc.sell), W/2, H-55);
      // XP bar
      ctx.fillStyle = '#333';
      ctx.fillRect(W/2-100, H-48, 200, 6);
      ctx.fillStyle = '#4a9eff';
      ctx.fillRect(W/2-100, H-48, 200*(sc.xp/need), 6);
    }

    // Danger vignette
    if (baseHp <= maxHp*0.3 && baseHp > 0) {
      var intensity = 0.15 + 0.1*Math.sin(tick*0.2);
      var grad = ctx.createRadialGradient(W/2,H/2,W*0.3, W/2,H/2,W*0.7);
      grad.addColorStop(0, 'rgba(255,0,0,0)');
      grad.addColorStop(1, 'rgba(255,0,0,'+intensity+')');
      ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
    }
  }

  function drawSpecPicker(cx, cy) {
    // Compact spec picker panel — shows all 3, highlights current
    var pw = 180, ph = 100;
    var px = Math.min(Math.max(cx - pw/2, 5), W - pw - 5);
    var py = cy + GRID/2 + 8;
    if (py + ph > H - 35) py = cy - GRID/2 - ph - 8;

    ctx.fillStyle = 'rgba(0,0,0,0.92)';
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = '#4a9eff'; ctx.lineWidth = 1;
    ctx.strokeRect(px, py, pw, ph);

    ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = '#888';
    ctx.fillText('SELECT CANNON ↑↓', px+8, py+14);

    for (var i = 0; i < SPECS.length; i++) {
      var s = SPECS[i];
      var ry = py + 20 + i*25;
      var selected = (i === pickSpec);
      if (selected) {
        ctx.fillStyle = 'rgba(74,158,255,0.15)';
        ctx.fillRect(px+3, ry-2, pw-6, 22);
        ctx.strokeStyle = '#4a9eff'; ctx.lineWidth = 1;
        ctx.strokeRect(px+3, ry-2, pw-6, 22);
      }
      // Dot
      ctx.fillStyle = s.col;
      ctx.beginPath(); ctx.arc(px+16, ry+9, 5, 0, Math.PI*2); ctx.fill();
      // Name + cost
      ctx.fillStyle = selected ? '#fff' : '#aaa'; ctx.font = selected ? 'bold 13px sans-serif' : '12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(s.name, px+28, ry+13);
      // Cost
      var affordable = gold >= s.cost;
      ctx.fillStyle = affordable ? '#ffd700' : '#ff4444';
      ctx.textAlign = 'right'; ctx.font = '12px sans-serif';
      ctx.fillText('$'+s.cost, px+pw-8, ry+13);
    }
  }

  function drawMenu() {
    ctx.fillStyle = '#4a9eff'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('⚔ TOWER DEFENSE', W/2, 160);
    ctx.fillStyle = '#666'; ctx.font = '14px sans-serif';
    ctx.fillText('Meta Rayban Display Edition', W/2, 190);

    ctx.fillStyle = '#e8e8e8'; ctx.font = '18px sans-serif';
    var lines = [
      '↑↓←→   Move cursor',
      'ENTER   Place / Select / Start wave',
      '◀ BACK  Cancel / Pause',
      '',
      'Move to empty cell → ENTER to place',
      'Move to cannon → ENTER to inspect',
      'Between waves → ENTER to start',
    ];
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], W/2, 250 + i*30);
    }

    var pulse = 0.5 + 0.5*Math.sin(tick*0.1);
    ctx.fillStyle = 'rgba(74,158,255,'+pulse+')';
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText('[ ENTER ] START', W/2, 520);
  }

  function drawGameOver() {
    ctx.fillStyle = '#ff4444'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('💀 GAME OVER', W/2, 180);

    ctx.fillStyle = '#e8e8e8'; ctx.font = '22px sans-serif';
    ctx.fillText('Wave: '+totalWaves, W/2, 250);
    ctx.fillText('Kills: '+kills, W/2, 285);
    ctx.fillText('Cannons: '+cannons.length, W/2, 320);

    var grade = totalWaves >= 50 ? 'S' : totalWaves >= 30 ? 'A' : totalWaves >= 20 ? 'B' : totalWaves >= 10 ? 'C' : 'D';
    var gc = grade==='S'?'#ffd700':grade==='A'?'#44ff88':grade==='B'?'#4a9eff':'#ff9900';
    ctx.fillStyle = gc; ctx.font = 'bold 60px sans-serif';
    ctx.fillText(grade, W/2, 410);

    var pulse = 0.5 + 0.5*Math.sin(tick*0.1);
    ctx.fillStyle = 'rgba(74,158,255,'+pulse+')';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('[ ENTER ] PLAY AGAIN', W/2, 500);
  }

  // ── Input (D-pad only: 5 buttons) ──
  document.addEventListener('keydown', function(e) {
    e.preventDefault();
    ensureAudio();

    // ── MENU ──
    if (state === S_MENU) {
      if (e.key === 'Enter') { state = S_PLAY; startWave(); }
      return;
    }

    // ── GAME OVER ──
    if (state === S_OVER) {
      if (e.key === 'Enter') {
        wave=0; baseHp=maxHp; kills=0; gold=120;
        enemies=[]; cannons=[]; bullets=[]; particles=[];
        waveActive=false; selCannon=null;
        state = S_PLAY; startWave();
      }
      return;
    }

    // ── PAUSED ──
    if (state === S_PAUSE) {
      if (e.key === 'Enter' || e.key === 'Escape' || e.key === 'Backspace') {
        state = S_PLAY;
      }
      return;
    }

    // ── SPEC PICKER (cursor locked, up/down cycles specs) ──
    if (state === S_PICK) {
      if (e.key === 'ArrowUp') {
        pickSpec = (pickSpec - 1 + SPECS.length) % SPECS.length;
        return;
      }
      if (e.key === 'ArrowDown') {
        pickSpec = (pickSpec + 1) % SPECS.length;
        return;
      }
      if (e.key === 'Enter') {
        var spec = SPECS[pickSpec];
        if (gold >= spec.cost && canPlace(curX, curY)) {
          gold -= spec.cost;
          cannons.push({
            gx:curX, gy:curY,
            px:curX*GRID+GRID/2, py:curY*GRID+GRID/2,
            name:spec.name, col:spec.col,
            dmg:spec.dmg, rate:spec.rate, rng:spec.rng,
            cd:0, angle:0, lvl:0, xp:0,
            sell:spec.cost*0.6, specIdx:pickSpec
          });
          sfxPlace();
          announce('🔧 '+spec.name+' placed!', 40);
          state = waveActive ? S_PLAY : S_WAVE_READY;
        } else if (gold < spec.cost) {
          announce('❌ Need $'+spec.cost, 40);
        }
        return;
      }
      if (e.key === 'Escape' || e.key === 'Backspace') {
        state = waveActive ? S_PLAY : S_WAVE_READY;
        return;
      }
      // Left/Right move cursor even in pick mode (exit pick first)
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        state = waveActive ? S_PLAY : S_WAVE_READY;
        // Fall through to cursor movement below
      } else {
        return;
      }
    }

    // ── SELECTED CANNON ──
    if (state === S_SELECT) {
      if (e.key === 'Enter') {
        // Sell cannon
        if (selCannon) {
          gold += Math.floor(selCannon.sell);
          var idx = cannons.indexOf(selCannon);
          if (idx !== -1) cannons.splice(idx, 1);
          sfxSell();
          announce('💰 Sold for $'+Math.floor(selCannon.sell), 40);
          selCannon = null;
          state = waveActive ? S_PLAY : S_WAVE_READY;
        }
        return;
      }
      if (e.key === 'Escape' || e.key === 'Backspace') {
        selCannon = null;
        state = waveActive ? S_PLAY : S_WAVE_READY;
        return;
      }
      // Arrow keys deselect and move
      if (e.key.indexOf('Arrow') === 0) {
        selCannon = null;
        state = waveActive ? S_PLAY : S_WAVE_READY;
        // Fall through to movement
      } else {
        return;
      }
    }

    // ── CURSOR MOVEMENT (S_PLAY and S_WAVE_READY) ──
    if (e.key === 'ArrowUp')    { curY = Math.max(0, curY-1); return; }
    if (e.key === 'ArrowDown')  { curY = Math.min(ROWS-1, curY+1); return; }
    if (e.key === 'ArrowLeft')  { curX = Math.max(0, curX-1); return; }
    if (e.key === 'ArrowRight') { curX = Math.min(COLS-1, curX+1); return; }

    // ── ENTER (context-sensitive) ──
    if (e.key === 'Enter') {
      // Between waves? Always start next wave first (highest priority)
      if (state === S_WAVE_READY) {
        startWave();
        return;
      }
      // On a cannon? Select it
      var existing = cannonAt(curX, curY);
      if (existing) {
        selCannon = existing;
        state = S_SELECT;
        return;
      }
      // On a valid empty cell? Open spec picker
      if (canPlace(curX, curY)) {
        pickSpec = 0;
        state = S_PICK;
        return;
      }
    }

    // ── PAUSE ──
    if (e.key === 'Escape' || e.key === 'Backspace') {
      state = S_PAUSE;
    }
  });

  // ── Voice ──
  function initVoice() {
    if (typeof MetaGlassSDK === 'undefined' || !MetaGlassSDK.isSupported) return;
    try {
      MetaGlassSDK.dictation.addEventListener('result', function(ev) {
        if (!ev.isFinal) return;
        var cmd = ev.transcript.toLowerCase().trim();
        if (cmd.indexOf('place') !== -1 && (state===S_PLAY||state===S_WAVE_READY) && canPlace(curX,curY)) {
          pickSpec = 0; state = S_PICK;
        } else if (cmd.indexOf('pause') !== -1 && (state===S_PLAY||state===S_WAVE_READY)) {
          state = S_PAUSE;
        } else if ((cmd.indexOf('resume') !== -1 || cmd.indexOf('unpause') !== -1) && state===S_PAUSE) {
          state = S_PLAY;
        } else if ((cmd.indexOf('start') !== -1 || cmd.indexOf('go') !== -1 || cmd.indexOf('next') !== -1)) {
          if (state === S_WAVE_READY) startWave();
          else if (state === S_MENU) { state = S_PLAY; startWave(); }
        } else if (cmd.indexOf('cancel') !== -1 || cmd.indexOf('back') !== -1) {
          if (state === S_PICK) { state = waveActive ? S_PLAY : S_WAVE_READY; }
          else if (state === S_SELECT) { selCannon = null; state = waveActive ? S_PLAY : S_WAVE_READY; }
        } else if (cmd.indexOf('sell') !== -1 && state === S_SELECT && selCannon) {
          gold += Math.floor(selCannon.sell);
          var idx = cannons.indexOf(selCannon);
          if (idx !== -1) cannons.splice(idx, 1);
          announce('💰 Sold!', 40);
          selCannon = null; state = waveActive ? S_PLAY : S_WAVE_READY;
        } else if (cmd.indexOf('blaster') !== -1 && state === S_PICK) { pickSpec = 0; }
        else if (cmd.indexOf('sniper') !== -1 && state === S_PICK) { pickSpec = 1; }
        else if (cmd.indexOf('rapid') !== -1 && state === S_PICK) { pickSpec = 2; }
      });
      MetaGlassSDK.dictation.start({silenceTimeout:3000, maxDuration:120000, punctuation:'none'});
    } catch(ex) {}
  }

  // ── Game Loop ──
  function loop(ts) {
    if (state === S_PLAY || state === S_PICK || state === S_SELECT || state === S_WAVE_READY) {
      simTick();
    }
    if (state === S_MENU || state === S_OVER) tick++;
    draw();
    requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() { initVoice(); requestAnimationFrame(loop); }, 100);
    });
  } else {
    setTimeout(function() { initVoice(); requestAnimationFrame(loop); }, 100);
  }
})();
</script>
