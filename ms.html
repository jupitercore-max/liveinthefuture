<!DOCTYPE html>
<html>
  <head>
    <title>Stopwatch</title>
  </head>
  <body>
    <div style="font-size: 100px" id="stopwatch"></div>
    <script>
      // Get the element where the stopwatch will be displayed
      var stopwatch = document.getElementById("stopwatch");

      // Set the initial time to 0
      var time = 0;

      // Update the stopwatch every millisecond
      setInterval(function() {
        // Increment the time by one millisecond
        time++;
        
        // Display the updated time in the stopwatch element
        stopwatch.innerHTML = time + " ms";
      }, 1);
    </script>
  </body>
</html>
