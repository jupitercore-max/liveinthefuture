  <style>
    :root {
      --accent: #1E90FF;
      --accent-hover: #0066CC;
      --bg: #fafafa;
      --text: #1a1a1a;
      --text-muted: #666;
      --border: #ddd;
      --card-bg: #fff;
      --radius: 6px;
      --font-mono: 'SF Mono', 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-mono);
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s;
    }

    a:hover {
      color: var(--accent-hover);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0 0 10px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 5px 0;
    }

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .tool-link {
      display: block;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .tool-link:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(30, 144, 255, 0.1);
    }

    .tool-link .name {
      font-weight: 600;
      color: var(--accent);
    }

    .tool-link .desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Utility Cards */
    .utility-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .utility-card h3 {
      margin: 0 0 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .utility-card textarea,
    .utility-card input[type="text"],
    .utility-card input[type="number"] {
      width: 100%;
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      resize: vertical;
    }

    .utility-card textarea:focus,
    .utility-card input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .btn {
      padding: 8px 14px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .btn:hover {
      border-color: var(--accent);
      background: rgba(30, 144, 255, 0.05);
    }

    .btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .result {
      margin-top: 10px;
      padding: 10px;
      background: var(--bg);
      border-radius: var(--radius);
      font-size: 0.85rem;
      min-height: 20px;
      word-break: break-all;
    }

    .result.error {
      color: #c00;
      background: #fff0f0;
    }

    .result.success {
      color: #080;
      background: #f0fff0;
    }

    .inline-result {
      display: inline-block;
      margin-left: 10px;
      color: var(--text-muted);
    }

    /* Color picker section */
    .color-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }

    .color-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-control label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input[type="color"] {
      width: 40px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
    }

    input[type="range"] {
      width: 150px;
      cursor: pointer;
    }

    #tempValue {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-width: 50px;
    }

    /* Stats row */
    .stats-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stat {
      display: flex;
      gap: 6px;
    }

    .stat-value {
      font-weight: 600;
      color: var(--text);
    }

    /* Responsive */
    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      .tools-grid {
        grid-template-columns: 1fr;
      }
      .color-controls {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>rayhe.net</h1>
    <p class="meta" id="ip"></p>
    <p class="meta" id="uag"></p>
  </header>

  <div class="container">
    <!-- Tools Section -->
    <section class="section">
      <div class="section-title">Tools</div>
      <div class="tools-grid">
        <a href="fov.html" class="tool-link">
          <div class="name">FOV Calculator</div>
          <div class="desc">Field of view & PPD metrics</div>
        </a>
        <a href="dylos.html" class="tool-link">
          <div class="name">Dylos PM2.5</div>
          <div class="desc">Air quality converter</div>
        </a>
        <a href="ms.html" class="tool-link">
          <div class="name">Stopwatch</div>
          <div class="desc">Millisecond precision timer</div>
        </a>
      </div>
    </section>

    <!-- Quick Utilities Section -->
    <section class="section">
      <div class="section-title">Quick Utilities</div>

      <!-- Text Transform -->
      <div class="utility-card">
        <h3>Text Transform</h3>
        <textarea id="textInput" rows="3" placeholder="Enter text to transform..."></textarea>
        <div class="btn-row">
          <button class="btn" onclick="transformText('upper')">UPPERCASE</button>
          <button class="btn" onclick="transformText('lower')">lowercase</button>
          <button class="btn" onclick="transformText('title')">Title Case</button>
          <button class="btn" onclick="transformText('reverse')">esreveR</button>
          <button class="btn" onclick="copyResult('textInput')">Copy</button>
        </div>
        <div class="stats-row" style="margin-top: 10px;">
          <div class="stat">chars: <span class="stat-value" id="charCount">0</span></div>
          <div class="stat">words: <span class="stat-value" id="wordCount">0</span></div>
          <div class="stat">lines: <span class="stat-value" id="lineCount">0</span></div>
        </div>
      </div>

      <!-- Base64 -->
      <div class="utility-card">
        <h3>Base64 Encode/Decode</h3>
        <textarea id="base64Input" rows="2" placeholder="Enter text or base64 string..."></textarea>
        <div class="btn-row">
          <button class="btn" onclick="base64Encode()">Encode</button>
          <button class="btn" onclick="base64Decode()">Decode</button>
          <button class="btn" onclick="copyResult('base64Result')">Copy</button>
        </div>
        <div class="result" id="base64Result"></div>
      </div>

      <!-- Unix Timestamp -->
      <div class="utility-card">
        <h3>Unix Timestamp</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
          <input type="number" id="timestampInput" placeholder="Unix timestamp (seconds)" style="flex: 1; min-width: 200px;">
          <button class="btn" onclick="insertNow()">Now</button>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="timestampToDate()">To Date</button>
          <button class="btn" onclick="dateToTimestamp()">Date to Timestamp</button>
        </div>
        <div class="result" id="timestampResult"></div>
      </div>

      <!-- JSON Formatter -->
      <div class="utility-card">
        <h3>JSON Format / Validate</h3>
        <textarea id="jsonInput" rows="4" placeholder='{"key": "value"}'></textarea>
        <div class="btn-row">
          <button class="btn" onclick="formatJson(2)">Format (2 space)</button>
          <button class="btn" onclick="formatJson(4)">Format (4 space)</button>
          <button class="btn" onclick="minifyJson()">Minify</button>
          <button class="btn" onclick="copyResult('jsonInput')">Copy</button>
        </div>
        <div class="result" id="jsonResult"></div>
      </div>

      <!-- URL Encode/Decode -->
      <div class="utility-card">
        <h3>URL Encode/Decode</h3>
        <input type="text" id="urlInput" placeholder="Enter URL or encoded string...">
        <div class="btn-row">
          <button class="btn" onclick="urlEncode()">Encode</button>
          <button class="btn" onclick="urlDecode()">Decode</button>
          <button class="btn" onclick="copyResult('urlResult')">Copy</button>
        </div>
        <div class="result" id="urlResult"></div>
      </div>
    </section>

    <!-- Color Picker Section -->
    <section class="section">
      <div class="section-title">Background Color</div>
      <div class="color-controls">
        <div class="color-control">
          <label for="colorPicker">Custom:</label>
          <input type="color" id="colorPicker" value="#fafafa" onchange="changeBgColorCustom(this.value)">
        </div>
        <div class="color-control">
          <label for="tempSlider">Temperature:</label>
          <input type="range" id="tempSlider" min="2000" max="6500" value="5000" oninput="changeBgColorTemp(this.value)">
          <span id="tempValue">5000K</span>
        </div>
        <button class="btn" onclick="resetBg()">Reset</button>
      </div>
    </section>
  </div>

  <script>
    // Fetch IP and User Agent
    fetch('https://www.cloudflare.com/cdn-cgi/trace')
      .then(r => r.text())
      .then(data => {
        data.split('\n').forEach(line => {
          const [key, val] = line.split('=');
          if (key === 'ip') document.getElementById('ip').textContent = val;
          if (key === 'uag') document.getElementById('uag').textContent = val;
        });
      })
      .catch(() => {});

    // Text Transform
    const textInput = document.getElementById('textInput');
    textInput.addEventListener('input', updateStats);

    function updateStats() {
      const text = textInput.value;
      document.getElementById('charCount').textContent = text.length;
      document.getElementById('wordCount').textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('lineCount').textContent = text ? text.split('\n').length : 0;
    }

    function transformText(type) {
      const text = textInput.value;
      switch(type) {
        case 'upper': textInput.value = text.toUpperCase(); break;
        case 'lower': textInput.value = text.toLowerCase(); break;
        case 'title': textInput.value = text.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substr(1).toLowerCase()); break;
        case 'reverse': textInput.value = text.split('').reverse().join(''); break;
      }
      updateStats();
    }

    // Base64
    function base64Encode() {
      const input = document.getElementById('base64Input').value;
      const result = document.getElementById('base64Result');
      try {
        result.textContent = btoa(unescape(encodeURIComponent(input)));
        result.className = 'result';
      } catch(e) {
        result.textContent = 'Error: ' + e.message;
        result.className = 'result error';
      }
    }

    function base64Decode() {
      const input = document.getElementById('base64Input').value;
      const result = document.getElementById('base64Result');
      try {
        result.textContent = decodeURIComponent(escape(atob(input)));
        result.className = 'result';
      } catch(e) {
        result.textContent = 'Error: Invalid base64 string';
        result.className = 'result error';
      }
    }

    // Timestamp
    function insertNow() {
      document.getElementById('timestampInput').value = Math.floor(Date.now() / 1000);
    }

    function timestampToDate() {
      const ts = parseInt(document.getElementById('timestampInput').value);
      const result = document.getElementById('timestampResult');
      if (isNaN(ts)) {
        result.textContent = 'Enter a valid timestamp';
        result.className = 'result error';
        return;
      }
      const d = new Date(ts * 1000);
      result.textContent = d.toISOString() + ' (Local: ' + d.toLocaleString() + ')';
      result.className = 'result';
    }

    function dateToTimestamp() {
      const result = document.getElementById('timestampResult');
      const now = Math.floor(Date.now() / 1000);
      result.textContent = 'Current timestamp: ' + now;
      result.className = 'result';
      document.getElementById('timestampInput').value = now;
    }

    // JSON
    function formatJson(spaces) {
      const input = document.getElementById('jsonInput');
      const result = document.getElementById('jsonResult');
      try {
        const obj = JSON.parse(input.value);
        input.value = JSON.stringify(obj, null, spaces);
        result.textContent = 'Valid JSON';
        result.className = 'result success';
      } catch(e) {
        result.textContent = 'Invalid JSON: ' + e.message;
        result.className = 'result error';
      }
    }

    function minifyJson() {
      const input = document.getElementById('jsonInput');
      const result = document.getElementById('jsonResult');
      try {
        const obj = JSON.parse(input.value);
        input.value = JSON.stringify(obj);
        result.textContent = 'Minified';
        result.className = 'result success';
      } catch(e) {
        result.textContent = 'Invalid JSON: ' + e.message;
        result.className = 'result error';
      }
    }

    // URL Encode/Decode
    function urlEncode() {
      const input = document.getElementById('urlInput').value;
      document.getElementById('urlResult').textContent = encodeURIComponent(input);
    }

    function urlDecode() {
      const input = document.getElementById('urlInput').value;
      const result = document.getElementById('urlResult');
      try {
        result.textContent = decodeURIComponent(input);
        result.className = 'result';
      } catch(e) {
        result.textContent = 'Error: Invalid encoded string';
        result.className = 'result error';
      }
    }

    // Copy to clipboard
    function copyResult(elementId) {
      const el = document.getElementById(elementId);
      const text = el.value !== undefined ? el.value : el.textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('active');
        setTimeout(() => {
          btn.textContent = original;
          btn.classList.remove('active');
        }, 1000);
      });
    }

    // Background color controls
    function changeBgColorCustom(color) {
      document.body.style.backgroundColor = color;
    }

    function lerp(v0, v1, t) {
      return v0 + t * (v1 - v0);
    }

    function getRGBForTemperature(temp) {
      let startTemp, endTemp, t, startRGB, endRGB;
      if (temp <= 3500) {
        startTemp = 2000; endTemp = 3500;
        startRGB = [255, 56, 0]; endRGB = [255, 214, 170];
      } else if (temp <= 5000) {
        startTemp = 3500; endTemp = 5000;
        startRGB = [255, 214, 170]; endRGB = [255, 255, 244];
      } else {
        startTemp = 5000; endTemp = 6500;
        startRGB = [255, 255, 244]; endRGB = [202, 222, 255];
      }
      t = (temp - startTemp) / (endTemp - startTemp);
      const r = Math.round(lerp(startRGB[0], endRGB[0], t));
      const g = Math.round(lerp(startRGB[1], endRGB[1], t));
      const b = Math.round(lerp(startRGB[2], endRGB[2], t));
      return `rgb(${r},${g},${b})`;
    }

    function changeBgColorTemp(temp) {
      const color = getRGBForTemperature(temp);
      document.body.style.backgroundColor = color;
      document.getElementById('tempValue').textContent = temp + 'K';
    }

    function resetBg() {
      document.body.style.backgroundColor = '';
      document.getElementById('colorPicker').value = '#fafafa';
      document.getElementById('tempSlider').value = 5000;
      document.getElementById('tempValue').textContent = '5000K';
    }
  </script>
</body>
</html>
