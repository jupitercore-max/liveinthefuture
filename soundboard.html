<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Leader Soundboard 🔥</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --card-bg: #13131a;
    --border: #1e1e2e;
    --text: #e0e0e0;
    --text-dim: #666;
    --leader-color: #0084FF;
    --leader-glow: rgba(0,132,255,0.3);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background particles */
  .bg-particles {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-particles::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: var(--leader-glow);
    opacity: 0.15;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    transition: background 0.5s ease, opacity 0.5s ease;
  }
  .bg-particles::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: var(--leader-glow);
    opacity: 0.08;
    bottom: -100px; right: -100px;
    transition: background 0.5s ease, opacity 0.5s ease;
  }
  /* Desktop only: enable blur on background particles */
  @media (min-width: 601px) {
    .bg-particles::before { filter: blur(150px); }
    .bg-particles::after { filter: blur(120px); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 50px 20px 30px;
  }
  .header h1 {
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #fff 0%, #888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .header .subtitle {
    color: #555;
    font-size: 1rem;
    font-weight: 500;
  }

  /* Leader Tabs */
  .leader-tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 20px 0;
    margin-bottom: 10px;
  }
  .leader-tab {
    padding: 14px 28px;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: var(--card-bg);
    color: #888;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
  }
  .leader-tab:hover {
    border-color: #444;
    color: #ccc;
    transform: translateY(-2px);
  }
  .leader-tab.active {
    border-color: var(--leader-color);
    color: #fff;
    background: linear-gradient(145deg, var(--card-bg), rgba(255,255,255,0.03));
    box-shadow: 0 4px 30px var(--leader-glow), inset 0 1px 0 rgba(255,255,255,0.05);
    transform: translateY(-2px);
  }
  .leader-tab .tab-emoji {
    font-size: 1.4rem;
  }
  .leader-tab .tab-count {
    font-size: 0.7rem;
    background: rgba(255,255,255,0.08);
    padding: 2px 8px;
    border-radius: 20px;
    color: #888;
    font-weight: 600;
  }
  .leader-tab.active .tab-count {
    background: var(--leader-color);
    color: #fff;
  }

  /* Controls Bar */
  .controls-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    margin-bottom: 10px;
  }
  .leader-title {
    font-size: 1.6rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .leader-title .emoji { font-size: 2rem; }
  .leader-title .name { transition: color 0.3s; }
  .leader-title .name span {
    color: var(--leader-color);
    transition: color 0.3s;
  }

  .btn-random {
    padding: 12px 24px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(135deg, var(--leader-color), color-mix(in srgb, var(--leader-color) 70%, #000));
    color: #fff;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px var(--leader-glow);
  }
  .btn-random:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 6px 30px var(--leader-glow);
  }
  .btn-random:active {
    transform: scale(0.97);
  }
  .btn-random .dice { font-size: 1.2rem; }

  /* Sound Grid */
  .sound-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    padding-bottom: 60px;
  }

  .sound-btn {
    background: linear-gradient(145deg, #16161f, #111118);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease;
    text-align: left;
    position: relative;
    overflow: hidden;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .sound-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--leader-color);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .sound-btn:hover {
    border-color: var(--leader-color);
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 20px var(--leader-glow);
  }
  .sound-btn:hover::before {
    opacity: 1;
  }
  .sound-btn:active {
    transform: scale(0.96);
  }
  .sound-btn.playing {
    border-color: var(--leader-color);
    box-shadow: 0 0 30px var(--leader-glow), 0 0 60px var(--leader-glow);
    transform: scale(1.02);
  }
  .sound-btn.playing::before {
    opacity: 1;
  }
  .sound-btn.playing .quote-text {
    color: #fff;
  }

  .quote-text {
    font-size: 0.85rem;
    line-height: 1.5;
    color: #a0a0a8;
    flex: 1;
    transition: color 0.2s;
  }

  .btn-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }
  .btn-number {
    font-size: 0.7rem;
    color: #333;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }
  .play-indicator {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.2s;
  }
  .sound-btn:hover .play-indicator {
    opacity: 0.6;
  }
  .sound-btn.playing .play-indicator {
    opacity: 1;
    background: var(--leader-color);
    animation: pulse-ring 1.2s ease-out infinite;
  }
  .play-indicator .tri {
    width: 0; height: 0;
    border-left: 8px solid #fff;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    margin-left: 2px;
  }

  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 var(--leader-glow); }
    70% { box-shadow: 0 0 0 12px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }

  /* Waveform animation when playing */
  .waveform {
    display: flex;
    gap: 2px;
    align-items: center;
    height: 20px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .sound-btn.playing .waveform {
    opacity: 1;
  }
  .waveform .bar {
    width: 3px;
    background: var(--leader-color);
    border-radius: 3px;
    animation: wave 0.8s ease-in-out infinite;
  }
  .waveform .bar:nth-child(1) { height: 40%; animation-delay: 0s; }
  .waveform .bar:nth-child(2) { height: 70%; animation-delay: 0.1s; }
  .waveform .bar:nth-child(3) { height: 100%; animation-delay: 0.2s; }
  .waveform .bar:nth-child(4) { height: 60%; animation-delay: 0.3s; }
  .waveform .bar:nth-child(5) { height: 80%; animation-delay: 0.15s; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 30px 20px 50px;
    color: #2a2a2a;
    font-size: 0.75rem;
  }
  .footer a {
    color: #444;
    text-decoration: none;
  }
  .footer a:hover {
    color: var(--leader-color);
  }

  /* Now Playing Bar */
  .now-playing {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: linear-gradient(180deg, rgba(10,10,15,0) 0%, rgba(10,10,15,0.95) 20%, #0a0a0f 100%);
    padding: 20px 30px 25px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 15px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .now-playing.visible {
    transform: translateY(0);
  }
  .now-playing .np-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--leader-color);
    animation: pulse-ring 1.2s ease-out infinite;
    flex-shrink: 0;
  }
  .now-playing .np-text {
    font-size: 0.85rem;
    color: #888;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .now-playing .np-text strong {
    color: #fff;
  }
  .now-playing .np-close {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #666;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .now-playing .np-close:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }

  /* Mobile */
  @media (max-width: 600px) {
    .header h1 { font-size: 2rem; }
    .leader-tabs { gap: 6px; }
    .leader-tab { padding: 10px 16px; font-size: 0.8rem; }
    .sound-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .sound-btn { padding: 14px; min-height: 85px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .sound-btn:hover, .sound-btn:hover::before { transform: none; box-shadow: none; }
    .sound-btn.playing { transform: none; }
    .quote-text { font-size: 0.78rem; }
    .controls-bar { flex-direction: column; gap: 12px; align-items: flex-start; }
    .leader-title { font-size: 1.3rem; }
    .btn-random, .btn-stop { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .btn-random:hover { transform: none; box-shadow: none; }
    /* Disable infinite pulse animation on mobile */
    .sound-btn.playing .play-indicator { animation: none; }
  }

  /* Stop All button */
  .btn-stop {
    padding: 10px 20px;
    border-radius: 50px;
    border: 1px solid #333;
    background: rgba(255,255,255,0.03);
    color: #666;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-stop:hover {
    border-color: #ff4444;
    color: #ff4444;
    background: rgba(255,68,68,0.05);
  }

  .controls-right {
    display: flex;
    gap: 10px;
    align-items: center;
  }
</style>
</head>
<body>

<div class="bg-particles"></div>

<div class="container">
  <div class="header">
    <h1>Tech Leader Soundboard</h1>
    <p class="subtitle">Because every reorg needs a soundtrack 🎵</p>

  <div class="controls-bar">

  <div class="sound-grid" id="soundGrid"></div>
</div>

<div class="now-playing" id="nowPlaying">
  <div class="np-dot"></div>
  <div class="np-text" id="npText"></div>
  <button class="np-close" onclick="stopAll()">✕</button>
</div>

<div class="footer">
  <p><a href="https://liveinthefuture.org">liveinthefuture.org</a> — every reorg exists to justify executive comp 💀</p>
</div>

      "Life's too short to hang out with people who aren't resourceful.",
      "We've had three big ideas at Amazon that we've stuck with for 18 years: put the customer first, invent, and be patient.",
      "If you decide you're going to do only the things you know are going to work, you're going to leave a lot of opportunity on the table.",
      "Complaining is not a strategy.",
      "You can have the best technology, you can have the best business model, but if you don't have the right culture, you're dead.",
      "I think frugality drives innovation, just like other constraints do.",
      "The great thing about fact-based decisions is that they overrule the hierarchy.",
      "If you never want to be criticized, for goodness' sake don't do anything new.",
      "When you are in the thick of things it's hard to see what the right answer is. But we have a North Star which is customer focus."
    ]
  }
};

let currentLeader = 'mark';
let currentAudio = null;
let currentPlayingBtn = null;

function getAudioUrl(leaderId, index) {
  const num = String(index).padStart(2, '0');
  return `soundboard-audio/${leaderId}-${num}.mp3`;
}

function setTheme(leaderId) {
  const leader = LEADERS[leaderId];
  document.documentElement.style.setProperty('--leader-color', leader.color);
  document.documentElement.style.setProperty('--leader-glow', leader.glow);
}

function renderTabs() {
  const container = document.getElementById('leaderTabs');
  container.innerHTML = '';
  Object.entries(LEADERS).forEach(([id, leader]) => {
    const tab = document.createElement('button');
    tab.className = `leader-tab ${id === currentLeader ? 'active' : ''}`;
    tab.innerHTML = `
      <span class="tab-emoji">${leader.emoji}</span>
      ${leader.name.split(' ')[0]}
      <span class="tab-count">${leader.quotes.length}</span>
    `;
    tab.onclick = () => switchLeader(id);
    container.appendChild(tab);
  });
}

function renderGrid() {
  const leader = LEADERS[currentLeader];
  const container = document.getElementById('soundGrid');
  container.innerHTML = '';

  leader.quotes.forEach((quote, i) => {
    const btn = document.createElement('button');
    btn.className = 'sound-btn';
    btn.dataset.index = i;
    btn.innerHTML = `
      <div class="quote-text">${quote}</div>
      <div class="btn-footer">
        <span class="btn-number">${String(i).padStart(2, '0')}</span>
        <div class="waveform">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="play-indicator"><div class="tri"></div></div>
      </div>
    `;
    btn.onclick = () => playSound(currentLeader, i, btn);
    // Preload clip on hover only (desktop) — skip touchstart preload on mobile
    // to avoid double-fetch freezes
    const preload = () => { getOrCreateAudio(currentLeader, i); };
    btn.addEventListener('mouseenter', preload, { once: true });
    container.appendChild(btn);
  });
}

function updateTitle() {
  const leader = LEADERS[currentLeader];
  document.getElementById('leaderTitle').innerHTML = `
    <span class="emoji">${leader.emoji}</span>
    <span class="name"><span>${leader.name}</span></span>
  `;
}

function switchLeader(leaderId) {
  stopAll();
  currentLeader = leaderId;
  setTheme(leaderId);
  renderTabs();
  renderGrid();
  updateTitle();
}

// Mobile audio unlock: iOS/Safari require first play() in a user gesture.
// We create a shared AudioContext and unlock it on first interaction.
let audioCtx = null;
function unlockAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  // Create and play a silent buffer to unlock the audio pipeline
  const buf = audioCtx.createBuffer(1, 1, 22050);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start(0);
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });

const audioCache = {};
function getOrCreateAudio(leaderId, index) {
  const key = `${leaderId}-${index}`;
  if (!audioCache[key]) {
    audioCache[key] = new Audio(getAudioUrl(leaderId, index));
    audioCache[key].preload = 'auto';
  }
  return audioCache[key];
}

function playSound(leaderId, index, btn) {
  stopAll();
  unlockAudio();

  // Reuse cached audio if available, otherwise create fresh
  const key = `${leaderId}-${index}`;
  let audio = audioCache[key];
  if (!audio) {
    audio = new Audio(getAudioUrl(leaderId, index));
    audio.preload = 'auto';
    audioCache[key] = audio;
  }
  
  audio.currentTime = 0;
  currentAudio = audio;
  currentPlayingBtn = btn;

  btn.classList.add('playing');
  document.getElementById('stopBtn').style.display = 'block';

  // Show now playing bar
  const np = document.getElementById('nowPlaying');
  const quote = LEADERS[leaderId].quotes[index];
  document.getElementById('npText').innerHTML = `<strong>${LEADERS[leaderId].name}:</strong> ${quote}`;
  np.classList.add('visible');

  const playPromise = audio.play();
  if (playPromise !== undefined) {
    playPromise.catch((e) => {
      console.warn('Audio play failed:', e);
      btn.classList.remove('playing');
      np.classList.remove('visible');
      document.getElementById('stopBtn').style.display = 'none';
    });
  }

  audio.onended = () => {
    btn.classList.remove('playing');
    np.classList.remove('visible');
    document.getElementById('stopBtn').style.display = 'none';
    currentAudio = null;
    currentPlayingBtn = null;
  };

  audio.onerror = () => {
    btn.classList.remove('playing');
    np.classList.remove('visible');
    document.getElementById('stopBtn').style.display = 'none';
    currentAudio = null;
    currentPlayingBtn = null;
    // Clear bad cache entry so next tap retries
    delete audioCache[key];
  };
}

function stopAll() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  if (currentPlayingBtn) {
    currentPlayingBtn.classList.remove('playing');
    currentPlayingBtn = null;
  }
  document.getElementById('nowPlaying').classList.remove('visible');
  document.getElementById('stopBtn').style.display = 'none';
}

function playRandom() {
  const leader = LEADERS[currentLeader];
  const index = Math.floor(Math.random() * leader.quotes.length);
  const btn = document.querySelector(`.sound-btn[data-index="${index}"]`);
  if (btn) {
    playSound(currentLeader, index, btn);
    btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') stopAll();
  if (e.key === 'r' && !e.ctrlKey && !e.metaKey) {
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
    playRandom();
  }
  // Number keys 1-5 to switch leaders
  const leaderKeys = Object.keys(LEADERS);
  const num = parseInt(e.key);
  if (num >= 1 && num <= leaderKeys.length && !e.ctrlKey && !e.metaKey) {
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
    switchLeader(leaderKeys[num - 1]);
  }
});

// Init
switchLeader('mark');
</script>

</body>
