      // Escape cancels targeting
      if (e.key === 'Escape' && abilityTargeting) {
        cancelTargeting();
      }
    });

    function cancelTargeting() {
      abilityTargeting = false;
      canvas.classList.remove('canvas-targeting');
      updateAbilityBtn();
    }

    function fireAbility(targetX, targetY) {
      const c = cannons[playerId];
      if (!c || !c.x) return;
      const abKey = getPlayerAbilityKey();
      const ab = getPlayerAbility();

      // Start cooldown
      abilityCooldownLeft = ab.cooldown;
      abilityTargeting = false;
      canvas.classList.remove('canvas-targeting');
      updateAbilityBtn();

      const stats = getCannonStats(c.level || 1, c.path || null, c.spec || null);

      switch (abKey) {
        case 'basic': {
          // Power Shot — 5× damage to nearest enemy to target point
          const target = findNearestEnemy(targetX, targetY, 80);
          if (target) {
            target.hp -= stats.dmg * 5;
            spawnAbilityProjectile(c.x, c.y, target.x, target.y, '#1E90FF');
            abilityZones.push({ x: target.x, y: target.y, radius: 20, color: '30,144,255', life: 15, maxLife: 15, type: 'burst' });
            triggerScreenShake(false);
          }
          break;
        }
        case 'rapid': {
          // Rapid Burst — 10 instant shots at enemies in range
          let fired = 0;
          for (const e of enemies) {
            if (e.hp <= 0 || fired >= 10) continue;
            const dist = Math.hypot(e.x - c.x, e.y - c.y);
            if (dist <= stats.range * 1.2) {
              e.hp -= stats.dmg * 1.5;
              spawnAbilityProjectile(c.x, c.y, e.x, e.y, '#ff6b35');
              fired++;
            }
          }
          break;
        }
        case 'power': {
          // Bombardment — massive AoE at target
          abilityZones.push({ x: targetX, y: targetY, radius: 80, color: '231,76,60', life: 20, maxLife: 20, type: 'explosion' });
          for (const e of enemies) {
            if (e.hp <= 0) continue;
            const dist = Math.hypot(e.x - targetX, e.y - targetY);
            if (dist <= 80) {
              e.hp -= stats.dmg * 4;
            } else if (dist <= 120) {
              e.hp -= stats.dmg * 2;
            }
          }
          triggerScreenShake(true);
          break;
        }
        case 'tech': {
          // EMP — freeze all enemies for 3s
          for (const e of enemies) {
            if (e.hp <= 0) continue;
            e.slowTimer = Math.max(e.slowTimer, TICK_RATE * 3);
            e.hp -= stats.dmg * 0.5;
          }
          abilityZones.push({ x: CANVAS_W / 2, y: CANVAS_H / 2, radius: 400, color: '155,89,182', life: 20, maxLife: 20, type: 'pulse' });
          triggerScreenShake(false);
          break;
        }
        case 'gatling': {
          // Bullet Storm — 20 rapid shots
          let fired = 0;
          const shuffled = [...enemies].filter(e => e.hp > 0).sort(() => Math.random() - 0.5);
          for (const e of shuffled) {
            if (fired >= 20) break;
            const dist = Math.hypot(e.x - c.x, e.y - c.y);
            if (dist <= stats.range * 1.5) {
              e.hp -= stats.dmg * 1.2;
              setTimeout(() => spawnAbilityProjectile(c.x, c.y, e.x, e.y, '#ff8c42'), fired * 40);
              fired++;
            }
          }
          break;
        }
        case 'sniper': {
          // Headshot — instant kill non-boss, 20× dmg to boss
          const target = findNearestEnemy(targetX, targetY, 60);
          if (target) {
            if (target.type === 'boss') {
              target.hp -= stats.dmg * 20;
            } else {
              target.hp = 0; // instant kill
            }
            spawnAbilityProjectile(c.x, c.y, target.x, target.y, '#ff4500');
            abilityZones.push({ x: target.x, y: target.y, radius: 15, color: '255,69,0', life: 12, maxLife: 12, type: 'burst' });
            triggerScreenShake(false);
          }
          break;
        }
        case 'cannon': {
          // Napalm — AoE + burn zone
          abilityZones.push({ x: targetX, y: targetY, radius: 60, color: '255,107,53', life: 60, maxLife: 60, type: 'napalm' });
          for (const e of enemies) {
            if (e.hp <= 0) continue;
            const dist = Math.hypot(e.x - targetX, e.y - targetY);
            if (dist <= 60) {
              e.hp -= stats.dmg * 3;
            }
          }
          triggerScreenShake(true);
          break;
        }
        case 'railgun': {
          // Orbital Strike — line from cannon through target across map
          const dx = targetX - c.x;
          const dy = targetY - c.y;
          const len = Math.hypot(dx, dy) || 1;
          const nx = dx / len, ny = dy / len;
          // Extend line across entire canvas
          const farX = c.x + nx * 1000;
          const farY = c.y + ny * 1000;
          abilityZones.push({ x1: c.x, y1: c.y, x2: farX, y2: farY, color: '231,76,60', life: 15, maxLife: 15, type: 'beam' });
          for (const e of enemies) {
            if (e.hp <= 0) continue;
            // Distance from point to line
            const t = Math.max(0, ((e.x - c.x) * nx + (e.y - c.y) * ny));
            const closestX = c.x + nx * t;
            const closestY = c.y + ny * t;
            const dist = Math.hypot(e.x - closestX, e.y - closestY);
            if (dist <= 30) {
              e.hp -= stats.dmg * 6;
            }
          }
          triggerScreenShake(true);
          break;
        }
        case 'tesla': {
          // Chain Overload — hit all enemies with lightning
          for (const e of enemies) {
            if (e.hp <= 0) continue;
            e.hp -= stats.dmg * 2;
            spawnAbilityProjectile(c.x, c.y, e.x, e.y, '#8e44ad');
          }
          abilityZones.push({ x: c.x, y: c.y, radius: 300, color: '142,68,173', life: 15, maxLife: 15, type: 'pulse' });
          triggerScreenShake(false);
          break;
        }
        case 'frost': {
          // Blizzard — slow all enemies 80% for 5s
          for (const e of enemies) {
            if (e.hp <= 0) continue;
            e.slowTimer = Math.max(e.slowTimer, TICK_RATE * 5);
          }
          abilityZones.push({ x: CANVAS_W / 2, y: CANVAS_H / 2, radius: 400, color: '93,173,226', life: 25, maxLife: 25, type: 'blizzard' });
          break;
        }
      }

      // Check kills after ability fire
      checkAbilityKills();
    }

    function findNearestEnemy(x, y, maxDist) {
      let nearest = null, nearestDist = maxDist;
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        const dist = Math.hypot(e.x - x, e.y - y);
        if (dist < nearestDist) {
          nearest = e;
          nearestDist = dist;
        }
      }
      return nearest;
    }

    function spawnAbilityProjectile(x1, y1, x2, y2, color) {
      projectiles.push({ x1, y1, x2, y2, color, life: 8 });
    }

    function checkAbilityKills() {
      for (const e of enemies) {
        if (e.hp <= 0 && !e.dead) {
          e.dead = true;
          totalKills++;
          comboCount++;
          comboTimer = COMBO_WINDOW;
          const comboMult = comboCount >= COMBO_MIN ? Math.min(comboCount, 10) : 1;
          const earlyBonus = earlySendBonusPct > 0 ? Math.ceil(comboMult * earlySendBonusPct / 100) : 0;
          const xpAmount = comboMult + earlyBonus;
          if (offlineMode) {
            offlineAwardXP(xpAmount);
          } else {
            awardXP(Object.entries(cannons), xpAmount);
          }
          scorePopups.push({
            x: e.x + (Math.random() - 0.5) * 16,
            y: e.y,
            text: `+${xpAmount} XP`,
            color: comboCount >= 8 ? '#ff4444' : comboCount >= 5 ? '#ff8800' : comboCount >= COMBO_MIN ? '#ffd700' : '#ffffff',
            life: 40, maxLife: 40,
            size: comboCount >= 5 ? 16 : comboCount >= COMBO_MIN ? 13 : 11,
            vy: -1.5
          });
          for (let i = 0; i < 8; i++) {
            particles.push({
              x: e.x, y: e.y,
              vx: (Math.random() - 0.5) * 5,
              vy: (Math.random() - 0.5) * 5,
              color: e.color,
              life: 15 + Math.random() * 10
            });
          }
        }
      }
      enemies = enemies.filter(e => !e.dead);
      updateComboDisplay();
      hudKills.textContent = totalKills;
      hudEnemies.textContent = enemies.filter(e => e.hp > 0).length;
    }

    // ═══════════════════════════════════════════════════
    //  Player Panel
    // ═══════════════════════════════════════════════════
    playersBtn.addEventListener('click', () => {
      playerPanel.classList.toggle('active');
    });

    function updatePlayerPanel() {
      let html = '';
      for (const [cid, c] of Object.entries(cannons)) {
        if (!c.name) continue;
        const isOnline = onlinePlayers[cid]?.online;
        const statusClass = isOnline ? 'player-online' : 'player-offline';
        const avatarContent = c.avatar
          ? `<div class="p-avatar" style="background-image:url(${c.avatar});background-size:cover;"></div>`
          : `<div class="p-avatar" style="display:flex;align-items:center;justify-content:center;font-size:14px;">${c.emoji || '⚪'}</div>`;
        html += `<div class="player-row ${statusClass}">
          ${avatarContent}
          <span class="p-name">${escapeHtml(c.name)}${cid === playerId ? ' (you)' : ''}</span>
          <span class="p-level">Lv${c.level || 1}</span>
          <span class="p-kills">${c.kills || 0}k</span>
        </div>`;
      }
      playerList.innerHTML = html || '<div style="color:var(--text-muted);font-size:0.75rem;">No players yet</div>';
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // ═══════════════════════════════════════════════════
    //  Canvas Rendering (60fps)
    // ═══════════════════════════════════════════════════
    const avatarImages = {}; // cache loaded avatar images

    function renderLoop(now) {
      // Client-side visual projectile generation (all clients)
      const dt = now - lastVisualTick;
      lastVisualTick = now;

      // Non-leader: locally simulate enemy movement between snapshots
      if (!isLeader && waveState === 'active' && dt > 0 && dt < 200 && currentPath) {
        const dtSec = dt / 1000 * gameSpeed;
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          let speed = e.speed;
          if (e.slowTimer > 0) speed *= 0.5;
          const progressPerSec = speed * TICK_RATE / (currentPathLength || 1000);
          e.pathProgress = (e.pathProgress || 0) + progressPerSec * dtSec;
          const pos = getPathPosition(currentPath, e.pathProgress);
          e.x = pos.x;
          e.y = pos.y;
        }
      }

      if (waveState === 'active' && enemies.length > 0) {
        for (const [cid, c] of Object.entries(cannons)) {
          if (!c.x || !c.y) continue;
          const stats = getCannonStats(c.level || 1, c.path || null, c.spec || null);
          if (!(cid in visualFireTimers)) visualFireTimers[cid] = 0;
          visualFireTimers[cid] += dt * gameSpeed;
          const fireMs = 1000 / stats.fireRate;
          if (visualFireTimers[cid] >= fireMs) {
            visualFireTimers[cid] -= fireMs;
            // Find nearest enemy in range
            let nearest = null, nearestDist = Infinity;
            for (const e of enemies) {
              if (e.hp <= 0) continue;
              const dist = Math.hypot(e.x - c.x, e.y - c.y);
              if (dist <= stats.range && dist < nearestDist) {
                nearest = e; nearestDist = dist;
              }
            }
            if (nearest) {
              projectiles.push({
                x1: c.x, y1: c.y,
                x2: nearest.x, y2: nearest.y,
                color: getCannonColor(c.path, c.spec),
                life: 5
              });
            }
          }
        }
      }

      // Update HUD from current state (for non-leaders)
      hudEnemies.textContent = enemies.filter(e => e.hp > 0).length;

      // Non-leader countdown display
      if (!isLeader && waveState === 'countdown' && countdownStartedAt > 0) {
        const elapsed = Date.now() - countdownStartedAt;
        const remaining = Math.max(0, 3000 - elapsed);
        countdownTimer = Math.ceil(remaining / TICK_MS * (TICK_RATE / TICK_RATE));
      }

      drawFrame();
      requestAnimationFrame(renderLoop);
    }

    function drawFrame() {
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

      // Background grid
      drawGrid();

      // Base line
      ctx.strokeStyle = '#1E90FF';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(0, BASE_Y);
      ctx.lineTo(CANVAS_W, BASE_Y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Placement zone hint (subtle)
      ctx.fillStyle = 'rgba(30,144,255,0.03)';
      ctx.fillRect(0, PLACEMENT_MIN_Y, CANVAS_W, BASE_Y - PLACEMENT_MIN_Y);

      // Placement instruction hint for new players
      if (showPlacementHint && !cannons[playerId]) {
        ctx.fillStyle = 'rgba(30,144,255,0.08)';
        ctx.fillRect(0, PLACEMENT_MIN_Y, CANVAS_W, BASE_Y - PLACEMENT_MIN_Y);
        ctx.fillStyle = 'rgba(30,144,255,0.7)';
        ctx.font = '16px ' + getComputedStyle(document.body).fontFamily;
        ctx.textAlign = 'center';
        ctx.fillText('⬇ Click here to place your cannon ⬇', CANVAS_W / 2, PLACEMENT_MIN_Y + (BASE_Y - PLACEMENT_MIN_Y) / 2);
        ctx.font = '11px ' + getComputedStyle(document.body).fontFamily;
        ctx.fillStyle = 'rgba(30,144,255,0.5)';
        ctx.fillText('Defend the blue line from incoming enemies', CANVAS_W / 2, PLACEMENT_MIN_Y + (BASE_Y - PLACEMENT_MIN_Y) / 2 + 22);
        // Show banked XP from sell refund
        const bankedXP = parseInt(localStorage.getItem('td_sell_refund') || '0', 10);
        if (bankedXP > 0) {
          ctx.fillStyle = 'rgba(34,197,94,0.8)';
          ctx.font = '13px ' + getComputedStyle(document.body).fontFamily;
          ctx.fillText(`💰 ${bankedXP} XP banked — place to apply!`, CANVAS_W / 2, PLACEMENT_MIN_Y + (BASE_Y - PLACEMENT_MIN_Y) / 2 + 42);
        }
        ctx.textAlign = 'start';
      }

      // Draw enemy path
      if (currentPath && currentPath.length >= 2) {
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(currentPath[0].x, currentPath[0].y);
        for (let i = 1; i < currentPath.length; i++) {
          ctx.lineTo(currentPath[i].x, currentPath[i].y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Draw cannons
      for (const [cid, c] of Object.entries(cannons)) {
        if (!c.x || !c.y) continue;
        drawCannon(cid, c);
      }

      // Draw enemies
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        drawEnemy(e);
      }

      // Draw projectiles
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.globalAlpha = p.life / 5;
        ctx.beginPath();
        ctx.moveTo(p.x1, p.y1);
        ctx.lineTo(p.x2, p.y2);
        ctx.stroke();
        ctx.globalAlpha = 1;
        p.life--;
        if (p.life <= 0) projectiles.splice(i, 1);
      }

      // Draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        ctx.globalAlpha = p.life / 25;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        ctx.globalAlpha = 1;
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Draw ability zones
      for (let i = abilityZones.length - 1; i >= 0; i--) {
        const az = abilityZones[i];
        const alpha = az.life / az.maxLife;
        if (az.type === 'beam') {
          ctx.globalAlpha = alpha * 0.8;
          ctx.strokeStyle = `rgba(${az.color},${alpha})`;
          ctx.lineWidth = 12 * alpha;
          ctx.beginPath();
          ctx.moveTo(az.x1, az.y1);
          ctx.lineTo(az.x2, az.y2);
          ctx.stroke();
          // Bright core
          ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.6})`;
          ctx.lineWidth = 4 * alpha;
          ctx.beginPath();
          ctx.moveTo(az.x1, az.y1);
          ctx.lineTo(az.x2, az.y2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        } else if (az.type === 'napalm') {
          // Persistent burn zone
          const flicker = 0.5 + Math.random() * 0.3;
          ctx.globalAlpha = alpha * 0.4 * flicker;
          ctx.fillStyle = `rgba(${az.color},1)`;
          ctx.beginPath();
          ctx.arc(az.x, az.y, az.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          // Napalm damages enemies each frame while active (leader only)
          if (az.life % 4 === 0 && (isLeader || offlineMode)) {
            for (const e of enemies) {
              if (e.hp <= 0) continue;
              const dist = Math.hypot(e.x - az.x, e.y - az.y);
              if (dist <= az.radius) {
                e.hp -= 0.3;
              }
            }
          }
        } else if (az.type === 'blizzard') {
          ctx.globalAlpha = alpha * 0.15;
          ctx.fillStyle = `rgba(${az.color},1)`;
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
          // Snowflake particles
          ctx.globalAlpha = alpha * 0.5;
          ctx.fillStyle = '#fff';
          for (let s = 0; s < 8; s++) {
            const sx = Math.random() * CANVAS_W;
            const sy = Math.random() * CANVAS_H;
            ctx.fillRect(sx, sy, 2, 2);
          }
          ctx.globalAlpha = 1;
        } else {
          // burst / explosion / pulse
          const expand = az.type === 'pulse' ? 1 : (1 - alpha) * 0.3 + 0.7;
          const r = az.radius * expand;
          ctx.globalAlpha = alpha * 0.5;
          ctx.fillStyle = `rgba(${az.color},${alpha * 0.3})`;
          ctx.beginPath();
          ctx.arc(az.x, az.y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = `rgba(${az.color},${alpha * 0.8})`;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        az.life--;
        if (az.life <= 0) abilityZones.splice(i, 1);
      }

      // Draw ability targeting indicator
      if (abilityTargeting) {
        const rect = canvas.getBoundingClientRect();
        // We draw a pulsing crosshair hint at center
        ctx.fillStyle = 'rgba(30,144,255,0.4)';
        ctx.font = '14px ' + getComputedStyle(document.body).fontFamily;
        ctx.textAlign = 'center';
        ctx.fillText('🎯 Click to target ability', CANVAS_W / 2, 30);
        ctx.textAlign = 'start';
      }

      // Draw score popups
      for (let i = scorePopups.length - 1; i >= 0; i--) {
        const sp = scorePopups[i];
        const alpha = sp.life / sp.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = sp.color;
        ctx.font = 'bold ' + sp.size + 'px ' + getComputedStyle(document.body).fontFamily;
        ctx.textAlign = 'center';
        ctx.fillText(sp.text, sp.x, sp.y);
        ctx.textAlign = 'start';
        ctx.globalAlpha = 1;
        sp.y += sp.vy;
        sp.life--;
        if (sp.life <= 0) scorePopups.splice(i, 1);
      }

      // Draw base HP bar along the base line
      {
        const barW = 200;
        const barH = 8;
        const barX = CANVAS_W / 2 - barW / 2;
        const barY = BASE_Y + 8;
        const pct = Math.max(0, baseHp / BASE_MAX_HP);

        // Background
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);

        // Fill
        const hpColor = pct > 0.5 ? '#22c55e' : pct > 0.25 ? '#f39c12' : '#e74c3c';
        ctx.fillStyle = hpColor;
        ctx.fillRect(barX, barY, barW * pct, barH);

        // Border
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX - 1, barY - 1, barW + 2, barH + 2);

        // Label
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '9px ' + getComputedStyle(document.body).fontFamily;
        ctx.textAlign = 'center';
        ctx.fillText(`❤ ${baseHp}/${BASE_MAX_HP}`, CANVAS_W / 2, barY + barH + 12);
        ctx.textAlign = 'start';
      }

      // Early send bonus indicator on canvas
      if (earlySendBonusPct > 0 && waveState === 'active') {
        ctx.fillStyle = 'rgba(34,197,94,0.7)';
        ctx.font = 'bold 11px ' + getComputedStyle(document.body).fontFamily;
        ctx.textAlign = 'center';
        ctx.fillText(`⚡ +${earlySendBonusPct}% XP BONUS ⚡`, CANVAS_W / 2, 18);
        ctx.textAlign = 'start';
      }

      // Damage flash overlay
      if (damageFlashTimer > 0) {
        const flashAlpha = (damageFlashTimer / 8) * 0.25;
        ctx.fillStyle = `rgba(231,76,60,${flashAlpha})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        damageFlashTimer--;
      }

      // Game over overlay handled by DOM
      if (waveState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }

      // Countdown overlay
      if (waveState === 'countdown') {
        let secs;
        if (isLeader) {
          secs = Math.ceil(countdownTimer / TICK_RATE);
        } else if (countdownStartedAt > 0) {
          secs = Math.max(1, Math.ceil((3000 - (Date.now() - countdownStartedAt)) / 1000));
        } else {
          secs = 3;
        }
        if (secs > 0) {
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.fillRect(CANVAS_W / 2 - 40, CANVAS_H / 2 - 30, 80, 50);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 32px ' + getComputedStyle(document.body).fontFamily;
          ctx.textAlign = 'center';
          ctx.fillText(secs, CANVAS_W / 2, CANVAS_H / 2 + 8);
          ctx.textAlign = 'start';
        }
      }
    }

    function drawGrid() {
      // Sky gradient (subtle)
      const skyGrad = ctx.createLinearGradient(0, 0, 0, PLACEMENT_MIN_Y);
      skyGrad.addColorStop(0, 'rgba(10,10,30,0.3)');
      skyGrad.addColorStop(1, 'rgba(15,25,50,0.1)');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, CANVAS_W, PLACEMENT_MIN_Y);

      // Ground gradient
      const groundGrad = ctx.createLinearGradient(0, PLACEMENT_MIN_Y, 0, CANVAS_H);
      groundGrad.addColorStop(0, 'rgba(20,40,30,0.2)');
      groundGrad.addColorStop(1, 'rgba(15,30,25,0.4)');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, PLACEMENT_MIN_Y, CANVAS_W, CANVAS_H - PLACEMENT_MIN_Y);

      // Grid lines
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      const spacing = 40;
      for (let x = 0; x <= CANVAS_W; x += spacing) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, CANVAS_H);
        ctx.stroke();
      }
      for (let y = 0; y <= CANVAS_H; y += spacing) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(CANVAS_W, y);
        ctx.stroke();
      }
    }

    function drawCannon(cid, c) {
      const x = c.x, y = c.y;
      const color = getCannonColor(c.path, c.spec);
      const level = c.level || 1;
      const stats = getCannonStats(level, c.path, c.spec);
      const isMe = cid === playerId;
      const spec = c.spec || null;
      const path = c.path || null;
      const baseR = 12;

      // Range circle (only for own cannon)
      if (isMe) {
        ctx.strokeStyle = 'rgba(30,144,255,0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, stats.range, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Barrel — point toward nearest enemy or up
      let barrelAngle = -Math.PI / 2;
      let nearestDist = Infinity;
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        const dist = Math.hypot(e.x - x, e.y - y);
        if (dist <= stats.range && dist < nearestDist) {
          nearestDist = dist;
          barrelAngle = Math.atan2(e.y - y, e.x - x);
        }
      }

      // Spec/path-specific glow aura
      if (spec || path) {
        ctx.save();
        const glowR = baseR + 6;
        const glowAlpha = 0.12 + Math.sin(Date.now() / 400) * 0.05;
        ctx.globalAlpha = glowAlpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, glowR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Draw cannon body based on spec/path
      ctx.save();
      if (spec === 'gatling') {
        // Gatling: square body with rounded corners + triple barrel
        const s = baseR;
        ctx.fillStyle = color;
        roundRect(ctx, x - s, y - s, s * 2, s * 2, 4);
        ctx.fill();
        // Triple barrel
        for (let i = -1; i <= 1; i++) {
          const offsetAngle = barrelAngle + i * 0.15;
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(offsetAngle) * 6, y + Math.sin(offsetAngle) * 6);
          ctx.lineTo(x + Math.cos(offsetAngle) * 20, y + Math.sin(offsetAngle) * 20);
          ctx.stroke();
        }
        // Spinning barrel hub
        const spin = (Date.now() / 100) % (Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, 5, spin, spin + Math.PI);
        ctx.stroke();
      } else if (spec === 'sniper') {
        // Sniper: slim diamond body + long thin barrel
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y - baseR);
        ctx.lineTo(x + baseR * 0.7, y);
        ctx.lineTo(x, y + baseR);
        ctx.lineTo(x - baseR * 0.7, y);
        ctx.closePath();
        ctx.fill();
        // Long barrel with scope
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(barrelAngle) * 26, y + Math.sin(barrelAngle) * 26);
        ctx.stroke();
        // Scope lens at tip
        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.arc(x + Math.cos(barrelAngle) * 26, y + Math.sin(barrelAngle) * 26, 3, 0, Math.PI * 2);
        ctx.fill();
      } else if (spec === 'cannon') {
        // Cannon: large hexagonal body + wide barrel
        ctx.fillStyle = color;
        drawCtxPolygon(ctx, x, y, baseR + 2, 6);
        ctx.fill();
        // Wide barrel
        const bx = Math.cos(barrelAngle), by = Math.sin(barrelAngle);
        const perpX = -by, perpY = bx;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x + perpX * 5, y + perpY * 5);
        ctx.lineTo(x + bx * 20 + perpX * 6, y + by * 20 + perpY * 6);
        ctx.lineTo(x + bx * 20 - perpX * 6, y + by * 20 - perpY * 6);
        ctx.lineTo(x - perpX * 5, y - perpY * 5);
        ctx.closePath();
        ctx.fill();
      } else if (spec === 'railgun') {
        // Railgun: angular/wedge body + energy rail barrel
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(barrelAngle) * baseR, y + Math.sin(barrelAngle) * baseR);
        ctx.lineTo(x + Math.cos(barrelAngle + 2.3) * baseR, y + Math.sin(barrelAngle + 2.3) * baseR);
        ctx.lineTo(x + Math.cos(barrelAngle + Math.PI) * baseR * 0.8, y + Math.sin(barrelAngle + Math.PI) * baseR * 0.8);
        ctx.lineTo(x + Math.cos(barrelAngle - 2.3) * baseR, y + Math.sin(barrelAngle - 2.3) * baseR);
        ctx.closePath();
        ctx.fill();
        // Energy rail barrel (two parallel lines with glow)
        const bx = Math.cos(barrelAngle), by = Math.sin(barrelAngle);
        const perpX = -by, perpY = bx;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + perpX * 4, y + perpY * 4);
        ctx.lineTo(x + bx * 24 + perpX * 3, y + by * 24 + perpY * 3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - perpX * 4, y - perpY * 4);
        ctx.lineTo(x + bx * 24 - perpX * 3, y + by * 24 - perpY * 3);
        ctx.stroke();
        // Energy glow between rails
        const pulse = 0.4 + Math.sin(Date.now() / 150) * 0.3;
        ctx.globalAlpha = pulse;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + bx * 8, y + by * 8);
        ctx.lineTo(x + bx * 22, y + by * 22);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (spec === 'tesla') {
        // Tesla: circle with electricity arcs
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, baseR, 0, Math.PI * 2);
        ctx.fill();
        // Lightning arcs around the coil
        ctx.strokeStyle = '#d1a0ff';
        ctx.lineWidth = 1.5;
        const arcCount = 3;
        for (let a = 0; a < arcCount; a++) {
          const angle = (Date.now() / 300 + a * Math.PI * 2 / arcCount) % (Math.PI * 2);
          const arcR = baseR + 4 + Math.random() * 3;
          ctx.beginPath();
          ctx.arc(x, y, arcR, angle, angle + 0.8);
          ctx.stroke();
        }
        // Central coil
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.stroke();
        // Short barrel
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(barrelAngle) * 15, y + Math.sin(barrelAngle) * 15);
        ctx.stroke();
      } else if (spec === 'frost') {
        // Frost: snowflake/crystal shape
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, baseR, 0, Math.PI * 2);
        ctx.fill();
        // Crystal spikes
        ctx.strokeStyle = '#aae4ff';
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI * 2 / 6) * i - Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(angle) * (baseR - 2), y + Math.sin(angle) * (baseR - 2));
          ctx.lineTo(x + Math.cos(angle) * (baseR + 6), y + Math.sin(angle) * (baseR + 6));
          ctx.stroke();
          // Small perpendicular ticks on each spoke
          const tipX = x + Math.cos(angle) * (baseR + 3);
          const tipY = y + Math.sin(angle) * (baseR + 3);
          const perpAngle = angle + Math.PI / 2;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(tipX + Math.cos(perpAngle) * 3, tipY + Math.sin(perpAngle) * 3);
          ctx.lineTo(tipX - Math.cos(perpAngle) * 3, tipY - Math.sin(perpAngle) * 3);
          ctx.stroke();
          ctx.lineWidth = 2;
        }
        // Frost mist
        const mist = 0.08 + Math.sin(Date.now() / 600) * 0.04;
        ctx.globalAlpha = mist;
        ctx.fillStyle = '#aae4ff';
        ctx.beginPath();
        ctx.arc(x, y, baseR + 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        // Short barrel
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(barrelAngle) * 16, y + Math.sin(barrelAngle) * 16);
        ctx.stroke();
      } else if (path === 'rapid') {
        // Rapid (pre-spec): circle with speed lines
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, baseR, 0, Math.PI * 2);
        ctx.fill();
        // Speed lines behind the barrel
        ctx.strokeStyle = 'rgba(255,107,53,0.3)';
        ctx.lineWidth = 1;
        const backAngle = barrelAngle + Math.PI;
        for (let i = -1; i <= 1; i++) {
          const a = backAngle + i * 0.3;
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(a) * (baseR + 2), y + Math.sin(a) * (baseR + 2));
          ctx.lineTo(x + Math.cos(a) * (baseR + 10), y + Math.sin(a) * (baseR + 10));
          ctx.stroke();
        }
        // Standard barrel
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(barrelAngle) * 18, y + Math.sin(barrelAngle) * 18);
        ctx.stroke();
      } else if (path === 'power') {
        // Power (pre-spec): pentagon body + thick barrel
        ctx.fillStyle = color;
        drawCtxPolygon(ctx, x, y, baseR, 5);
        ctx.fill();
        // Thick barrel
        ctx.strokeStyle = color;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(barrelAngle) * 18, y + Math.sin(barrelAngle) * 18);
        ctx.stroke();
      } else if (path === 'tech') {
        // Tech (pre-spec): circle with ring
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, baseR, 0, Math.PI * 2);
        ctx.fill();
        // Rotating outer ring
        const spin = (Date.now() / 800) % (Math.PI * 2);
        ctx.strokeStyle = 'rgba(155,89,182,0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, y, baseR + 4, spin, spin + Math.PI * 1.2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, baseR + 4, spin + Math.PI, spin + Math.PI * 2.2);
        ctx.stroke();
        // Standard barrel
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(barrelAngle) * 18, y + Math.sin(barrelAngle) * 18);
        ctx.stroke();
      } else {
        // Basic (no path): simple circle + barrel
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, baseR, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(barrelAngle) * 18, y + Math.sin(barrelAngle) * 18);
        ctx.stroke();
      }

      // Inner ring (player indicator)
      ctx.strokeStyle = isMe ? '#fff' : 'rgba(255,255,255,0.4)';
      ctx.lineWidth = isMe ? 2 : 1;
      ctx.beginPath();
      ctx.arc(x, y, baseR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Level badge
      ctx.fillStyle = '#000';
      ctx.globalAlpha = 0.6;
      ctx.fillRect(x + 8, y - 20, 16, 12);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.fillText(level, x + 16, y - 11);
      ctx.textAlign = 'start';

      // Avatar or emoji
      if (c.avatar) {
        if (!avatarImages[cid]) {
          const img = new Image();
          img.src = c.avatar;
          avatarImages[cid] = img;
        }
        const img = avatarImages[cid];
        if (img.complete && img.naturalWidth > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y - 28, 12, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(img, x - 12, y - 40, 24, 24);
          ctx.restore();
        }
      } else if (c.emoji) {
        ctx.font = '16px serif';
        ctx.textAlign = 'center';
        ctx.fillText(c.emoji, x, y - 20);
        ctx.textAlign = 'start';
      }

      // Name below (with spec/path indicator)
      ctx.fillStyle = isMe ? '#fff' : 'rgba(255,255,255,0.5)';
      ctx.font = '9px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.fillText(c.name || '???', x, y + 24);
      ctx.textAlign = 'start';
    }

    // Helper: draw a polygon on main canvas context
    function drawCtxPolygon(ctx, cx, cy, r, sides) {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
        const px = cx + r * Math.cos(angle);
        const py = cy + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    // Helper: rounded rectangle
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawEnemy(e) {
      const x = e.x, y = e.y;
      ctx.fillStyle = e.color;

      switch (e.shape) {
        case 'circle':
          ctx.beginPath();
          ctx.arc(x, y, e.radius, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'hexagon':
          drawPolygon(x, y, e.radius, 6);
          break;
        case 'diamond':
          drawPolygon(x, y, e.radius, 4);
          break;
        case 'shielded':
          ctx.beginPath();
          ctx.arc(x, y, e.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#5dade2';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y, e.radius + 3, 0, Math.PI * 2);
          ctx.stroke();
          break;
        case 'octagon':
          drawPolygon(x, y, e.radius, 8);
          break;
        default:
          ctx.beginPath();
          ctx.arc(x, y, e.radius, 0, Math.PI * 2);
          ctx.fill();
      }

      // HP bar
      if (e.hp < e.maxHp) {
        const barW = e.radius * 2 + 4;
        const barH = 3;
        const barX = x - barW / 2;
        const barY = y - e.radius - 6;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX, barY, barW, barH);
        const pct = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = pct > 0.5 ? '#2ecc71' : pct > 0.25 ? '#f39c12' : '#e74c3c';
        ctx.fillRect(barX, barY, barW * pct, barH);
      }
    }

    function drawPolygon(cx, cy, r, sides) {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
        const px = cx + r * Math.cos(angle);
        const py = cy + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }

    // ═══════════════════════════════════════════════════
    //  Wave Preview
    // ═══════════════════════════════════════════════════
    function getWaveEnemyBreakdown(waveNum) {
      const rng = mulberry32(waveNum * 7919);
      const count = 8 + waveNum * 3;
      const isBossWave = waveNum % 10 === 0 && waveNum > 0;
      const available = ENEMY_TYPES.filter(e => {
        if (e.type === 'boss') return isBossWave;
        return e.wave <= waveNum;
      });
      const breakdown = {};
      for (let i = 0; i < count; i++) {
        const et = available[Math.floor(rng() * available.length)];
        breakdown[et.type] = (breakdown[et.type] || 0) + 1;
      }
      if (isBossWave) {
        breakdown['boss'] = (breakdown['boss'] || 0) + 1;
      }
      return breakdown;
    }

    function drawEnemyIcon(miniCanvas, type) {
      const et = ENEMY_TYPES.find(e => e.type === type);
      if (!et) return;
      miniCanvas.width = 28;
      miniCanvas.height = 28;
      const cx = miniCanvas.getContext('2d');
      cx.clearRect(0, 0, 28, 28);
      const x = 14, y = 14;
      const r = Math.min(et.radius, 10);
      cx.fillStyle = et.color;
      switch (et.shape) {
        case 'circle':
          cx.beginPath();
          cx.arc(x, y, r, 0, Math.PI * 2);
          cx.fill();
          break;
        case 'hexagon':
          drawMiniPolygon(cx, x, y, r, 6);
          break;
        case 'diamond':
          drawMiniPolygon(cx, x, y, r, 4);
          break;
        case 'shielded':
          cx.beginPath();
          cx.arc(x, y, r, 0, Math.PI * 2);
          cx.fill();
          cx.strokeStyle = '#5dade2';
          cx.lineWidth = 2;
          cx.beginPath();
          cx.arc(x, y, r + 2, 0, Math.PI * 2);
          cx.stroke();
          break;
        case 'octagon':
          drawMiniPolygon(cx, x, y, r, 8);
          break;
        default:
          cx.beginPath();
          cx.arc(x, y, r, 0, Math.PI * 2);
          cx.fill();
      }
    }

    function drawMiniPolygon(cx, x, y, r, sides) {
      cx.beginPath();
      for (let i = 0; i < sides; i++) {
        const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
        const px = x + r * Math.cos(angle);
        const py = y + r * Math.sin(angle);
        if (i === 0) cx.moveTo(px, py);
        else cx.lineTo(px, py);
      }
      cx.closePath();
      cx.fill();
    }

    function showWavePreview(waveNum) {
      const breakdown = getWaveEnemyBreakdown(waveNum);
      // Clear old entries (keep the label)
      while (wavePreview.children.length > 1) {
        wavePreview.removeChild(wavePreview.lastChild);
      }
      // Sort: boss first, then by count descending
      const sorted = Object.entries(breakdown).sort((a, b) => {
        if (a[0] === 'boss') return -1;
        if (b[0] === 'boss') return 1;
        return b[1] - a[1];
      });
      for (const [type, count] of sorted) {
        const et = ENEMY_TYPES.find(e => e.type === type);
        if (!et) continue;
        const div = document.createElement('div');
        div.className = 'wave-preview-enemy';
        const miniCanvas = document.createElement('canvas');
        drawEnemyIcon(miniCanvas, type);
        const nameSpan = document.createElement('span');
        nameSpan.className = 'wpe-name';
        nameSpan.textContent = type;
        nameSpan.style.color = et.color;
        const countSpan = document.createElement('span');
        countSpan.className = 'wpe-count';
        countSpan.textContent = '×' + count;
        div.appendChild(miniCanvas);
        div.appendChild(nameSpan);
        div.appendChild(countSpan);
        wavePreview.appendChild(div);
      }
      wavePreview.classList.add('active');
    }

    function hideWavePreview() {
      wavePreview.classList.remove('active');
    }

    // ═══════════════════════════════════════════════════
    //  Screen Shake
    // ═══════════════════════════════════════════════════
    let shakeTimeout = null;

    function triggerScreenShake(heavy = false) {
      // Remove existing shake classes
      canvasWrap.classList.remove('shake', 'shake-heavy');
      // Force reflow so animation re-triggers
      void canvasWrap.offsetHeight;
      canvasWrap.classList.add(heavy ? 'shake-heavy' : 'shake');
      if (shakeTimeout) clearTimeout(shakeTimeout);
      shakeTimeout = setTimeout(() => {
        canvasWrap.classList.remove('shake', 'shake-heavy');
      }, heavy ? 500 : 300);
    }

    // ═══════════════════════════════════════════════════
    //  Init
    // ═══════════════════════════════════════════════════
    initFirebase();

  })();
  </script>
</body>
</html>
