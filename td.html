<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tower Defense — rayhe.net</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-light: #16213e;
      --card-bg: #0f3460;
      --text: #e0e0e0;
      --text-muted: #8888aa;
      --accent: #1E90FF;
      --accent-glow: rgba(30,144,255,0.3);
      --danger: #e74c3c;
      --success: #22c55e;
      --border: #2a2a4a;
      --radius: 6px;
      --font-mono: 'SF Mono', 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ─── Header ─────────────────────────────────────── */
    .header {
      width: 100%;
      max-width: 740px;
      padding: 16px 20px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header .back { font-size: 0.8rem; color: var(--text-muted); }
    .header h1 { font-size: 1.1rem; font-weight: 600; }

    /* ─── Avatar Button (in controls) ────────────────── */
    .avatar-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 16px;
      line-height: 1;
      transition: border-color 0.2s;
    }
    .avatar-btn:hover { border-color: var(--accent); }
    .avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-input { display: none; }

    /* ─── Game Screen ────────────────────────────────── */
    #gameScreen { width: 100%; max-width: 740px; padding: 0 10px 20px; }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 6px;
    }
    .hud-item { display: flex; align-items: center; gap: 4px; }
    .hud-val { color: var(--text); font-weight: 600; }

    .canvas-wrap {
      width: 100%;
      position: relative;
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: crosshair;
    }

    /* ─── Control Bar ────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .ctrl-btn:disabled { opacity: 0.4; cursor: default; }
    .ctrl-btn:disabled:hover { background: var(--card-bg); color: var(--text); border-color: var(--border); }
    .xp-bar-wrap {
      flex: 1;
      min-width: 100px;
      height: 14px;
      background: var(--bg);
      border-radius: 7px;
      overflow: hidden;
      position: relative;
    }
    .xp-bar-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
      border-radius: 7px;
    }
    .xp-bar-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: #fff;
      text-shadow: 0 0 3px rgba(0,0,0,0.8);
    }
    .cannon-info {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* ─── Upgrade Modal ──────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 480px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h2 {
      font-size: 1rem;
      margin-bottom: 16px;
      text-align: center;
      color: var(--accent);
    }
    .upgrade-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .upgrade-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upgrade-card:hover {
      border-color: var(--accent);
      background: var(--card-bg);
    }
    .upgrade-card .uc-name {
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }
    .upgrade-card .uc-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .modal-close {
      display: block;
      margin: 16px auto 0;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 20px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .modal-close:hover { border-color: var(--text-muted); }

    /* ─── Player List Panel ──────────────────────────── */
    .player-panel {
      display: none;
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 8px;
    }
    .player-panel.active { display: block; }
    .player-panel h3 {
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .player-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 0.75rem;
    }
    .player-row .p-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--card-bg);
    }
    .player-row .p-name { flex: 1; }
    .player-row .p-level { color: var(--accent); }
    .player-row .p-kills { color: var(--text-muted); }
    .player-online { color: var(--success); }
    .player-offline { color: var(--text-muted); opacity: 0.5; }

    /* ─── Wave Announcement ──────────────────────────── */
    .wave-announce {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      pointer-events: none;
      z-index: 10;
    }
    .wave-announce.active { display: flex; }
    .wave-announce .wa-text {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
      animation: wavePulse 0.8s ease-in-out;
    }
    .wave-announce .wa-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    @keyframes wavePulse {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ─── Base HP ────────────────────────────────────── */
    .hud-hp { transition: color 0.2s; }
    .hud-hp.damaged {
      color: var(--danger);
      animation: hpPulse 0.4s ease-out;
    }
    @keyframes hpPulse {
      0% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
    .damage-flash {
      position: absolute;
      inset: 0;
      background: rgba(231,76,60,0.25);
      pointer-events: none;
      z-index: 9;
      animation: damageFlash 0.4s ease-out forwards;
    }
    @keyframes damageFlash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    .game-over-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0,0,0,0.75);
      z-index: 20;
    }
    .game-over-overlay.active { display: flex; }
    .game-over-overlay .go-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--danger);
      margin-bottom: 8px;
    }
    .game-over-overlay .go-stats {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .game-over-overlay .go-restart {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 10px 28px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s;
    }
    .game-over-overlay .go-restart:hover { background: #c0392b; }

    /* ─── Combo Counter ──────────────────────────────── */
    .combo-display {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255,215,0,0.6), 0 0 24px rgba(255,215,0,0.3);
      pointer-events: none;
      z-index: 11;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .combo-display.active {
      opacity: 1;
      animation: comboShake 0.15s ease-out;
    }
    .combo-display .combo-num {
      font-size: 1.8rem;
      display: inline-block;
    }
    .combo-display .combo-label {
      font-size: 0.7rem;
      color: #ffaa00;
      display: block;
      text-align: center;
    }
    @keyframes comboShake {
      0% { transform: scale(1.3); }
      50% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    /* ─── Wave Preview ───────────────────────────────── */
    .wave-preview {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(30,144,255,0.3);
      border-radius: 8px;
      z-index: 12;
      pointer-events: none;
      animation: previewFadeIn 0.4s ease-out;
      flex-wrap: wrap;
      max-width: 90%;
    }
    .wave-preview.active { display: flex; }
    .wave-preview-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      width: 100%;
      text-align: center;
      margin-bottom: 2px;
    }
    .wave-preview-enemy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
    }
    .wave-preview-enemy canvas {
      width: 28px;
      height: 28px;
      cursor: default;
    }
    .wave-preview-enemy .wpe-name {
      font-size: 0.55rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .wave-preview-enemy .wpe-count {
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text);
    }
    @keyframes previewFadeIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ─── Send Next / Early Wave ──────────────────────── */
    .send-next-btn:not(:disabled) {
      border-color: var(--success);
      color: var(--success);
    }
    .send-next-btn:not(:disabled):hover {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }
    .send-bonus-popup {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--success);
      text-shadow: 0 0 12px rgba(34,197,94,0.6), 0 0 24px rgba(34,197,94,0.3);
      pointer-events: none;
      z-index: 13;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .send-bonus-popup.active {
      opacity: 1;
      animation: bonusPopIn 0.3s ease-out;
    }
    @keyframes bonusPopIn {
      0% { transform: translateX(-50%) scale(1.5); opacity: 0; }
      50% { transform: translateX(-50%) scale(0.95); }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }
    .send-next-btn .sn-bonus {
      font-size: 0.6rem;
      color: var(--success);
      margin-left: 4px;
      opacity: 0.8;
    }

    /* ─── Speed Controls ─────────────────────────────── */
    .speed-controls {
      display: flex;
      gap: 2px;
      background: var(--bg);
      border-radius: var(--radius);
      padding: 2px;
      border: 1px solid var(--border);
    }
    .speed-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
      font-weight: 600;
    }
    .speed-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .speed-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* ─── Ability Button ─────────────────────────────── */
    .ability-btn {
      background: linear-gradient(135deg, var(--card-bg), #1a1a3e);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }
    .ability-btn:hover:not(:disabled) {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .ability-btn:disabled {
      opacity: 0.5;
      cursor: default;
      border-color: var(--border);
    }
    .ability-btn.targeting {
      background: var(--accent);
      color: #fff;
      animation: abilityPulse 0.8s ease-in-out infinite;
    }
    .ability-btn .ab-cooldown {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--accent);
      transition: width 0.1s linear;
    }
    .ability-btn .ab-key {
      font-size: 0.6rem;
      color: var(--text-muted);
      margin-left: 4px;
      opacity: 0.6;
    }
    @keyframes abilityPulse {
      0%, 100% { box-shadow: 0 0 4px var(--accent-glow); }
      50% { box-shadow: 0 0 16px var(--accent-glow); }
    }

    /* ─── Sell Button ─────────────────────────────────── */
    .sell-btn:not(:disabled) {
      border-color: var(--danger);
      color: var(--danger);
    }
    .sell-btn:not(:disabled):hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .sell-confirm-card {
      border-color: var(--danger) !important;
    }
    .sell-confirm-card:hover {
      background: rgba(231,76,60,0.15) !important;
      border-color: var(--danger) !important;
    }
    .sell-refund {
      color: var(--success);
      font-weight: 600;
    }
    .sell-warning {
      color: var(--danger);
      font-size: 0.7rem;
      margin-top: 4px;
    }

    /* ─── Ability targeting crosshair ────────────────── */
    .canvas-targeting {
      cursor: crosshair !important;
    }

    /* ─── Ability zone indicators (on canvas) ────────── */

    /* ─── Speed Indicator (on canvas) ────────────────── */
    .speed-indicator {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      pointer-events: none;
      z-index: 11;
      opacity: 0;
      transition: opacity 0.3s;
      text-shadow: 0 0 8px var(--accent-glow);
    }
    .speed-indicator.active { opacity: 1; }

    /* ─── Screen Shake ───────────────────────────────── */
    .canvas-wrap.shake {
      animation: screenShake 0.3s ease-out;
    }
    .canvas-wrap.shake-heavy {
      animation: screenShakeHeavy 0.5s ease-out;
    }
    @keyframes screenShake {
      0% { transform: translate(0, 0); }
      15% { transform: translate(-3px, 2px); }
      30% { transform: translate(3px, -2px); }
      45% { transform: translate(-2px, 1px); }
      60% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, 1px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes screenShakeHeavy {
      0% { transform: translate(0, 0); }
      10% { transform: translate(-6px, 4px); }
      20% { transform: translate(5px, -3px); }
      30% { transform: translate(-4px, 5px); }
      40% { transform: translate(4px, -2px); }
      50% { transform: translate(-3px, 3px); }
      60% { transform: translate(3px, -2px); }
      70% { transform: translate(-2px, 1px); }
      80% { transform: translate(1px, -1px); }
      100% { transform: translate(0, 0); }
    }

    /* ─── Achievement Toast ─────────────────────────── */
    .achievement-toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .achievement-toast {
      background: linear-gradient(135deg, #2a1f00, #3d2e00);
      border: 2px solid #ffd700;
      border-radius: 8px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 20px rgba(255,215,0,0.4), 0 4px 12px rgba(0,0,0,0.6);
      animation: achieveSlideIn 0.5s ease-out, achieveFadeOut 0.5s ease-in 3s forwards;
      min-width: 220px;
      max-width: 360px;
    }
    .achievement-toast .at-icon { font-size: 1.6rem; flex-shrink: 0; }
    .achievement-toast .at-body { display: flex; flex-direction: column; gap: 2px; }
    .achievement-toast .at-label { font-size: 0.6rem; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; }
    .achievement-toast .at-name { font-size: 0.85rem; font-weight: 700; color: #fff; }
    .achievement-toast .at-desc { font-size: 0.65rem; color: #ccc; }
    @keyframes achieveSlideIn {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes achieveFadeOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateY(-10px); }
    }

    /* ─── Achievement Panel ──────────────────────────── */
    .achieve-panel {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
    }
    .achieve-panel.active { display: flex; }
    .achieve-inner {
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
    }
    .achieve-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .achieve-header h2 { font-size: 1.1rem; color: #ffd700; margin: 0; }
    .achieve-header .achieve-count { font-size: 0.75rem; color: var(--text-muted); }
    .achieve-close {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .achieve-close:hover { color: var(--text); border-color: var(--text-muted); }
    .achieve-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .achieve-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transition: border-color 0.2s;
    }
    .achieve-card.unlocked {
      border-color: rgba(255,215,0,0.4);
      background: linear-gradient(135deg, var(--bg), #1a1a00);
    }
    .achieve-card.locked { opacity: 0.45; }
    .achieve-card .ac-icon { font-size: 1.5rem; flex-shrink: 0; line-height: 1; }
    .achieve-card .ac-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .achieve-card .ac-name { font-size: 0.75rem; font-weight: 700; color: #fff; }
    .achieve-card.locked .ac-name { color: var(--text-muted); }
    .achieve-card .ac-desc { font-size: 0.6rem; color: var(--text-muted); line-height: 1.3; }
    .achieve-card .ac-date { font-size: 0.55rem; color: #ffd700; margin-top: 2px; }

    /* ─── Responsive ─────────────────────────────────── */
    @media (max-width: 600px) {
      .header h1 { font-size: 0.95rem; }
      .start-title { font-size: 1.4rem; }
      .hud { font-size: 0.65rem; }
      .controls { font-size: 0.65rem; }
      .wave-announce .wa-text { font-size: 1.2rem; }
      .achieve-grid { grid-template-columns: 1fr; }
      .achieve-inner { padding: 14px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back">&larr; home</a>
    <h1>Tower Defense</h1>
  </div>

  <!-- ─── Game Screen ──────────────────────────────── -->
  <div id="gameScreen">
    <div class="hud">
      <div class="hud-item">❤️ <span class="hud-val hud-hp" id="hudBaseHp">20</span></div>
      <div class="hud-item">Wave <span class="hud-val" id="hudWave">1</span></div>
      <div class="hud-item">Enemies <span class="hud-val" id="hudEnemies">0</span></div>
      <div class="hud-item">Kills <span class="hud-val" id="hudKills">0</span></div>
      <div class="hud-item">Online <span class="hud-val" id="hudOnline">1</span></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="700" height="500"></canvas>
      <div class="wave-announce" id="waveAnnounce">
        <div class="wa-text" id="waText"></div>
        <div class="wa-sub" id="waSub"></div>
      </div>
      <div class="combo-display" id="comboDisplay">
        <span class="combo-num" id="comboNum">2</span><span>× COMBO</span>
        <span class="combo-label" id="comboLabel">+2 XP</span>
      </div>
      <div class="speed-indicator" id="speedIndicator">▶▶ 2×</div>
      <div class="game-over-overlay" id="gameOverOverlay">
        <div class="go-title">GAME OVER</div>
        <div class="go-stats" id="goStats">Wave 1 · 0 kills</div>
        <button class="go-restart" id="goRestart">Play Again</button>
      </div>
      <div class="wave-preview" id="wavePreview">
        <div class="wave-preview-label">INCOMING ENEMIES</div>
      </div>
      <div class="send-bonus-popup" id="sendBonusPopup"></div>
    </div>

    <div class="controls">
      <div class="avatar-btn" id="avatarBtn" title="Upload avatar"></div>
      <input type="file" accept="image/*" class="avatar-input" id="avatarInput">
      <span class="cannon-info" id="cannonInfo">Lv1 Basic</span>
      <div class="xp-bar-wrap">
        <div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div>
        <div class="xp-bar-text" id="xpBarText">0 / 50 XP</div>
      </div>
      <button class="ctrl-btn" id="upgradeBtn" disabled>Upgrade</button>
      <button class="ability-btn" id="abilityBtn" disabled>⚡ Power Shot<span class="ab-key">[Q]</span><div class="ab-cooldown" id="abCooldownBar"></div></button>
      <div class="speed-controls" id="speedControls">
        <button class="speed-btn active" data-speed="1">1×</button>
        <button class="speed-btn" data-speed="2">2×</button>
        <button class="speed-btn" data-speed="3">3×</button>
      </div>
      <button class="ctrl-btn send-next-btn" id="sendNextBtn" disabled>⏩ Send Next <span class="ab-key">[E]</span></button>
      <button class="ctrl-btn" id="relocateBtn">Relocate</button>
      <button class="ctrl-btn sell-btn" id="sellBtn" disabled>🗑 Sell</button>
      <button class="ctrl-btn" id="playersBtn">Players</button>
      <button class="ctrl-btn" id="achieveBtn" title="Achievements">🏆</button>
      <button class="ctrl-btn" id="muteBtn" title="Toggle sound">🔊</button>
    </div>

    <div class="player-panel" id="playerPanel">
      <h3>Players</h3>
      <div id="playerList"></div>
    </div>
  </div>

  <!-- ─── Upgrade Modal ────────────────────────────── -->
  <div class="modal-overlay" id="upgradeModal">
    <div class="modal">
      <h2 id="upgradeTitle">Choose Upgrade Path</h2>
      <div class="upgrade-cards" id="upgradeCards"></div>
      <button class="modal-close" id="upgradeClose">Cancel</button>
    </div>
  </div>

  <!-- ─── Achievement Toast Container ─────────────── -->
  <div class="achievement-toast-container" id="achieveToastContainer"></div>

  <!-- ─── Achievement Panel ───────────────────────── -->
  <div class="achieve-panel" id="achievePanel">
    <div class="achieve-inner">
      <div class="achieve-header">
        <h2>🏆 Achievements <span class="achieve-count" id="achieveCount">0/0</span></h2>
        <button class="achieve-close" id="achieveClose">Close</button>
      </div>
      <div class="achieve-grid" id="achieveGrid"></div>
    </div>
  </div>

  <script src="firebase-shared.js"></script>
  <script>
  (() => {
    'use strict';

    // ═══════════════════════════════════════════════════
    //  Constants & Config
    // ═══════════════════════════════════════════════════
    const CANVAS_W = 700, CANVAS_H = 500;
    const BASE_Y = CANVAS_H - 30;
    const PLACEMENT_MIN_Y = 300;
    const MIN_CANNON_SPACING = 40;
    const RELOCATE_COOLDOWN = 30000;
    const TICK_RATE = 20; // ticks per second
    const TICK_MS = 1000 / TICK_RATE;
    const SNAPSHOT_INTERVAL = 40; // ticks between snapshots (2s)
    const LEADER_HEARTBEAT_MS = 2000;
    const LEADER_STALE_MS = 6000;
    const STALE_CANNON_DAYS = 30;
    const XP_PER_LEVEL = lvl => lvl * 50;
    const BASE_MAX_HP = 20;
    const BOSS_DAMAGE = 3;
    const HP_REGEN_PER_WAVE = 1;

    // ═══════════════════════════════════════════════════
    //  Achievement System
    // ═══════════════════════════════════════════════════
    const ACHIEVEMENTS = {
      first_blood:    { icon: '🩸', name: 'First Blood',      desc: 'Kill your first enemy' },
      wave_5:         { icon: '🌊', name: 'Wave Runner',      desc: 'Reach wave 5' },
      wave_10:        { icon: '🌊', name: 'Wave Master',      desc: 'Reach wave 10' },
      wave_20:        { icon: '🌊', name: 'Tidal Force',      desc: 'Reach wave 20' },
      wave_50:        { icon: '🌊', name: 'Unstoppable',      desc: 'Reach wave 50' },
      boss_slayer:    { icon: '💀', name: 'Boss Slayer',      desc: 'Kill a boss' },
      combo_5:        { icon: '🔥', name: 'Hot Streak',       desc: 'Reach a 5× combo' },
      combo_10:       { icon: '💥', name: 'Combo King',       desc: 'Reach a 10× combo' },
      speed_demon:    { icon: '⚡', name: 'Speed Demon',      desc: 'Use 3× speed' },
      path_chosen:    { icon: '🔀', name: 'Path Chosen',      desc: 'Choose an upgrade path' },
      specialist:     { icon: '⭐', name: 'Specialist',       desc: 'Choose a specialization' },
      sharpshooter:   { icon: '🎯', name: 'Sharpshooter',     desc: 'Get 100 kills in one game' },
      mass_murderer:  { icon: '☠️', name: 'Mass Destruction', desc: 'Get 500 kills in one game' },
      early_bird:     { icon: '🐦', name: 'Early Bird',       desc: 'Use early send' },
      ability_user:   { icon: '✨', name: 'Special Forces',   desc: 'Use an active ability' },
      untouchable:    { icon: '🛡️', name: 'Untouchable',     desc: 'Clear wave 5 with full HP' },
      sell_cannon:    { icon: '💰', name: 'Trade-In',         desc: 'Sell a cannon' },
      max_level:      { icon: '👑', name: 'Maxed Out',        desc: 'Reach level 10' },
    };

    const achieveToastContainer = document.getElementById('achieveToastContainer');
    const achievePanel = document.getElementById('achievePanel');
    const achieveGrid = document.getElementById('achieveGrid');
    const achieveCount = document.getElementById('achieveCount');
    const achieveBtn = document.getElementById('achieveBtn');
    const achieveClose = document.getElementById('achieveClose');

    // Load from localStorage
    let unlockedAchievements = {};
    try {
      unlockedAchievements = JSON.parse(localStorage.getItem('td_achievements') || '{}');
    } catch(e) { unlockedAchievements = {}; }
    // Lifetime stats
    let lifetimeStats = {};
    try {
      lifetimeStats = JSON.parse(localStorage.getItem('td_lifetime_stats') || '{}');
    } catch(e) { lifetimeStats = {}; }

    function saveAchievements() {
      localStorage.setItem('td_achievements', JSON.stringify(unlockedAchievements));
    }
    function saveLifetimeStats() {
      localStorage.setItem('td_lifetime_stats', JSON.stringify(lifetimeStats));
    }

    function unlockAchievement(id) {
      if (unlockedAchievements[id]) return; // already unlocked
      if (!ACHIEVEMENTS[id]) return;
      unlockedAchievements[id] = Date.now();
      saveAchievements();
      showAchievementToast(id);
      sfxAchievement();
    }

    function showAchievementToast(id) {
      const a = ACHIEVEMENTS[id];
      const toast = document.createElement('div');
      toast.className = 'achievement-toast';
      toast.innerHTML = `
        <span class="at-icon">${a.icon}</span>
        <div class="at-body">
          <span class="at-label">Achievement Unlocked</span>
          <span class="at-name">${a.name}</span>
          <span class="at-desc">${a.desc}</span>
        </div>
      `;
      achieveToastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 3600);
    }

    function sfxAchievement() {
      if (!audioCtx || soundMuted) return;
      const now = audioCtx.currentTime;
      // Triumphant ascending arpeggio: C5 → E5 → G5 → C6 with shimmering reverb feel
      const notes = [523, 659, 784, 1047];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.1);
        g.gain.setValueAtTime(soundVolume * 0.25, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
        osc.connect(g).connect(audioCtx.destination);
        osc.start(now + i * 0.1);
        osc.stop(now + i * 0.1 + 0.4);
      });
      // Final shimmer
      const osc2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1047, now + 0.4);
      osc2.frequency.exponentialRampToValueAtTime(1568, now + 0.8);
      g2.gain.setValueAtTime(soundVolume * 0.15, now + 0.4);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc2.connect(g2).connect(audioCtx.destination);
      osc2.start(now + 0.4);
      osc2.stop(now + 0.9);
    }

    function renderAchievePanel() {
      achieveGrid.innerHTML = '';
      const keys = Object.keys(ACHIEVEMENTS);
      const unlocked = keys.filter(k => unlockedAchievements[k]);
      achieveCount.textContent = `${unlocked.length}/${keys.length}`;

      for (const id of keys) {
        const a = ACHIEVEMENTS[id];
        const isUnlocked = !!unlockedAchievements[id];
        const card = document.createElement('div');
        card.className = `achieve-card ${isUnlocked ? 'unlocked' : 'locked'}`;
        let dateStr = '';
        if (isUnlocked) {
          const d = new Date(unlockedAchievements[id]);
          dateStr = `<div class="ac-date">${d.toLocaleDateString()}</div>`;
        }
        card.innerHTML = `
          <span class="ac-icon">${isUnlocked ? a.icon : '🔒'}</span>
          <div class="ac-info">
            <div class="ac-name">${a.name}</div>
            <div class="ac-desc">${a.desc}</div>
            ${dateStr}
          </div>
        `;
        achieveGrid.appendChild(card);
      }
    }

    achieveBtn.addEventListener('click', () => {
      renderAchievePanel();
      achievePanel.classList.add('active');
    });
    achieveClose.addEventListener('click', () => achievePanel.classList.remove('active'));
    achievePanel.addEventListener('click', e => {
      if (e.target === achievePanel) achievePanel.classList.remove('active');
    });

    // ═══════════════════════════════════════════════════
    //  Sound Effects System (Web Audio API)
    // ═══════════════════════════════════════════════════
    let audioCtx = null;
    let soundMuted = localStorage.getItem('td_sound_muted') === 'true';
    let soundVolume = 0.3; // master volume

    function ensureAudioCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e) { return null; }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(fn) {
      if (soundMuted) return;
      const ctx = ensureAudioCtx();
      if (!ctx) return;
      try { fn(ctx); } catch(e) { /* silent fail */ }
    }

    // Helper: create gain node with volume
    function makeGain(ctx, vol) {
      const g = ctx.createGain();
      g.gain.value = vol * soundVolume;
      g.connect(ctx.destination);
      return g;
    }

    // ── Individual Sound Effects ──────────────────────
    function sfxShoot(path, spec) {
      playSound(ctx => {
        const g = makeGain(ctx, 0.15);
        const osc = ctx.createOscillator();
        const now = ctx.currentTime;
        // Different sounds per cannon type
        if (spec === 'gatling' || path === 'rapid') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(800 + Math.random() * 200, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
          g.gain.setValueAtTime(0.08 * soundVolume, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(g); osc.start(now); osc.stop(now + 0.04);
        } else if (spec === 'sniper') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
          g.gain.setValueAtTime(0.2 * soundVolume, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(g); osc.start(now); osc.stop(now + 0.15);
        } else if (spec === 'cannon' || spec === 'railgun' || path === 'power') {
          // Deep boom
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
          g.gain.setValueAtTime(0.25 * soundVolume, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(g); osc.start(now); osc.stop(now + 0.2);
          // Add noise burst for impact
          const buf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i/d.length);
          const ns = ctx.createBufferSource(); ns.buffer = buf;
          const ng = makeGain(ctx, 0.1);
          ns.connect(ng); ns.start(now); ns.stop(now + 0.05);
        } else if (spec === 'tesla' || path === 'tech') {
          // Electric zap
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(2000 + Math.random() * 500, now);
          osc.frequency.setValueAtTime(400 + Math.random() * 200, now + 0.02);
          osc.frequency.setValueAtTime(1500 + Math.random() * 500, now + 0.04);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
          g.gain.setValueAtTime(0.1 * soundVolume, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(g); osc.start(now); osc.stop(now + 0.08);
        } else if (spec === 'frost') {
          // Icy whoosh
          const buf = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(i/d.length * Math.PI);
          const ns = ctx.createBufferSource(); ns.buffer = buf;
          const filt = ctx.createBiquadFilter();
          filt.type = 'bandpass'; filt.frequency.value = 3000; filt.Q.value = 2;
          ns.connect(filt); filt.connect(g);
          g.gain.setValueAtTime(0.12 * soundVolume, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          ns.start(now); ns.stop(now + 0.1);
          return; // skip osc
        } else {
          // Default pew
          osc.type = 'square';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
          g.gain.setValueAtTime(0.12 * soundVolume, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(g); osc.start(now); osc.stop(now + 0.08);
        }
      });
    }

    function sfxEnemyDeath(isBoss) {
      playSound(ctx => {
        const now = ctx.currentTime;
        if (isBoss) {
          // Epic explosion for boss
          const g = makeGain(ctx, 0.35);
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
          g.gain.setValueAtTime(0.35 * soundVolume, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(g); osc.start(now); osc.stop(now + 0.5);
          // Noise burst
          const buf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i/d.length);
          const ns = ctx.createBufferSource(); ns.buffer = buf;
          const ng = makeGain(ctx, 0.2);
          ns.connect(ng); ns.start(now); ns.stop(now + 0.3);
        } else {
          // Small pop
          const g = makeGain(ctx, 0.15);
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400 + Math.random() * 200, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
          g.gain.setValueAtTime(0.15 * soundVolume, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(g); osc.start(now); osc.stop(now + 0.1);
        }
      });
    }

    function sfxWaveStart(isBossWave) {
      playSound(ctx => {
        const now = ctx.currentTime;
        const g = makeGain(ctx, 0.2);
        if (isBossWave) {
          // Ominous low horn
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(80, now);
          osc.frequency.setValueAtTime(100, now + 0.2);
          osc.frequency.setValueAtTime(80, now + 0.4);
          g.gain.setValueAtTime(0.2 * soundVolume, now);
          g.gain.linearRampToValueAtTime(0.25 * soundVolume, now + 0.2);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
          osc.connect(g); osc.start(now); osc.stop(now + 0.8);
          // Second ominous tone
          const osc2 = ctx.createOscillator();
          osc2.type = 'sawtooth';
          osc2.frequency.setValueAtTime(60, now + 0.1);
          const g2 = makeGain(ctx, 0.15);
          g2.gain.setValueAtTime(0.001, now);
          g2.gain.linearRampToValueAtTime(0.15 * soundVolume, now + 0.3);
          g2.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
          osc2.connect(g2); osc2.start(now + 0.1); osc2.stop(now + 0.8);
        } else {
          // Rising chime — three ascending notes
          [440, 554, 659].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = freq;
            const ng = makeGain(ctx, 0.15);
            ng.gain.setValueAtTime(0.001, now + i * 0.1);
            ng.gain.linearRampToValueAtTime(0.15 * soundVolume, now + i * 0.1 + 0.03);
            ng.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.2);
            osc.connect(ng); osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.2);
          });
        }
      });
    }

    function sfxBaseDamage(isBossDmg) {
      playSound(ctx => {
        const now = ctx.currentTime;
        const vol = isBossDmg ? 0.35 : 0.25;
        const g = makeGain(ctx, vol);
        // Impact thud
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(isBossDmg ? 60 : 100, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
        g.gain.setValueAtTime(vol * soundVolume, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(g); osc.start(now); osc.stop(now + 0.3);
        // Crunch noise
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i/d.length) * 0.8;
        const ns = ctx.createBufferSource(); ns.buffer = buf;
        const ng = makeGain(ctx, vol * 0.6);
        ns.connect(ng); ns.start(now); ns.stop(now + 0.1);
      });
    }

    function sfxGameOver() {
      playSound(ctx => {
        const now = ctx.currentTime;
        // Descending tones
        [440, 350, 260, 180].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          const g = makeGain(ctx, 0.2);
          osc.frequency.value = freq;
          g.gain.setValueAtTime(0.001, now + i * 0.15);
          g.gain.linearRampToValueAtTime(0.2 * soundVolume, now + i * 0.15 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.3);
          osc.connect(g); osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.3);
        });
        // Final low rumble
        const osc = ctx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = 50;
        const g = makeGain(ctx, 0.25);
        g.gain.setValueAtTime(0.001, now + 0.5);
        g.gain.linearRampToValueAtTime(0.25 * soundVolume, now + 0.6);
        g.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
        osc.connect(g); osc.start(now + 0.5); osc.stop(now + 1.5);
      });
    }

    function sfxLevelUp() {
      playSound(ctx => {
        const now = ctx.currentTime;
        // Triumphant ascending arpeggio
        [523, 659, 784, 1047].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const g = makeGain(ctx, 0.18);
          g.gain.setValueAtTime(0.001, now + i * 0.08);
          g.gain.linearRampToValueAtTime(0.18 * soundVolume, now + i * 0.08 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
          osc.connect(g); osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.25);
        });
      });
    }

    function sfxPlaceCannon() {
      playSound(ctx => {
        const now = ctx.currentTime;
        const g = makeGain(ctx, 0.2);
        // Mechanical clunk + rising tone
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);

    // ═══════════════════════════════════════════════════
    //  Seeded PRNG (mulberry32)
    // ═══════════════════════════════════════════════════
    function mulberry32(seed) {
      return function() {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function getCannonStats(level, path, spec) {
      let dmg = 1, fireRate = 1, range = 120, aoeSplash = 0, pierce = 0, chain = 0, slowPct = 0;
      // Per-level scaling
      const lvlMult = 1 + (level - 1) * 0.10;
      const rangeMult = 1 + (level - 1) * 0.05;
      dmg *= lvlMult;
      range *= rangeMult;

      if (path === 'rapid') { fireRate = 1.8; dmg *= 0.7; }
      if (path === 'power') { fireRate = 0.6; dmg *= 1.8; }
      if (path === 'tech')  { fireRate = 0.8; dmg *= 0.9; slowPct = 0.3; }

      if (spec === 'gatling')  { fireRate = 3.0; dmg *= 0.5; }
      if (spec === 'sniper')   { fireRate = 0.4; dmg *= 3.0; range *= 1.6; }
      if (spec === 'cannon')   { aoeSplash = 50; dmg *= 1.2; }
      if (spec === 'railgun')  { pierce = 3; dmg *= 1.1; }
      if (spec === 'tesla')    { chain = 3; dmg *= 0.8; }
      if (spec === 'frost')    { slowPct = 0.6; range *= 1.2; }

      return { dmg, fireRate, range, aoeSplash, pierce, chain, slowPct };
    }

    function getCannonColor(path, spec) {
      if (spec && SPECS[spec]) return SPECS[spec].color;
      if (path && PATHS[path]) return PATHS[path].color;

    // ═══════════════════════════════════════════════════
    //  Path System
    // ═══════════════════════════════════════════════════
    let currentPath = null;
    let currentPathLength = 0;

    function generatePath(waveNum) {
      const rng = mulberry32(waveNum * 4219);
      const numPoints = 4 + Math.floor(rng() * 3); // 4-6 waypoints
      const path = [];
      // Start off-screen
      path.push({ x: 60 + rng() * (CANVAS_W - 120), y: -20 });
      // Intermediate waypoints — zigzag
      for (let i = 1; i < numPoints - 1; i++) {
        const yFrac = i / (numPoints - 1);
        const y = yFrac * (BASE_Y + 20) - 20;
        // Alternate sides for zigzag
        let x;
        if (i % 2 === 1) {
          x = 60 + rng() * (CANVAS_W / 2 - 80); // left side
        } else {
          x = CANVAS_W / 2 + 20 + rng() * (CANVAS_W / 2 - 80); // right side
        }
        path.push({ x, y });
      }
      // End at base
      path.push({ x: 60 + rng() * (CANVAS_W - 120), y: BASE_Y });
      return path;
    }

    function getPathLength(path) {
      let len = 0;
      for (let i = 1; i < path.length; i++) {
        len += Math.hypot(path[i].x - path[i-1].x, path[i].y - path[i-1].y);
      }
      return len;
    }

    function getPathPosition(path, progress) {
      if (!path || path.length < 2) return { x: CANVAS_W / 2, y: -20 };
      const totalLen = currentPathLength || getPathLength(path);
      const targetDist = progress * totalLen;

      if (progress <= 0) {
        // Extrapolate backward from first segment
        const dx = path[1].x - path[0].x;
        const dy = path[1].y - path[0].y;
        const segLen = Math.hypot(dx, dy) || 1;
        return {
          x: path[0].x - (dx / segLen) * (-targetDist),
          y: path[0].y - (dy / segLen) * (-targetDist)
        };
      }

      let traveled = 0;
      for (let i = 1; i < path.length; i++) {
        const dx = path[i].x - path[i-1].x;
        const dy = path[i].y - path[i-1].y;
        const segLen = Math.hypot(dx, dy);
        if (traveled + segLen >= targetDist) {
          const t = (targetDist - traveled) / (segLen || 1);
          return {
            x: path[i-1].x + dx * t,
            y: path[i-1].y + dy * t
          };
        }
        traveled += segLen;
      }
      // Past end
      return { x: path[path.length - 1].x, y: path[path.length - 1].y };
    }

    // ═══════════════════════════════════════════════════
    //  Terrain Hazard Generation (deterministic per wave)
    // ═══════════════════════════════════════════════════
    const HAZARD_TYPES = [
      { type: 'swamp',     color: '#2d5a27', glowColor: '45,90,39',   label: '🌿 Swamp',    radius: 45, slowMult: 0.4 },
      { type: 'lava',      color: '#8b2500', glowColor: '200,60,20',  label: '🔥 Lava',     radius: 40, dps: 0.15 },
      { type: 'lightning',  color: '#4a2d8b', glowColor: '120,80,200', label: '⚡ Storm',    radius: 38, minWave: 8 }
    ];

    function generateHazards(waveNum, path, pathLength) {
      const rng = mulberry32(waveNum * 3571);
      const hazards = [];
      // Number of hazards scales with wave: 1 at wave 1-4, 2 at 5-9, 3 at 10+
      const numHazards = waveNum < 5 ? 1 : waveNum < 10 ? 2 : 3;
      const available = HAZARD_TYPES.filter(h => !h.minWave || waveNum >= h.minWave);

      for (let i = 0; i < numHazards; i++) {
        const ht = available[Math.floor(rng() * available.length)];
        // Place hazard between 15% and 85% of the path to avoid spawn/base areas
        const progress = 0.15 + rng() * 0.70;
        const pos = getPathPosition(path, progress);
        hazards.push({
          type: ht.type,
          x: pos.x,
          y: pos.y,
          radius: ht.radius + rng() * 15, // slight size variation
          progress: progress,
          color: ht.color,
          glowColor: ht.glowColor,
          label: ht.label,
          slowMult: ht.slowMult || 1,
          dps: ht.dps || 0,
          animOffset: rng() * Math.PI * 2 // for animation phase offset
        });
      }
      return hazards;
    }

    // ═══════════════════════════════════════════════════
    //  Wave Generation (deterministic)
    // ═══════════════════════════════════════════════════
    function generateWave(waveNum) {
      // Generate path for this wave
      currentPath = generatePath(waveNum);
      currentPathLength = getPathLength(currentPath);

      // Generate terrain hazards for this wave
      terrainHazards = generateHazards(waveNum, currentPath, currentPathLength);

      const rng = mulberry32(waveNum * 7919);
      const count = 8 + waveNum * 3;
      const baseHp = 1 + waveNum * 0.15;
      const isBossWave = waveNum % 10 === 0 && waveNum > 0;
      const available = ENEMY_TYPES.filter(e => {
        if (e.type === 'boss') return isBossWave;
        return e.wave <= waveNum;
      });

      const enemies = [];
      const spacing = 0.04; // progress spacing between enemies
      for (let i = 0; i < count; i++) {
        const et = available[Math.floor(rng() * available.length)];
        const startProgress = -(i * spacing) - (rng() * spacing * 0.5);
        const pos = getPathPosition(currentPath, startProgress);
        enemies.push({
          id: `w${waveNum}_e${i}`,
          type: et.type,
          x: pos.x,
          y: pos.y,
          pathProgress: startProgress,
          hp: baseHp * et.hpMult,
          maxHp: baseHp * et.hpMult,
          speed: et.speed,
          color: et.color,
          shape: et.shape,
          radius: et.radius,
          slowTimer: 0
        });
      }
      // Add boss
      if (isBossWave) {
        const boss = ENEMY_TYPES.find(e => e.type === 'boss');
        const bossProgress = -(count * spacing) - 0.15;
        const pos = getPathPosition(currentPath, bossProgress);
        enemies.push({
          id: `w${waveNum}_boss`,
          type: 'boss',
          x: pos.x,
          y: pos.y,
          pathProgress: bossProgress,
          hp: baseHp * boss.hpMult,
          maxHp: baseHp * boss.hpMult,
          speed: boss.speed,
          baseSpeed: boss.speed,
          color: boss.color,
          shape: boss.shape,
          radius: boss.radius,
          slowTimer: 0,
          // Boss phase mechanics
          bossPhase: 0,        // 0=normal, 1=shielded, 2=summoned, 3=enraged
          shieldHp: 0,         // absorbs damage before HP
          shieldMaxHp: 0,
          enraged: false,
          summonDone: false,
          phaseFlashTimer: 0   // visual flash on phase transition
        });
      }
      return enemies;
    }
