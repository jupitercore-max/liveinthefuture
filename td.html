<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tower Defense — rayhe.net</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-light: #16213e;
      --card-bg: #0f3460;
      --text: #e0e0e0;
      --text-muted: #8888aa;
      --accent: #1E90FF;
      --accent-glow: rgba(30,144,255,0.3);
      --danger: #e74c3c;
      --success: #22c55e;
      --border: #2a2a4a;
      --radius: 6px;
      --font-mono: 'SF Mono', 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ─── Header ─────────────────────────────────────── */
    .header {
      width: 100%;
      max-width: 740px;
      padding: 16px 20px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header .back { font-size: 0.8rem; color: var(--text-muted); }
    .header h1 { font-size: 1.1rem; font-weight: 600; }

    /* ─── Avatar Button (in controls) ────────────────── */
    .avatar-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 16px;
      line-height: 1;
      transition: border-color 0.2s;
    }
    .avatar-btn:hover { border-color: var(--accent); }
    .avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-input { display: none; }

    /* ─── Game Screen ────────────────────────────────── */
    #gameScreen { width: 100%; max-width: 740px; padding: 0 10px 20px; }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 6px;
    }
    .hud-item { display: flex; align-items: center; gap: 4px; }
    .hud-val { color: var(--text); font-weight: 600; }

    .canvas-wrap {
      width: 100%;
      position: relative;
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: crosshair;
    }

    /* ─── Control Bar ────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .ctrl-btn:disabled { opacity: 0.4; cursor: default; }
    .ctrl-btn:disabled:hover { background: var(--card-bg); color: var(--text); border-color: var(--border); }
    .xp-bar-wrap {
      flex: 1;
      min-width: 100px;
      height: 14px;
      background: var(--bg);
      border-radius: 7px;
      overflow: hidden;
      position: relative;
    }
    .xp-bar-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
      border-radius: 7px;
    }
    .xp-bar-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: #fff;
      text-shadow: 0 0 3px rgba(0,0,0,0.8);
    }
    .cannon-info {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* ─── Upgrade Modal ──────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 480px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h2 {
      font-size: 1rem;
      margin-bottom: 16px;
      text-align: center;
      color: var(--accent);
    }
    .upgrade-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .upgrade-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upgrade-card:hover {
      border-color: var(--accent);
      background: var(--card-bg);
    }
    .upgrade-card .uc-name {
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }
    .upgrade-card .uc-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .modal-close {
      display: block;
      margin: 16px auto 0;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 20px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .modal-close:hover { border-color: var(--text-muted); }

    /* ─── Player List Panel ──────────────────────────── */
    .player-panel {
      display: none;
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 8px;
    }
    .player-panel.active { display: block; }
    .player-panel h3 {
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .player-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 0.75rem;
    }
    .player-row .p-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--card-bg);
    }
    .player-row .p-name { flex: 1; }
    .player-row .p-level { color: var(--accent); }
    .player-row .p-kills { color: var(--text-muted); }
    .player-online { color: var(--success); }
    .player-offline { color: var(--text-muted); opacity: 0.5; }

    /* ─── Wave Announcement ──────────────────────────── */
    .wave-announce {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      pointer-events: none;
      z-index: 10;
    }
    .wave-announce.active { display: flex; }
    .wave-announce .wa-text {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
      animation: wavePulse 0.8s ease-in-out;
    }
    .wave-announce .wa-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    @keyframes wavePulse {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ─── Base HP ────────────────────────────────────── */
    .hud-hp { transition: color 0.2s; }
    .hud-hp.damaged {
      color: var(--danger);
      animation: hpPulse 0.4s ease-out;
    }
    @keyframes hpPulse {
      0% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
    .damage-flash {
      position: absolute;
      inset: 0;
      background: rgba(231,76,60,0.25);
      pointer-events: none;
      z-index: 9;
      animation: damageFlash 0.4s ease-out forwards;
    }
    @keyframes damageFlash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    .game-over-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0,0,0,0.75);
      z-index: 20;
    }
    .game-over-overlay.active { display: flex; }
    .game-over-overlay .go-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--danger);
      margin-bottom: 8px;
    }
    .game-over-overlay .go-stats {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .game-over-overlay .go-restart {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 10px 28px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s;
    }
    .game-over-overlay .go-restart:hover { background: #c0392b; }

    /* ─── Combo Counter ──────────────────────────────── */
    .combo-display {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255,215,0,0.6), 0 0 24px rgba(255,215,0,0.3);
      pointer-events: none;
      z-index: 11;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .combo-display.active {
      opacity: 1;
      animation: comboShake 0.15s ease-out;
    }
    .combo-display .combo-num {
      font-size: 1.8rem;
      display: inline-block;
    }
    .combo-display .combo-label {
      font-size: 0.7rem;
      color: #ffaa00;
      display: block;
      text-align: center;
    }
    @keyframes comboShake {
      0% { transform: scale(1.3); }
      50% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    /* ─── Wave Preview ───────────────────────────────── */
    .wave-preview {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(30,144,255,0.3);
      border-radius: 8px;
      z-index: 12;
      pointer-events: none;
      animation: previewFadeIn 0.4s ease-out;
      flex-wrap: wrap;
      max-width: 90%;
    }
    .wave-preview.active { display: flex; }
    .wave-preview-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      width: 100%;
      text-align: center;
      margin-bottom: 2px;
    }
    .wave-preview-enemy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
    }
    .wave-preview-enemy canvas {
      width: 28px;
      height: 28px;
      cursor: default;
    }
    .wave-preview-enemy .wpe-name {
      font-size: 0.55rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .wave-preview-enemy .wpe-count {
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text);
    }
    @keyframes previewFadeIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ─── Send Next / Early Wave ──────────────────────── */
    .send-next-btn:not(:disabled) {
      border-color: var(--success);
      color: var(--success);
    }
    .send-next-btn:not(:disabled):hover {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }
    .send-bonus-popup {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--success);
      text-shadow: 0 0 12px rgba(34,197,94,0.6), 0 0 24px rgba(34,197,94,0.3);
      pointer-events: none;
      z-index: 13;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .send-bonus-popup.active {
      opacity: 1;
      animation: bonusPopIn 0.3s ease-out;
    }
    @keyframes bonusPopIn {
      0% { transform: translateX(-50%) scale(1.5); opacity: 0; }
      50% { transform: translateX(-50%) scale(0.95); }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }
    .send-next-btn .sn-bonus {
      font-size: 0.6rem;
      color: var(--success);
      margin-left: 4px;
      opacity: 0.8;
    }

    /* ─── Speed Controls ─────────────────────────────── */
    .speed-controls {
      display: flex;
      gap: 2px;
      background: var(--bg);
      border-radius: var(--radius);
      padding: 2px;
      border: 1px solid var(--border);
    }
    .speed-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
      font-weight: 600;
    }
    .speed-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .speed-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* ─── Ability Button ─────────────────────────────── */
    .ability-btn {
      background: linear-gradient(135deg, var(--card-bg), #1a1a3e);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }
    .ability-btn:hover:not(:disabled) {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .ability-btn:disabled {
      opacity: 0.5;
      cursor: default;
      border-color: var(--border);
    }
    .ability-btn.targeting {
      background: var(--accent);
      color: #fff;
      animation: abilityPulse 0.8s ease-in-out infinite;
    }
    .ability-btn .ab-cooldown {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--accent);
      transition: width 0.1s linear;
    }
    .ability-btn .ab-key {
      font-size: 0.6rem;
      color: var(--text-muted);
      margin-left: 4px;
      opacity: 0.6;
    }
    @keyframes abilityPulse {
      0%, 100% { box-shadow: 0 0 4px var(--accent-glow); }
      50% { box-shadow: 0 0 16px var(--accent-glow); }
    }

    /* ─── Sell Button ─────────────────────────────────── */
    .sell-btn:not(:disabled) {
      border-color: var(--danger);
      color: var(--danger);
    }
    .sell-btn:not(:disabled):hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .sell-confirm-card {
      border-color: var(--danger) !important;
    }
    .sell-confirm-card:hover {
      background: rgba(231,76,60,0.15) !important;
      border-color: var(--danger) !important;
    }
    .sell-refund {
      color: var(--success);
      font-weight: 600;
    }
    .sell-warning {
      color: var(--danger);
      font-size: 0.7rem;
      margin-top: 4px;
    }

    /* ─── Ability targeting crosshair ────────────────── */
    .canvas-targeting {
      cursor: crosshair !important;
    }

    /* ─── Ability zone indicators (on canvas) ────────── */

    /* ─── Speed Indicator (on canvas) ────────────────── */
    .speed-indicator {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      pointer-events: none;
      z-index: 11;
      opacity: 0;
      transition: opacity 0.3s;
      text-shadow: 0 0 8px var(--accent-glow);
    }
    .speed-indicator.active { opacity: 1; }

    /* ─── Screen Shake ───────────────────────────────── */
    .canvas-wrap.shake {
      animation: screenShake 0.3s ease-out;
    }
    .canvas-wrap.shake-heavy {
      animation: screenShakeHeavy 0.5s ease-out;
    }
    @keyframes screenShake {
      0% { transform: translate(0, 0); }
      15% { transform: translate(-3px, 2px); }
      30% { transform: translate(3px, -2px); }
      45% { transform: translate(-2px, 1px); }
      60% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, 1px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes screenShakeHeavy {
      0% { transform: translate(0, 0); }
      10% { transform: translate(-6px, 4px); }
      20% { transform: translate(5px, -3px); }
      30% { transform: translate(-4px, 5px); }
      40% { transform: translate(4px, -2px); }
      50% { transform: translate(-3px, 3px); }
      60% { transform: translate(3px, -2px); }
      70% { transform: translate(-2px, 1px); }
      80% { transform: translate(1px, -1px); }
      100% { transform: translate(0, 0); }
    }

    /* ─── Responsive ─────────────────────────────────── */
    @media (max-width: 600px) {
      .header h1 { font-size: 0.95rem; }
      .start-title { font-size: 1.4rem; }
      .hud { font-size: 0.65rem; }
      .controls { font-size: 0.65rem; }
      .wave-announce .wa-text { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back">&larr; home</a>
    <h1>Tower Defense</h1>
  </div>

  <!-- ─── Game Screen ──────────────────────────────── -->
  <div id="gameScreen">
    <div class="hud">
      <div class="hud-item">❤️ <span class="hud-val hud-hp" id="hudBaseHp">20</span></div>
      <div class="hud-item">Wave <span class="hud-val" id="hudWave">1</span></div>
      <div class="hud-item">Enemies <span class="hud-val" id="hudEnemies">0</span></div>
      <div class="hud-item">Kills <span class="hud-val" id="hudKills">0</span></div>
      <div class="hud-item">Online <span class="hud-val" id="hudOnline">1</span></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="700" height="500"></canvas>
      <div class="wave-announce" id="waveAnnounce">
        <div class="wa-text" id="waText"></div>
        <div class="wa-sub" id="waSub"></div>
      </div>
      <div class="combo-display" id="comboDisplay">
        <span class="combo-num" id="comboNum">2</span><span>× COMBO</span>
        <span class="combo-label" id="comboLabel">+2 XP</span>
      </div>
      <div class="speed-indicator" id="speedIndicator">▶▶ 2×</div>
      <div class="game-over-overlay" id="gameOverOverlay">
        <div class="go-title">GAME OVER</div>
        <div class="go-stats" id="goStats">Wave 1 · 0 kills</div>
        <button class="go-restart" id="goRestart">Play Again</button>
      </div>
      <div class="wave-preview" id="wavePreview">
        <div class="wave-preview-label">INCOMING ENEMIES</div>
      </div>
      <div class="send-bonus-popup" id="sendBonusPopup"></div>
    </div>

    <div class="controls">
      <div class="avatar-btn" id="avatarBtn" title="Upload avatar"></div>
      <input type="file" accept="image/*" class="avatar-input" id="avatarInput">
      <span class="cannon-info" id="cannonInfo">Lv1 Basic</span>
      <div class="xp-bar-wrap">
        <div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div>
        <div class="xp-bar-text" id="xpBarText">0 / 50 XP</div>
      </div>
      <button class="ctrl-btn" id="upgradeBtn" disabled>Upgrade</button>
      <button class="ability-btn" id="abilityBtn" disabled>⚡ Power Shot<span class="ab-key">[Q]</span><div class="ab-cooldown" id="abCooldownBar"></div></button>
      <div class="speed-controls" id="speedControls">
        <button class="speed-btn active" data-speed="1">1×</button>
        <button class="speed-btn" data-speed="2">2×</button>
        <button class="speed-btn" data-speed="3">3×</button>
      </div>
      <button class="ctrl-btn send-next-btn" id="sendNextBtn" disabled>⏩ Send Next <span class="ab-key">[E]</span></button>
      <button class="ctrl-btn" id="relocateBtn">Relocate</button>
      <button class="ctrl-btn sell-btn" id="sellBtn" disabled>🗑 Sell</button>
      <button class="ctrl-btn" id="playersBtn">Players</button>
    </div>

    <div class="player-panel" id="playerPanel">
      <h3>Players</h3>
      <div id="playerList"></div>
    </div>
  </div>

  <!-- ─── Upgrade Modal ────────────────────────────── -->
  <div class="modal-overlay" id="upgradeModal">
    <div class="modal">
      <h2 id="upgradeTitle">Choose Upgrade Path</h2>
      <div class="upgrade-cards" id="upgradeCards"></div>
      <button class="modal-close" id="upgradeClose">Cancel</button>
    </div>
  </div>

  <script src="firebase-shared.js"></script>
  <script>
  (() => {
    'use strict';

    // ═══════════════════════════════════════════════════
    //  Constants & Config
    // ═══════════════════════════════════════════════════
    const CANVAS_W = 700, CANVAS_H = 500;
    const BASE_Y = CANVAS_H - 30;
    const PLACEMENT_MIN_Y = 300;
    const MIN_CANNON_SPACING = 40;
    const RELOCATE_COOLDOWN = 30000;
    const TICK_RATE = 20; // ticks per second
    const TICK_MS = 1000 / TICK_RATE;
    const SNAPSHOT_INTERVAL = 40; // ticks between snapshots (2s)
    const LEADER_HEARTBEAT_MS = 2000;
    const LEADER_STALE_MS = 6000;
    const STALE_CANNON_DAYS = 30;
    const XP_PER_LEVEL = lvl => lvl * 50;
    const BASE_MAX_HP = 20;
    const BOSS_DAMAGE = 3;
    const HP_REGEN_PER_WAVE = 1;

    // ═══════════════════════════════════════════════════
    //  Seeded PRNG (mulberry32)
    // ═══════════════════════════════════════════════════
    function mulberry32(seed) {
      return function() {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // ═══════════════════════════════════════════════════
    //  Upgrade Tree Definitions
    // ═══════════════════════════════════════════════════
    const PATHS = {
      rapid: { name: 'Rapid', color: '#ff6b35', desc: 'Fast fire rate' },
      power: { name: 'Power', color: '#e74c3c', desc: 'High damage' },
      tech:  { name: 'Tech',  color: '#9b59b6', desc: 'Utility & slow' }
    };
    const SPECS = {
      gatling:  { path: 'rapid', name: 'Gatling',  color: '#ff8c42', desc: 'Extreme fire rate' },
      sniper:   { path: 'rapid', name: 'Sniper',   color: '#ff4500', desc: 'Long range, high single-target' },
      cannon:   { path: 'power', name: 'Cannon',   color: '#c0392b', desc: 'Area-of-effect damage' },
      railgun:  { path: 'power', name: 'Railgun',  color: '#e74c3c', desc: 'Piercing shots' },
      tesla:    { path: 'tech',  name: 'Tesla',    color: '#8e44ad', desc: 'Chain lightning' },
      frost:    { path: 'tech',  name: 'Frost',    color: '#5dade2', desc: 'Slow field' }
    };

    function getCannonStats(level, path, spec) {
      let dmg = 1, fireRate = 1, range = 120, aoeSplash = 0, pierce = 0, chain = 0, slowPct = 0;
      // Per-level scaling
      const lvlMult = 1 + (level - 1) * 0.10;
      const rangeMult = 1 + (level - 1) * 0.05;
      dmg *= lvlMult;
      range *= rangeMult;

      if (path === 'rapid') { fireRate = 1.8; dmg *= 0.7; }
      if (path === 'power') { fireRate = 0.6; dmg *= 1.8; }
      if (path === 'tech')  { fireRate = 0.8; dmg *= 0.9; slowPct = 0.3; }

      if (spec === 'gatling')  { fireRate = 3.0; dmg *= 0.5; }
      if (spec === 'sniper')   { fireRate = 0.4; dmg *= 3.0; range *= 1.6; }
      if (spec === 'cannon')   { aoeSplash = 50; dmg *= 1.2; }
      if (spec === 'railgun')  { pierce = 3; dmg *= 1.1; }
      if (spec === 'tesla')    { chain = 3; dmg *= 0.8; }
      if (spec === 'frost')    { slowPct = 0.6; range *= 1.2; }

      return { dmg, fireRate, range, aoeSplash, pierce, chain, slowPct };
    }

    function getCannonColor(path, spec) {
      if (spec && SPECS[spec]) return SPECS[spec].color;
      if (path && PATHS[path]) return PATHS[path].color;
      return '#1E90FF';
    }

    function getCannonLabel(level, path, spec) {
      let name = 'Basic';
      if (spec && SPECS[spec]) name = SPECS[spec].name;
      else if (path && PATHS[path]) name = PATHS[path].name;
      return `Lv${level} ${name}`;
    }

    // ═══════════════════════════════════════════════════
    //  Enemy Type Definitions
    // ═══════════════════════════════════════════════════
    const ENEMY_TYPES = [
      { type: 'scout',    wave: 1,  hpMult: 1.0, speed: 2.0, color: '#e74c3c', shape: 'circle',   radius: 6  },
      { type: 'grunt',    wave: 1,  hpMult: 1.5, speed: 1.5, color: '#f39c12', shape: 'circle',   radius: 8  },
      { type: 'tank',     wave: 5,  hpMult: 4.0, speed: 0.8, color: '#9b59b6', shape: 'hexagon',  radius: 12 },
      { type: 'speedster',wave: 10, hpMult: 0.8, speed: 3.5, color: '#2ecc71', shape: 'diamond',  radius: 7  },
      { type: 'shielded', wave: 15, hpMult: 3.0, speed: 1.2, color: '#3498db', shape: 'shielded', radius: 10 },
      { type: 'boss',     wave: 10, hpMult: 15,  speed: 0.5, color: '#8b0000', shape: 'octagon',  radius: 16 }
    ];

    // ═══════════════════════════════════════════════════
    //  Path System
    // ═══════════════════════════════════════════════════
    let currentPath = null;
    let currentPathLength = 0;

    function generatePath(waveNum) {
      const rng = mulberry32(waveNum * 4219);
      const numPoints = 4 + Math.floor(rng() * 3); // 4-6 waypoints
      const path = [];
      // Start off-screen
      path.push({ x: 60 + rng() * (CANVAS_W - 120), y: -20 });
      // Intermediate waypoints — zigzag
      for (let i = 1; i < numPoints - 1; i++) {
        const yFrac = i / (numPoints - 1);
        const y = yFrac * (BASE_Y + 20) - 20;
        // Alternate sides for zigzag
        let x;
        if (i % 2 === 1) {
          x = 60 + rng() * (CANVAS_W / 2 - 80); // left side
        } else {
          x = CANVAS_W / 2 + 20 + rng() * (CANVAS_W / 2 - 80); // right side
        }
        path.push({ x, y });
      }
      // End at base
      path.push({ x: 60 + rng() * (CANVAS_W - 120), y: BASE_Y });
      return path;
    }

    function getPathLength(path) {
      let len = 0;
      for (let i = 1; i < path.length; i++) {
        len += Math.hypot(path[i].x - path[i-1].x, path[i].y - path[i-1].y);
      }
      return len;
    }

    function getPathPosition(path, progress) {
      if (!path || path.length < 2) return { x: CANVAS_W / 2, y: -20 };
      const totalLen = currentPathLength || getPathLength(path);
      const targetDist = progress * totalLen;

      if (progress <= 0) {
        // Extrapolate backward from first segment
        const dx = path[1].x - path[0].x;
        const dy = path[1].y - path[0].y;
        const segLen = Math.hypot(dx, dy) || 1;
        return {
          x: path[0].x - (dx / segLen) * (-targetDist),
          y: path[0].y - (dy / segLen) * (-targetDist)
        };
      }

      let traveled = 0;
      for (let i = 1; i < path.length; i++) {
        const dx = path[i].x - path[i-1].x;
        const dy = path[i].y - path[i-1].y;
        const segLen = Math.hypot(dx, dy);
        if (traveled + segLen >= targetDist) {
          const t = (targetDist - traveled) / (segLen || 1);
          return {
            x: path[i-1].x + dx * t,
            y: path[i-1].y + dy * t
          };
        }
        traveled += segLen;
      }
      // Past end
      return { x: path[path.length - 1].x, y: path[path.length - 1].y };
    }

    // ═══════════════════════════════════════════════════
    //  Wave Generation (deterministic)
    // ═══════════════════════════════════════════════════
    function generateWave(waveNum) {
      // Generate path for this wave
      currentPath = generatePath(waveNum);
      currentPathLength = getPathLength(currentPath);

      const rng = mulberry32(waveNum * 7919);
      const count = 8 + waveNum * 3;
      const baseHp = 1 + waveNum * 0.15;
      const isBossWave = waveNum % 10 === 0 && waveNum > 0;
      const available = ENEMY_TYPES.filter(e => {
        if (e.type === 'boss') return isBossWave;
        return e.wave <= waveNum;
      });

      const enemies = [];
      const spacing = 0.04; // progress spacing between enemies
      for (let i = 0; i < count; i++) {
        const et = available[Math.floor(rng() * available.length)];
        const startProgress = -(i * spacing) - (rng() * spacing * 0.5);
        const pos = getPathPosition(currentPath, startProgress);
        enemies.push({
          id: `w${waveNum}_e${i}`,
          type: et.type,
          x: pos.x,
          y: pos.y,
          pathProgress: startProgress,
          hp: baseHp * et.hpMult,
          maxHp: baseHp * et.hpMult,
          speed: et.speed,
          color: et.color,
          shape: et.shape,
          radius: et.radius,
          slowTimer: 0
        });
      }
      // Add boss
      if (isBossWave) {
        const boss = ENEMY_TYPES.find(e => e.type === 'boss');
        const bossProgress = -(count * spacing) - 0.15;
        const pos = getPathPosition(currentPath, bossProgress);
        enemies.push({
          id: `w${waveNum}_boss`,
          type: 'boss',
          x: pos.x,
          y: pos.y,
          pathProgress: bossProgress,
          hp: baseHp * boss.hpMult,
          maxHp: baseHp * boss.hpMult,
          speed: boss.speed,
          color: boss.color,
          shape: boss.shape,
          radius: boss.radius,
          slowTimer: 0
        });
      }
      return enemies;
    }

    // ═══════════════════════════════════════════════════
    //  Game State
    // ═══════════════════════════════════════════════════
    let playerId = null;
    let playerName = '';
    let playerAvatar = null; // data URL
    let db = null;
    let isLeader = false;
    let leaderCheckTimer = null;
    let heartbeatTimer = null;
    let simTimer = null;
    let tickCount = 0;

    // Game data
    let waveNumber = 1;
    let waveState = 'waiting'; // waiting, active, countdown, failed, gameover
    let baseHp = BASE_MAX_HP;
    let totalKills = 0;
    let damageFlashTimer = 0; // frames remaining for red flash
    let enemies = [];
    let cannons = {}; // id -> cannon data
    let projectiles = []; // client-side visual only
    let particles = []; // death particles
    let onlinePlayers = {};
    let lastRelocateTime = 0;
    let countdownTimer = 0;
    let countdownStartedAt = 0; // timestamp for non-leader countdown display
    let waveAnnounceTimer = 0;
    let lastWaveState = 'waiting'; // track waveState changes for non-leader announcements
    let visualFireTimers = {}; // cannonId -> ms since last visual fire
    let lastVisualTick = 0; // for visual fire timing
    let myCannonFireTimers = {}; // cannonId -> ticks since last fire
    let scorePopups = []; // floating score text
    let comboCount = 0; // current combo count
    let comboTimer = 0; // ticks remaining before combo resets
    let comboXpBonus = 0; // total bonus XP from current combo
    let gameSpeed = 1; // 1, 2, or 3
    let abilityCooldownLeft = 0; // seconds remaining on ability cooldown
    let abilityTargeting = false; // waiting for canvas click to target
    let abilityZones = []; // visual effect zones on canvas
    let earlySendBonusPct = 0; // current bonus XP percentage from early sends
    let earlySendCount = 0; // how many consecutive early sends
    let bonusPopupTimer = 0; // ticks to show bonus popup
    const COMBO_WINDOW = TICK_RATE * 1.5; // 1.5s to chain kills
    const COMBO_MIN = 2; // minimum kills to show combo

    // Firebase refs
    let metaRef, leaderRef, stateRef, cannonsRef, playersRef;

    // ═══════════════════════════════════════════════════
    //  DOM Elements
    // ═══════════════════════════════════════════════════
    const $ = id => document.getElementById(id);
    const canvas = $('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hudWave = $('hudWave');
    const hudEnemies = $('hudEnemies');
    const hudKills = $('hudKills');
    const hudOnline = $('hudOnline');
    const hudBaseHp = $('hudBaseHp');
    const cannonInfo = $('cannonInfo');
    const xpBarFill = $('xpBarFill');
    const xpBarText = $('xpBarText');
    const upgradeBtn = $('upgradeBtn');
    const relocateBtn = $('relocateBtn');
    const playersBtn = $('playersBtn');
    const playerPanel = $('playerPanel');
    const playerList = $('playerList');
    const upgradeModal = $('upgradeModal');
    const upgradeTitle = $('upgradeTitle');
    const upgradeCards = $('upgradeCards');
    const upgradeClose = $('upgradeClose');
    const waveAnnounce = $('waveAnnounce');
    const waText = $('waText');
    const waSub = $('waSub');
    const gameOverOverlay = $('gameOverOverlay');
    const goStats = $('goStats');
    const goRestart = $('goRestart');
    const avatarBtn = $('avatarBtn');
    const avatarInput = $('avatarInput');
    const gameScreen = $('gameScreen');
    const comboDisplay = $('comboDisplay');
    const comboNum = $('comboNum');
    const comboLabel = $('comboLabel');
    const wavePreview = $('wavePreview');
    const canvasWrap = document.querySelector('.canvas-wrap');
    const speedControls = $('speedControls');
    const speedIndicator = $('speedIndicator');

    const sendBonusPopup = $('sendBonusPopup');
    const sellBtn = $('sellBtn');

    // ═══════════════════════════════════════════════════
    //  Default Emoji Avatars
    // ═══════════════════════════════════════════════════
    const EMOJI_AVATARS = ['🐺','🐉','🦅','🐙','🔥','🌟','🗡️','🛡️','🏹','🦊','🐻','🦁','🐯','🦇','🐍','🦈'];
    let playerEmoji = localStorage.getItem('td_emoji');
    if (!playerEmoji) {
      playerEmoji = EMOJI_AVATARS[Math.floor(Math.random() * EMOJI_AVATARS.length)];
      localStorage.setItem('td_emoji', playerEmoji);
    }

    function updateAvatarBtn() {
      if (playerAvatar) {
        avatarBtn.innerHTML = `<img src="${playerAvatar}" alt="avatar">`;
      } else {
        avatarBtn.textContent = playerEmoji;
      }
    }
    updateAvatarBtn();

    // ═══════════════════════════════════════════════════
    //  Avatar Upload
    // ═══════════════════════════════════════════════════
    avatarBtn.addEventListener('click', () => avatarInput.click());
    avatarInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = 64; c.height = 64;
          const cx = c.getContext('2d');
          // Center crop
          const size = Math.min(img.width, img.height);
          const sx = (img.width - size) / 2;
          const sy = (img.height - size) / 2;
          cx.drawImage(img, sx, sy, size, size, 0, 0, 64, 64);
          let dataUrl = c.toDataURL('image/png');
          // If too large, compress as JPEG
          if (dataUrl.length > 10000) {
            dataUrl = c.toDataURL('image/jpeg', 0.5);
          }
          playerAvatar = dataUrl;
          localStorage.setItem('td_avatar', dataUrl);
          updateAvatarBtn();
          // Update Firebase cannon data if cannon exists
          if (db && cannons[playerId]) {
            cannonsRef.child(playerId).update({ avatar: dataUrl });
          }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Load saved avatar
    const savedAvatar = localStorage.getItem('td_avatar');
    if (savedAvatar) {
      playerAvatar = savedAvatar;
      updateAvatarBtn();
    }

    // ═══════════════════════════════════════════════════
    //  Single-Player / Offline Mode
    // ═══════════════════════════════════════════════════
    let offlineMode = false;
    let showPlacementHint = true; // show hint until first cannon placed

    function startOfflineMode() {
      offlineMode = true;
      isLeader = true; // always leader in offline mode
      playerId = playerId || 'local_' + Math.random().toString(36).slice(2);
      playerName = playerName || 'Player';
      console.log('[TD] Running in offline/single-player mode');

      // Register canvas events
      canvas.addEventListener('click', onCanvasClick);
      canvas.addEventListener('touchend', onCanvasTouchEnd);

      // Start render + sim loops
      lastVisualTick = performance.now();
      requestAnimationFrame(renderLoop);
      if (!simTimer) {
        simTimer = setInterval(simTick, TICK_MS / gameSpeed);
      }
    }

    function offlinePlaceCannon(x, y) {
      const existing = cannons[playerId];
      const isNewPlacement = !existing || !existing.x;
      cannons[playerId] = {
        x: Math.round(x),
        y: Math.round(y),
        level: existing?.level || 1,
        xp: existing?.xp || 0,
        kills: existing?.kills || 0,
        path: existing?.path || null,
        spec: existing?.spec || null,
        name: playerName,
        avatar: playerAvatar || null,
        emoji: playerEmoji,
        lastSeen: Date.now()
      };
      showPlacementHint = false;
      // Apply any banked sell refund XP to new cannons
      if (isNewPlacement) applySellRefund();
      updateCannonUI();
      // Start wave if waiting
      if (waveState === 'waiting' || waveState === 'paused') {
        startWaveCountdown();
      }
    }

    function offlineAwardXP(xpAmount = 1) {
      const c = cannons[playerId];
      if (!c || !c.x) return;
      const newXp = (c.xp || 0) + xpAmount;
      const level = c.level || 1;
      const needed = XP_PER_LEVEL(level);
      if (newXp >= needed) {
        c.xp = newXp - needed;
        c.level = level + 1;
      } else {
        c.xp = newXp;
      }
      c.kills = (c.kills || 0) + 1;
      updateCannonUI();
    }

    // ═══════════════════════════════════════════════════
    //  Firebase Init
    // ═══════════════════════════════════════════════════
    async function initFirebase() {
      // Auto-set a name if none exists (prevents prompt() dialog)
      if (!localStorage.getItem('rayhe_visitor_name')) {
        const autoName = 'Player_' + Math.random().toString(36).slice(2, 6);
        localStorage.setItem('rayhe_visitor_name', autoName);
      }

      try {
        await FirebaseShared.init('td', { presenceId: '_norender' });
        playerId = FirebaseShared.getVisitorId();
        playerName = FirebaseShared.getVisitorName() || 'Player';
      } catch (err) {
        console.warn('[TD] FirebaseShared.init failed, going offline:', err);
        startOfflineMode();
        return;
      }

      // Wait for firebase global
      if (typeof firebase === 'undefined' || !firebase.database) {
        console.warn('[TD] Firebase SDK not available, going offline');
        startOfflineMode();
        return;
      }
      db = firebase.database();
      metaRef = db.ref('td/meta');
      leaderRef = db.ref('td/leader');
      stateRef = db.ref('td/state');
      cannonsRef = db.ref('td/cannons');
      playersRef = db.ref('td/players');

      // Auto-join immediately
      joinGame();
    }

    // ═══════════════════════════════════════════════════
    //  Join Game
    // ═══════════════════════════════════════════════════
    function joinGame() {
      if (!db) return;

      // Register player presence
      const myPlayerRef = playersRef.child(playerId);
      myPlayerRef.set({
        name: playerName,
        online: true,
        lastSeen: firebase.database.ServerValue.TIMESTAMP
      });
      myPlayerRef.onDisconnect().update({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });

      // Listen for all cannons
      cannonsRef.on('value', snap => {
        const data = snap.val() || {};
        cannons = {};
        for (const [id, c] of Object.entries(data)) {
          cannons[id] = c;
          // Init fire timer if not present
          if (!(id in myCannonFireTimers)) myCannonFireTimers[id] = 0;
        }
        updatePlayerPanel();
        updateCannonUI();
      });

      // Listen for players
      playersRef.on('value', snap => {
        onlinePlayers = snap.val() || {};
        const onlineCount = Object.values(onlinePlayers).filter(p => p.online).length;
        hudOnline.textContent = onlineCount;
        updatePlayerPanel();
      });

      // Listen for meta
      metaRef.on('value', snap => {
        const meta = snap.val();
        if (meta) {
          waveNumber = meta.waveNumber || 1;
          if (!isLeader) {
            const prevState = waveState;
            waveState = meta.waveState || 'waiting';
            totalKills = meta.totalKills || 0;
            baseHp = meta.baseHp != null ? meta.baseHp : BASE_MAX_HP;
            updateBaseHpHUD();
            // Trigger wave announcement for non-leaders
            if (waveState === 'countdown' && prevState !== 'countdown') {
              showWaveAnnouncement(waveNumber);
              countdownStartedAt = Date.now();
            }
            // Show game over for non-leaders
            if (waveState === 'gameover' && prevState !== 'gameover') {
              showGameOver();
              triggerScreenShake(true);
              hideWavePreview();
            }
            // Hide wave preview when wave becomes active
            if (waveState === 'active' && prevState === 'countdown') {
              hideWavePreview();
            }
          }
          hudWave.textContent = waveNumber;
          hudKills.textContent = totalKills;
        }
      });

      // Listen for state (non-leaders)
      stateRef.on('value', snap => {
        if (isLeader) return;
        const data = snap.val();
        if (data && data.enemies) {
          try {
            enemies = JSON.parse(data.enemies);
          } catch(e) {}
        }
        if (data && data.path) {
          try {
            currentPath = JSON.parse(data.path);
            currentPathLength = getPathLength(currentPath);
          } catch(e) {}
        }
      });

      // Start leader election
      tryClaimLeadership();
      leaderCheckTimer = setInterval(checkLeadership, 3000);

      // Canvas events
      canvas.addEventListener('click', onCanvasClick);
      canvas.addEventListener('touchend', onCanvasTouchEnd);

      // Start render loop
      lastVisualTick = performance.now();
      requestAnimationFrame(renderLoop);

      // Load meta to init wave
      metaRef.once('value', snap => {
        const meta = snap.val();
        if (meta) {
          waveNumber = meta.waveNumber || 1;
          totalKills = meta.totalKills || 0;
          waveState = meta.waveState || 'waiting';
          baseHp = meta.baseHp != null ? meta.baseHp : BASE_MAX_HP;
          updateBaseHpHUD();
          if (waveState === 'gameover') showGameOver();
        }
      });
    }

    // ═══════════════════════════════════════════════════
    //  Leader Election
    // ═══════════════════════════════════════════════════
    function tryClaimLeadership() {
      leaderRef.transaction(current => {
        if (!current || Date.now() - (current.heartbeat || 0) > LEADER_STALE_MS) {
          return { id: playerId, heartbeat: Date.now(), claimedAt: Date.now() };
        }
        return; // abort — someone else is leader
      }, (err, committed) => {
        if (committed) {
          becomeLeader();
        }
      });
    }

    function becomeLeader() {
      if (isLeader) return;
      isLeader = true;
      console.log('[TD] Became leader');

      // Set onDisconnect to remove leader
      leaderRef.onDisconnect().remove();

      // Heartbeat
      heartbeatTimer = setInterval(() => {
        leaderRef.update({ heartbeat: Date.now() });
      }, LEADER_HEARTBEAT_MS);

      // Load current state
      stateRef.once('value', snap => {
        const data = snap.val();
        if (data && data.enemies) {
          try { enemies = JSON.parse(data.enemies); } catch(e) {}
        }
        if (data && data.path) {
          try {
            currentPath = JSON.parse(data.path);
            currentPathLength = getPathLength(currentPath);
          } catch(e) {}
        }
      });

      // Load baseHp from meta
      metaRef.once('value', snap => {
        const meta = snap.val();
        if (meta) {
          baseHp = meta.baseHp != null ? meta.baseHp : BASE_MAX_HP;
          updateBaseHpHUD();
          if (meta.waveState === 'gameover') {
            // Reset if leader takes over a game-over state
            resetGame();
          }
        }
      });

      // Start sim
      if (!simTimer) {
        simTimer = setInterval(simTick, TICK_MS / gameSpeed);
      }

      // If waiting, start countdown for next wave
      if (waveState === 'waiting' || waveState === 'paused') {
        startWaveCountdown();
      }

      // Clean up stale cannons (> 30 days inactive)
      cannonsRef.once('value', snap => {
        const data = snap.val();
        if (!data) return;
        const cutoff = Date.now() - STALE_CANNON_DAYS * 24 * 60 * 60 * 1000;
        for (const [cid, c] of Object.entries(data)) {
          if (c.lastSeen && c.lastSeen < cutoff) {
            cannonsRef.child(cid).remove();
          }
        }
      });
    }

    function yieldLeadership() {
      if (!isLeader) return;
      isLeader = false;
      console.log('[TD] Yielded leadership');
      if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
      if (simTimer) { clearInterval(simTimer); simTimer = null; }
      leaderRef.transaction(current => {
        if (current && current.id === playerId) return null;
        return current;
      });
    }

    function checkLeadership() {
      if (isLeader) return;
      leaderRef.once('value', snap => {
        const data = snap.val();
        if (!data || Date.now() - (data.heartbeat || 0) > LEADER_STALE_MS) {
          // Random jitter to reduce contention
          setTimeout(tryClaimLeadership, Math.random() * 1000);
        }
      });
    }

    // Yield leadership when tab hidden
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && isLeader) {
        yieldLeadership();
      } else if (document.visibilityState === 'visible' && !isLeader && db) {
        setTimeout(checkLeadership, 500);
      }
    });

    // ═══════════════════════════════════════════════════
    //  Simulation (Leader Only)
    // ═══════════════════════════════════════════════════
    function simTick() {
      if (!isLeader) return;
      if (waveState === 'gameover') return;

      tickCount++;

      if (waveState === 'countdown') {
        countdownTimer--;
        if (countdownTimer <= 0) {
          waveState = 'active';
          enemies = generateWave(waveNumber);
          hideWavePreview();
          if (!offlineMode) metaRef.update({ waveState: 'active' });
        }
        writeSnapshot();
        return;
      }

      if (waveState !== 'active') return;

      // Move enemies along path
      for (const e of enemies) {
        let speed = e.speed;
        if (e.slowTimer > 0) {
          speed *= 0.5;
          e.slowTimer--;
        }
        // Advance path progress
        const progressPerTick = speed / (currentPathLength || 1000);
        e.pathProgress = (e.pathProgress || 0) + progressPerTick;
        const pos = getPathPosition(currentPath, e.pathProgress);
        e.x = pos.x;
        e.y = pos.y;
      }

      // Cannon firing
      const cannonList = Object.entries(cannons);
      for (const [cid, c] of cannonList) {
        if (!c.x || !c.y) continue;
        const stats = getCannonStats(c.level || 1, c.path || null, c.spec || null);
        if (!(cid in myCannonFireTimers)) myCannonFireTimers[cid] = 0;
        myCannonFireTimers[cid]++;
        const fireInterval = TICK_RATE / stats.fireRate;
        if (myCannonFireTimers[cid] < fireInterval) continue;

        // Find nearest enemy in range
        let nearest = null, nearestDist = Infinity;
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          const dist = Math.hypot(e.x - c.x, e.y - c.y);
          if (dist <= stats.range && dist < nearestDist) {
            nearest = e;
            nearestDist = dist;
          }
        }
        if (!nearest) continue;

        myCannonFireTimers[cid] = 0;

        // Apply damage
        nearest.hp -= stats.dmg;

        // Slow
        if (stats.slowPct > 0) {
          nearest.slowTimer = Math.max(nearest.slowTimer, TICK_RATE * 2);
        }

        // AoE splash
        if (stats.aoeSplash > 0) {
          for (const e of enemies) {
            if (e === nearest || e.hp <= 0) continue;
            const d = Math.hypot(e.x - nearest.x, e.y - nearest.y);
            if (d <= stats.aoeSplash) {
              e.hp -= stats.dmg * 0.5;
            }
          }
        }

        // Pierce
        if (stats.pierce > 0) {
          let pierced = 0;
          for (const e of enemies) {
            if (e === nearest || e.hp <= 0 || pierced >= stats.pierce) continue;
            const d = Math.hypot(e.x - nearest.x, e.y - nearest.y);
            if (d <= 60) {
              e.hp -= stats.dmg * 0.7;
              pierced++;
            }
          }
        }

        // Chain
        if (stats.chain > 0) {
          let chainTarget = nearest;
          for (let ch = 0; ch < stats.chain; ch++) {
            let best = null, bestD = 100;
            for (const e of enemies) {
              if (e === chainTarget || e.hp <= 0) continue;
              const d = Math.hypot(e.x - chainTarget.x, e.y - chainTarget.y);
              if (d < bestD) { best = e; bestD = d; }
            }
            if (best) {
              best.hp -= stats.dmg * 0.6;
              if (stats.slowPct > 0) best.slowTimer = Math.max(best.slowTimer, TICK_RATE);
              chainTarget = best;
            }
          }
        }
      }

      // Check kills
      const beforeCount = enemies.length;
      let killsThisTick = 0;
      for (const e of enemies) {
        if (e.hp <= 0 && !e.dead) {
          e.dead = true;
          totalKills++;
          killsThisTick++;
          // Combo tracking
          comboCount++;
          comboTimer = COMBO_WINDOW;
          // Screen shake on big combos
          if (comboCount === 5 || comboCount === 10) {
            triggerScreenShake(comboCount >= 10);
          }
          // Calculate XP: base 1 + combo bonus + early send bonus
          const comboMult = comboCount >= COMBO_MIN ? Math.min(comboCount, 10) : 1;
          const earlyBonus = earlySendBonusPct > 0 ? Math.ceil(comboMult * earlySendBonusPct / 100) : 0;
          const xpAmount = comboMult + earlyBonus;
          // Award XP to cannon that would have killed (simplified: split among all)
          awardXP(cannonList, xpAmount);
          // Score popup
          const popupText = comboCount >= COMBO_MIN
            ? `+${xpAmount} XP`
            : '+1 XP';
          const popupColor = comboCount >= 8 ? '#ff4444'
            : comboCount >= 5 ? '#ff8800'
            : comboCount >= COMBO_MIN ? '#ffd700'
            : '#ffffff';
          scorePopups.push({
            x: e.x + (Math.random() - 0.5) * 16,
            y: e.y,
            text: popupText,
            color: popupColor,
            life: 40,
            maxLife: 40,
            size: comboCount >= 5 ? 16 : comboCount >= COMBO_MIN ? 13 : 11,
            vy: -1.5
          });
          // Death particles
          const numParticles = comboCount >= COMBO_MIN ? 10 : 6;
          for (let i = 0; i < numParticles; i++) {
            particles.push({
              x: e.x, y: e.y,
              vx: (Math.random() - 0.5) * (comboCount >= 5 ? 6 : 4),
              vy: (Math.random() - 0.5) * (comboCount >= 5 ? 6 : 4),
              color: comboCount >= COMBO_MIN ? popupColor : e.color,
              life: 15 + Math.random() * 10
            });
          }
        }
      }
      // Combo timer decay
      if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) {
          comboCount = 0;
          comboXpBonus = 0;
        }
      }
      // Update combo display
      updateComboDisplay();
      enemies = enemies.filter(e => !e.dead);

      // Check if enemy reached base (end of path) — deal damage instead of instant fail
      let damageTaken = 0;
      enemies = enemies.filter(e => {
        if ((e.pathProgress || 0) >= 1.0) {
          damageTaken += e.type === 'boss' ? BOSS_DAMAGE : 1;
          return false; // remove enemy
        }
        return true;
      });
      if (damageTaken > 0) {
        baseHp = Math.max(0, baseHp - damageTaken);
        damageFlashTimer = 8; // ~0.4s at 20fps
        triggerScreenShake(damageTaken >= BOSS_DAMAGE); // heavy shake for boss damage
        if (!offlineMode) metaRef.update({ baseHp, totalKills });
        updateBaseHpHUD();

        if (baseHp <= 0) {
          waveState = 'gameover';
          triggerScreenShake(true); // heavy shake on game over
          hideWavePreview();
          if (!offlineMode) metaRef.update({ waveState: 'gameover', totalKills });
          showGameOver();
          updateCannonUI();
          writeSnapshot();
          return;
        }
      }

      // Check wave clear
      if (enemies.length === 0 && waveState === 'active') {
        waveNumber++;
        // Reset early send bonus/streak on natural wave clear
        earlySendBonusPct = 0;
        earlySendCount = 0;
        // Heal 1 HP per wave cleared (capped at max)
        baseHp = Math.min(BASE_MAX_HP, baseHp + HP_REGEN_PER_WAVE);
        if (!offlineMode) metaRef.update({ waveNumber, waveState: 'waiting', totalKills, baseHp });
        waveState = 'waiting';
        updateBaseHpHUD();
        updateSendNextBtn();
        startWaveCountdown();
      }

      // Update send next button state
      if (tickCount % 10 === 0) updateSendNextBtn();

      // Update HUD
      hudKills.textContent = totalKills;
      hudEnemies.textContent = enemies.length;
      hudWave.textContent = waveNumber;

      // Write snapshot periodically
      writeSnapshot();
    }

    function writeSnapshot() {
      if (!isLeader) return;
      if (tickCount % SNAPSHOT_INTERVAL !== 0) return;
      if (offlineMode) return; // no Firebase writes in offline mode
      stateRef.set({
        enemies: JSON.stringify(enemies),
        path: JSON.stringify(currentPath),
        tick: tickCount,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
      metaRef.update({
        waveNumber,
        waveState,
        totalKills,
        baseHp,
        lastActivity: firebase.database.ServerValue.TIMESTAMP
      });
    }

    function startWaveCountdown() {
      waveState = 'countdown';
      countdownTimer = TICK_RATE * 3; // 3 seconds
      countdownStartedAt = Date.now();
      if (!offlineMode) metaRef.update({ waveState: 'countdown' });
      // Show announcement
      showWaveAnnouncement(waveNumber);
    }

    function showWaveAnnouncement(num) {
      waText.textContent = `WAVE ${num}`;
      waSub.textContent = num % 10 === 0 && num > 0 ? '⚠ BOSS WAVE!' : 'incoming';
      waveAnnounce.classList.add('active');
      setTimeout(() => waveAnnounce.classList.remove('active'), 2500);
      // Show wave preview with enemy breakdown
      showWavePreview(num);
    }

    function awardXP(cannonList, xpAmount = 1) {
      // Offline mode — award locally
      if (offlineMode) {
        offlineAwardXP(xpAmount);
        return;
      }
      // Award XP to every cannon (idle game — everyone benefits)
      for (const [cid, c] of cannonList) {
        if (!c.x || !c.y) continue;
        const newXp = (c.xp || 0) + xpAmount;
        const newKills = (c.kills || 0) + (cid === playerId ? 0 : 0);
        const level = c.level || 1;
        const needed = XP_PER_LEVEL(level);
        if (newXp >= needed) {
          // Level up
          cannonsRef.child(cid).update({
            xp: newXp - needed,
            level: level + 1,
            kills: (c.kills || 0) + 1
          });
        } else {
          cannonsRef.child(cid).update({ xp: newXp, kills: (c.kills || 0) + 1 });
        }
      }
    }

    // ═══════════════════════════════════════════════════
    //  Base HP System
    // ═══════════════════════════════════════════════════
    function updateBaseHpHUD() {
      hudBaseHp.textContent = baseHp;
      // Color coding based on HP percentage
      const pct = baseHp / BASE_MAX_HP;
      if (pct <= 0.25) {
        hudBaseHp.style.color = '#e74c3c';
      } else if (pct <= 0.5) {
        hudBaseHp.style.color = '#f39c12';
      } else {
        hudBaseHp.style.color = '';
      }
      // Pulse animation on damage
      if (damageFlashTimer > 0) {
        hudBaseHp.classList.add('damaged');
        setTimeout(() => hudBaseHp.classList.remove('damaged'), 400);
      }
    }

    function showGameOver() {
      goStats.textContent = `Wave ${waveNumber} · ${totalKills} kills`;
      gameOverOverlay.classList.add('active');
    }

    function updateComboDisplay() {
      if (comboCount >= COMBO_MIN && comboTimer > 0) {
        comboNum.textContent = comboCount;
        const bonusXp = Math.min(comboCount, 10);
        comboLabel.textContent = `+${bonusXp} XP per kill`;
        comboDisplay.classList.add('active');
        // Re-trigger animation on each new kill
        comboDisplay.style.animation = 'none';
        comboDisplay.offsetHeight;
        comboDisplay.style.animation = '';
      } else {
        comboDisplay.classList.remove('active');
      }
    }

    function resetGame() {
      gameOverOverlay.classList.remove('active');
      waveNumber = 1;
      baseHp = BASE_MAX_HP;
      totalKills = 0;
      enemies = [];
      waveState = 'waiting';
      damageFlashTimer = 0;
      comboCount = 0;
      comboTimer = 0;
      comboXpBonus = 0;
      gameSpeed = 1;
      scorePopups = [];
      abilityZones = [];
      abilityCooldownLeft = 0;
      abilityTargeting = false;
      earlySendBonusPct = 0;
      earlySendCount = 0;
      bonusPopupTimer = 0;
      // Clear any banked sell refund on game reset
      localStorage.removeItem('td_sell_refund');
      sendBonusPopup.classList.remove('active');
      canvas.classList.remove('canvas-targeting');
      hideWavePreview();
      updateComboDisplay();
      updateBaseHpHUD();
      updateSpeedIndicator();
      updateSendNextBtn();
      // Reset speed button UI
      speedControls.querySelectorAll('.speed-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.speed === '1');
      });
      hudWave.textContent = waveNumber;
      hudKills.textContent = totalKills;
      hudEnemies.textContent = 0;

      if (!offlineMode && isLeader) {
        metaRef.update({
          waveNumber: 1,
          waveState: 'waiting',
          totalKills: 0,
          baseHp: BASE_MAX_HP
        });
        stateRef.set({ enemies: '[]', path: '[]', tick: 0 });
      }

      // Reset cannon levels for offline mode
      if (offlineMode && cannons[playerId]) {
        cannons[playerId].level = 1;
        cannons[playerId].xp = 0;
        cannons[playerId].kills = 0;
        cannons[playerId].path = null;
        cannons[playerId].spec = null;
        updateCannonUI();
      }

      // Restart sim timer with reset speed
      restartSimTimer();

      // Start first wave after brief pause
      setTimeout(() => {
        if (isLeader) startWaveCountdown();
      }, 500);
    }

    goRestart.addEventListener('click', resetGame);

    // ═══════════════════════════════════════════════════
    //  Canvas Interaction
    // ═══════════════════════════════════════════════════
    function canvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = CANVAS_W / rect.width;
      const scaleY = CANVAS_H / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    function onCanvasClick(e) {
      const pos = canvasCoords(e);
      if (abilityTargeting) {
        fireAbility(pos.x, pos.y);
        return;
      }
      placeCannon(pos.x, pos.y);
    }

    function onCanvasTouchEnd(e) {
      e.preventDefault();
      if (e.changedTouches.length === 0) return;
      const touch = e.changedTouches[0];
      const pos = canvasCoords(touch);
      if (abilityTargeting) {
        fireAbility(pos.x, pos.y);
        return;
      }
      placeCannon(pos.x, pos.y);
    }

    function placeCannon(x, y) {
      // Can't place during game over
      if (waveState === 'gameover') return;
      // Must be in bottom area
      if (y < PLACEMENT_MIN_Y) return;
      if (y > BASE_Y) return;

      // Check cooldown for relocate
      const myCannon = cannons[playerId];
      if (myCannon && myCannon.x) {
        const elapsed = Date.now() - lastRelocateTime;
        if (elapsed < RELOCATE_COOLDOWN) {
          const remaining = Math.ceil((RELOCATE_COOLDOWN - elapsed) / 1000);
          return; // silently reject during cooldown
        }
      }

      // Check spacing from other cannons
      for (const [cid, c] of Object.entries(cannons)) {
        if (cid === playerId || !c.x) continue;
        const dist = Math.hypot(c.x - x, c.y - y);
        if (dist < MIN_CANNON_SPACING) return;
      }

      lastRelocateTime = Date.now();
      showPlacementHint = false;

      // Offline mode — update local state directly
      if (offlineMode) {
        offlinePlaceCannon(x, y);
        return;
      }

      // Write to Firebase
      const existing = cannons[playerId];
      const isNewPlacement = !existing || !existing.x;
      cannonsRef.child(playerId).set({
        x: Math.round(x),
        y: Math.round(y),
        level: existing?.level || 1,
        xp: existing?.xp || 0,
        kills: existing?.kills || 0,
        path: existing?.path || null,
        spec: existing?.spec || null,
        name: playerName,
        avatar: playerAvatar || null,
        emoji: playerEmoji,
        lastSeen: firebase.database.ServerValue.TIMESTAMP
      });

      // Apply banked sell refund XP to new cannons
      if (isNewPlacement) {
        // Wait a tick for Firebase local cache to update, then apply refund
        setTimeout(() => applySellRefund(), 100);
      }

      // Start wave if waiting and leader
      if (isLeader && (waveState === 'waiting' || waveState === 'paused')) {
        startWaveCountdown();
      }
    }

    // ═══════════════════════════════════════════════════
    //  Upgrade System
    // ═══════════════════════════════════════════════════
    upgradeBtn.addEventListener('click', openUpgradeModal);
    upgradeClose.addEventListener('click', () => upgradeModal.classList.remove('active'));
    upgradeModal.addEventListener('click', e => {
      if (e.target === upgradeModal) upgradeModal.classList.remove('active');
    });

    function openUpgradeModal() {
      const c = cannons[playerId];
      if (!c) return;
      const level = c.level || 1;

      upgradeCards.innerHTML = '';

      if (level >= 3 && !c.path) {
        // Choose path
        upgradeTitle.textContent = 'Choose Your Path (Level 3)';
        for (const [key, p] of Object.entries(PATHS)) {
          const card = document.createElement('div');
          card.className = 'upgrade-card';
          card.innerHTML = `<div class="uc-name" style="color:${p.color}">${p.name}</div><div class="uc-desc">${p.desc}</div>`;
          card.addEventListener('click', () => {
            if (offlineMode) {
              cannons[playerId].path = key;
            } else {
              cannonsRef.child(playerId).update({ path: key });
            }
            upgradeModal.classList.remove('active');
            updateCannonUI();
          });
          upgradeCards.appendChild(card);
        }
      } else if (level >= 6 && c.path && !c.spec) {
        // Choose spec
        upgradeTitle.textContent = 'Choose Specialization (Level 6)';
        const available = Object.entries(SPECS).filter(([, s]) => s.path === c.path);
        for (const [key, s] of available) {
          const card = document.createElement('div');
          card.className = 'upgrade-card';
          card.innerHTML = `<div class="uc-name" style="color:${s.color}">${s.name}</div><div class="uc-desc">${s.desc}</div>`;
          card.addEventListener('click', () => {
            if (offlineMode) {
              cannons[playerId].spec = key;
            } else {
              cannonsRef.child(playerId).update({ spec: key });
            }
            upgradeModal.classList.remove('active');
            updateCannonUI();
          });
          upgradeCards.appendChild(card);
        }
      } else {
        upgradeTitle.textContent = 'No Upgrades Available';
        const info = document.createElement('div');
        info.className = 'upgrade-card';
        if (level < 3) {
          info.innerHTML = `<div class="uc-desc">Reach Level 3 to choose a path</div>`;
        } else if (level < 6) {
          info.innerHTML = `<div class="uc-desc">Reach Level 6 to choose a specialization</div>`;
        } else {
          info.innerHTML = `<div class="uc-desc">All upgrades selected! Stats increase each level.</div>`;
        }
        upgradeCards.appendChild(info);
      }

      upgradeModal.classList.add('active');
    }

    function updateCannonUI() {
      const c = cannons[playerId];
      if (!c) {
        cannonInfo.textContent = 'Click canvas to place cannon';
        xpBarFill.style.width = '0%';
        xpBarText.textContent = 'No cannon';
        upgradeBtn.disabled = true;
        sellBtn.disabled = true;
        if (typeof updateAbilityBtn === 'function') updateAbilityBtn();
        return;
      }
      const level = c.level || 1;
      const xp = c.xp || 0;
      const needed = XP_PER_LEVEL(level);
      const pct = Math.min(100, (xp / needed) * 100);

      cannonInfo.textContent = getCannonLabel(level, c.path, c.spec);
      xpBarFill.style.width = pct + '%';
      xpBarText.textContent = `${xp} / ${needed} XP`;

      // Enable sell button when cannon exists
      sellBtn.disabled = (waveState === 'gameover');

      // Enable upgrade button if path/spec selection available
      const canUpgrade = (level >= 3 && !c.path) || (level >= 6 && c.path && !c.spec);
      upgradeBtn.disabled = !canUpgrade;
      if (canUpgrade) {
        upgradeBtn.style.animation = 'none';
        upgradeBtn.offsetHeight; // reflow
        upgradeBtn.style.borderColor = 'var(--accent)';
        upgradeBtn.style.color = 'var(--accent)';
      } else {
        upgradeBtn.style.borderColor = '';
        upgradeBtn.style.color = '';
      }
      if (typeof updateAbilityBtn === 'function') updateAbilityBtn();
    }

    // ═══════════════════════════════════════════════════
    //  Relocate Button
    // ═══════════════════════════════════════════════════
    relocateBtn.addEventListener('click', () => {
      const myCannon = cannons[playerId];
      if (!myCannon || !myCannon.x) return;
      const elapsed = Date.now() - lastRelocateTime;
      if (elapsed < RELOCATE_COOLDOWN) {
        const remaining = Math.ceil((RELOCATE_COOLDOWN - elapsed) / 1000);
        relocateBtn.textContent = `Wait ${remaining}s`;
        return;
      }
      relocateBtn.textContent = 'Click map...';
      // Next canvas click will relocate
    });

    // Update relocate cooldown display
    setInterval(() => {
      const elapsed = Date.now() - lastRelocateTime;
      if (elapsed < RELOCATE_COOLDOWN) {
        const remaining = Math.ceil((RELOCATE_COOLDOWN - elapsed) / 1000);
        relocateBtn.textContent = `Relocate (${remaining}s)`;
        relocateBtn.disabled = true;
      } else {
        relocateBtn.textContent = 'Relocate';
        relocateBtn.disabled = false;
      }
    }, 1000);

    // ═══════════════════════════════════════════════════
    //  Sell Cannon
    // ═══════════════════════════════════════════════════
    sellBtn.addEventListener('click', openSellModal);

    function calcSellRefund() {
      const c = cannons[playerId];
      if (!c || !c.x) return 0;
      const level = c.level || 1;
      // Total XP invested = sum of XP thresholds for levels 1..(level-1) + current xp
      let totalXp = c.xp || 0;
      for (let i = 1; i < level; i++) totalXp += XP_PER_LEVEL(i);
      // 50% refund
      return Math.floor(totalXp * 0.5);
    }

    function openSellModal() {
      const c = cannons[playerId];
      if (!c || !c.x) return;
      const level = c.level || 1;
      const label = getCannonLabel(level, c.path, c.spec);
      const refund = calcSellRefund();

      upgradeCards.innerHTML = '';
      upgradeTitle.textContent = '🗑 Sell Cannon?';

      // Info card
      const infoCard = document.createElement('div');
      infoCard.className = 'upgrade-card';
      infoCard.style.cursor = 'default';
      infoCard.innerHTML = `<div class="uc-name">${label}</div>` +
        `<div class="uc-desc">Kills: ${c.kills || 0}</div>` +
        (refund > 0 ? `<div class="uc-desc sell-refund" style="margin-top:6px">Refund: +${refund} XP to next cannon</div>` : '') +
        `<div class="sell-warning">⚠ All upgrades and progress will be lost</div>`;
      upgradeCards.appendChild(infoCard);

      // Confirm sell card
      const confirmCard = document.createElement('div');
      confirmCard.className = 'upgrade-card sell-confirm-card';
      confirmCard.innerHTML = `<div class="uc-name" style="color:var(--danger)">Confirm Sell</div>` +
        `<div class="uc-desc">Remove cannon and start fresh</div>`;
      confirmCard.addEventListener('click', () => {
        executeSellCannon(refund);
        upgradeModal.classList.remove('active');
      });
      upgradeCards.appendChild(confirmCard);

      upgradeModal.classList.add('active');
    }

    function executeSellCannon(refund) {
      const c = cannons[playerId];
      if (!c || !c.x) return;

      // Store refund in localStorage so next cannon starts with bonus XP
      if (refund > 0) {
        const existing = parseInt(localStorage.getItem('td_sell_refund') || '0', 10);
        localStorage.setItem('td_sell_refund', existing + refund);
      }

      // Show refund popup
      if (refund > 0) {
        scorePopups.push({
          x: c.x, y: c.y,
          text: `+${refund} XP banked`,
          color: '#22c55e',
          life: 90, maxLife: 90, size: 1.2
        });
      }

      // Remove cannon
      if (offlineMode) {
        delete cannons[playerId];
      } else {
        cannonsRef.child(playerId).remove();
        // Also remove from local state immediately
        delete cannons[playerId];
      }

      // Reset ability state
      abilityCooldownLeft = 0;
      abilityTargeting = false;
      canvas.classList.remove('canvas-targeting');

      // Reset relocate cooldown so next placement is instant
      lastRelocateTime = 0;

      // Show placement hint again
      showPlacementHint = true;

      updateCannonUI();
    }

    // Apply banked sell refund XP when placing a new cannon
    function applySellRefund() {
      const refund = parseInt(localStorage.getItem('td_sell_refund') || '0', 10);
      if (refund <= 0) return;
      localStorage.removeItem('td_sell_refund');

      const c = cannons[playerId];
      if (!c) return;

      // Apply XP and auto-level-up
      let xp = (c.xp || 0) + refund;
      let level = c.level || 1;
      let needed = XP_PER_LEVEL(level);
      while (xp >= needed) {
        xp -= needed;
        level++;
        needed = XP_PER_LEVEL(level);
      }
      c.xp = xp;
      c.level = level;

      // Sync to Firebase
      if (!offlineMode) {
        cannonsRef.child(playerId).update({ xp: c.xp, level: c.level });
      }

      // Show XP applied popup
      scorePopups.push({
        x: c.x, y: c.y,
        text: `+${refund} XP applied!`,
        color: '#22c55e',
        life: 90, maxLife: 90, size: 1.2
      });

      updateCannonUI();
    }

    // ═══════════════════════════════════════════════════
    //  Early Send / Wave Skip
    // ═══════════════════════════════════════════════════
    sendNextBtn.addEventListener('click', () => {
      if (waveState !== 'active') return;
      if (!cannons[playerId] || !cannons[playerId].x) return;
      if (!isLeader && !offlineMode) return; // only leader/offline can trigger early send

      // Calculate bonus based on enemies remaining
      const totalEnemies = enemies.length;
      if (totalEnemies === 0) return;

      earlySendCount++;
      // Bonus: 25% base + 10% per consecutive early send (capped at 100%)
      earlySendBonusPct = Math.min(100, 25 + (earlySendCount - 1) * 10);

      // Show bonus popup
      showSendBonusPopup(earlySendBonusPct);

      // Advance wave number and spawn next wave's enemies on top of current ones
      waveNumber++;
      const newEnemies = generateWave(waveNumber);
      enemies = enemies.concat(newEnemies);

      // Heal a bit less than normal clear (half regen)
      baseHp = Math.min(BASE_MAX_HP, baseHp + Math.ceil(HP_REGEN_PER_WAVE * 0.5));

      // Update state
      if (!offlineMode) {
        metaRef.update({ waveNumber, totalKills, baseHp });
      }
      updateBaseHpHUD();
      updateSendNextBtn();

      // Show wave announcement
      showWaveAnnouncement(waveNumber);

      // Light screen shake for excitement
      triggerScreenShake(false);

      // Update HUD
      hudWave.textContent = waveNumber;
      hudEnemies.textContent = enemies.filter(e => e.hp > 0).length;
    });

    function updateSendNextBtn() {
      const hasCannon = cannons[playerId] && cannons[playerId].x;
      const canControl = isLeader || offlineMode;
      const canSend = waveState === 'active' && enemies.length > 0 && hasCannon && canControl;
      sendNextBtn.disabled = !canSend;
      if (canSend) {
        const nextBonus = Math.min(100, 25 + earlySendCount * 10);
        sendNextBtn.innerHTML = `⏩ Send Next <span class="sn-bonus">+${nextBonus}%</span>`;
      } else {
        sendNextBtn.textContent = '⏩ Send Next';
      }
    }

    function showSendBonusPopup(bonusPct) {
      sendBonusPopup.textContent = `🎯 EARLY SEND! +${bonusPct}% XP`;
      sendBonusPopup.classList.add('active');
      bonusPopupTimer = TICK_RATE * 3; // show for 3 seconds
      setTimeout(() => {
        sendBonusPopup.classList.remove('active');
      }, 3000);
    }

    // ═══════════════════════════════════════════════════
    //  Speed Controls
    // ═══════════════════════════════════════════════════
    speedControls.addEventListener('click', e => {
      const btn = e.target.closest('.speed-btn');
      if (!btn) return;
      const newSpeed = parseInt(btn.dataset.speed, 10);
      if (newSpeed === gameSpeed) return;
      gameSpeed = newSpeed;
      // Update button states
      speedControls.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // Update speed indicator on canvas
      updateSpeedIndicator();
      // Restart simulation timer with new speed
      restartSimTimer();
    });

    function updateSpeedIndicator() {
      if (gameSpeed > 1) {
        const arrows = '▶'.repeat(gameSpeed);
        speedIndicator.textContent = `${arrows} ${gameSpeed}×`;
        speedIndicator.classList.add('active');
      } else {
        speedIndicator.classList.remove('active');
      }
    }

    function restartSimTimer() {
      if (simTimer) {
        clearInterval(simTimer);
        simTimer = null;
      }
      if (isLeader || offlineMode) {
        const speedTickMs = TICK_MS / gameSpeed;
        simTimer = setInterval(simTick, speedTickMs);
      }
    }

    // ═══════════════════════════════════════════════════
    //  Active Abilities
    // ═══════════════════════════════════════════════════
    const ABILITIES = {
      // Default (no path/spec)
      basic:   { name: 'Power Shot',     emoji: '⚡', cooldown: 8,  targeted: true,  desc: '5× damage single target' },
      // Path-level abilities
      rapid:   { name: 'Rapid Burst',    emoji: '🔥', cooldown: 10, targeted: false, desc: '10 instant shots' },
      power:   { name: 'Bombardment',    emoji: '💥', cooldown: 12, targeted: true,  desc: 'Massive AoE blast' },
      tech:    { name: 'EMP Pulse',      emoji: '⚡', cooldown: 15, targeted: false, desc: 'Freeze all enemies 3s' },
      // Spec-level abilities
      gatling: { name: 'Bullet Storm',   emoji: '🌪️', cooldown: 10, targeted: false, desc: '20 rapid shots everywhere' },
      sniper:  { name: 'Headshot',       emoji: '🎯', cooldown: 15, targeted: true,  desc: 'Instant kill / huge boss dmg' },
      cannon:  { name: 'Napalm',         emoji: '🔥', cooldown: 14, targeted: true,  desc: 'AoE + burn zone' },
      railgun: { name: 'Orbital Strike', emoji: '⚡', cooldown: 16, targeted: true,  desc: 'Piercing line across map' },
      tesla:   { name: 'Chain Overload', emoji: '⚡', cooldown: 14, targeted: false, desc: 'Lightning hits all enemies' },
      frost:   { name: 'Blizzard',       emoji: '❄️', cooldown: 12, targeted: false, desc: 'Slow all enemies 80% for 5s' }
    };

    const abilityBtn = $('abilityBtn');

    function getPlayerAbility() {
      const c = cannons[playerId];
      if (!c) return ABILITIES.basic;
      if (c.spec && ABILITIES[c.spec]) return ABILITIES[c.spec];
      if (c.path && ABILITIES[c.path]) return ABILITIES[c.path];
      return ABILITIES.basic;
    }

    function getPlayerAbilityKey() {
      const c = cannons[playerId];
      if (!c) return 'basic';
      if (c.spec && ABILITIES[c.spec]) return c.spec;
      if (c.path && ABILITIES[c.path]) return c.path;
      return 'basic';
    }

    function updateAbilityBtn() {
      const c = cannons[playerId];
      if (!c || !c.x) {
        abilityBtn.disabled = true;
        abilityBtn.innerHTML = '⚡ Power Shot<span class="ab-key">[Q]</span><div class="ab-cooldown" id="abCooldownBar"></div>';
        return;
      }
      const ab = getPlayerAbility();
      const onCooldown = abilityCooldownLeft > 0;
      abilityBtn.disabled = onCooldown || waveState === 'gameover';
      const cdText = onCooldown ? ` (${Math.ceil(abilityCooldownLeft)}s)` : '';
      abilityBtn.innerHTML = `${ab.emoji} ${ab.name}${cdText}<span class="ab-key">[Q]</span><div class="ab-cooldown" id="abCooldownBar" style="width:${onCooldown ? ((1 - abilityCooldownLeft / ab.cooldown) * 100) : 100}%"></div>`;
      if (abilityTargeting) {
        abilityBtn.classList.add('targeting');
      } else {
        abilityBtn.classList.remove('targeting');
      }
    }

    // Cooldown timer (runs every 100ms for smooth display)
    setInterval(() => {
      if (abilityCooldownLeft > 0) {
        abilityCooldownLeft = Math.max(0, abilityCooldownLeft - 0.1);
        updateAbilityBtn();
      }
    }, 100);

    abilityBtn.addEventListener('click', () => {
      if (abilityCooldownLeft > 0) return;
      const c = cannons[playerId];
      if (!c || !c.x) return;
      if (waveState !== 'active' && waveState !== 'countdown') return;

      const ab = getPlayerAbility();
      if (ab.targeted) {
        // Enter targeting mode — next canvas click fires ability
        abilityTargeting = true;
        canvas.classList.add('canvas-targeting');
        updateAbilityBtn();
      } else {
        // Immediate activation (no targeting needed)
        fireAbility(null, null);
      }
    });

    // Keyboard shortcuts: Q = ability, E = early send
    document.addEventListener('keydown', e => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'q' || e.key === 'Q') {
        if (!abilityBtn.disabled) abilityBtn.click();
      }
      if (e.key === 'e' || e.key === 'E') {
        if (!sendNextBtn.disabled) sendNextBtn.click();
      }
